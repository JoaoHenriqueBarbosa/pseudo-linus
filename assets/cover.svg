    <rect x="1508" y="490" width="30" height="108" rx="12"/>
    <rect x="1546" y="496" width="28" height="102" rx="12" fill="#4E6E53"/>
  </g>
  <circle cx="1238" cy="140" r="4.5" fill="#16364C"/>
