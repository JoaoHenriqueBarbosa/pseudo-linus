  <ellipse cx="1488" cy="602" rx="110" ry="8" fill="#0E2633" opacity="0.12"/>

  <!-- terminal -->
  <rect x="826" y="276" width="600" height="300" rx="14" fill="#16364C" opacity="0.18"/>
  <g clip-path="url(#term)">
    <rect x="820" y="268" width="600" height="300" fill="#14303F"/>
    <rect x="820" y="268" width="600" height="38" fill="#1C3D50"/>
  </g>
  <circle cx="846" cy="287" r="6" fill="#E0A33B"/>
  <circle cx="866" cy="287" r="6" fill="#7FA8BA"/>
  <circle cx="886" cy="287" r="6" fill="#7FA8BA"/>
  <text x="1120" y="292" text-anchor="middle" font-family="JetBrains Mono" font-size="15" fill="#8FB1C1">root@plinus: /work</text>
  <g font-family="JetBrains Mono" font-size="18">
    <text x="846" y="344" fill="#E0A33B">$ <tspan fill="#EAF2F4">head -1 /etc/os-release</tspan></text>
    <text x="846" y="370" fill="#B9D0DA">PRETTY_NAME="Debian GNU/Linux 13 (trixie)"</text>
    <text x="846" y="408" fill="#E0A33B">$ <tspan fill="#EAF2F4">python3 -c 'import sys; print(sys.version[:6])'</tspan></text>
    <text x="846" y="434" fill="#B9D0DA">3.13.5</text>
    <text x="846" y="472" fill="#E0A33B">$ <tspan fill="#EAF2F4">gcc fib.c</tspan></text>
    <text x="846" y="498" fill="#B9D0DA">bash: gcc: command not found</text>
    <text x="846" y="536" fill="#9CC9A2">9264/9507 identical to debian:trixie</text>
  </g>

