<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9DCE6"/>
      <stop offset="0.72" stop-color="#E7F0F3"/>
      <stop offset="1" stop-color="#F3F7F8"/>
    </linearGradient>
    <clipPath id="term"><rect x="820" y="268" width="600" height="300" rx="14"/></clipPath>
  </defs>
  <rect width="1600" height="680" fill="url(#sky)"/>
  <!-- distant ice shelf -->
  <path d="M0 560 L120 548 L210 556 L330 540 L470 552 L560 544 L700 556 L820 548 L1000 558 L1180 546 L1340 556 L1600 544 L1600 680 L0 680 Z" fill="#DCE8EC"/>
  <path d="M0 600 C300 588 520 610 800 598 C1080 586 1320 606 1600 594 L1600 680 L0 680 Z" fill="#F7FAFB"/>

  <!-- wordmark -->
  <text x="104" y="300" font-family="Bricolage Grotesque" font-weight="800" font-size="200" letter-spacing="-2" fill="#16364C">plinus</text>
  <text x="116" y="384" font-family="Bricolage Grotesque" font-weight="500" font-size="44" fill="#16364C">A behavioral operating system.</text>
  <text x="117" y="436" font-family="Bricolage Grotesque" font-weight="400" font-size="27" fill="#3F6276">Debian 13 on the outside. Simulated all the way down.</text>
  <text x="117" y="474" font-family="Bricolage Grotesque" font-weight="400" font-size="27" fill="#3F6276">Built in safe Rust as the computer of an AI agent.</text>

  <!-- sauropod standing behind the terminal, neck over it -->
  <g fill="#5E8063">
    <path d="M1392 470 C1360 400 1330 330 1300 260 C1282 218 1262 186 1236 168 C1218 156 1214 140 1228 132 C1246 122 1272 128 1288 146 C1316 178 1346 236 1380 300 C1404 346 1428 394 1446 430 Z"/>
