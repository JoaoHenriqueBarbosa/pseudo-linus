# cp, mv e dd: porte em andamento (fora até compilarem sobre o sysio).
# --- fim dos demais grupos ---

# Conformidade no kernel real: `cargo test -p ul-coreutils --features kernel-tests` com
# `CONF_KERNEL=1`. Fora disso os testes só dependem do testkit (o kernel pode estar em obra).
pl-testing = { path = "../pl-testing", optional = true }

[features]
kernel-tests = ["dep:pl-testing", "pl-testing/kernel"]

[dev-dependencies]
sysabi = { workspace = true, features = ["testkit"] }
harness = { path = "../../testbench/crates/harness" }

[lints]
workspace = true
