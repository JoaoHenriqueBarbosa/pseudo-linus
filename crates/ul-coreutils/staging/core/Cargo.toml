[package]
name = "staging-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Preparação do grupo core do ul-coreutils: iteração fora do workspace principal"

# Workspace próprio: imune a manifesto quebrado de outros agentes no workspace principal.
[workspace]

[dependencies]
sysabi = { path = "../../../sysabi" }
sysio = { path = "../../../sysio" }
uucore = { path = "../../vendor/src/uucore", package = "pl-uucore", features = [
    "backup-control", "buf-copy", "checksum", "colors", "encoding", "entries", "extendedbigdecimal",
    "fast-inc", "format", "fs", "fsext", "fsxattr", "hardware", "i18n-charmap", "i18n-collator",
    "i18n-common", "i18n-datetime", "i18n-decimal", "lines", "mode", "parser", "parser-glob",
    "parser-size", "perms", "pipes", "process", "quoting-style", "ranges", "ringbuffer",
    "safe-copy", "safe-traversal", "signals", "sum", "time", "tty", "update-control", "utf8",
    "utmpx", "version-cmp", "wide",
] }
pl-testing = { path = "../../../pl-testing", optional = true }
uu_cat = { path = "../../vendor/src/uu/cat", package = "pl-uu-cat" }
uu_head = { path = "../../vendor/src/uu/head", package = "pl-uu-head" }
uu_wc = { path = "../../vendor/src/uu/wc", package = "pl-uu-wc" }
uu_sort = { path = "../../vendor/src/uu/sort", package = "pl-uu-sort" }
uu_ls = { path = "../../vendor/src/uu/ls", package = "pl-uu-ls" }

[features]
kernel-tests = ["dep:pl-testing", "pl-testing/kernel"]

[dev-dependencies]
sysabi = { path = "../../../sysabi", features = ["testkit"] }
harness = { path = "../../../../testbench/crates/harness" }

[lints.rust]
unsafe_code = "forbid"
