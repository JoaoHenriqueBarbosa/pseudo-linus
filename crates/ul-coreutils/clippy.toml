    { path = "std::path::Path::exists", reason = "use sysio::path::PathExt::sys_exists" },
    { path = "std::path::Path::try_exists", reason = "use sysio::path::PathExt" },
    { path = "std::path::Path::is_dir", reason = "use sysio::path::PathExt::sys_is_dir" },
