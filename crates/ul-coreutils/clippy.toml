disallowed-macros = [
    { path = "std::print", reason = "use sysio::print" },
    { path = "std::println", reason = "use sysio::println" },
    { path = "std::eprint", reason = "use sysio::eprint" },
    { path = "std::eprintln", reason = "use sysio::eprintln" },
    { path = "std::dbg", reason = "não toque o stderr do host" },
]
