    { path = "jiff::tz::TimeZone::system", reason = "use uucore::time::process_time_zone" },
    { path = "jiff::Timestamp::now", reason = "use sysio::time::now" },
    { path = "jiff::Zoned::now", reason = "use sysio::time::now" },
