# Auditoria do porte: tudo que toca o host a partir do código do coreutils (o crate e os
# vendorizados em vendor/src, que acham este arquivo subindo os diretórios). Rodar:
#   cargo clippy -p ul-coreutils 2>&1 | grep -A5 disallowed
# Cada aviso é um lugar que ainda fala com o host em vez do sysio.

disallowed-methods = [
    { path = "std::fs::read", reason = "use sysio::fs" },
    { path = "std::fs::read_to_string", reason = "use sysio::fs" },
