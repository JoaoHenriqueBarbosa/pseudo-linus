[package]
name = "pl-conformance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Painel de conformidade: a bancada inteira sobre o kernel real com todos os programas"

[features]
default = ["shell", "coreutils", "findutils", "textproc", "awk", "jq", "yaml", "diff", "archive", "misc", "procps", "net", "sqlite", "git"]
shell = ["userland/shell"]
coreutils = ["userland/coreutils"]
findutils = ["userland/findutils"]
net = ["userland/net"]
textproc = ["userland/textproc"]
awk = ["userland/awk"]
jq = ["userland/jq"]
yaml = ["userland/yaml"]
diff = ["userland/diff"]
archive = ["userland/archive"]
misc = ["userland/misc"]
procps = ["userland/procps"]
sqlite = ["userland/sqlite"]
git = ["userland/git"]

[dependencies]
sysabi = { workspace = true }
userland = { path = "../userland", default-features = false }
pl-testing = { path = "../pl-testing", features = ["kernel"] }
harness = { path = "../../testbench/crates/harness" }

[lints]
workspace = true
