# Porte pseudo-linus: fork localizado do jaq-json 2.0.3 (MIT, Michael Färber), vendorizado de
# crates.io. O manifesto original está em Cargo.toml.upstream; as alterações no código estão marcadas
# com "Porte pseudo-linus".
[package]
name = "jaq-json"
version = "2.0.3"
authors = ["Michael Färber <michael.faerber@gedenkt.at>"]
edition = "2021"
license = "MIT"
readme = "README.md"
description = "JSON values for jaq (fork do pseudo-linus)"
publish = false

[features]
default = []

[dependencies]
jaq-core = { path = "../jaq-core" }
jaq-std = { path = "../jaq-std" }

bstr = { version = "1", default-features = false }
bytes = { version = "1", default-features = false }
foldhash = { version = "0.1", default-features = false }
indexmap = { version = "2.0", default-features = false }
# Porte pseudo-linus: funções da libm que o `std` não tem (erf, j0, lgamma...). As que o `std` tem
# usam o `std`, que chama a libm do sistema como o jq do Debian.
libm = "0.2"

[lints]
workspace = true
