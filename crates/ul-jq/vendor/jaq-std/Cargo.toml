# Porte pseudo-linus: fork localizado do jaq-std 3.0.3 (MIT, Michael Färber), vendorizado de
# crates.io. O manifesto original está em Cargo.toml.upstream; as alterações no código estão marcadas
# com "Porte pseudo-linus". Saíram as partes que tocam o host (`std::env`, `SystemTime`, fuso do
# sistema, `log`) e o motor de regex `regex-bites`; tempo, fuso e regex do jq ficam no ul-jq.
[package]
name = "jaq-std"
version = "3.0.3"
authors = ["Michael Färber <michael.faerber@gedenkt.at>"]
edition = "2021"
license = "MIT"
readme = "README.md"
description = "Standard library for jaq (fork do pseudo-linus)"
publish = false

[features]
default = ["format", "math"]
format = ["aho-corasick", "base64", "urlencoding"]
math = ["libm"]

[dependencies]
jaq-core = { path = "../jaq-core" }

bstr = { version = "1.6", default-features = false, features = ["alloc", "unicode"] }
# Porte pseudo-linus: Oniguruma em Rust puro, o motor de regex do jq (ver `src/onig.rs`).
ferroni = "1.8"
libm = { version = "0.2.7", optional = true }
aho-corasick = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }
urlencoding = { version = "2.1.3", optional = true }

[lints]
workspace = true
