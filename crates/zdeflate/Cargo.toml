[package]
name = "zdeflate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# Tradução do deflate.c e do trees.c do zlib 1.3.1 (licença zlib).
license = "Zlib"
publish = false
description = "Compressor deflate do zlib 1.3.1 traduzido sem unsafe, com saída idêntica byte a byte"


[dependencies]
# O CRC-32 do invólucro gzip é o `crc32.c` do zlib 1.3.1, portado no `ul-common`.
ul-common = { path = "../ul-common" }

[lints.rust]
unsafe_code = "forbid"
