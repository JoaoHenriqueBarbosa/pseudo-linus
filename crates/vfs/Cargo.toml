[package]
name = "vfs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "VFS do pseudo-linus: namei do Linux, permissões com bypass do root, tmpfs persistente (imbl), procfs e montagens"

[dependencies]
sysabi = { workspace = true }
bitflags = "2"
imbl = "7"
parking_lot = "0.12"

[dev-dependencies]
# Teste diferencial contra o tmpfs real do host (tests/differential.rs).
proptest = "1"
rustix = { version = "1", features = ["fs", "process"] }

[lints]
workspace = true
