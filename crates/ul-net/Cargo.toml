[package]
name = "ul-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "curl e wget do pseudo-linus: HTTP/1.1 e HTTPS (rustls) sobre o net_connect do kernel, com a CLI, as mensagens e os códigos de saída do curl 8.14.1 e do wget 1.25 do Debian 13"

[dependencies]
sysabi = { workspace = true }
# TLS sobre o fd do net_connect. Provedor de cripto: ring (o mesmo medido no F12).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
# Cabeçalhos da resposta com a grafia original (o curl -i/-D/-v mostra como o servidor mandou).
httparse = "1.9"
# --compressed: gzip/deflate (zlib-rs, Rust puro), br e zstd (decodificadores Rust puros).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
brotli-decompressor = "5"
ruzstd = "0.8"

[dev-dependencies]
sysabi = { workspace = true, features = ["testkit"] }
pl-testing = { path = "../pl-testing" }

[lints]
workspace = true
