<!doctype html><html><head><meta charset="utf-8"><title>box</title>
<style>body{margin:12px;font-family:sans-serif}.b{display:inline-block;width:120px;height:70px;margin:8px;vertical-align:top;font-size:12px}
.s{border:4px solid #c33;background:#fde}.d{border:4px dashed #393;background:#efe}.o{border:4px dotted #339;background:#eef}.dbl{border:6px double #333;background:#ffe}
.r{border:3px solid #000;border-radius:16px;background:#cfc}.p{padding:10px;border:2px solid #888;background:#ddd}.op{background:#06c;opacity:.5}.sh{box-shadow:4px 4px 8px #555;background:#fff}
.g{background:linear-gradient(#f00,#00f)}.m{margin-left:30px;background:#fa0}</style></head><body>
<div class="b s">solid</div><div class="b d">dashed</div><div class="b o">dotted</div><div class="b dbl">double</div>
<div class="b r">radius</div><div class="b p">padding</div><div class="b op">opacity</div><div class="b sh">shadow</div>
<div class="b g"></div><div class="b m">margin</div></body></html>
