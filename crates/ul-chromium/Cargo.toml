[package]
name = "ul-chromium"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "chromium --headless do pseudo-linus: busca a página pelo cliente do curl, monta o DOM com o html5ever, roda os scripts no JavaScriptCore portado (zjsc) e serializa o resultado"

[dependencies]
sysabi = { workspace = true }
ul-common = { workspace = true }
ul-net = { path = "../ul-net" }
# Parser de HTML conforme a especificação (o mesmo do Servo), na versão que o blitz-html usa.
html5ever = "0.39"
markup5ever = "0.39"
encoding_rs = "0.8"
# O DOM, o parser e os seletores vêm do Blitz (Dioxus), não de uma árvore própria. Sem `system-fonts`: as fontes
# do hospedeiro não podem entrar (ver `fonts`).
blitz-dom = { version = "=0.3.0-beta.2", default-features = false, features = ["svg", "woff", "accessibility", "file-input", "custom-widget"] }
blitz-html = "=0.3.0-beta.2"
blitz-traits = "=0.3.0-beta.2"
# O contexto de fontes do Blitz, montado aqui com as fontes da VFS (sem as do sistema hospedeiro).
parley = { version = "0.11.1", default-features = false, features = ["std"] }
# O motor de CSS do Servo (o mesmo que o Blitz usa): parse e serialização canônica do `style` escrito via CSSOM.
stylo = "=0.20.0"
# O parser de media query do `matchMedia` é o do stylo, que pede o tokenizador e os modos de parse dele.
stylo_traits = "=0.20.0"
cssparser = "0.37"
selectors = "=0.40.0"
url = "2.5"
# O processador de `data:` URL da especificação de Fetch (o do Servo).
data-url = "0.3"
# Decodificação das imagens que a página carrega (dimensões e pixels), nos formatos que o Chromium aceita.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# Motor JavaScript: o JavaScriptCore portado, ainda fora do workspace (ver wip/zjsc).
zjsc = { path = "../../wip/zjsc" }

[dev-dependencies]
serde_json = "1"
zjsc = { path = "../../wip/zjsc" }
sysabi = { workspace = true, features = ["testkit"] }
pl-testing = { path = "../pl-testing" }

[lints]
workspace = true
