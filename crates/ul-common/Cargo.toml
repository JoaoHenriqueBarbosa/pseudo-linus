[package]
name = "ul-common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "O que os programas do pseudo-linus repetiam cada um por si: getopt, calendário e fusos, números e ctype da libc, citação do gnulib, caminhos e modos"

[features]
# Fusos e formatação de data pelo `jiff` com o banco da tzdata embutido (`time::zone`).
zone = ["dep:jiff"]

[dependencies]
sysabi = { workspace = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }

[dev-dependencies]
sysabi = { workspace = true, features = ["testkit"] }

# As do workspace, com uma exceção: `unsafe_code` é `deny` em vez de `forbid` porque o despacho do
# CRC-32 pela CPU (`codec::clmul` e `codec::armcrc`) precisa de um `unsafe` por kernel para chamar a
# função `#[target_feature]` depois de confirmar as features; os kernels em si são seguros.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
