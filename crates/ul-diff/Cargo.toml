[package]
name = "ul-diff"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "diff, cmp, diff3, sdiff e patch do pseudo-linus, fiéis ao GNU diffutils 3.10 e ao GNU patch 2.8"

[dependencies]
sysabi = { workspace = true }
ul-common = { workspace = true, features = ["zone"] }
# Parser de patch unificado e git (o localizador e o aplicador são nossos).
diffy = { version = "0.5", default-features = false, features = ["std"] }
# Datas dos cabeçalhos no fuso do sandbox; sem `tz-system` nem `tzdb-zoneinfo`, que leem o host.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Largura de coluna dos caracteres no lado a lado (o `wcwidth` do glibc no C.UTF-8).
unicode-width = "0.2"

[dev-dependencies]
sysabi = { workspace = true, features = ["testkit"] }
pl-testing = { path = "../pl-testing" }
harness = { path = "../../testbench/crates/harness" }
# Cache das saídas do oráculo nos testes de corpus aleatório; o imara-diff é a linha de base do F08.
serde_json = "1"
imara-diff = "0.2"

[features]
# Conformidade também sobre o kernel real (`cargo test -p ul-diff --features kernel`). Fora do padrão
# pra que um kernel no meio de uma edição não trave os testes sobre o testkit.
kernel = ["pl-testing/kernel"]

[lints]
workspace = true
