[package]
name = "ul-python"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "python3 (CPython 3.13.5 do Debian 13) do pseudo-linus"

[dependencies]
sysabi = { workspace = true }
ul-common = { workspace = true }
# Deflate/inflate em Rust puro (zlib-rs), o mesmo backend do ul-archive.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# Deflate do zlib 1.3.1 traduzido sem unsafe, com saída idêntica byte a byte (fora do workspace).
zdeflate = { path = "../../wip/zdeflate" }
# JPEG do libjpeg-turbo 2.1.5 traduzido sem unsafe, com os pixels do Pillow do Debian (fora do workspace).
zjpeg = { path = "../../wip/zjpeg" }
zft = { path = "../../wip/zft" }
# HarfBuzz 10.2.0, fribidi 1.0.16 e raqm 0.10.2 traduzidos sem unsafe: o layout Raqm do Pillow.
zhb = { path = "../../wip/zhb" }
# `__dict__` de instâncias e classes na ordem de inserção, como no CPython.
indexmap = "2"
# `int` de precisão arbitrária (o que não cabe em `i64`).
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
# `erf`, `erfc`, `gamma` e `lgamma` do `math` (fdlibm, como a libm do CPython).
libm = "0.2"
# `unicodedata`: normalização, categorias gerais, classes de combinação e nomes de caracteres.
icu_normalizer = "2"
icu_properties = "2"
unicode_names2 = "3"
# `bz2` e `lzma`: os mesmos codecs que o bzip2 e o xz do sandbox usam.
ul-archive = { path = "../ul-archive" }
# `sqlite3`: o mesmo motor e o mesmo VFS (banco no FS do sandbox) do programa sqlite3.
ul-sqlite = { path = "../ul-sqlite" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["functions", "hooks", "limits", "series", "collation", "window", "backup", "serialize", "modern_sqlite", "cache", "column_decltype"] }

[dev-dependencies]
# Os testes de `os.fork` rodam o interpretador dentro de um pseudo-processo do kernel de teste (que cria o
# filho de `spawn_fn` e o espera de verdade).
sysabi = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
