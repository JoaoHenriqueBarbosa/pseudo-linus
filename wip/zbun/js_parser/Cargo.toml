[package]
name = "bun_js_parser"
version = "1.4.2"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
bstr.workspace = true
bun_alloc = { path = "../bun_alloc" }
bun_ast = { path = "../ast" }
bun_collections = { path = "../bun_collections" }
bun_core = { path = "../bun_core" }
bun_options_types = { path = "../options_types" }
bun_paths = { path = "../paths" }
bun_wyhash = { path = "../bun_wyhash" }
bitflags.workspace = true
enumset.workspace = true
scopeguard.workspace = true
smallvec.workspace = true
thiserror.workspace = true
# O base64 padrão com preenchimento (o `bun_base64::encode` do upstream) e o que mais for comum aos programas.
ul-common = { path = "../../../crates/ul-common" }
bytemuck.workspace = true
strum.workspace = true

[features]
# O parser copiado do upstream, enquanto não compila (README, "Próximos passos", passo 2).
parser = []
# Ganchos de crates que ficam fora do porte por decisão da coordenação. Ligar exige portar a crate antes; enquanto
# isso, a opção `--react-compiler` não pode chegar ao parser.
react_compiler = []
crash_handler = []

[lints]
workspace = true
