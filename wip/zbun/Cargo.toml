[workspace]
resolver = "2"
members = ["ast", "bun_alloc", "bun_collections", "bun_core", "bun_core_macros", "bun_wyhash", "js_parser", "js_printer", "options_types", "paths", "react_compiler", "sourcemap", "transpile"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
bitflags = "2"
bstr = "1"
bytemuck = "1"
enum-map = "2"
enumset = "1"
# A versão do upstream (Cargo.lock do bun 1.4.2): a ordem de iteração da tabela de membros do escopo é a dele.
hashbrown = { version = "=0.15.5", default-features = false, features = ["inline-more", "raw-entry"] }
smallvec = "1"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
