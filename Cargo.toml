# Workspace principal do pseudo-linus. Cada crate vive em crates/<nome>; crates vendorizados dentro de
# um crate (ex.: crates/ul-coreutils/vendor/uucore) viram membros automaticamente por serem path
# dependencies dentro do workspace.
[workspace]
resolver = "3"
members = ["crates/*"]
# A bancada é outro workspace (testbench/Cargo.toml); o harness entra aqui só como dependência.
exclude = ["testbench", "wip"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Crates internos.
rbtree = { path = "crates/rbtree" }
sched = { path = "crates/sched" }
sysabi = { path = "crates/sysabi" }
sysio = { path = "crates/sysio" }
vfs = { path = "crates/vfs" }
kernel = { path = "crates/kernel" }
mirror = { path = "crates/mirror" }
shell = { path = "crates/shell" }
regex-posix = { path = "crates/regex-posix" }
ul-common = { path = "crates/ul-common" }
userland = { path = "crates/userland" }

[profile.dev]
# Sem debuginfo: vários builds em paralelo precisam caber no disco e compilar rápido.
debug = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = "line-tables-only"

# Perfil do ciclo de trabalho (`--profile fast`): o painel de conformidade só compara saída, então
# opt-level 1, incremental e muitas unidades de código recompilam em segundos em vez de minutos.
# O `release` fica para medir desempenho e para o binário final.
[profile.fast]
inherits = "release"
opt-level = 1
debug = 0
incremental = true
codegen-units = 256
lto = false

# rusqlite 0.40.2 vendorizado: o generate_series dele segue a semântica antiga do series.c e o
# sqlite3 do Debian 13 é o 3.46.1. A tabela virtual exige `unsafe impl`, que os nossos crates
# proíbem; a correção fica na dependência, que já é unsafe por natureza.
[patch.crates-io]
rusqlite = { path = "vendor/rusqlite" }
# tracking-allocator 0.4.0 vendorizado: o cabeçalho de 8 bytes deixava o objeto em 8 mod 16, e o
# unwinder do alvo musl exige 16 na exceção do panic (o binário estático caía em todo `execve`).
tracking-allocator = { path = "vendor/tracking-allocator" }
