# Workspace principal do pseudo-linus. Por enquanto só os crates que a bancada já valida:
# a árvore rubro-negra aumentada e o escalonador EEVDF, ambos feitos à mão.
[workspace]
resolver = "3"
members = ["crates/rbtree", "crates/sched"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
