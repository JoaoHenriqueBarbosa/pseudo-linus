tool = "coreutils"
source = "agent-style"

# Somas de verificação: md5sum, sha*sum, b2sum, cksum e sum. Cobre arquivo, stdin, "-", vários
# arquivos, --tag, -c (ok, FAILED, arquivo ausente, linha malformada, --quiet, --status,
# --ignore-missing) e os erros mais comuns. a.txt = "hello\n" e b.txt = "world\n" em quase todos.

# md5sum

[[case]]
id = "md5sum-file"
argv = ["md5sum", "a.txt"]
tags = ["md5sum", "checksum"]
[case.files]
"a.txt" = "hello\n"

[[case]]
id = "md5sum-multi"
argv = ["md5sum", "a.txt", "b.txt"]
tags = ["md5sum", "checksum"]
[case.files]
"a.txt" = "hello\n"
"b.txt" = "world\n"

[[case]]
id = "md5sum-stdin"
argv = ["md5sum"]
stdin = "hello\n"
tags = ["md5sum", "checksum", "stdin"]

[[case]]
id = "md5sum-dash-and-file"
argv = ["md5sum", "-", "b.txt"]
stdin = "hello\n"
tags = ["md5sum", "checksum", "stdin"]
[case.files]
"b.txt" = "world\n"

[[case]]
id = "md5sum-empty"
argv = ["md5sum", "empty"]
tags = ["md5sum", "checksum"]
[case.files]
"empty" = ""

[[case]]
id = "md5sum-tag"
argv = ["md5sum", "--tag", "a.txt"]
tags = ["md5sum", "checksum"]
[case.files]
"a.txt" = "hello\n"

[[case]]
id = "md5sum-binary-marker"
argv = ["md5sum", "-b", "a.txt"]
tags = ["md5sum", "checksum"]
[case.files]
"a.txt" = "hello\n"

[[case]]
id = "md5sum-zero-terminated"
argv = ["md5sum", "-z", "a.txt", "b.txt"]
tags = ["md5sum", "checksum"]
[case.files]
"a.txt" = "hello\n"
"b.txt" = "world\n"

# Nome com barra invertida: o GNU escapa o nome e prefixa a linha com "\".
[[case]]
id = "md5sum-backslash-name"
argv = ["md5sum", "a\\b.txt"]
tags = ["md5sum", "checksum", "escape"]
[case.files]
"a\\b.txt" = "hello\n"

[[case]]
id = "md5sum-missing"
argv = ["md5sum", "a.txt", "nope.txt"]
tags = ["md5sum", "checksum", "errno"]
[case.files]
"a.txt" = "hello\n"

[[case]]
id = "md5sum-dir"
argv = ["md5sum", "d"]
tags = ["md5sum", "checksum", "errno"]
[case.files]
"d" = { dir = true }

[[case]]
id = "md5sum-bad-option"
argv = ["md5sum", "-Q", "a.txt"]
tags = ["md5sum", "checksum", "errno"]
[case.files]
"a.txt" = "hello\n"

[[case]]
id = "md5sum-check-ok"
argv = ["md5sum", "-c", "sums.md5"]
tags = ["md5sum", "checksum", "check"]
[case.files]
"a.txt" = "hello\n"
"b.txt" = "world\n"
"sums.md5" = "b1946ac92492d2347c6235b4d2611184  a.txt\n591785b794601e212b260e25925636fd  b.txt\n"

[[case]]
id = "md5sum-check-failed"
argv = ["md5sum", "-c", "sums.md5"]
tags = ["md5sum", "checksum", "check", "errno"]
[case.files]
"a.txt" = "hello\n"
"b.txt" = "world\n"
"sums.md5" = "b1946ac92492d2347c6235b4d2611184  a.txt\n00000000000000000000000000000000  b.txt\n"

[[case]]
id = "md5sum-check-missing-file"
argv = ["md5sum", "-c", "sums.md5"]
tags = ["md5sum", "checksum", "check", "errno"]
[case.files]
"a.txt" = "hello\n"
"sums.md5" = "b1946ac92492d2347c6235b4d2611184  a.txt\n591785b794601e212b260e25925636fd  nope.txt\n"

[[case]]
id = "md5sum-check-ignore-missing"
argv = ["md5sum", "-c", "--ignore-missing", "sums.md5"]
tags = ["md5sum", "checksum", "check"]
[case.files]
"a.txt" = "hello\n"
"sums.md5" = "b1946ac92492d2347c6235b4d2611184  a.txt\n591785b794601e212b260e25925636fd  nope.txt\n"

[[case]]
id = "md5sum-check-quiet"
argv = ["md5sum", "-c", "--quiet", "sums.md5"]
tags = ["md5sum", "checksum", "check", "errno"]
[case.files]
"a.txt" = "hello\n"
"b.txt" = "world\n"
"sums.md5" = "b1946ac92492d2347c6235b4d2611184  a.txt\n00000000000000000000000000000000  b.txt\n"

[[case]]
id = "md5sum-check-status"
argv = ["md5sum", "-c", "--status", "sums.md5"]
tags = ["md5sum", "checksum", "check", "errno"]
[case.files]
"a.txt" = "hello\n"
"b.txt" = "world\n"
"sums.md5" = "b1946ac92492d2347c6235b4d2611184  a.txt\n00000000000000000000000000000000  b.txt\n"

[[case]]
id = "md5sum-check-malformed"
argv = ["md5sum", "-c", "sums.md5"]
tags = ["md5sum", "checksum", "check", "errno"]
[case.files]
"sums.md5" = "isto não é uma soma\n"

[[case]]
id = "md5sum-check-some-malformed-warn"
argv = ["md5sum", "-c", "-w", "sums.md5"]
tags = ["md5sum", "checksum", "check"]
[case.files]
"a.txt" = "hello\n"
"sums.md5" = "b1946ac92492d2347c6235b4d2611184  a.txt\nlixo\n"

[[case]]
id = "md5sum-check-stdin"
argv = ["md5sum", "-c", "-"]
stdin = "b1946ac92492d2347c6235b4d2611184  a.txt\n"
tags = ["md5sum", "checksum", "check", "stdin"]
[case.files]
"a.txt" = "hello\n"

[[case]]
id = "md5sum-check-tagged"
argv = ["md5sum", "-c", "sums"]
tags = ["md5sum", "checksum", "check"]
[case.files]
"a.txt" = "hello\n"
"sums" = "MD5 (a.txt) = b1946ac92492d2347c6235b4d2611184\n"

[[case]]
id = "md5sum-check-missing-list"
argv = ["md5sum", "-c", "nope.md5"]
tags = ["md5sum", "checksum", "check", "errno"]

