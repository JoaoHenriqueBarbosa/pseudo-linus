tool = "coreutils"
source = "agent-style"

# Mais operações de arquivo: rmdir, mktemp, install, truncate, link, unlink, mkfifo, mknod, sync
# e dd. O retrato do diretório registra conteúdo e modo; FIFO e dispositivo aparecem como arquivo
# vazio com os bits de tipo 0o170000 somados ao modo, por isso os casos de mkfifo e mknod também
# conferem o tipo com stat. O mktemp cria nomes aleatórios: os casos felizes rodam num script que
# não imprime o nome e apaga o que criou dentro do diretório do caso.

# rmdir

[[case]]
id = "rmdir-empty"
argv = ["rmdir", "d"]
tags = ["rmdir", "fs"]
[case.files]
"d" = { dir = true }
"keep.txt" = "k\n"

[[case]]
id = "rmdir-multiple"
argv = ["rmdir", "a", "b"]
tags = ["rmdir", "fs"]
[case.files]
"a" = { dir = true }
"b" = { dir = true }

[[case]]
id = "rmdir-parents"
argv = ["rmdir", "-p", "a/b/c"]
tags = ["rmdir", "fs"]
[case.files]
"a/b/c" = { dir = true }

[[case]]
id = "rmdir-parents-stops-nonempty"
argv = ["rmdir", "-p", "a/b"]
tags = ["rmdir", "fs", "errno"]
[case.files]
"a/b" = { dir = true }
"a/other.txt" = "o\n"

[[case]]
id = "rmdir-verbose"
argv = ["rmdir", "-v", "-p", "a/b"]
tags = ["rmdir", "fs"]
[case.files]
"a/b" = { dir = true }

[[case]]
id = "rmdir-nonempty"
argv = ["rmdir", "d"]
tags = ["rmdir", "fs", "errno"]
[case.files]
"d/x" = "x\n"

[[case]]
id = "rmdir-ignore-fail-non-empty"
argv = ["rmdir", "--ignore-fail-on-non-empty", "d", "e"]
tags = ["rmdir", "fs"]
[case.files]
"d/x" = "x\n"
"e" = { dir = true }

[[case]]
id = "rmdir-missing"
argv = ["rmdir", "nope"]
tags = ["rmdir", "fs", "errno"]

[[case]]
id = "rmdir-not-dir"
argv = ["rmdir", "a.txt"]
tags = ["rmdir", "fs", "errno"]
[case.files]
"a.txt" = "a\n"

[[case]]
id = "rmdir-symlink-to-dir"
argv = ["rmdir", "link"]
tags = ["rmdir", "fs", "errno", "symlink"]
[case.files]
"d" = { dir = true }
"link" = { symlink = "d" }

[[case]]
id = "rmdir-no-operand"
argv = ["rmdir"]
tags = ["rmdir", "fs", "errno"]

# mktemp

[[case]]
id = "mktemp-dir-ok"
script = "d=$(mktemp -d) && test -d \"$d\" && stat -c %a \"$d\" && rmdir \"$d\" && echo ok"
tags = ["mktemp", "fs"]

[[case]]
id = "mktemp-file-ok"
script = "f=$(mktemp) && test -f \"$f\" && test ! -s \"$f\" && stat -c %a \"$f\" && rm \"$f\" && echo ok"
tags = ["mktemp", "fs"]

[[case]]
id = "mktemp-default-location"
script = "f=$(mktemp) && case \"$f\" in /tmp/tmp.??????????) echo ok;; *) echo \"inesperado\";; esac; rm -f \"$f\""
tags = ["mktemp", "fs"]

[[case]]
id = "mktemp-suffix"
script = "f=$(mktemp --suffix=.txt) && case \"$f\" in /tmp/tmp.*.txt) echo ok;; *) echo inesperado;; esac; rm -f \"$f\""
tags = ["mktemp", "fs"]

[[case]]
id = "mktemp-template-cwd"
script = "f=$(mktemp lock.XXXXXX) && case \"$f\" in lock.??????) test -f \"$f\" && rm \"$f\" && echo ok;; esac"
tags = ["mktemp", "fs"]

[[case]]
id = "mktemp-p-dir"
script = "d=$(mktemp -d -p sub) && case \"$d\" in sub/tmp.*) rmdir \"$d\" && echo ok;; esac"
tags = ["mktemp", "fs"]
[case.files]
"sub" = { dir = true }

[[case]]
id = "mktemp-dry-run"
script = "f=$(mktemp -u) && test ! -e \"$f\" && echo ok"
tags = ["mktemp", "fs"]

[[case]]
id = "mktemp-too-few-x"
argv = ["mktemp", "fooXX"]
tags = ["mktemp", "fs", "errno"]

[[case]]
id = "mktemp-p-missing-dir"
argv = ["mktemp", "-p", "nodir"]
tags = ["mktemp", "fs", "errno"]

[[case]]
id = "mktemp-d-missing-parent"
argv = ["mktemp", "-d", "nodir/x.XXXXXX"]
tags = ["mktemp", "fs", "errno"]

[[case]]
id = "mktemp-too-many-templates"
argv = ["mktemp", "a.XXXXXX", "b.XXXXXX"]
tags = ["mktemp", "fs", "errno"]

[[case]]
id = "mktemp-suffix-with-slash"
argv = ["mktemp", "--suffix=a/b", "x.XXXXXX"]
tags = ["mktemp", "fs", "errno"]

# install

