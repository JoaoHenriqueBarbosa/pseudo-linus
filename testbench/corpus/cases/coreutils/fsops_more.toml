argv = ["install", "-m", "644", "a.txt", "b.txt", "dest/"]
tags = ["install", "fs"]
[case.files]
"a.txt" = "a\n"
"b.txt" = { content = "b\n", mode = 0o600 }
"dest" = { dir = true }

[[case]]
id = "install-d"
argv = ["install", "-d", "a/b/c", "x"]
tags = ["install", "fs"]

[[case]]
