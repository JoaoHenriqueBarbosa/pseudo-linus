[case.files]
"a.txt" = "a\n"

[[case]]
id = "install-missing-src"
argv = ["install", "nope.txt", "b.txt"]
tags = ["install", "fs", "errno"]

[[case]]
id = "install-missing-dest"
argv = ["install", "a.txt"]
tags = ["install", "fs", "errno"]
[case.files]
"a.txt" = "a\n"

[[case]]
