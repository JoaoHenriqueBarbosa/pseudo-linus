argv = ["install", "-o", "nouser", "a.txt", "b.txt"]
tags = ["install", "fs", "errno", "owner"]
[case.files]
"a.txt" = "a\n"

[[case]]
id = "install-missing-dest-dir"
argv = ["install", "a.txt", "nodir/b.txt"]
tags = ["install", "fs", "errno"]
[case.files]
"a.txt" = "a\n"

