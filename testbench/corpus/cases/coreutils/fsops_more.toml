argv = ["install", "-m", "999", "a.txt", "b.txt"]
tags = ["install", "fs", "errno"]
[case.files]
"a.txt" = "a\n"

[[case]]
id = "install-omit-dir"
argv = ["install", "d", "e"]
tags = ["install", "fs", "errno"]
[case.files]
"d" = { dir = true }

[[case]]
id = "install-same-file"
