# rev (util-linux)

[[case]]
id = "rev-file"
argv = ["rev", "in.txt"]
tags = ["rev", "text"]
[case.files]
"in.txt" = "abc\nhello world\n\nx\n"

[[case]]
id = "rev-stdin"
argv = ["rev"]
stdin = "123\n456\n"
tags = ["rev", "text", "stdin"]

[[case]]
id = "rev-utf8"
argv = ["rev", "in.txt"]
tags = ["rev", "text", "utf8"]
