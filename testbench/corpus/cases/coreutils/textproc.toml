tool = "coreutils"
source = "agent-style"

# Filtros de texto: nl, paste, join, comm, tac, rev (util-linux), fold, fmt, expand e unexpand.
# Cada um com o caso feliz, stdin, "-" quando faz sentido, as flags principais e os erros comuns.

# nl

[[case]]
id = "nl-default"
argv = ["nl", "in.txt"]
tags = ["nl", "text"]
[case.files]
"in.txt" = "primeira\n\nterceira\n  quarta\n"

[[case]]
id = "nl-ba"
argv = ["nl", "-ba", "in.txt"]
tags = ["nl", "text"]
[case.files]
"in.txt" = "primeira\n\nterceira\n"

[[case]]
id = "nl-format-ln"
argv = ["nl", "-n", "ln", "in.txt"]
tags = ["nl", "text"]
[case.files]
"in.txt" = "a\nb\n"

[[case]]
id = "nl-format-rz-width"
argv = ["nl", "-n", "rz", "-w", "4", "in.txt"]
tags = ["nl", "text"]
[case.files]
"in.txt" = "a\nb\n"

[[case]]
id = "nl-separator-width"
argv = ["nl", "-w", "2", "-s", ": ", "in.txt"]
tags = ["nl", "text"]
[case.files]
"in.txt" = "a\nb\n"

[[case]]
id = "nl-start-increment"
argv = ["nl", "-v", "10", "-i", "5", "in.txt"]
tags = ["nl", "text"]
[case.files]
"in.txt" = "a\nb\nc\n"

[[case]]
id = "nl-body-regex"
argv = ["nl", "-b", "p^#", "in.txt"]
tags = ["nl", "text", "regex"]
[case.files]
"in.txt" = "# um\ncódigo\n# dois\n"

[[case]]
id = "nl-sections"
argv = ["nl", "in.txt"]
tags = ["nl", "text"]
[case.files]
"in.txt" = "\\:\\:\\:\ncabeçalho\n\\:\\:\ncorpo 1\ncorpo 2\n\\:\nrodapé\n\\:\\:\ncorpo de novo\n"

[[case]]
id = "nl-stdin"
argv = ["nl"]
stdin = "x\ny\n"
tags = ["nl", "text", "stdin"]

[[case]]
id = "nl-multi-files-continue"
argv = ["nl", "a.txt", "-", "b.txt"]
stdin = "do stdin\n"
tags = ["nl", "text", "stdin"]
[case.files]
"a.txt" = "a1\na2\n"
"b.txt" = "b1\n"

[[case]]
id = "nl-missing"
argv = ["nl", "nope.txt"]
tags = ["nl", "text", "errno"]

[[case]]
id = "nl-bad-format"
argv = ["nl", "-n", "xx", "in.txt"]
tags = ["nl", "text", "errno"]
[case.files]
"in.txt" = "a\n"

# paste

[[case]]
id = "paste-two-files"
argv = ["paste", "a.txt", "b.txt"]
tags = ["paste", "text"]
[case.files]
"a.txt" = "1\n2\n3\n"
"b.txt" = "um\ndois\ntrês\n"

[[case]]
id = "paste-d-comma"
argv = ["paste", "-d,", "a.txt", "b.txt"]
tags = ["paste", "text"]
[case.files]
"a.txt" = "1\n2\n"
"b.txt" = "x\ny\n"

[[case]]
id = "paste-uneven"
argv = ["paste", "a.txt", "b.txt"]
tags = ["paste", "text"]
[case.files]
"a.txt" = "1\n2\n3\n4\n"
"b.txt" = "x\n"

[[case]]
id = "paste-s"
argv = ["paste", "-s", "a.txt", "b.txt"]
tags = ["paste", "text"]
[case.files]
"a.txt" = "1\n2\n3\n"
"b.txt" = "x\ny\n"

[[case]]
id = "paste-sd-plus"
argv = ["paste", "-sd+", "nums.txt"]
tags = ["paste", "text"]
[case.files]
"nums.txt" = "10\n20\n30\n"

[[case]]
id = "paste-stdin-columns"
argv = ["paste", "-", "-", "-"]
stdin = "1\n2\n3\n4\n5\n6\n7\n"
tags = ["paste", "text", "stdin"]

[[case]]
id = "paste-d-cycle"
argv = ["paste", "-d", ":,", "a.txt", "b.txt", "c.txt"]
tags = ["paste", "text"]
[case.files]
"a.txt" = "a\n"
"b.txt" = "b\n"
"c.txt" = "c\n"

[[case]]
id = "paste-no-trailing-newline"
argv = ["paste", "a.txt", "b.txt"]
tags = ["paste", "text"]
[case.files]
"a.txt" = "1\n2"
"b.txt" = "x\ny"

[[case]]
id = "paste-missing"
argv = ["paste", "a.txt", "nope.txt"]
tags = ["paste", "text", "errno"]
[case.files]
"a.txt" = "1\n"

# join

[[case]]
id = "join-basic"
argv = ["join", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "1 ana\n2 bia\n4 duda\n"
"b.txt" = "1 rio\n2 sp\n3 bh\n"

[[case]]
