# fold

[[case]]
id = "fold-default"
argv = ["fold", "in.txt"]
tags = ["fold", "text"]
[case.files]
"in.txt" = "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789\ncurta\n"

[[case]]
id = "fold-w"
argv = ["fold", "-w", "10", "in.txt"]
tags = ["fold", "text"]
[case.files]
"in.txt" = "the quick brown fox jumps over the lazy dog\n"

[[case]]
id = "fold-s"
argv = ["fold", "-s", "-w", "10", "in.txt"]
tags = ["fold", "text"]
[case.files]
"in.txt" = "the quick brown fox jumps over the lazy dog\n"

# O fold do Debian conta bytes mesmo sem -b (o coreutils não tem o patch i18n): os dois casos
# quebram "ç" ao meio.
[[case]]
id = "fold-utf8-columns"
argv = ["fold", "-w", "3", "in.txt"]
tags = ["fold", "text", "utf8"]
[case.files]
"in.txt" = "ççççç\n"

[[case]]
id = "fold-b-utf8"
argv = ["fold", "-b", "-w", "3", "in.txt"]
tags = ["fold", "text", "utf8"]
[case.files]
"in.txt" = "ççççç\n"

[[case]]
id = "fold-tabs"
argv = ["fold", "-w", "10", "in.txt"]
tags = ["fold", "text"]
[case.files]
"in.txt" = "a\tb\tc\td\n"

[[case]]
id = "fold-stdin"
argv = ["fold", "-w5"]
stdin = "abcdefghijkl\n"
tags = ["fold", "text", "stdin"]

[[case]]
id = "fold-missing"
argv = ["fold", "nope.txt"]
tags = ["fold", "text", "errno"]

[[case]]
id = "fold-bad-width"
argv = ["fold", "-w", "0x", "in.txt"]
tags = ["fold", "text", "errno"]
[case.files]
"in.txt" = "a\n"

# fmt

[[case]]
id = "fmt-default"
argv = ["fmt", "in.txt"]
tags = ["fmt", "text"]
[case.files]
"in.txt" = "Esta é uma linha curta.\nOutra linha curta que deve ser juntada à anterior porque o fmt preenche até setenta e cinco colunas por padrão.\n\nNovo parágrafo.\n"

[[case]]
id = "fmt-w"
argv = ["fmt", "-w", "20", "in.txt"]
tags = ["fmt", "text"]
[case.files]
"in.txt" = "the quick brown fox jumps over the lazy dog and keeps running\n"

[[case]]
id = "fmt-u"
argv = ["fmt", "-u", "in.txt"]
tags = ["fmt", "text"]
[case.files]
"in.txt" = "um    dois   três.  Quatro\n"

[[case]]
id = "fmt-s"
argv = ["fmt", "-s", "-w", "15", "in.txt"]
tags = ["fmt", "text"]
[case.files]
"in.txt" = "uma linha bem comprida aqui\ncurta\n"

[[case]]
id = "fmt-indent-preserved"
argv = ["fmt", "-w", "30", "in.txt"]
tags = ["fmt", "text"]
[case.files]
