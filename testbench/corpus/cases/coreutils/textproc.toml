argv = ["fmt", "-p", "#", "-w", "25", "in.txt"]
tags = ["fmt", "text"]
[case.files]
"in.txt" = "# comentário que é longo demais pra caber numa linha só\n# e continua aqui\ncódigo()\n"

[[case]]
id = "fmt-stdin"
argv = ["fmt", "-w", "12"]
stdin = "a b c d e f g h i j k l m n\n"
tags = ["fmt", "text", "stdin"]

[[case]]
id = "fmt-bad-width"
argv = ["fmt", "-w", "abc", "in.txt"]
tags = ["fmt", "text", "errno"]
[case.files]
"in.txt" = "a\n"

[[case]]
id = "fmt-missing"
argv = ["fmt", "nope.txt"]
tags = ["fmt", "text", "errno"]

