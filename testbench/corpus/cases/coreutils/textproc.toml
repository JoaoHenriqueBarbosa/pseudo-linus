tags = ["join", "text", "csv"]
[case.files]
"a.csv" = "id1,ana\nid2,bia\n"
"b.csv" = "id1,10\nid2,20\n"

[[case]]
id = "join-fields"
argv = ["join", "-1", "2", "-2", "1", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "ana 1\nbia 2\n"
"b.txt" = "1 rio\n2 sp\n"

[[case]]
id = "join-a1"
argv = ["join", "-a", "1", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "1 ana\n2 bia\n4 duda\n"
"b.txt" = "1 rio\n2 sp\n3 bh\n"

[[case]]
id = "join-v2"
argv = ["join", "-v", "2", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "1 ana\n2 bia\n4 duda\n"
"b.txt" = "1 rio\n2 sp\n3 bh\n"

[[case]]
id = "join-o-e"
argv = ["join", "-a", "1", "-a", "2", "-e", "NULL", "-o", "0,1.2,2.2", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "1 ana\n2 bia\n4 duda\n"
"b.txt" = "1 rio\n2 sp\n3 bh\n"

[[case]]
id = "join-o-auto"
argv = ["join", "-a", "1", "-e", "-", "-o", "auto", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "1 ana x\n2 bia y\n"
"b.txt" = "1 rio\n"

[[case]]
id = "join-ignore-case"
argv = ["join", "-i", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "Ana 1\nBia 2\n"
"b.txt" = "ana x\nbia y\n"

[[case]]
id = "join-header"
argv = ["join", "--header", "-t,", "a.csv", "b.csv"]
tags = ["join", "text", "csv"]
[case.files]
"a.csv" = "id,nome\n1,ana\n2,bia\n"
"b.csv" = "id,cidade\n1,rio\n2,sp\n"

[[case]]
id = "join-unsorted"
argv = ["join", "a.txt", "b.txt"]
tags = ["join", "text", "errno"]
[case.files]
"a.txt" = "2 bia\n1 ana\n"
"b.txt" = "1 rio\n2 sp\n"

[[case]]
id = "join-nocheck-order"
argv = ["join", "--nocheck-order", "a.txt", "b.txt"]
tags = ["join", "text"]
[case.files]
"a.txt" = "2 bia\n1 ana\n"
"b.txt" = "1 rio\n2 sp\n"

[[case]]
id = "join-stdin"
argv = ["join", "-", "b.txt"]
stdin = "1 ana\n2 bia\n"
tags = ["join", "text", "stdin"]
[case.files]
"b.txt" = "1 rio\n2 sp\n"

[[case]]
id = "join-missing"
argv = ["join", "a.txt", "nope.txt"]
tags = ["join", "text", "errno"]
[case.files]
"a.txt" = "1 ana\n"

[[case]]
id = "join-missing-operand"
argv = ["join", "a.txt"]
tags = ["join", "text", "errno"]
[case.files]
"a.txt" = "1 ana\n"

