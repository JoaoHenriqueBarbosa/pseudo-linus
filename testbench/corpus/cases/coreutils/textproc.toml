"b.txt" = "b1\nb2\n"

[[case]]
id = "tac-stdin"
argv = ["tac"]
stdin = "x\ny\nz\n"
tags = ["tac", "text", "stdin"]

[[case]]
id = "tac-no-trailing-newline"
argv = ["tac", "in.txt"]
