tool = "wget"
source = "manual"

# Uso de agente contra um servidor HTTP local em segundo plano. O registro do wget vai para o stderr com
# data e taxa: o caso junta o stderr no stdout e troca essas partes por marcadores.

[[case]]
id = "download-log-errors"
tags = ["net"]
script = '''
cat > /tmp/srv.py <<'EOF'
import http.server, json
class H(http.server.BaseHTTPRequestHandler):
    protocol_version = 'HTTP/1.1'
    def log_message(self, *a): pass
    def _send(self, code, body, ctype='text/plain', extra=()):
        self.send_response(code)
        self.send_header('Content-Type', ctype)
        for k, v in extra: self.send_header(k, v)
        self.send_header('Content-Length', str(len(body)))
        self.end_headers()
        if self.command != 'HEAD': self.wfile.write(body)
    def do_GET(self):
        p = self.path
        if p.startswith('/redir'):
            n = int(p[6:] or 1)
            return self._send(302, b'', extra=[('Location', '/redir%d' % (n - 1) if n > 1 else '/ok')])
        if p == '/ok': return self._send(200, b'tudo ok\n')
        if p == '/big': return self._send(200, bytes(range(256)) * 600, 'application/octet-stream')
        if p == '/chunk':
            self.send_response(200); self.send_header('Transfer-Encoding', 'chunked'); self.end_headers()
            for part in (b'pri', b'meiro\n'): self.wfile.write(b'%x\r\n%s\r\n' % (len(part), part))
            self.wfile.write(b'0\r\n\r\n'); return
        if p.startswith('/echo'):
            h = {k: v for k, v in self.headers.items() if k.lower() != 'host'}
            return self._send(200, json.dumps({'m': self.command, 'path': p, 'h': h}, sort_keys=True).encode() + b'\n', 'application/json')
        if p == '/500': return self._send(500, b'falhou\n')
        return self._send(404, b'nao achei\n')
    do_HEAD = do_GET
    def do_POST(self):
        n = int(self.headers.get('Content-Length', 0)); body = self.rfile.read(n)
        info = {'m': self.command, 'ct': self.headers.get('Content-Type'), 'body': body.decode('latin-1'), 'ua': self.headers.get('User-Agent')}
        self._send(201, json.dumps(info, sort_keys=True).encode() + b'\n', 'application/json')
    do_PUT = do_POST
http.server.ThreadingHTTPServer(('127.0.0.1', 8099), H).serve_forever()
EOF
python3 /tmp/srv.py &
for i in $(seq 100); do wget -q -O /dev/null http://127.0.0.1:8099/ok && break; sleep 0.1; done
mkdir -p /tmp/w && cd /tmp/w
U=http://127.0.0.1:8099
norm() { sed -E 's/[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:]{2}:[0-9]{2}:[0-9]{2}/DATA/g; s/\([0-9.]+ [KMG]?B\/s\)/(TAXA)/; s/ +[0-9.]+[ KMG]=[0-9.]+s$/ TAXA/; s/^  Date: .*/  Date: X/'; }
t() { echo "== $*"; "$@" 2>&1 | norm; echo "[rc=${PIPESTATUS[0]}]"; }
t wget -q -O - $U/ok
t wget $U/ok; cat ok
t wget -nv $U/ok; ls ok*
t wget -O - $U/nada
t wget -nv -O - $U/500
t wget -q -O - http://127.0.0.1:1/
t wget -O /dev/null http://127.0.0.1:1/
t wget -qS -O /dev/null $U/ok
t wget -q -O - --post-data 'a=1' $U/x
t wget -q -O - --header 'X-Tok: 7' -U ag/2 $U/echo
t wget -O redir.txt $U/redir2; cat redir.txt
t wget --max-redirect=1 -q -O - $U/redir3
t wget -q -O - $U/chunk
t wget --spider $U/ok
t wget --spider $U/nada
t wget -q -P dl $U/ok; cat dl/ok
t wget -nc $U/ok
t wget -c $U/ok
t wget -q "$U/echo?a=1&b=2"; ls echo*
t wget -q -O - --body-data=zz --method=PUT $U/x
t wget -q -O big.bin $U/big; wc -c < big.bin
t wget -O - http://nao.existe/
t wget nada://x
t wget
t wget --opcao-que-nao-existe $U/ok
kill %1
wait
'''
