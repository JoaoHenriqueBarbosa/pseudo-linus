tool = "shell"
source = "agent-style"

# Arrays indexados e associativos, mapfile, redirecionamentos e descritores.

[[case]]
id = "array-indexed-ops"
script = '''
a=(zero um "dois três")
a+=(quatro)
a[10]=dez
echo "${#a[@]} ${a[2]} ${a[-1]} ${!a[*]}"
unset 'a[1]'
echo "${a[@]}"
for x in "${a[@]}"; do printf '[%s]' "$x"; done; echo
b=("${a[@]:1:2}"); echo "${b[@]}"
c=($(echo x y z)); echo "${#c[@]}"
echo "${a[*]}" "${a[@]/#/-}"
sorted=($(printf '%s\n' 3 1 2 | sort -n)); echo "${sorted[*]}"
'''
tags = ["arrays"]

[[case]]
id = "array-assoc-ops"
script = '''
declare -A cor=([maçã]=vermelha [banana]=amarela)
cor[uva]=roxa
cor+=([kiwi]=verde)
echo "${cor[banana]} ${#cor[@]}"
for k in $(printf '%s\n' "${!cor[@]}" | sort); do echo "$k=${cor[$k]}"; done
[[ -v cor[uva] ]] && echo "tem uva"
unset 'cor[uva]'
[[ -v cor[uva] ]] || echo "sem uva"
declare -A conta
for w in a b a c a b; do conta[$w]=$(( ${conta[$w]:-0} + 1 )); done
for k in a b c; do echo "$k:${conta[$k]}"; done
'''
tags = ["assoc-arrays"]

[[case]]
id = "array-assoc-iteration-order"
script = '''
declare -A m
for k in alfa beta gama delta epsilon zeta eta teta; do m[$k]=1; done
echo "${!m[@]}"
'''
tags = ["assoc-arrays", "ordering"]

[[case]]
id = "mapfile-readarray"
script = '''
mapfile -t linhas < dados.txt
echo "${#linhas[@]}: ${linhas[1]}"
readarray -t -s 1 -n 2 parte < dados.txt
echo "${parte[*]}"
mapfile -t -d , campos <<< "a,b,c"
printf '[%s]' "${campos[@]}"; echo
mapfile arr < <(printf 'x\ny\n'); printf '%q ' "${arr[@]}"; echo
'''
tags = ["arrays", "mapfile"]
[case.files]
"dados.txt" = "linha1\nlinha2\nlinha3\nlinha4\n"

[[case]]
id = "redirect-stdout-stderr-combos"
script = '''
f() { echo out; echo err >&2; }
f > o1.txt 2> e1.txt
f > both.txt 2>&1
f 2>&1 > only_out.txt | sed 's/^/pipe:/'
f &> amp.txt
f &>> amp.txt
f >> o1.txt 2>/dev/null
f 2>&1 | wc -l
for x in o1 e1 both only_out amp; do printf '%s: ' "$x"; tr '\n' ' ' < $x.txt; echo; done
'''
tags = ["redirect"]

[[case]]
id = "redirect-fd-manipulation"
script = '''
exec 3> fd3.txt
echo "via 3" >&3
exec 3>&-
exec 4< fd3.txt
read -r l <&4; echo "lido: $l"
exec 4<&-
exec {myfd}> named.txt
echo "fd nomeado" >&$myfd
exec {myfd}>&-
cat named.txt
echo erro 2>&1 1>/dev/null >&2 | cat
( exec 1>&- ; echo x ) 2>&1 | sed 's/[0-9]\+/N/'
'''
tags = ["redirect", "fd"]

[[case]]
id = "redirect-noclobber-and-errors"
script = '''
echo a > f.txt
set -o noclobber
echo b > f.txt; echo "rc=$?"
echo c >| f.txt; cat f.txt
set +o noclobber
cat < naoexiste.txt; echo "rc=$?"
echo x > dir/; echo "rc=$?"
echo y > /proc/naopode 2>/dev/null; echo "rc=$?"
'''
tags = ["redirect", "errors"]
[case.files]
"dir" = { dir = true }

[[case]]
id = "redirect-input-and-dup"
script = '''
wc -l < entrada.txt
sort < entrada.txt > ordenado.txt
cat ordenado.txt
tr a-z A-Z < entrada.txt | head -n 1
cat 0< entrada.txt | tail -n 1
'''
tags = ["redirect"]
[case.files]
"entrada.txt" = "pera\nabacate\nmanga\n"

[[case]]
id = "pipeline-common-agent"
script = '''
cat log.txt | grep -v DEBUG | awk '{print $2}' | sort | uniq -c | sort -rn | head -n 3
grep -c ERROR log.txt
grep -o 'id=[0-9]*' log.txt | cut -d= -f2 | paste -sd+ | bc
find . -name '*.txt' -type f | sort | xargs wc -l | tail -n 1
'''
tags = ["pipeline", "userland"]
[case.files]
"log.txt" = "2026 INFO id=1 start\n2026 ERROR id=2 falha\n2026 DEBUG id=3 x\n2026 ERROR id=4 falha\n2026 INFO id=5 fim\n"

[[case]]
id = "pipeline-sigpipe-producers"
script = '''
yes | head -n 2
seq 1 100000 | head -n 1
cat /dev/zero | head -c 5 | od -An -c
echo "${PIPESTATUS[*]}"
'''
tags = ["pipeline", "sigpipe"]

[[case]]
id = "background-jobs-wait"
script = '''
( echo bg1 ) > bg1.txt &
p1=$!
( exit 4 ) &
p2=$!
wait $p1; echo "w1=$?"
wait $p2; echo "w2=$?"
cat bg1.txt
sleep 0.05 & wait
echo "todos"
'''
tags = ["jobs"]

[[case]]
id = "coproc-basic"
script = '''
coproc UPPER { tr a-z A-Z; }
echo "texto" >&"${UPPER[1]}"
exec {UPPER[1]}>&-
read -r line <&"${UPPER[0]}"
echo "$line"
wait
'''
tags = ["coproc"]

[[case]]
id = "string-ops-agent-idioms"
script = '''
s="  Olá, Mundo!  "
trimmed="${s#"${s%%[![:space:]]*}"}"; trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
echo "[$trimmed]"
csv="a,b,,d"
IFS=, read -ra parts <<< "$csv"; echo "${#parts[@]}"
str="abc"; for ((i=${#str}-1; i>=0; i--)); do rev+="${str:i:1}"; done; echo "$rev"
[[ "$s" == *Mundo* ]] && echo contém
echo "${#trimmed}"
printf '%s\n' "$trimmed" | wc -c
'''
tags = ["param-expansion", "strings"]

[[case]]
id = "env-and-export"
script = '''
export VISIVEL=sim
LOCAL_SO=nao
bash -c 'echo "filho vê: ${VISIVEL:-} ${LOCAL_SO:-nada}"'
TEMP=só-no-comando bash -c 'echo "$TEMP"'
echo "depois: ${TEMP:-vazio}"
env -i X=1 bash -c 'echo "env -i: $X ${HOME:-sem home}"'
echo "$HOME $USER $LC_ALL $TZ"
unset VISIVEL; bash -c 'echo "após unset: ${VISIVEL:-sumiu}"'
'''
tags = ["env"]

[[case]]
id = "special-vars"
script = '''
f() { echo "$0|$#|$*|$@|${10:-}"; }
f a b c d e f g h i j
echo "$-" | grep -q h && echo "hashall"
echo "${BASH_VERSINFO[0]}"
echo "$SHLVL"
echo "$LINENO"
echo "${#BASH_ARGV[@]}"
'''
tags = ["special-vars"]

[[case]]
id = "long-agent-script"
script = '''
#!/usr/bin/env bash
set -euo pipefail

readonly OUT_DIR="build"
declare -A counts=()
files=()

usage() { echo "uso: $0 [-v] arquivos..." >&2; return 1; }

process_file() {
  local file="$1" lines words
  [[ -f "$file" ]] || { echo "ignorando $file" >&2; return 0; }
  lines=$(wc -l < "$file")
  words=$(wc -w < "$file")
  counts["$file"]=$lines
  printf '%-12s %3d linhas %3d palavras\n' "$(basename "$file")" "$lines" "$words"
}

mkdir -p "$OUT_DIR"
for f in src/*.txt missing.txt; do
  files+=("$f")
done

for f in "${files[@]}"; do process_file "$f"; done

total=0
for k in "${!counts[@]}"; do total=$(( total + counts[$k] )); done
echo "total=$total arquivos=${#counts[@]}" | tee "$OUT_DIR/summary.txt"

if [[ $total -gt 3 ]]; then
  echo "grande" > "$OUT_DIR/flag"
fi
ls "$OUT_DIR"
'''
tags = ["agent-script", "errexit", "assoc-arrays", "functions"]
[case.files]
"src/a.txt" = "um dois\ntrês\n"
"src/b.txt" = "quatro cinco seis\nsete\noito\n"
