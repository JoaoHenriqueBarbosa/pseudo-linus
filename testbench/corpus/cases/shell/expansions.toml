tool = "shell"
source = "agent-style"

# Expansão de parâmetro em todas as formas, chaves, til, aritmética, substituição de comando e de processo.

[[case]]
id = "param-default-assign-alt"
script = '''
unset u; e=""; s="valor"
echo "1:${u:-def} 2:${u-def} 3:${e:-def} 4:${e-def} 5:${s:-def}"
echo "6:${u:+alt} 7:${e:+alt} 8:${e+alt} 9:${s:+alt}"
echo "10:${u:=atribuído} depois:$u"
: "${novo:=x}"; echo "11:$novo"
'''
tags = ["param-expansion"]

[[case]]
id = "param-error-if-unset"
script = '''
echo antes
echo "${obrigatorio:?precisa definir}"
echo nunca
'''
tags = ["param-expansion", "errors"]

[[case]]
id = "param-error-default-message"
script = '''
x=""
echo "${x:?}"
'''
tags = ["param-expansion", "errors"]

[[case]]
id = "param-length-substring"
script = '''
s="abcdefghij"
echo "${#s} ${s:2} ${s:2:3} ${s: -3} ${s: -4:2} ${s:0:0}|"
a=(um dois três quatro)
echo "${#a[@]} ${#a[2]} ${a[@]:1:2}"
set -- p1 p2 p3 p4
echo "${@:2} | ${@:2:2} | ${#}"
'''
tags = ["param-expansion", "arrays"]

[[case]]
id = "param-prefix-suffix-removal"
script = '''
path="/usr/local/lib/libfoo.so.1.2"
echo "${path#*/} ${path##*/} ${path%.*} ${path%%.*}"
f="arquivo.tar.gz"
echo "${f%.gz} ${f%%.*} ${f#*.} ${f##*.}"
url="https://example.com/a/b?q=1"
host="${url#*://}"; host="${host%%/*}"; echo "$host"
'''
tags = ["param-expansion", "patterns"]

[[case]]
id = "param-replace"
script = '''
s="foo bar foo baz foo"
echo "${s/foo/X}|${s//foo/X}|${s/#foo/X}|${s/%foo/X}|${s//o}|${s// /_}"
p="a.b.c"; echo "${p//./\/}"
v="CamelCaseName"; echo "${v//[A-Z]/_}"
'''
tags = ["param-expansion", "patterns"]

[[case]]
id = "param-case-modification"
script = '''
s="hello World"
echo "${s^} ${s^^} ${s,} ${s,,} ${s~~}"
echo "${s^^[lo]}"
a=(abc def); echo "${a[@]^}"
'''
tags = ["param-expansion"]

[[case]]
id = "param-transform-ops"
script = '''
s=$'it\'s a "test"'
echo "${s@Q}"
declare -a arr=(x "y z")
echo "${arr[@]@Q}"
n=5; echo "${n@A}"
declare -i num=3; echo "${num@a}"
t='\t'; echo "${t@E}|"
'''
tags = ["param-expansion", "quoting"]

[[case]]
id = "param-indirect-and-names"
script = '''
cfg_host=localhost cfg_port=80 other=1
ref=cfg_host; echo "${!ref}"
for v in ${!cfg_@}; do echo "$v=${!v}"; done
a=(x y z); echo "${!a[@]}"
declare -A m=([k1]=v1); echo "${!m[@]}"
'''
tags = ["param-expansion", "indirect", "assoc-arrays"]

[[case]]
id = "brace-expansion"
script = '''
echo {a,b,c}.txt
echo pre{1..5}
echo {01..10..3}
echo {a..e} {e..a..2}
echo {1..3}{x,y}
echo {a,{b,c}d}
echo {x}  {a..}  "{1..3}"
mkdir -p proj/{src,tests}/{core,util} && find proj -type d | sort
'''
tags = ["brace-expansion"]

[[case]]
id = "tilde-expansion"
script = '''
echo ~ ~/x
echo "~" '~'
x=~/sub; echo "$x"
echo a:~/b
cd /tmp && echo ~+ && cd - >/dev/null && echo ~-
'''
tags = ["tilde"]

[[case]]
id = "arith-expansion"
script = '''
a=7 b=3
echo $((a + b)) $((a - b)) $((a * b)) $((a / b)) $((a % b)) $((a ** b))
echo $((a > b ? a : b)) $((a & b)) $((a | b)) $((a ^ b)) $((a << 2)) $((~a))
echo $((0x1f)) $((8#17)) $((2#1010)) $((36#zz))
echo $(( (a + 1) * 2 )) $((-a)) $((!0)) $((a && 0)) $((a || 0))
i=0; ((i++)); ((i += 5)); echo $i $((i--)) $i
echo $((2**62)) $((2**63)) $((-9223372036854775807 - 1))
'''
tags = ["arithmetic"]

[[case]]
id = "arith-errors"
script = '''
echo $((1 / 0))
echo "rc=$?"
'''
tags = ["arithmetic", "errors"]

[[case]]
id = "arith-command-and-let"
script = '''
x=5
if (( x > 3 )); then echo maior; fi
(( x == 0 )) || echo "não é zero"
(( 0 )); echo "rc0=$?"
let "y = x * 2" z=x+1; echo "$y $z"
declare -i n; n="2 + 3"; echo $n
for ((i = 0; i < 3; i++)); do printf '%d,' "$i"; done; echo
'''
tags = ["arithmetic"]

[[case]]
id = "cmdsub-nested"
script = '''
echo "a$(echo "b$(echo "c$(echo d)")")"
x=$(echo $(echo $(echo deep)))
echo "$x"
y=`echo \`echo crase\``
echo "$y"
z=$(case foo in foo) echo casou;; esac)
echo "$z"
echo "$(echo "aspas \"dentro\"")"
'''
tags = ["command-substitution", "nested"]

[[case]]
id = "cmdsub-trailing-newlines"
script = '''
v=$(printf 'a\n\n\n')
echo "[$v]"
w=$(printf '\n\nb\n')
echo "[$w]"
n=$(printf '')
echo "[${#n}]"
'''
tags = ["command-substitution"]

[[case]]
id = "cmdsub-heredoc-inside"
script = '''
msg=$(cat <<EOF
linha 1
linha $((1 + 1))
EOF
)
echo "$msg"
json=$(cat <<'JSON'
{"a": [1, 2, 3]}
JSON
)
echo "${#json}"
'''
tags = ["command-substitution", "heredoc"]

[[case]]
id = "process-substitution"
script = '''
diff <(printf 'a\nb\n') <(printf 'a\nc\n')
echo "rc=$?"
while read -r l; do echo "lido:$l"; done < <(printf 'x\ny\n')
paste <(seq 3) <(seq 4 6)
cat <(echo "fd: ok")
'''
tags = ["process-substitution"]

[[case]]
id = "process-substitution-dev-fd"
script = '''
echo <(true)
readlink -f /dev/stdin >/dev/null && echo "stdin ok"
'''
tags = ["process-substitution"]

[[case]]
id = "glob-basic-and-nullglob"
script = '''
echo *.txt
echo *.nada
shopt -s nullglob
echo "nullglob:[" *.nada "]"
arr=(*.log); echo "${#arr[@]}"
shopt -u nullglob
shopt -s failglob
echo *.nada
echo "rc=$?"
'''
tags = ["glob", "shopt"]
[case.files]
"a.txt" = "a"
"b.txt" = "b"
"c.md" = "c"
".hidden.txt" = "h"

[[case]]
id = "glob-dotglob-globstar-extglob"
script = '''
echo *
shopt -s dotglob; echo *; shopt -u dotglob
shopt -s globstar; echo **/*.rs; shopt -u globstar
shopt -s extglob
echo !(*.rs)
echo @(a|b).txt
echo +([0-9]).log
echo ?([a-z])x
'''
tags = ["glob", "shopt", "extglob"]
[case.files]
"a.txt" = ""
"b.txt" = ""
"123.log" = ""
"x" = ""
".env" = ""
"src/main.rs" = ""
"src/sub/lib.rs" = ""

[[case]]
id = "glob-char-classes"
script = '''
echo [ab]*.txt
echo [!a]*.txt
echo [[:digit:]]*
echo ?.txt
echo '*.txt' "*.txt"
'''
tags = ["glob"]
[case.files]
"a1.txt" = ""
"b2.txt" = ""
"c3.txt" = ""
"9lives" = ""
"x.txt" = ""

[[case]]
id = "expansion-order"
script = '''
a='$HOME'
echo $a
b='*'
echo "$b" $b | head -c 1; echo
c="{1,2}"
echo $c
d='$(echo injetado)'
echo $d
'''
tags = ["expansion-order", "glob"]
[case.files]
"only.txt" = ""
