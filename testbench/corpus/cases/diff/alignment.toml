[[case]]
id = "diff-tie-python-return"
argv = ["diff", "-u", "a.py", "b.py"]
tags = ["ties", "unified", "code"]
[case.files]
"a.py" = '''
def parse(value):
    if value is None:
        return None
    value = value.strip()
    if not value:
        return None
    return int(value)


def render(value):
    if value is None:
        return ""
    return str(value)
'''
"b.py" = '''
def parse(value):
    if value is None:
        return None
    value = value.strip()
    if not value:
        return None
    if value.startswith("0x"):
        return int(value, 16)
    return int(value)


def render(value):
    if value is None:
        return ""
    return f"{value}"
'''

