tool = "diff"
source = "agent-style"

# Empates de alinhamento: o mesmo par de arquivos admite vários scripts de edição de custo mínimo, e o
# GNU diff escolhe um (Myers com as heurísticas e o deslocamento de fronteiras dele). Aqui se mede se a
# biblioteca escolhe o mesmo.

[[case]]
id = "diff-tie-repeated-pair-delete"
argv = ["diff", "a.txt", "b.txt"]
tags = ["ties", "normal"]
[case.files]
"a.txt" = "a\nb\na\nb\na\nb\n"
"b.txt" = "a\nb\na\nb\n"

[[case]]
id = "diff-tie-repeated-pair-delete-u"
argv = ["diff", "-u", "a.txt", "b.txt"]
tags = ["ties", "unified"]
[case.files]
"a.txt" = "a\nb\na\nb\na\nb\n"
"b.txt" = "a\nb\na\nb\n"

[[case]]
id = "diff-tie-insert-in-run"
argv = ["diff", "a.txt", "b.txt"]
tags = ["ties", "normal"]
[case.files]
"a.txt" = "x\nx\nx\n"
"b.txt" = "x\nx\nx\nx\n"

[[case]]
id = "diff-tie-delete-from-run"
argv = ["diff", "a.txt", "b.txt"]
tags = ["ties", "normal"]
[case.files]
"a.txt" = "start\nx\nx\nx\nx\nend\n"
"b.txt" = "start\nx\nx\nend\n"

[[case]]
