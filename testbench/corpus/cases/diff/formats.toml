"b.txt" = "one\ntwo\nthree\n"

[[case]]
id = "diff-c-mixed-two-hunks"
argv = ["diff", "-c", "a.txt", "b.txt"]
tags = ["context", "hunks"]
[case.files]
"a.txt" = "l01\nl02\nl03\nl04\nl05\nl06\nl07\nl08\nl09\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\n"
"b.txt" = "l01\nl02\nL03\nl04\nl05\nl06\nl07\nl08\nl09\nl10\nl11\nl12\nl13\nl14\nl15\nl17\nl18\nadded\nl19\nl20\n"

[[case]]
id = "diff-C1"
argv = ["diff", "-C", "1", "a.txt", "b.txt"]
tags = ["context"]
[case.files]
"a.txt" = "a\nb\nc\nd\ne\n"
"b.txt" = "a\nb\nX\nd\ne\n"

[[case]]
id = "diff-q-differ"
argv = ["diff", "-q", "a.txt", "b.txt"]
tags = ["brief", "exit"]
[case.files]
"a.txt" = "a\n"
"b.txt" = "b\n"

[[case]]
id = "diff-q-same"
argv = ["diff", "-q", "a.txt", "b.txt"]
tags = ["brief", "exit"]
[case.files]
"a.txt" = "a\n"
"b.txt" = "a\n"

[[case]]
id = "diff-brief-long"
argv = ["diff", "--brief", "a.txt", "b.txt"]
tags = ["brief", "exit"]
[case.files]
"a.txt" = "a\n"
"b.txt" = "a\nb\n"

[[case]]
id = "diff-s-same"
argv = ["diff", "-s", "a.txt", "b.txt"]
tags = ["brief", "exit"]
[case.files]
"a.txt" = "a\n"
"b.txt" = "a\n"

[[case]]
id = "diff-s-differ-u"
argv = ["diff", "-s", "-u", "a.txt", "b.txt"]
tags = ["unified", "exit"]
[case.files]
"a.txt" = "a\n"
"b.txt" = "b\n"

[[case]]
id = "diff-e-ed-script"
argv = ["diff", "-e", "a.txt", "b.txt"]
tags = ["ed"]
[case.files]
"a.txt" = "one\ntwo\nthree\nfour\n"
"b.txt" = "one\nTWO\nthree\nfour\nfive\n"
