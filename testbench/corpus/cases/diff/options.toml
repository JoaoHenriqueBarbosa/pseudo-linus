"x" = "1\n3\n"
"y" = "1\n2\n"

[[case]]
id = "dirs-to-file-dir"
argv = ["diff", "-u", "--to-file=d", "x", "y"]
tags = ["dirs"]
[case.files]
"d/x" = "1\n"
"d/y" = "2\n"
"x" = "1\n"
"y" = "3\n"

[[case]]
id = "dirs-from-and-to"
argv = ["diff", "--from-file=a", "--to-file=b", "c"]
tags = ["dirs", "error"]

[[case]]
id = "top-new-file"
