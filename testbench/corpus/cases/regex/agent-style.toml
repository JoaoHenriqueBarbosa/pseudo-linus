[case.files]
"m.awk" = """
BEGIN { getline re < "re.txt" }
{
  if (match($0, re, a)) {
    out = NR " " RSTART " " RLENGTH
    for (k = 1; k <= N; k++) {
      if ((k, "start") in a) out = out " " a[k, "start"] ":" a[k, "length"]
      else out = out " -"
    }
    print out
  } else print NR " 0"
}
"""
"re.txt" = """
([0-9a-f]{0,4}:){2,7}[0-9a-f]{1,4}
"""
