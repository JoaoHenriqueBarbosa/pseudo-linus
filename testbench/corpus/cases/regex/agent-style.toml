[[case]]
id = "agent-log-error-warning-gawk"
argv = ["gawk", "-v", "N=1", "-f", "m.awk", "s.txt"]
tags = ["src:agent-style", "dialect:grep-ere", "feat:alternation", "feat:anchor", "feat:group", "probe:gawk", "aspect:submatch"]
timeout_ms = 10000

[case.files]
"m.awk" = """
BEGIN { getline re < "re.txt" }
{
  if (match($0, re, a)) {
    out = NR " " RSTART " " RLENGTH
    for (k = 1; k <= N; k++) {
      if ((k, "start") in a) out = out " " a[k, "start"] ":" a[k, "length"]
      else out = out " -"
    }
    print out
  } else print NR " 0"
}
"""
"re.txt" = """
^(error|warning)
"""
