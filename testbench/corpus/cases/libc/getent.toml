for k in " 1" "+1" "01" "4294967295" "4294967297" "x" ""; do
  echo "[$k]"
  getent group "$k"
  echo "rc=$?"
done
'''

[[case]]
id = "getent-group-appended-entries"
script = '''
cp /etc/group /tmp/group.bak
printf '%s\n' 'grp1:x:2000:a,b,c' 'grp2:x:2001:a, b ,,c' 'grp3:x:2002:' 'grp4:*:2003:solo' 'grp5:x:2004:  lead,trail  ' 'grp6:x:2005:a,b' 'bad:x:nan:a' '+nisgroup' 'grp7:x:2006' 'grp8::2007:z' >> /etc/group
getent group grp1 2000 grp2 grp3 grp4 grp5 2005 bad nan grp7 grp8 '+nisgroup'
echo "rc=$?"
getent group | tail -n 7
cp /tmp/group.bak /etc/group
'''

# ---- shadow e gshadow ----

[[case]]
id = "getent-shadow-appended-entries"
script = '''
cp /etc/shadow /tmp/shadow.bak
printf '%s\n' 's1:$6$salt$hash:19000:0:99999:7:::' 's2:!:19001:1:2:3:4:5:6' 's3:*::::::' 's4:x:1:2:3' 's5:x:1:2:3:4:5' 's6:x:3000000000:-5:abc:7:8:9:10' 's7:x:1:2:3:4:5:6:7' 's8:x' 's9:x:1' '+nis' >> /etc/shadow
getent shadow s1 s2 s3 s4 s5 s6 s7 s8 s9 '+nis' no-such
echo "rc=$?"
getent shadow | tail -n 10
cp /tmp/shadow.bak /etc/shadow
'''

[[case]]
id = "getent-shadow-lookup-by-uid-fails"
argv = ["getent", "shadow", "0"]

[[case]]
id = "getent-gshadow-appended-entries"
script = '''
cp /etc/gshadow /tmp/gshadow.bak
printf '%s\n' 'gs1:*:adm1,adm2:mem1,mem2' 'gs2:!::' 'gs3:x:solo:' 'gs4:x::only' 'gs5:x:a, b ,,c:d, e' 'gs6' 'gs7:x' '+nis' >> /etc/gshadow
getent gshadow gs1 gs2 gs3 gs4 gs5 gs6 gs7 '+nis' no-such
echo "rc=$?"
getent gshadow | tail -n 8
cp /tmp/gshadow.bak /etc/gshadow
'''

