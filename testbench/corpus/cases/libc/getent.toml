# ---- passwd ----

[[case]]
id = "getent-passwd-root"
argv = ["getent", "passwd", "root"]

[[case]]
id = "getent-passwd-uid-zero"
argv = ["getent", "passwd", "0"]

[[case]]
id = "getent-passwd-several-one-missing"
argv = ["getent", "passwd", "root", "0", "no-such-user", "root"]

[[case]]
id = "getent-passwd-missing"
argv = ["getent", "passwd", "no-such-user"]

[[case]]
id = "getent-passwd-empty-key"
argv = ["getent", "passwd", ""]

[[case]]
id = "getent-passwd-numeric-forms"
script = '''
for k in " 0" "+0" "00" "0x0" "1x" "4294967296" "99999999999999999999" "0 " "000000000000000000000000"; do
  echo "[$k]"
  getent passwd "$k"
  echo "rc=$?"
done
'''

[[case]]
id = "getent-passwd-appended-entries"
script = '''
cp /etc/passwd /tmp/passwd.bak
printf '%s\n' 'alice:x:1001:1001:Alice,,,:/home/alice:/bin/sh' '# comment' '   spaced:x:1002:1002::/h:/s' 'bad:x:notanumber:1:::' 'short:x:1' 'tiny:x:7:8' 'dup:x:1001:1001:second:/d:/s' 'noshell:x:1003:1003:g:/home/x' 'empty::1004:1004::/:' '+nis' '+@group:::::::' >> /etc/passwd
getent passwd alice 1001 spaced 1002 bad short tiny 7 dup noshell empty '+nis' nis
echo "rc=$?"
getent passwd | tail -n 8
cp /tmp/passwd.bak /etc/passwd
'''

[[case]]
id = "getent-passwd-large-uid"
script = '''
cp /etc/passwd /tmp/passwd.bak
printf '%s\n' 'big:x:4294967295:4294967295:::' 'over:x:4294967296:1:::' 'neg:x:-1:1:::' 'plus:x:+5:6:g:/d:/s' 'hexuid:x:0x10:1:::' >> /etc/passwd
getent passwd big 4294967295 over neg plus 5 hexuid 16
echo "rc=$?"
cp /tmp/passwd.bak /etc/passwd
'''

[[case]]
id = "getent-passwd-gecos-colon-fields"
script = '''
cp /etc/passwd /tmp/passwd.bak
printf '%s\n' 'g1:x:2001:2001:a:b:c:d:e' 'g2:x:2002:2002:::' 'g3:*:2003:2003:Full Name,Room,Phone:/home/g3:/bin/bash' >> /etc/passwd
getent passwd g1 g2 g3
cp /tmp/passwd.bak /etc/passwd
'''

