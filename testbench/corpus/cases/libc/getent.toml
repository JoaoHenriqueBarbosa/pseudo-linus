id = "getent-hosts-by-ipv4-mapped"
argv = ["getent", "hosts", "::ffff:127.0.0.1"]

[[case]]
id = "getent-hosts-unspecified-v6"
argv = ["getent", "hosts", "::"]

[[case]]
id = "getent-hosts-numeric-name"
script = '''
for k in 1234 127.1 10.1 0x7f.1 1.2.3.4.5 08.1 1.2.3.4. 0177.1 1.2.3 4294967295 4294967296 256.1; do
  echo "[$k]"
  getent hosts "$k"
  echo "rc=$?"
done
'''

[[case]]
id = "getent-hosts-missing"
argv = ["getent", "hosts", "no-such-host.invalid"]

[[case]]
id = "getent-hosts-v6-names"
argv = ["getent", "hosts", "ip6-allnodes", "ip6-allrouters", "ip6-localnet", "ip6-mcastprefix"]

[[case]]
id = "getent-hosts-enumeration"
argv = ["getent", "hosts"]

[[case]]
id = "getent-hosts-custom-file"
script = '''
cp /etc/hosts /tmp/hosts.bak
cp /etc/host.conf /tmp/host.conf.bak 2>/dev/null
printf '%s\n' '10.0.0.1 alpha alpha.example   a1' '10.0.0.2   beta   # trailing comment' '# 10.0.0.3 hidden' '10.0.0.4' '2001:db8::5 gamma gamma6' 'fe80::1 linklocal' '::ffff:10.0.0.6 mapped' '10.0.0.7 Mixed.Case MIXED2' '10.0.0.8 dup-name' '10.0.0.9 dup-name second' 'bad-address host-bad' '999.1.1.1 host-999' '::1 loop6 localhost' > /etc/hosts
printf 'multi off\n' > /etc/host.conf
for k in alpha a1 alpha.example BETA hidden gamma gamma6 linklocal mapped mixed.case MIXED2 dup-name second host-bad host-999 loop6 10.0.0.1 10.0.0.4 2001:db8::5 fe80::1 ::ffff:10.0.0.6 10.0.0.6 10.0.0.9; do
  echo "[$k]"
  getent hosts "$k"
  echo "rc=$?"
done
echo "[enumeration]"
getent hosts
cp /tmp/hosts.bak /etc/hosts
if [ -e /tmp/host.conf.bak ]; then cp /tmp/host.conf.bak /etc/host.conf; else rm -f /etc/host.conf; fi
'''

[[case]]
id = "getent-hosts-multi-on"
script = '''
cp /etc/hosts /tmp/hosts.bak
cp /etc/host.conf /tmp/host.conf.bak 2>/dev/null
printf '%s\n' '10.0.0.1 srv s1' '10.0.0.2 srv s2 extra' '10.0.0.3 other srv' '2001:db8::1 srv v6a' '2001:db8::2 srv v6b' > /etc/hosts
printf 'multi on\n' > /etc/host.conf
getent hosts srv
echo "rc=$?"
getent hosts s2
echo "rc=$?"
getent hosts v6a
echo "rc=$?"
getent hosts other
echo "rc=$?"
cp /tmp/hosts.bak /etc/hosts
if [ -e /tmp/host.conf.bak ]; then cp /tmp/host.conf.bak /etc/host.conf; else rm -f /etc/host.conf; fi
'''

[[case]]
id = "getent-hosts-multi-env"
script = '''
cp /etc/hosts /tmp/hosts.bak
printf '%s\n' '10.0.0.1 srv' '10.0.0.2 srv' > /etc/hosts
getent hosts srv
RESOLV_MULTI=on getent hosts srv
RESOLV_MULTI=off getent hosts srv
cp /tmp/hosts.bak /etc/hosts
'''

[[case]]
id = "getent-hosts-nsswitch-files-only"
script = '''
cp /etc/nsswitch.conf /tmp/nsswitch.bak
printf 'hosts: files\n' > /etc/nsswitch.conf
getent hosts localhost 127.0.0.1
echo "rc=$?"
cp /tmp/nsswitch.bak /etc/nsswitch.conf
'''

[[case]]
id = "getent-hosts-nsswitch-no-files"
script = '''
cp /etc/nsswitch.conf /tmp/nsswitch.bak
printf 'hosts: dns\n' > /etc/nsswitch.conf
getent hosts localhost
echo "rc=$?"
cp /tmp/nsswitch.bak /etc/nsswitch.conf
'''

