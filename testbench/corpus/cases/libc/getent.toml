tool = "getent"
source = "manual"

# getent da glibc 2.41. Os bancos lidos de arquivos do sistema (passwd, group, hosts...) são
# exercitados com entradas que o próprio caso acrescenta em /etc e desfaz no fim (o oráculo roda todos
# os casos num mesmo contêiner, então cada script restaura o que mexeu). O oráculo roda sem rede
# (--network none), e o sandbox modela o mesmo: só o loopback, sem DNS.

# ---- opções, ajuda e erros de uso (argp) ----

[[case]]
id = "getent-help"
argv = ["getent", "--help"]

[[case]]
id = "getent-help-short"
argv = ["getent", "-?"]

[[case]]
id = "getent-help-prefix"
argv = ["getent", "--he"]

[[case]]
id = "getent-help-after-operand"
argv = ["getent", "passwd", "--help"]

[[case]]
id = "getent-usage"
