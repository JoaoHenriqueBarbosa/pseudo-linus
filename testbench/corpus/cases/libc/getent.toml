[[case]]
id = "getent-ahosts-alias"
argv = ["getent", "ahosts", "ip6-localhost"]

[[case]]
id = "getent-ahosts-v6-only-name"
argv = ["getent", "ahosts", "ip6-allnodes", "ip6-allrouters"]

[[case]]
id = "getent-ahostsv4-alias-no-addrconfig"
argv = ["getent", "-A", "ahostsv4", "ip6-localhost", "ip6-allnodes"]

[[case]]
id = "getent-ahostsv6-alias-no-addrconfig"
argv = ["getent", "-A", "ahostsv6", "ip6-localhost", "ip6-allnodes"]

[[case]]
id = "getent-ahosts-missing"
argv = ["getent", "ahosts", "no-such-host.invalid"]

[[case]]
id = "getent-ahosts-several-keys"
argv = ["getent", "ahosts", "localhost", "no-such-host.invalid", "1.2.3.4"]

[[case]]
id = "getent-ahosts-trailing-dot"
argv = ["getent", "ahosts", "localhost."]

[[case]]
id = "getent-ahosts-bracketed"
argv = ["getent", "ahosts", "[::1]"]

[[case]]
id = "getent-ahosts-enumeration"
argv = ["getent", "ahosts"]

[[case]]
id = "getent-ahosts-no-idn"
argv = ["getent", "-i", "ahosts", "localhost"]

[[case]]
id = "getent-ahosts-custom-file"
script = '''
cp /etc/hosts /tmp/hosts.bak
cp /etc/host.conf /tmp/host.conf.bak 2>/dev/null
printf '%s\n' '10.0.0.1 srv s1' '10.0.0.2 srv s2' '2001:db8::1 srv v6a' '::1 srv lo6' '127.0.0.5 only4' '2002:a00:1::1 six2four' '::ffff:10.9.9.9 mapped' '10.0.0.3 mapped' > /etc/hosts
printf 'multi on\n' > /etc/host.conf
for k in srv s1 v6a only4 six2four mapped lo6; do
  for db in ahosts ahostsv4 ahostsv6; do
    echo "[$db $k]"
    getent -A $db $k
    echo "rc=$?"
  done
done
printf 'multi off\n' > /etc/host.conf
for k in srv mapped; do
  for db in ahosts ahostsv4 ahostsv6; do
    echo "[$db $k off]"
    getent -A $db $k
    echo "rc=$?"
  done
done
cp /tmp/hosts.bak /etc/hosts
if [ -e /tmp/host.conf.bak ]; then cp /tmp/host.conf.bak /etc/host.conf; else rm -f /etc/host.conf; fi
'''

# ---- services ----

[[case]]
id = "getent-services-default-http"
argv = ["getent", "services", "http", "80", "80/tcp", "ssh"]

[[case]]
id = "getent-services-custom-file"
script = '''
if [ -e /etc/services ]; then cp /etc/services /tmp/services.bak; had=1; else had=0; fi
printf '%s\n' '# comment' 'http 80/tcp www web' 'http 80/udp' 'echo   7/tcp' 'echo 7/udp' 'hex 0x51/tcp' 'octal 0100/tcp' 'weird 65537/tcp' 'dual 53/tcp  # trailing comment' 'dual 53/udp' 'bad line' 'spaces    8080  /  tcp' 'slashes 9090//tcp' 'noalias 1234/tcp' 'upper 2000/TCP' 'big 70000/tcp' 'negative -5/tcp' '  indented 4000/tcp' > /etc/services
for k in http 80 80/tcp 80/udp www web/tcp web/udp http/udp http/sctp http/ /tcp 81 0x51 hex octal 64 1 weird 65537 echo 7/udp 7/tcp dual 53 53/udp 53/sctp bad spaces 8080 slashes 9090 noalias 1234/tcp upper 2000/tcp 2000/TCP big 70000 negative indented 4000 +80 ''; do
  echo "[$k]"
  getent services -- "$k"
  echo "rc=$?"
done
echo "[enumeration]"
getent services
if [ $had = 1 ]; then cp /tmp/services.bak /etc/services; else rm /etc/services; fi
'''

[[case]]
id = "getent-services-missing-file"
script = '''
if [ -e /etc/services ]; then cp /etc/services /tmp/services.bak; had=1; else had=0; fi
rm -f /etc/services
getent services http
echo "rc=$?"
getent services
echo "rc=$?"
if [ $had = 1 ]; then cp /tmp/services.bak /etc/services; fi
'''

# ---- protocols ----

[[case]]
id = "getent-protocols-default-tcp"
argv = ["getent", "protocols", "tcp", "6", "icmp"]

[[case]]
id = "getent-protocols-custom-file"
script = '''
if [ -e /etc/protocols ]; then cp /etc/protocols /tmp/protocols.bak; had=1; else had=0; fi
printf '%s\n' '# comment' 'ip 0 IP' 'icmp 1 ICMP' 'tcp 6 TCP' 'udp 17 UDP  # trailing' 'dup 6 TCPDUP' 'bad x' 'lonely' 'big 4294967295 BIGP' 'huge 4294967296' 'neg -1 NEGP' 'spaced     99     SP1   SP2' > /etc/protocols
for k in tcp TCP 6 6x 0 ip IP icmp ICMP 1 17 udp UDP TCPDUP dup bad x lonely 255 99 SP2 sp2 big 4294967295 -1 huge 4294967296 ''; do
  echo "[$k]"
  getent protocols -- "$k"
  echo "rc=$?"
done
echo "[enumeration]"
getent protocols
if [ $had = 1 ]; then cp /tmp/protocols.bak /etc/protocols; else rm /etc/protocols; fi
'''

# ---- rpc ----

[[case]]
id = "getent-rpc-custom-file"
script = '''
if [ -e /etc/rpc ]; then cp /etc/rpc /tmp/rpc.bak; had=1; else had=0; fi
printf '%s\n' '# comment' 'portmapper 100000 portmap sunrpc rpcbind' 'rstatd 100001 rstat rstat_svc' 'noalias 100002' 'bad name' 'spaced    100003     one   two  # c' 'neg -5 NEGR' > /etc/rpc
for k in portmapper 100000 portmap sunrpc rstatd rstat noalias 100002 bad spaced 100003 one neg -5 unknown 999 ''; do
  echo "[$k]"
  getent rpc -- "$k"
  echo "rc=$?"
done
echo "[enumeration]"
getent rpc
if [ $had = 1 ]; then cp /tmp/rpc.bak /etc/rpc; else rm /etc/rpc; fi
'''

# ---- networks ----

[[case]]
id = "getent-networks-custom-file"
script = '''
cp /etc/networks /tmp/networks.bak
printf '%s\n' '# comment' 'default 0.0.0.0' 'loopback 127.0.0.0' 'link-local 169.254.0.0 ll LINK' 'short 10' 'two 172.16' 'three 192.168.1' 'four 192.168.2.0' 'hexnet 0x0a.0x01' 'octnet 010.1' 'bad notanumber' 'toobig 300.1.1.1' 'noaddr' 'mixed Mixed.Net 1.2.3' > /etc/networks
for k in loopback LOOPBACK 127.0.0.0 127.0.0 127 0 default link-local ll LINK 169.254.0.0 short 10 10.0.0.0 two 172.16.0.0 three 192.168.1.0 192.168.1 four 192.168.2.0 hexnet 10.1.0.0 octnet 8.1.0.0 bad toobig noaddr mixed mixed.net 1.2.3.0 1x nope 255.255.255.255 '1.2.3.4 x'; do
  echo "[$k]"
  getent networks "$k"
  echo "rc=$?"
done
echo "[enumeration]"
getent networks
cp /tmp/networks.bak /etc/networks
'''

# ---- ethers ----

[[case]]
id = "getent-ethers-enumeration-unsupported"
argv = ["getent", "ethers"]

[[case]]
id = "getent-ethers-missing-file"
argv = ["getent", "ethers", "00:11:22:33:44:55", "somehost"]

[[case]]
id = "getent-ethers-custom-file"
script = '''
printf '%s\n' '# comment' '00:11:22:33:44:55 host1' '0:a:B:c:D:e  host2   # trailing' 'aa:bb:cc:dd:ee:ff Host3' '1:2:3:4:5:6 host4' '00:11:22:33:44 short' 'zz:11:22:33:44:55 bad' '100:11:22:33:44:55 big' '0x11:22:33:44:55:66 hexname' > /etc/ethers
for k in 00:11:22:33:44:55 0:11:22:33:44:55 host1 HOST1 0:a:b:c:d:e 00:0a:0b:0c:0d:0e host2 aa:bb:cc:dd:ee:ff AA:BB:CC:DD:EE:FF host3 1:2:3:4:5:6 01:02:03:04:05:06 host4 short bad big hexname 11:22:33:44:55:66 00:11:22:33:44:55zzz 00:11:22:33:44:5 unknown ''; do
  echo "[$k]"
  getent ethers "$k"
  echo "rc=$?"
done
getent ethers host1 unknown host3
echo "rc=$?"
rm -f /etc/ethers
'''

# ---- aliases ----

[[case]]
id = "getent-aliases-missing-file"
argv = ["getent", "aliases", "root"]

[[case]]
id = "getent-aliases-enumeration-missing-file"
argv = ["getent", "aliases"]

[[case]]
id = "getent-aliases-custom-file"
script = '''
printf '%s\n' '# comment' 'root: admin' 'postmaster:    root' 'Mixed: a, b ,c' 'long-alias-name-here: x@y.z, w@v.u' 'continued: one,' '   two,' '   three' 'comment-tail: a, b # ignored' 'empty:' ': noname' 'nocolon' 'last: end' > /etc/aliases
for k in root postmaster mixed MIXED long-alias-name-here continued comment-tail empty noname nocolon last unknown; do
  echo "[$k]"
  getent aliases "$k"
  echo "rc=$?"
done
echo "[enumeration]"
getent aliases
rm -f /etc/aliases
'''

[[case]]
id = "getent-aliases-include"
script = '''
printf '%s\n' 'alice@example.com' 'bob@example.com, carol@example.com # ignored' '' '  dave@example.com' > /tmp/members.list
printf '%s\n' 'team: :include:/tmp/members.list, extra@example.com' 'solo: :include:/tmp/missing-file.list' 'after: tail@example.com' > /etc/aliases
getent aliases team solo after
echo "rc=$?"
getent aliases
rm -f /etc/aliases /tmp/members.list
'''

# ---- netgroup ----

[[case]]
id = "getent-netgroup-enumeration-unsupported"
argv = ["getent", "netgroup"]

[[case]]
id = "getent-netgroup-default-nsswitch"
script = '''
printf '%s\n' 'grp (host1,user1,dom1)' > /etc/netgroup
getent netgroup grp
echo "rc=$?"
getent netgroup grp host1 user1 dom1
echo "rc=$?"
rm -f /etc/netgroup
'''

[[case]]
id = "getent-netgroup-files"
script = '''
printf '%s\n' 'simple (host1,user1,dom1) (host2,,) (,user3,) (-,-,-)' 'nested (h4,u4,d4) simple other' 'other (h5,u5,d5) nested' 'wild (*,*,*)' 'spaced ( a b , c , d )' 'broken (a,b' 'multi (m1,u1,d1) \' '   (m2,u2,d2) \' '   (m3,u3,d3)' 'empty' 'only-group simple' > /etc/netgroup
for g in simple nested other wild spaced broken multi empty only-group missing; do
  echo "[$g]"
  getent -s files netgroup "$g"
  echo "rc=$?"
done
rm -f /etc/netgroup
'''

[[case]]
id = "getent-netgroup-innetgr"
script = '''
printf '%s\n' 'grp (host1,user1,dom1) (host2,,) (,user3,) sub' 'sub (host9,user9,dom9)' > /etc/netgroup
getent -s files netgroup grp host1 user1 dom1
getent -s files netgroup grp HOST1 user1 DOM1
getent -s files netgroup grp host1 USER1 dom1
getent -s files netgroup grp host1 user1 other
getent -s files netgroup grp host2 anyone anydomain
getent -s files netgroup grp anyhost user3 anydomain
getent -s files netgroup grp '*' '*' '*'
getent -s files netgroup grp host9 user9 dom9
getent -s files netgroup missing a b c
getent -s files netgroup grp a b
getent -s files netgroup grp a b c d e
echo "rc=$?"
rm -f /etc/netgroup
'''

# ---- nsswitch.conf ----

[[case]]
id = "getent-nsswitch-db-then-files"
script = '''
cp /etc/nsswitch.conf /tmp/nsswitch.bak
printf 'passwd: db files\ngroup: foo\n' > /etc/nsswitch.conf
getent passwd root
echo "rc=$?"
getent group root
echo "rc=$?"
cp /tmp/nsswitch.bak /etc/nsswitch.conf
'''

[[case]]
id = "getent-nsswitch-notfound-return"
script = '''
cp /etc/nsswitch.conf /tmp/nsswitch.bak
printf 'passwd: files [NOTFOUND=return] foo\ngroup: foo [UNAVAIL=return] files\n' > /etc/nsswitch.conf
getent passwd root
echo "rc=$?"
getent passwd nobody-here
echo "rc=$?"
getent group root
echo "rc=$?"
cp /tmp/nsswitch.bak /etc/nsswitch.conf
'''

[[case]]
id = "getent-nsswitch-missing-file-defaults"
script = '''
cp /etc/nsswitch.conf /tmp/nsswitch.bak
rm /etc/nsswitch.conf
getent passwd root
echo "rc=$?"
getent group root
echo "rc=$?"
getent hosts localhost
echo "rc=$?"
cp /tmp/nsswitch.bak /etc/nsswitch.conf
'''

[[case]]
id = "getent-nsswitch-comments-and-spacing"
script = '''
cp /etc/nsswitch.conf /tmp/nsswitch.bak
printf '%s\n' '# passwd: foo' '   passwd:   files   ' 'group :files' 'shadow  files' > /etc/nsswitch.conf
getent passwd root
echo "rc=$?"
getent group root
echo "rc=$?"
cp /tmp/nsswitch.bak /etc/nsswitch.conf
'''

[[case]]
id = "getent-group-invalid-member-chars"
script = '''
cp /etc/group /tmp/group.bak
printf '%s\n' 'badmem:x:2100:a:b' 'goodmem:x:2101:a,b' >> /etc/group
getent group badmem goodmem 2100 2101
echo "rc=$?"
getent group | tail -n 2
cp /tmp/group.bak /etc/group
'''

[[case]]
id = "getent-gshadow-invalid-member-chars"
script = '''
cp /etc/gshadow /tmp/gshadow.bak
printf '%s\n' 'badsg:x:adm:a:b' 'goodsg:x:adm:a,b' >> /etc/gshadow
getent gshadow badsg goodsg
echo "rc=$?"
cp /tmp/gshadow.bak /etc/gshadow
'''
