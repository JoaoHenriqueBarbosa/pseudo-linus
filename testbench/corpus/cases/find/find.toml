# NO_FAKE_STAT: sem ele o libfaketime desloca os tempos devolvidos por stat pela diferença entre a
# data falsa e a real, e o golden passaria a depender do dia em que foi gerado.
[[case]]
id = "find-mtime-plus"
argv = ["find", ".", "-type", "f", "-mtime", "+3"]
faketime = "2026-01-25 12:00:00"
tags = ["find", "unordered", "time"]
[case.env]
NO_FAKE_STAT = "1"
[case.files]
"old.txt" = ""
"d/new.txt" = ""

