tool = "find"
source = "agent-style"

# find como agente usa pra explorar repositório. A ordem de saída do find é a ordem do readdir do
# sistema de arquivos (no oráculo, a do ext4 por baixo do overlay), que não é propriedade semântica:
# casos com a tag "unordered" são comparados pela bancada f06 como multiconjunto de registros.

[[case]]
id = "find-all"
argv = ["find", "."]
tags = ["find", "unordered"]
[case.files]
"README.md" = "# proj\n"
"src/main.rs" = "fn main() {}\n"
"src/util/mod.rs" = ""
"empty" = { dir = true }

[[case]]
id = "find-name"
argv = ["find", ".", "-name", "*.rs"]
tags = ["find", "unordered", "glob"]
[case.files]
"README.md" = ""
"src/main.rs" = ""
"src/lib.rs" = ""
"src/util/mod.rs" = ""
"notes.rs.txt" = ""

