tool = "utmpdump"
source = "manual"

# utmpdump do util-linux 2.41.

[[case]]
id = "utmpdump-help"
argv = ["utmpdump", "--help"]
tags = ["help"]

[[case]]
id = "utmpdump-version"
argv = ["utmpdump", "-V"]
tags = ["help"]

[[case]]
id = "utmpdump-invalid-option"
argv = ["utmpdump", "--bogus"]
tags = ["error"]

[[case]]
id = "utmpdump-missing-file"
argv = ["utmpdump", "/nonexistent/wtmp"]
tags = ["error"]

[[case]]
id = "utmpdump-empty-file"
argv = ["utmpdump", "/dev/null"]
tags = ["empty"]

[[case]]
id = "utmpdump-empty-stdin"
script = "utmpdump < /dev/null"
tags = ["empty"]
