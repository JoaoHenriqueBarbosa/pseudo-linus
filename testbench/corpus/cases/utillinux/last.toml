tool = "last"
source = "manual"

# last e lastb do util-linux 2.41. No oráculo (contêiner docker) /var/log/wtmp e btmp não existem.

[[case]]
id = "last-help"
argv = ["last", "--help"]
tags = ["help"]

[[case]]
id = "last-version"
argv = ["last", "-V"]
tags = ["help"]

[[case]]
id = "last-invalid-option"
argv = ["last", "--bogus"]
tags = ["error"]

[[case]]
id = "last-no-wtmp"
argv = ["last"]
tags = ["error"]

[[case]]
id = "last-missing-file"
argv = ["last", "-f", "/nonexistent/wtmp"]
tags = ["error"]

[[case]]
id = "last-empty-file"
script = "last -f /dev/null | head -1"
tags = ["empty"]

[[case]]
id = "lastb-no-btmp"
argv = ["lastb"]
tags = ["error"]

[[case]]
id = "lastb-help"
argv = ["lastb", "--help"]
tags = ["help"]
