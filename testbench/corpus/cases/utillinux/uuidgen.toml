tool = "uuidgen"
source = "manual"

# uuidgen do util-linux 2.41: os modos aleatório e de tempo não são determinísticos, então os casos
# cobrem só UUIDs de hash (-m/-s com namespace e nome fixos), versão, ajuda e erros de uso.

[[case]]
id = "uuidgen-help"
argv = ["uuidgen", "--help"]

[[case]]
id = "uuidgen-version"
argv = ["uuidgen", "-V"]

[[case]]
id = "uuidgen-sha1-dns"
argv = ["uuidgen", "-s", "-n", "@dns", "-N", "www.example.com"]

[[case]]
id = "uuidgen-md5-dns"
argv = ["uuidgen", "-m", "-n", "@dns", "-N", "www.example.com"]

[[case]]
id = "uuidgen-sha1-url"
argv = ["uuidgen", "--sha1", "--namespace", "@url", "--name", "http://example.com/"]

[[case]]
id = "uuidgen-md5-oid"
argv = ["uuidgen", "--md5", "--namespace", "@oid", "--name", "1.3.6.1"]

[[case]]
id = "uuidgen-sha1-x500"
argv = ["uuidgen", "-s", "-n", "@x500", "-N", "cn=test"]

[[case]]
id = "uuidgen-sha1-hex"
argv = ["uuidgen", "-s", "-x", "-n", "@dns", "-N", "7777772e6578616d706c652e636f6d"]

[[case]]
id = "uuidgen-sha1-uuid-namespace"
argv = ["uuidgen", "-s", "-n", "6ba7b810-9dad-11d1-80b4-00c04fd430c8", "-N", "www.example.com"]

[[case]]
id = "uuidgen-md5-missing-name"
argv = ["uuidgen", "-m", "-n", "@dns"]

[[case]]
id = "uuidgen-sha1-missing-namespace"
argv = ["uuidgen", "-s", "-N", "x"]

[[case]]
id = "uuidgen-name-without-hash"
argv = ["uuidgen", "-N", "x"]

[[case]]
id = "uuidgen-unknown-namespace"
argv = ["uuidgen", "-s", "-n", "@bogus", "-N", "x"]

[[case]]
id = "uuidgen-invalid-option"
argv = ["uuidgen", "-Z"]

[[case]]
id = "uuidgen-unrecognized-option"
argv = ["uuidgen", "--bogus"]
