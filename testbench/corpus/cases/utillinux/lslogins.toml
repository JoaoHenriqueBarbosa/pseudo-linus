tool = "lslogins"
source = "manual"

# lslogins do util-linux 2.41.5. Só entram casos que não dependem do passwd do host:
# help, versão, erros de uso e opções que o oráculo rejeita (--passwd-path e --json não existem).

[[case]]
id = "json"
script = "lslogins --json"

[[case]]
id = "two-operands"
script = "lslogins root bob 2>&1; echo \"rc=$?\""

[[case]]
id = "bad-time-format"
script = "lslogins --time-format=bogus 2>&1; echo \"rc=$?\""

[[case]]
id = "invalid-option"
script = "lslogins -Q 2>&1; echo \"rc=$?\""

[[case]]
id = "help"
script = "lslogins -h; echo \"rc=$?\""

[[case]]
id = "version"
script = "lslogins -V; echo \"rc=$?\""
