tool = "whereis"
source = "manual"

# whereis do util-linux 2.41: argumentos lidos à mão (sem getopt), listas -B/-M/-S terminadas por -f,
# -b/-m/-s cumulativos, -u, -g, -l, sufixos de manual e de fonte. Os diretórios de busca vêm da própria
# fixture (cada tipo com um arquivo por diretório, porque a ordem dentro do diretório é a do readdir).

[[case]]
id = "whereis-help"
argv = ["whereis", "--help"]

[[case]]
id = "whereis-help-short"
argv = ["whereis", "-h"]

[[case]]
id = "whereis-version"
argv = ["whereis", "--version"]

[[case]]
id = "whereis-version-short"
argv = ["whereis", "-V"]

[[case]]
id = "whereis-no-args"
argv = ["whereis"]

[[case]]
id = "whereis-bad-option"
argv = ["whereis", "-x", "ls"]

[[case]]
id = "whereis-double-dash-is-bad-usage"
argv = ["whereis", "--", "ls"]

[[case]]
id = "whereis-long-option-not-first"
argv = ["whereis", "ls", "--help"]

[[case]]
id = "whereis-help-not-first-is-bad"
argv = ["whereis", "-b", "--help"]

[[case]]
id = "whereis-dir-option-with-suffix-chars"
argv = ["whereis", "-Bx", "bin", "ls"]
[case.files]
"bin" = { dir = true }

[[case]]
id = "whereis-f-missing"
argv = ["whereis", "-B", "bin", "ls"]
[case.files]
"bin" = { dir = true }
"bin/ls" = ""

[[case]]
id = "whereis-f-missing-at-end"
argv = ["whereis", "-B", "bin", "-f", "ls", "-M", "man"]
[case.files]
"bin" = { dir = true }
"bin/ls" = ""
"man" = { dir = true }

[[case]]
