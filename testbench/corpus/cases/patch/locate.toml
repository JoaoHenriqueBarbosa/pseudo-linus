tool = "patch"
source = "agent-style"

# Localização de hunks: deslocamento (offset), fuzz, empate entre posições, rejeição, patch já aplicado,
# CRLF. É aqui que um patch "estrito" diverge do GNU.

[[case]]
id = "patch-offset-positive"
argv = ["patch", "-p0", "-i", "fix.patch"]
tags = ["offset"]
[case.files]
"a.txt" = "extra 1\nextra 2\nline 1\nline 2\nline 3\nline 4\nline 5\nline 6\nline 7\nline 8\nline 9\nline 10\n"
"fix.patch" = '''
--- a.txt
+++ a.txt
@@ -2,7 +2,7 @@
 line 2
 line 3
 line 4
-line 5
+line five
 line 6
 line 7
 line 8
'''

[[case]]
id = "patch-offset-negative"
argv = ["patch", "-p0", "-i", "fix.patch"]
tags = ["offset"]
[case.files]
"a.txt" = "line 2\nline 3\nline 4\nline 5\nline 6\nline 7\nline 8\nline 9\nline 10\n"
"fix.patch" = '''
--- a.txt
+++ a.txt
@@ -2,7 +2,7 @@
 line 2
 line 3
 line 4
-line 5
+line five
 line 6
 line 7
 line 8
'''

[[case]]
id = "patch-offset-two-hunks"
argv = ["patch", "-p0", "-i", "fix.patch"]
tags = ["offset", "multi-hunk"]
[case.files]
"a.txt" = "new top\nl01\nl02\nl03\nl04\nl05\nl06\nl07\nl08\nl09\nl10\nl11\nl12\nl13\nl14\nl15\nl16\nl17\nl18\nl19\nl20\n"
"fix.patch" = '''
--- a.txt
+++ a.txt
@@ -1,4 +1,4 @@
 l01
-l02
+L02
 l03
 l04
@@ -14,7 +14,7 @@
 l14
 l15
 l16
-l17
+L17
 l18
 l19
 l20
'''

[[case]]
id = "patch-offset-no-backup"
argv = ["patch", "--no-backup-if-mismatch", "-p0", "-i", "fix.patch"]
tags = ["offset", "backup"]
[case.files]
"a.txt" = "extra\nalpha\nbeta\ngamma\n"
"fix.patch" = '''
--- a.txt
+++ a.txt
@@ -1,3 +1,3 @@
 alpha
-beta
+BETA
 gamma
'''

[[case]]
id = "patch-ambiguous-offset"
argv = ["patch", "-p0", "-i", "fix.patch"]
tags = ["offset", "ties"]
[case.files]
"a.txt" = "x\ny\nz\nm\nx\ny\nz\n"
"fix.patch" = '''
--- a.txt
+++ a.txt
@@ -3,3 +3,3 @@
 x
-y
+Y
 z
'''

