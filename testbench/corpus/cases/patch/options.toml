"out" = { content = "old\n", mode = 0o755 }
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-Y\n+Z\n"

[[case]]
id = "patch-opt-output-skipped"
argv = ["patch", "-o", "out", "-i", "fix.patch"]
tags = ["output", "reverse"]
[case.files]
"a.txt" = "x\nY\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

[[case]]
id = "patch-opt-output-failed"
