"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n--- b.txt\n+++ b.txt\n@@ -1,2 +1,2 @@\n p\n-q\n+Q\n"

[[case]]
id = "patch-opt-output-stdout-two-files"
argv = ["patch", "-o", "-", "-i", "fix.patch"]
tags = ["output", "multi"]
[case.files]
"a.txt" = "x\ny\n"
