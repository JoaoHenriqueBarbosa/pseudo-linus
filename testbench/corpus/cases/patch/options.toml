tool = "patch"
source = "manual"

# GNU patch 2.8: opções de backup (-b, -B, -Y, -z, -V, VERSION_CONTROL, SIMPLE_BACKUP_SUFFIX), saída
# (-o, -o -, -r, -r -), formatos de rejeito, -D, -E, -d, -l, -F, --dry-run com falha, -s, --verbose,
# citação de nomes, --version, --help e erros de opção.

[[case]]
id = "patch-opt-suffix"
argv = ["patch", "-b", "-z", ".bak", "-i", "fix.patch"]
tags = ["backup"]
[case.files]
"a.txt" = "x\ny\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

[[case]]
id = "patch-opt-prefix-dir"
argv = ["patch", "-b", "-B", "pre/", "-i", "fix.patch"]
tags = ["backup"]
[case.files]
"a.txt" = "x\ny\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

[[case]]
id = "patch-opt-basename-prefix"
argv = ["patch", "-b", "-Y", "old_", "-p1", "-i", "fix.patch"]
tags = ["backup"]
[case.files]
"d/a.txt" = "x\ny\n"
"fix.patch" = "--- a/d/a.txt\n+++ b/d/a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

[[case]]
id = "patch-opt-numbered"
argv = ["patch", "-b", "-V", "numbered", "-i", "fix.patch"]
tags = ["backup"]
[case.files]
"a.txt" = "x\ny\n"
"a.txt.~1~" = "older\n"
"a.txt.~3~" = "old\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

[[case]]
id = "patch-opt-existing-without-numbered"
argv = ["patch", "-b", "-V", "existing", "-i", "fix.patch"]
tags = ["backup"]
[case.files]
"a.txt" = "x\ny\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

[[case]]
id = "patch-opt-existing-with-numbered"
argv = ["patch", "-b", "-V", "t", "-i", "fix.patch"]
tags = ["backup"]
[case.files]
"a.txt" = "x\ny\n"
"a.txt.~1~" = "q\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

[[case]]
id = "patch-opt-version-control-env"
argv = ["patch", "-b", "-i", "fix.patch"]
tags = ["backup", "env"]
env = { VERSION_CONTROL = "numbered" }
[case.files]
"a.txt" = "x\ny\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

