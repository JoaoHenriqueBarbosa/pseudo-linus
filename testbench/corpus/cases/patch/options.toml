id = "patch-opt-simple-suffix-env"
argv = ["patch", "-b", "-i", "fix.patch"]
tags = ["backup", "env"]
env = { SIMPLE_BACKUP_SUFFIX = ".sv" }
[case.files]
"a.txt" = "x\ny\n"
"fix.patch" = "--- a.txt\n+++ a.txt\n@@ -1,2 +1,2 @@\n x\n-y\n+Y\n"

