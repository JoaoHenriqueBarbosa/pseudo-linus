tool = "patch"
source = "manual"

# GNU patch 2.8: hunks malformados e truncados (linhas em branco completadas no fim), criação e
# remoção em conflito (cada variante de -N, -t, -f, -R), patch invertido com -R, hunks fora de ordem,
# rejeitos do formato normal e de contexto, alvo que não é arquivo regular, symlink com
# --follow-symlinks, Index:, hunks sem cabeçalho, CRLF, linha sem newline final e script do ed.

[[case]]
id = "patch-edge-trunc-fill-one"
argv = ["patch", "-i", "p"]
tags = ["malformed"]
[case.files]
"m.txt" = "a\nb\nc\nd\ne\n"
"p" = "--- m.txt\n+++ m.txt\n@@ -1,3 +1,3 @@\n a\n-b\n+B\n"

[[case]]
id = "patch-edge-trunc-fill-three"
argv = ["patch", "-i", "p"]
tags = ["malformed"]
[case.files]
"m.txt" = "a\nb\nc\nd\ne\n"
"p" = "--- m.txt\n+++ m.txt\n@@ -1,4 +1,4 @@\n-a\n+A\n"

