[[case]]
id = "infocmp-terminals-each-default"
script = "for t in cons25 cygwin pcansi mach mach-bold mach-color mach-gnu mach-gnu-color rxvt rxvt-basic rxvt-unicode screen-bce screen-s screen-w screen.xterm-256color tmux vt102 vt220 wsvt25 wsvt25m xterm-color xterm-mono xterm-r5 xterm-r6 xterm-vt220 xterm-xfree86 Eterm; do infocmp -1 $t; done"

[[case]]
id = "infocmp-terminals-each-extended"
script = "for t in screen-256color screen-bce screen.xterm-256color tmux tmux-256color rxvt-unicode-256color xterm-256color xterm-vt220 xterm-xfree86; do infocmp -x -1 $t; done"

[[case]]
id = "infocmp-terminals-each-termcap-unlimited"
