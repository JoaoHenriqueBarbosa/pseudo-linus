tool = "toe"
source = "manual"

# toe do ncurses 6.5.20250216: a tabela das entradas do banco terminfo. A ordem de readdir não é
# estável entre sistemas de arquivos, então os casos usam -s (ordenado) ou ordenam a saída.

[[case]]
id = "toe-default-first-directory-is-empty"
argv = ["toe"]

[[case]]
id = "toe-sorted-default-directory"
argv = ["toe", "-s"]

[[case]]
id = "toe-sorted-all-directories"
argv = ["toe", "-a", "-s"]

[[case]]
id = "toe-sorted-all-directories-header"
argv = ["toe", "-a", "-s", "-h"]

[[case]]
id = "toe-sorted-one-directory"
argv = ["toe", "-s", "/usr/share/terminfo"]

[[case]]
id = "toe-sorted-one-directory-header"
argv = ["toe", "-s", "-h", "/usr/share/terminfo"]

[[case]]
id = "toe-unsorted-piped-through-sort"
script = "toe /usr/share/terminfo | sort"

[[case]]
id = "toe-unsorted-count"
script = "toe -a | wc -l"

[[case]]
id = "toe-subdirectory-only"
argv = ["toe", "-s", "-h", "/usr/share/terminfo/x"]

[[case]]
id = "toe-nonexistent-directory"
argv = ["toe", "-s", "-h", "/usr/share/terminfo/x", "/nonexistent"]

[[case]]
id = "toe-two-directories-marks"
argv = ["toe", "-s", "/usr/share/terminfo", "/etc/terminfo", "/usr/share/terminfo"]

[[case]]
id = "toe-same-directory-twice"
argv = ["toe", "-s", "/usr/share/terminfo", "/usr/share/terminfo"]

[[case]]
id = "toe-custom-directories-differ"
script = "toe -s \"$PWD/a\" \"$PWD/b\" | sed \"s|$PWD|PWD|g\""
[case.files]
"a/d/dumb" = { content_b64 = "" }
"a/v/vt100" = { content_b64 = "" }
"b/v/vt100" = { content_b64 = "" }
"b/v/vt102" = { content_b64 = "" }

[[case]]
id = "toe-custom-directory-header"
script = "toe -s -h \"$PWD/a\" | sed \"s|$PWD|PWD|g\""
[case.files]
"a/d/dumb" = { content_b64 = "" }
"a/v/vt100" = { content_b64 = "" }

[[case]]
id = "toe-alias-files-are-skipped"
script = "toe -s \"$PWD/a\""
[case.files]
"a/v/vt100" = { content_b64 = "" }
"a/v/vt100-am" = { content_b64 = "" }
"a/x/not-a-terminal" = "texto qualquer\n"
"a/README" = "arquivo solto\n"

[[case]]
id = "toe-version"
argv = ["toe", "-V"]

[[case]]
id = "toe-invalid-option"
argv = ["toe", "-x"]

[[case]]
id = "toe-usage-missing-argument"
argv = ["toe", "-u"]

[[case]]
id = "toe-source-file-missing"
argv = ["toe", "-u", "/nonexistent"]

[[case]]
id = "toe-dependencies-direct"
argv = ["toe", "-u", "src.ti"]
[case.files]
"src.ti" = "alpha|first terminal,\n\tam, cols#80,\nbeta|second one,\n\tuse=alpha, xon,\ngamma|third entry,\n\tuse=alpha, use=beta,\ndelta|fourth entry,\n\tbw,\n"

[[case]]
id = "toe-dependencies-reverse"
argv = ["toe", "-U", "src.ti"]
[case.files]
"src.ti" = "alpha|first terminal,\n\tam, cols#80,\nbeta|second one,\n\tuse=alpha, xon,\ngamma|third entry,\n\tuse=alpha, use=beta,\ndelta|fourth entry,\n\tbw,\n"

[[case]]
id = "toe-dependencies-with-comments"
argv = ["toe", "-u", "src.ti"]
[case.files]
"src.ti" = "# comentário\nbase|base entry,\n\tam,\n\n# outro\nchild|child entry,\n\tuse=base,\n"

[[case]]
id = "toe-verbose-flag-with-number"
argv = ["toe", "-s", "-v2", "/usr/share/terminfo/x"]

[[case]]
id = "toe-digits-as-options"
argv = ["toe", "-s", "-12", "/usr/share/terminfo/d"]
