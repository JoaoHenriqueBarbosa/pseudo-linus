tool = "tic"
source = "manual"

# tic do ncurses 6.5.20250216 (ncurses-bin do Debian 13): compila fontes terminfo pequenas pro
# formato binário e as reescreve em texto (-I, -L, -C). Cada caso monta a fonte num heredoc em /work,
# compila com `tic -o t src` e confere o arquivo (od -An -tx1 -v) e a descompilação (infocmp -A t).
# As continuações usam espaços, não tab, pra a coluna das mensagens ("col N") não depender do tab.

[[case]]
id = "tic-version"
argv = ["tic", "-V"]

[[case]]
id = "tic-version-captoinfo-link"
script = "captoinfo -V; infotocap -V"

[[case]]
id = "tic-no-arguments"
argv = ["tic"]

[[case]]
id = "tic-invalid-option"
argv = ["tic", "-z"]

[[case]]
id = "tic-invalid-digit-option"
argv = ["tic", "-5", "x"]

[[case]]
id = "tic-too-many-file-names"
script = '''
cd /work && rm -rf t src src2
printf 't|x,\n am,\n' > src
printf 'u|y,\n am,\n' > src2
tic -o t src src2; echo "rc=$?"
ls t 2>&1
'''

[[case]]
id = "tic-source-file-missing"
script = '''
cd /work && rm -rf t
tic -o t /work/no-such-source-file; echo "rc=$?"
ls t 2>&1
'''

[[case]]
id = "tic-database-locations"
script = "TERMINFO=/work/t tic -D"

[[case]]
id = "tic-basic-compile-bytes"
script = '''
cd /work && rm -rf t src
cat > src <<'EOF'
t|test terminal,
  am, cols#80, bel=^G,
EOF
tic -o t src; echo "rc=$?"
od -An -tx1 -v t/t/t
'''

[[case]]
id = "tic-basic-compile-infocmp"
script = '''
cd /work && rm -rf t src
cat > src <<'EOF'
t|test terminal,
  am, bw, cols#80, lines#24, bel=^G, cup=\E[%i%p1%d;%p2%dH, clear=\E[H\E[2J$<50>,
EOF
tic -o t src; echo "rc=$?"
infocmp -1 -A /work/t t
'''

[[case]]
id = "tic-header-name-length-even"
script = '''
cd /work && rm -rf t src
cat > src <<'EOF'
ab|abc,
  am, bel=^G,
EOF
tic -o t src; echo "rc=$?"
od -An -tx1 -v t/a/ab
'''

[[case]]
id = "tic-header-name-length-odd"
script = '''
cd /work && rm -rf t src
cat > src <<'EOF'
abc|abcd,
  am, bel=^G,
EOF
tic -o t src; echo "rc=$?"
od -An -tx1 -v t/a/abc
'''

[[case]]
id = "tic-booleans-even-count-padding"
script = '''
