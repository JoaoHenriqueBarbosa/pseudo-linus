b|second,
  bw, lines#50, use=a,
a|first,
  am, bel=^G, cols#80, lines#24,
EOF
tic -o t src; echo "rc=$?"
for n in a b c; do echo "== $n"; infocmp -1 -A /work/t $n | tail -n +2; done
od -An -tx1 -v t/c/c
'''

[[case]]
id = "tic-use-two-bases-precedence"
