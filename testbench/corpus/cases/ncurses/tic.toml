[[case]]
id = "tic-tab-continuation"
script = "cd /work && rm -rf t src && printf 'tb|tab term,\\n\\tam, cols#80,\\n\\tbel=^G,\\n' > src && tic -o t src; echo \"rc=$?\"; od -An -tx1 -v t/t/tb"

[[case]]
id = "tic-multiple-entries-in-one-file"
script = '''
cd /work && rm -rf t src
cat > src <<'EOF'
one|first,
  am,
two|second,
  bw,
three|third,
  cols#40,
EOF
tic -o t src; echo "rc=$?"
ls t/*
od -An -tx1 -v t/o/one
od -An -tx1 -v t/t/two
od -An -tx1 -v t/t/three
'''

[[case]]
id = "tic-aliases-listing"
script = '''
cd /work && rm -rf t src
cat > src <<'EOF'
main|alias1|alias2|the description,
  am, cols#80,
EOF
tic -o t src; echo "rc=$?"
ls t/*
for n in main alias1 alias2; do infocmp -A /work/t -1 $n | tail -n +2; done
'''

[[case]]
id = "tic-aliases-different-initials"
