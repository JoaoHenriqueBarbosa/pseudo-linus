  it#4, use=left, use=right,
mix2|mix2,
  it#4, use=right, use=left,
EOF
tic -o t src; echo "rc=$?"
for n in mix mix2; do echo "== $n"; infocmp -1 -A /work/t $n | tail -n +2; done
'''

