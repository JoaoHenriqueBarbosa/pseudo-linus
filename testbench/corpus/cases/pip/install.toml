tool = "pip"
source = "manual"

# Um caso por pacote da leva da Fase 3 (pacotes Python puro do topo do PyPI, ver
# testbench/mirror/packages.txt): pip instala do espelho (https://pypi.sandbox/simple/) num venv novo e
# a saída mostra a resolução, `pip list`, `pip show`, `pip show -f` (as 30 primeiras linhas),
# `pip freeze` e `pip check`. O cache do pip é desligado para a saída não depender da ordem dos
# casos, e as velocidades e tempos da barra de progresso passam por um normalizador. A tag "mirror"
# faz o oráculo subir o espelho antes do caso. O uso real de cada pacote fica em smoke.toml.

[[case]]
id = "mirror-install-setuptools"
tags = ["mirror"]
script = '''
exec 2>&1
export PIP_NO_CACHE_DIR=1
norm() { sed -E 's/[0-9.]+ [kMG]?B\/s/<speed>/g; s/eta [0-9:]+/eta <t>/g'; }
rm -rf /tmp/v
python3 -m venv /tmp/v; echo "venv rc=$?"
/tmp/v/bin/pip install --progress-bar off setuptools 2>&1 | norm; echo "pip rc=${PIPESTATUS[0]}"
/tmp/v/bin/pip list; echo "rc=$?"
/tmp/v/bin/pip show setuptools; echo "rc=$?"
/tmp/v/bin/pip show -f setuptools | sed -n '1,30p'
/tmp/v/bin/pip freeze; echo "rc=$?"
/tmp/v/bin/pip check; echo "rc=$?"
'''

