from traitlets import HasTraits, Int, List, TraitError, Unicode, observe, validate


class P(HasTraits):
    name = Unicode("x")
    age = Int(0)
    tags = List(Unicode())

    @observe("age")
    def _o(self, ch):
        print("age", ch["old"], "->", ch["new"])

    @validate("age")
    def _v(self, proposal):
        if proposal["value"] < 0:
            raise TraitError("negativo")
        return proposal["value"]


p = P(name="n")
p.age = 3
p.tags.append("a")
try:
    p.age = -1
except TraitError as e:
    print(e)
try:
    p.age = "s"
except TraitError as e:
    print(e)
print(sorted(p.trait_values().items()), sorted(P.class_trait_names()))
PY
echo "py rc=$?"
'''

