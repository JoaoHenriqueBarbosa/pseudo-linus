tool = "pip"
source = "manual"

# Fumaça de pacotes reais do PyPI: cada caso cria um venv, instala o pacote pelo espelho
# (https://pypi.sandbox/simple/) e roda um script curto de uso real e determinístico do pacote.
# Nada de rede externa, tempo atual ou caminho aleatório: os servidores HTTP são locais (porta 8765),
# os arquivos ficam em /tmp e as datas são fixas. A tag "mirror" faz o oráculo subir o espelho antes
# do caso; "pip-smoke" agrupa esta leva. As wheels (com dependências) vêm de testbench/mirror/packages.txt.

[[case]]
id = "pip-smoke-requests"
tags = ["mirror", "pip-smoke"]
script = '''
exec 2>&1
export PIP_NO_CACHE_DIR=1
rm -rf /tmp/v
python3 -m venv /tmp/v; echo "venv rc=$?"
/tmp/v/bin/pip install -q requests; echo "pip rc=$?"
/tmp/v/bin/python - <<'PY'
import json
import threading
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

import requests


class H(BaseHTTPRequestHandler):
    def do_GET(self):
        body = json.dumps({"path": self.path, "ok": True}).encode()
        self.send_response(200)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    def log_message(self, *a):
        pass


srv = ThreadingHTTPServer(("127.0.0.1", 8765), H)
threading.Thread(target=srv.serve_forever, daemon=True).start()
s = requests.Session()
s.trust_env = False
r = s.get("http://127.0.0.1:8765/ola", params={"a": "1", "b": "x y"})
print(r.status_code, r.url)
print(r.headers["Content-Type"])
print(r.json())
print(r.ok, r.reason, r.encoding)
srv.shutdown()
srv.server_close()
PY
echo "py rc=$?"
'''

