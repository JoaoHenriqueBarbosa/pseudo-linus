import rsa

pub, priv = rsa.newkey(512)
msg = b"hello"
c = rsa.encrypt(msg, pub)
print(len(c), rsa.decrypt(c, priv), pub.n.bit_length(), pub.e)
sig = rsa.sign(msg, priv, "SHA-256")
