import anyio


async def worker(n, out):
    await anyio.sleep(0)
    out.append(n * n)


async def main():
    out = []
    async with anyio.create_task_group() as tg:
        for i in range(4):
            tg.start_soon(worker, i, out)
    print(sorted(out))
    send, recv = anyio.create_memory_object_stream(2)
    async with send, recv:
        await send.send("msg")
        print(await recv.receive())
    with anyio.move_on_after(0.05) as scope:
        await anyio.sleep(5)
    print(scope.cancelled_caught)
    return "fim"


print(anyio.run(main))
PY
echo "py rc=$?"
'''

