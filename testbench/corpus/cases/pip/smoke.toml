/tmp/v/bin/python - <<'PY'
from pyasn1.codec.der import decoder, encoder
from pyasn1.type import char, namedtype, univ


class Rec(univ.Sequence):
    componentType = namedtype.NamedTypes(
        namedtype.NamedType("id", univ.Integer()),
        namedtype.NamedType("name", char.UTF8String()),
        namedtype.NamedType("flag", univ.Boolean()),
    )


r = Rec()
r["id"] = 300
r["name"] = "ab"
r["flag"] = True
der = encoder.encode(r)
print(der.hex())
d, rest = decoder.decode(der, asn1Spec=Rec())
print(d.prettyPrint(), rest)
print(encoder.encode(univ.ObjectIdentifier("1.2.840.113549.1.1.11")).hex(), encoder.encode(univ.Integer(-129)).hex())
obj, _ = decoder.decode(der)
print(type(obj).__name__, [type(obj[i]).__name__ for i in range(len(obj))])
so = univ.SetOf(componentType=univ.Integer())
so.extend([3, 1, 2])
print(encoder.encode(so).hex())
PY
echo "py rc=$?"
'''

