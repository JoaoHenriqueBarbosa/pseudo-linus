echo "py rc=$?"
'''

[[case]]
id = "pip-smoke-tenacity"
tags = ["mirror", "pip-smoke"]
script = '''
exec 2>&1
export PIP_NO_CACHE_DIR=1
rm -rf /tmp/v
python3 -m venv /tmp/v; echo "venv rc=$?"
/tmp/v/bin/pip install -q tenacity; echo "pip rc=$?"
/tmp/v/bin/python - <<'PY'
from tenacity import RetryError, retry, retry_if_exception_type, stop_after_attempt, wait_none

n = {"c": 0}


@retry(stop=stop_after_attempt(3), wait=wait_none(), retry=retry_if_exception_type(ValueError))
def instavel():
    n["c"] += 1
    if n["c"] < 3:
        raise ValueError("falha %d" % n["c"])
    return "ok"


print(instavel(), n)


@retry(stop=stop_after_attempt(2), wait=wait_none())
def ruim():
    raise KeyError("k")


try:
    ruim()
except RetryError as e:
    print("RetryError", e.last_attempt.attempt_number, repr(e.last_attempt.exception()))


@retry(stop=stop_after_attempt(2), wait=wait_none(), reraise=True)
def ruim2():
    raise KeyError("k2")


try:
    ruim2()
except KeyError as e:
    print("KeyError", e)
PY
echo "py rc=$?"
'''
