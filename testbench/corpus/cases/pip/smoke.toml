import io

from pyasn1.codec.der import decoder, encoder
from pyasn1.type import univ
from pyasn1_modules import pem, rfc4055, rfc5280

ai = rfc5280.AlgorithmIdentifier()
ai["algorithm"] = rfc4055.sha256WithRSAEncryption
ai["parameters"] = univ.Any(encoder.encode(univ.Null("")))
der = encoder.encode(ai)
print(der.hex())
d, rest = decoder.decode(der, asn1Spec=rfc5280.AlgorithmIdentifier())
print(d["algorithm"], d["algorithm"] == rfc4055.sha256WithRSAEncryption, rest)
text = "-----BEGIN CERTIFICATE-----\nMAMCAQU=\n-----END CERTIFICATE-----\n"
idx, sub = pem.readPemBlocksFromFile(io.StringIO(text), ("-----BEGIN CERTIFICATE-----", "-----END CERTIFICATE-----"))
print(idx, sub)
obj, _ = decoder.decode(sub)
print(obj.prettyPrint())
print(rfc5280.id_ce_keyUsage, rfc5280.id_at_commonName)
PY
echo "py rc=$?"
'''

