import pluggy

hookspec = pluggy.HookspecMarker("demo")
hookimpl = pluggy.HookimplMarker("demo")


class Spec:
    @hookspec
    def calcula(self, x):
        """Calcula algo a partir de x."""


class A:
    @hookimpl
    def calcula(self, x):
        return x + 1


class B:
    @hookimpl
    def calcula(self, x):
        return x * 10


pm = pluggy.PluginManager("demo")
pm.add_hookspecs(Spec)
pm.register(A(), name="a")
pm.register(B(), name="b")
print(pm.hook.calcula(x=5))
print(sorted(n for n, _ in pm.list_name_plugin()))
pm.unregister(name="a")
print(pm.hook.calcula(x=5))
PY
echo "py rc=$?"
'''

