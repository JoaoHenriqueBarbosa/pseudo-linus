from cachetools import LFUCache, LRUCache, TTLCache, cached

c = LRUCache(maxsize=2)
c["a"] = 1
c["b"] = 2
c["a"]
c["c"] = 3
print(list(c), "b" in c, c.currsize, c.maxsize)
calls = []


@cached(cache=LRUCache(maxsize=8))
def f(x):
    calls.append(x)
    return x * 2


print(f(1), f(1), f(2), calls)
agora = [0]
t = TTLCache(maxsize=2, ttl=10, timer=lambda: agora[0])
t["a"] = 1
agora[0] = 5
print("a" in t)
agora[0] = 11
print("a" in t, len(t))
l = LFUCache(maxsize=2)
l["x"] = 1
l["y"] = 2
l["x"]
l["x"]
l["z"] = 3
print(sorted(l))
