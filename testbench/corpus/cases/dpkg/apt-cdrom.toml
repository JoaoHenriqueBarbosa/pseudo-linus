tool = "apt-cdrom"
source = "manual"

# apt-cdrom 3.0.3 (Debian 13): ajuda, versão, erros de uso e as operações sem CD-ROM montável.

[[case]]
id = "acd-help"
script = "apt-cdrom --help; echo \"rc=$?\""

[[case]]
id = "acd-version"
script = "apt-cdrom --version; echo \"rc=$?\""

[[case]]
id = "acd-no-command"
script = "apt-cdrom; echo \"rc=$?\""

[[case]]
id = "acd-unknown-option"
script = "apt-cdrom --bogus 2>&1; echo \"rc=$?\""

[[case]]
id = "acd-invalid-operation"
script = "apt-cdrom frobnicate 2>&1; echo \"rc=$?\""

[[case]]
id = "acd-add-no-device"
script = "apt-cdrom add 2>&1; echo \"rc=$?\""

[[case]]
id = "acd-ident-no-device"
script = "apt-cdrom ident 2>&1; echo \"rc=$?\""
