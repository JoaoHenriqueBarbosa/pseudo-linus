tool = "apt-cache"
source = "manual"

# apt-cache 3.0.3 (Debian 13) sobre um cache vazio: ajuda, versão, erros e os comandos de consulta.

[[case]]
id = "ac-help"
script = "apt-cache --help; echo \"rc=$?\""

[[case]]
id = "ac-help-command"
script = "apt-cache help; echo \"rc=$?\""

[[case]]
id = "ac-version"
script = "apt-cache --version; echo \"rc=$?\""

[[case]]
id = "ac-no-command"
script = "apt-cache; echo \"rc=$?\""

[[case]]
id = "ac-unknown-option"
script = "apt-cache --bogus 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-invalid-operation"
script = "apt-cache frobnicate 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-policy"
script = "apt-cache policy 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-policy-unknown"
script = "apt-cache policy nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-stats"
script = "apt-cache stats 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-pkgnames"
script = "apt-cache pkgnames 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-search"
script = "apt-cache search bash 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-search-no-pattern"
script = "apt-cache search 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-show-unknown"
script = "apt-cache show nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-depends-unknown"
script = "apt-cache depends nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "ac-showsrc-unknown"
script = "apt-cache showsrc nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""
