tool = "apt-get"
source = "manual"

# apt-get 3.0.3 (Debian 13): ajuda, versão, erros de opção e de operação, e o comportamento sem rede,
# sem listas e sem as travas de /var/lib.

[[case]]
id = "ag-help"
script = "apt-get --help; echo \"rc=$?\""

[[case]]
id = "ag-help-command"
script = "apt-get help; echo \"rc=$?\""

[[case]]
id = "ag-version"
script = "apt-get --version; echo \"rc=$?\""

[[case]]
id = "ag-no-command"
script = "apt-get; echo \"rc=$?\""

[[case]]
id = "ag-unknown-long-option"
script = "apt-get --bogus 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-unknown-short-option"
script = "apt-get -z 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-invalid-operation"
script = "apt-get frobnicate 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-update-no-lists-dir"
script = "apt-get update 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-install-unknown"
script = "apt-get install nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-install-simulate-unknown"
script = "apt-get -s install nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-install-simulate-quiet"
script = "apt-get -qq -s install nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-upgrade"
script = "apt-get upgrade 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-check-simulate"
script = "apt-get check 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-source-no-args"
script = "apt-get source 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-source-unknown"
script = "apt-get source nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-download-no-args"
script = "apt-get download 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-clean"
script = "apt-get clean 2>&1; echo \"rc=$?\""

[[case]]
id = "ag-moo"
script = "apt-get moo; echo \"rc=$?\""

[[case]]
id = "ag-option-set"
script = "apt-get -o Debug::NoLocking=true --version; echo \"rc=$?\""
