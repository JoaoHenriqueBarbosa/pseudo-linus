tool = "dpkg-query"
source = "manual"

# dpkg-query 1.22 (Debian 13): ajuda, versão, erros de uso, status ausente e as ações -l, -W, -s, -L e -S
# contra um --admindir local.

[[case]]
id = "dq-help"
script = "dpkg-query --help; echo \"rc=$?\""

[[case]]
id = "dq-version"
script = "dpkg-query --version; echo \"rc=$?\""

[[case]]
id = "dq-no-action"
script = "dpkg-query 2>&1; echo \"rc=$?\""

[[case]]
id = "dq-unknown-option"
script = "dpkg-query --bogus 2>&1; echo \"rc=$?\""

[[case]]
id = "dq-list-no-status"
script = "mkdir adm; dpkg-query --admindir $PWD/adm -l 2>&1 | sed 's#'$PWD'#PWD#g'; echo \"rc=$?\""

[[case]]
id = "dq-show-no-status"
script = "mkdir adm; dpkg-query --admindir $PWD/adm -W 2>&1 | sed 's#'$PWD'#PWD#g'; echo \"rc=$?\""

[[case]]
id = "dq-show-default-format"
script = "mkdir adm; printf 'Package: b\\nStatus: install ok installed\\nArchitecture: amd64\\nVersion: 2\\nDescription: b\\n\\nPackage: a\\nStatus: install ok installed\\nArchitecture: amd64\\nVersion: 1\\nDescription: a\\n' > adm/status; dpkg-query --admindir $PWD/adm -W"

[[case]]
id = "dq-show-format"
script = "mkdir adm; printf 'Package: a\\nStatus: install ok installed\\nArchitecture: amd64\\nVersion: 1\\nInstalled-Size: 42\\nDescription: a\\n' > adm/status; dpkg-query --admindir $PWD/adm -W -f='${Package} ${Version} ${Status} ${Installed-Size} [${db:Status-Abbrev}]\\n' a"

[[case]]
id = "dq-show-width"
script = "mkdir adm; printf 'Package: a\\nStatus: install ok installed\\nArchitecture: amd64\\nVersion: 1\\nDescription: a\\n' > adm/status; dpkg-query --admindir $PWD/adm -W -f='[${Package;-6}][${Version;6}]\\n'"

[[case]]
id = "dq-show-no-match"
script = "mkdir adm; printf 'Package: a\\nStatus: install ok installed\\nArchitecture: amd64\\nVersion: 1\\nDescription: a\\n' > adm/status; dpkg-query --admindir $PWD/adm -W nope 2>&1; echo \"rc=$?\""

[[case]]
id = "dq-list-columns"
script = "mkdir adm; printf 'Package: a\\nStatus: install ok installed\\nArchitecture: amd64\\nVersion: 1\\nDescription: short\\n\\nPackage: a-much-longer-package-name\\nStatus: install ok installed\\nArchitecture: all\\nVersion: 1:2.3-4\\nDescription: long\\n' > adm/status; COLUMNS=100 dpkg-query --admindir $PWD/adm -l"

[[case]]
id = "dq-status-not-installed"
script = "mkdir adm; : > adm/status; dpkg-query --admindir $PWD/adm -s nope 2>&1; echo \"rc=$?\""

[[case]]
id = "dq-listfiles-no-args"
script = "mkdir adm; : > adm/status; dpkg-query --admindir $PWD/adm -L 2>&1; echo \"rc=$?\""

[[case]]
id = "dq-search-no-args"
script = "mkdir adm; : > adm/status; dpkg-query --admindir $PWD/adm -S 2>&1; echo \"rc=$?\""

[[case]]
id = "dq-search-substring"
script = "mkdir -p adm/info; printf 'Package: foo\\nStatus: install ok installed\\nArchitecture: amd64\\nVersion: 1.0\\nDescription: a foo\\n' > adm/status; printf '/.\\n/usr/bin/foo\\n' > adm/info/foo.list; dpkg-query --admindir $PWD/adm -S foo"
