tool = "apt"
source = "manual"

# apt 3.0.3 (Debian 13): ajuda, versão, opção inválida, operação inválida e os comandos de consulta
# sem listas e sem rede (o aviso de CLI instável vai para o stderr).

[[case]]
id = "apt-help"
script = "apt --help; echo \"rc=$?\""

[[case]]
id = "apt-help-command"
script = "apt help; echo \"rc=$?\""

[[case]]
id = "apt-version"
script = "apt --version; echo \"rc=$?\""

[[case]]
id = "apt-no-command"
script = "apt; echo \"rc=$?\""

[[case]]
id = "apt-unknown-long-option"
script = "apt --bogus 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-unknown-short-option"
script = "apt -z 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-invalid-operation"
script = "apt frobnicate 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-list"
script = "apt list 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-search-no-pattern"
script = "apt search 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-show-unknown"
script = "apt show nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-policy-empty"
script = "apt policy 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-install-simulate-unknown"
script = "apt -s install nonexistent-pkg-xyz 2>&1; echo \"rc=$?\""

[[case]]
id = "apt-moo"
script = "apt moo 2>&1; echo \"rc=$?\""
