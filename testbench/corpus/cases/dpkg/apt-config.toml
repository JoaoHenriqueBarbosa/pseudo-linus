tool = "apt-config"
source = "manual"

# apt-config 3.0.3 (Debian 13): ajuda, versão, dump e shell sobre a configuração padrão.

[[case]]
id = "acf-help"
script = "apt-config --help; echo \"rc=$?\""

[[case]]
id = "acf-version"
script = "apt-config --version; echo \"rc=$?\""

[[case]]
id = "acf-no-command"
script = "apt-config; echo \"rc=$?\""

[[case]]
id = "acf-unknown-option"
script = "apt-config --bogus 2>&1; echo \"rc=$?\""

[[case]]
id = "acf-invalid-operation"
script = "apt-config frobnicate 2>&1; echo \"rc=$?\""

[[case]]
id = "acf-dump"
script = "apt-config dump; echo \"rc=$?\""

[[case]]
id = "acf-dump-subtree"
script = "apt-config dump APT::Architecture; apt-config dump Dir::Cache"

[[case]]
id = "acf-dump-option-override"
script = "apt-config -o APT::Install-Recommends=false dump APT::Install-Recommends"

[[case]]
id = "acf-shell-string"
script = "apt-config shell arch APT::Architecture"

[[case]]
id = "acf-shell-dir-file"
script = "apt-config shell cache Dir::Cache/d archives Dir::Cache::archives/d status Dir::State::status/f"

[[case]]
id = "acf-shell-bool-int"
script = "apt-config shell rec APT::Install-Recommends/b sug APT::Install-Suggests/b"

[[case]]
id = "acf-shell-missing"
script = "apt-config shell nothing Not::There; echo \"rc=$?\""
