tool = "file"
source = "manual"

# Fixtures binárias geradas de forma determinística (PIL pras imagens, gzip -n, tar e zip com mtime e
# dono fixos, lzip no oráculo). O tar é um cabeçalho ustar de 512 bytes (symlink com nome no prefix),
# escolhido pra não ter sequências longas de zeros no base64. Cada uma roda em `file x` e em
# `file --mime-type x`.

[[case]]
id = "file-png"
argv = ["file", "img.png"]
tags = ["image", "describe"]
[case.files]
"img.png" = { content_b64 = "iVBORw0KGgoAAAANSUhEUgAAAAQAAAADCAYAAAC09K7GAAAAFUlEQVR4nGP8z8DQwIAEmBjQAIYAAEoaAYXoyUqYAAAAAElFTkSuQmCC" }

[[case]]
