tool = "file"
source = "manual"

# Fixtures de texto: detecção de codificação, terminadores de linha, scripts e formatos textuais.
# Cada fixture roda em `file x` e em `file --mime-type x`; alguns também em `-i` e `--mime-encoding`.

[[case]]
id = "file-ascii"
argv = ["file", "ascii.txt"]
tags = ["text", "describe"]
[case.files]
"ascii.txt" = "hello world\n"

[[case]]
id = "file-ascii-mime"
argv = ["file", "--mime-type", "ascii.txt"]
tags = ["text", "mime"]
[case.files]
"ascii.txt" = "hello world\n"

[[case]]
id = "file-ascii-i"
argv = ["file", "-i", "ascii.txt"]
tags = ["text", "mime-charset"]
[case.files]
"ascii.txt" = "hello world\n"

[[case]]
id = "file-ascii-brief"
argv = ["file", "-b", "ascii.txt"]
tags = ["text", "describe", "brief"]
[case.files]
"ascii.txt" = "hello world\n"

