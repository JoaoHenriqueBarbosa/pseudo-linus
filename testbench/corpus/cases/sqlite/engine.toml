[[case]]
id = "sqlite-insert-variants"
stdin = '''
CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT UNIQUE);
INSERT INTO t VALUES (1, 'a'), (2, 'b');
INSERT OR IGNORE INTO t VALUES (3, 'a');
INSERT OR REPLACE INTO t VALUES (4, 'b');
REPLACE INTO t VALUES (1, 'c');
CREATE TABLE copy AS SELECT * FROM t WHERE id > 1;
INSERT INTO copy SELECT id + 100, v || '!' FROM t;
SELECT * FROM t ORDER BY id;
SELECT * FROM copy ORDER BY id;
'''
argv = ["sqlite3", "db.sqlite"]
tags = ["dml", "conflict", "stdin"]

[[case]]
