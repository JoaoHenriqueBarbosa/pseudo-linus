tool = "sqlite"
source = "agent-style"

# Núcleo do motor: DDL, DML, tipos e afinidade, funções escalares e agregadas, consultas.
# Tudo em modo list (o padrão do CLI). O banco é sempre `db.sqlite` no diretório do caso.

[[case]]
id = "sqlite-create-insert-select"
argv = ["sqlite3", "db.sqlite", '''CREATE TABLE t(a INTEGER, b TEXT); INSERT INTO t VALUES(1,'x'),(2,'y'),(3,NULL); SELECT * FROM t;''']
tags = ["ddl", "dml", "argv"]

[[case]]
id = "sqlite-null-and-literals"
argv = ["sqlite3", "db.sqlite", '''SELECT NULL, 1, 'a', -5, 2.5, '';''']
tags = ["types", "argv"]

[[case]]
id = "sqlite-type-affinity"
stdin = '''
CREATE TABLE t(i INTEGER, r REAL, tx TEXT, b BLOB, n NUMERIC, none);
INSERT INTO t VALUES('12', '3', 4, x'05', '5.0', '6');
INSERT INTO t VALUES('1e3', 'abc', 4.5, 'b', '7.25', 8);
SELECT typeof(i), typeof(r), typeof(tx), typeof(b), typeof(n), typeof(none) FROM t;
SELECT i, r, tx, n, none FROM t;
'''
argv = ["sqlite3", "db.sqlite"]
tags = ["types", "affinity", "stdin"]

[[case]]
id = "sqlite-real-formatting"
argv = ["sqlite3", "db.sqlite", '''SELECT 1.0, 0.1+0.2, 1e20, 1.5e-7, 100.0/3, 2.0*3, 9007199254740993.0, 1e308*10, -1e308*10, 123456789012345678.0, 0.5, 1e15, 1e16;''']
tags = ["types", "real", "argv"]

