[case.files]
in1 = """
A dialogue on poverty

\tOn the night when the rain beats,
\tDriven by the wind,
\tOn the night when the snowflakes mingle
\tWith a sleety rain,
\tI feel so helplessly cold.
\tI nibble at a lump of salt,
\tSip the hot, oft-diluted dregs of _sake_;
\tAnd coughing, snuffling,
\tAnd stroking my scanty beard,
\tI say in my pride,
\t"There's none worthy, save I!"
\tBut I shiver still with cold.
\tI pull up my hempen bedclothes,
\tWear what few sleeveless clothes I have,
\tBut cold and bitter is the night!
\tAs for those poorer than myself,
\tTheir parents must be cold and hungry,
\tTheir wives and children beg and cry.
\tThen, how do you struggle through life?

\tWide as they call the heaven and earth,
\tFor me they have shrunk quite small;
\tBright though they call the sun and moon,
\tThey never shine for me.
\tIs it the same with all men,
\tOr for me alone?
\tBy rare chance I was born a man
\tAnd no meaner than my fellows,
\tBut, wearing unwadded sleeveless clothes
\tIn tatters, like weeds waving in the sea,
\tHanging from my shoulders,
\tAnd under the sunken roof,
\tWithin the leaning walls,
\tHere I lie on straw
\tSpread on bare earth,
\tWith my parents at my pillow,
\tAnd my wife and children at my feet,
\tAll huddled in grief and tears.
\tNo fire sends up smoke
\tAt the cooking-place,
\tAnd in the cauldron
\tA spider spins its web.
\tWith not a grain to cook,
\tWe moan like the night thrush.
\tThen, "to cut," as the saying is,
\t"The ends of what is already too short,"
\tThe village headman comes,
\tWith rod in hand, to our sleeping place,
\tGrowling for his dues.
\tMust it be so hopeless --
\tThe way of this world?

\t-- Yamanoue Okura
"""

