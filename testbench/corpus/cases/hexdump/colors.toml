tool = "hexdump"
source = "manual"

# Unidades de cor `_L[...]`: sem terminal (o padrão e `-L`/`--color=auto`) elas são lidas e puladas;
# com `--color=always` as sequências saem. Condições por valor (hex, octal), texto, deslocamento e
# faixa, negação, nomes desconhecidos, listas vazias e os erros do original.
# `v.bin` = "ABCDABCD".

[[case]]
id = "hexdump-color-skipped-without-tty"
argv = ["hexdump", "-e", '4/1 "%02x_L[red] " "\n"', "v.bin"]
tags = ["color"]
[case.files]
"v.bin" = "ABCDABCD"

[[case]]
id = "hexdump-color-auto-flag"
argv = ["hexdump", "-L", "-e", '4/1 "%02x_L[red] " "\n"', "v.bin"]
tags = ["color"]
[case.files]
"v.bin" = "ABCDABCD"

[[case]]
id = "hexdump-color-never"
