tool = "hexdump"
source = "manual"

# Formatos prontos (-b -c -C -d -o -x -X e o padrão), `hd`, compressão de linhas repetidas com `*`,
# -v, vários arquivos como um fluxo só, -n e -s com sufixos e bases, stdin, ajuda e versão.
# Fixtures: `a` é texto de 20 bytes; `all.bin` tem os 256 bytes em ordem; `ctrl.bin` tem controles,
# bytes altos e UTF-8; `sq*.bin` exercitam a compressão (zeros, bloco parcial igual ao anterior).

[[case]]
id = "hexdump-default"
argv = ["hexdump", "a"]
tags = ["format", "default"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hexdump-canonical"
argv = ["hexdump", "-C", "a"]
tags = ["format", "canonical"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hd-default"
argv = ["hd", "a"]
tags = ["format", "hd"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hd-octal"
argv = ["hd", "-b", "a"]
tags = ["format", "hd"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hexdump-one-byte-octal"
argv = ["hexdump", "-b", "a"]
tags = ["format"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hexdump-one-byte-char"
argv = ["hexdump", "-c", "ctrl.bin"]
tags = ["format", "char"]
[case.files]
"ctrl.bin" = { content_b64 = "AAF/gP8KCQ0HCAwLIH7DqQ==" }

[[case]]
id = "hexdump-two-bytes-decimal"
argv = ["hexdump", "-d", "a"]
tags = ["format"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hexdump-two-bytes-octal"
argv = ["hexdump", "-o", "a"]
tags = ["format"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hexdump-two-bytes-hex"
argv = ["hexdump", "-x", "a"]
tags = ["format"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hexdump-one-byte-hex"
argv = ["hexdump", "-X", "a"]
tags = ["format"]
[case.files]
"a" = "0123456789abcdefghij"

[[case]]
id = "hexdump-canonical-all-bytes"
argv = ["hexdump", "-C", "all.bin"]
tags = ["format", "canonical", "binary"]
[case.files]
"all.bin" = { content_b64 = "" }

[[case]]
id = "hexdump-char-all-bytes"
argv = ["hexdump", "-c", "all.bin"]
tags = ["format", "char", "binary"]
[case.files]
"all.bin" = { content_b64 = "" }

[[case]]
id = "hexdump-default-all-bytes"
argv = ["hexdump", "all.bin"]
tags = ["format", "default", "binary"]
[case.files]
"all.bin" = { content_b64 = "" }

[[case]]
id = "hexdump-stdin"
argv = ["hexdump", "-C"]
stdin = "hello world\n"
tags = ["stdin", "canonical"]

[[case]]
id = "hexdump-stdin-empty"
argv = ["hexdump"]
tags = ["stdin", "empty"]

[[case]]
id = "hexdump-empty-file"
argv = ["hexdump", "-C", "empty"]
tags = ["empty"]
[case.files]
"empty" = ""

[[case]]
