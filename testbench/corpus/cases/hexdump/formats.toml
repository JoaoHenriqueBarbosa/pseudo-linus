tool = "hexdump"
source = "manual"

# O motor de formatos de -e e -f: iterações N/M, contagem de bytes por conversão, ajuste da última
# unidade ao tamanho do bloco, espaço final que some na última iteração, conversões %d %i %o %u %x
# %X %c %s %e %f %g %E %G com flags e largura, %_a %_A %_c %_p %_u, escapes e as mensagens de erro.
# `b.bin` = ff fe 01 80 "abcdefgh12345678"; `f4.bin` = floats (1, 0, inf, nan, -nan, -inf, 0.1, 2);
# `f8.bin` = doubles (1, 0.1, inf, -2.5, -0, nan, 255, 10, 1e-5).

[[case]]
id = "hexdump-e-signed-byte"
argv = ["hexdump", "-e", '1/1 "%d "', "b.bin"]
tags = ["e", "int"]
[case.files]
"b.bin" = { content_b64 = "//4BgGFiY2RlZmdoMTIzNDU2Nzg=" }

