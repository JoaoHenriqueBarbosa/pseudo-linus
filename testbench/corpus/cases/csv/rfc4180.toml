tool = "csv"
source = "manual"

# RFC 4180 sem oráculo GNU: a referência é o módulo `csv` do Python 3.13 que está no oráculo (é
# dependência do yq). Leitura: um registro por linha, em JSON (`json.dumps(..., ensure_ascii=False)`).
# Escrita: cada linha de stdin é um array JSON, escrito com `csv.writer` (QUOTE_MINIMAL).
# Os casos usam sempre o mesmo programa Python, que o front-end nosso reconhece literalmente.

[[case]]
id = "csv-read-simple"
argv = ["python3", "-c", "import csv, sys, json\nfor row in csv.reader(open(sys.argv[1], newline='', encoding='utf-8')):\n    print(json.dumps(row, ensure_ascii=False))\n", "in.csv"]
tags = ["read"]
[case.files]
"in.csv" = "name,age\nana,30\nbob,41\n"

