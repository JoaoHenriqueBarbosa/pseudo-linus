# Sem relógio congelado de propósito: com -u a libfaketime reinterpretaria o FAKETIME (ver options.toml);
# aqui a data é absoluta com offset e o fuso de saída é UTC, sem horário de verão.
[[case]]
id = "date-tz-utc-flag-with-offset-input"
argv = ["date", "-u", "-d", "2026-01-15T12:00:00-03:00", "+%F %T %Z"]
tags = ["tz", "parse", "iso"]
env = { TZ = "Asia/Kolkata" }
