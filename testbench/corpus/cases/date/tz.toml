tool = "date"
source = "agent-style"

# Fusos: TZ do ambiente (IANA e POSIX), abreviações, offsets não inteiros, horário de verão, horários
# inexistentes e ambíguos, e TZ="..." dentro da string do -d.
#
# Todo caso tem relógio congelado (ver format.toml), inclusive os de data absoluta: pra hora local
# ambígua o GNU herda o isdst do "agora" (medido no oráculo: Europe/Berlin "2026-10-25 02:30" sai CET
# com agora em janeiro e CEST com agora em julho), então sem relógio fixo o golden mudaria com a data
# real. O FAKETIME é interpretado no TZ do caso.

[[case]]
id = "date-tz-utc-now"
argv = ["date", "+%a %F %T %Z %z %:z %s"]
tags = ["tz"]
env = { TZ = "UTC", FAKETIME = "2026-01-15 12:00:00", LD_PRELOAD = "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1" }

[[case]]
id = "date-tz-sao-paulo-now"
argv = ["date", "+%a %F %T %Z %z %:z %s"]
tags = ["tz"]
env = { TZ = "America/Sao_Paulo", FAKETIME = "2026-01-15 12:00:00", LD_PRELOAD = "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1" }

