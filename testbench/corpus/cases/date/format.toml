tool = "date"
source = "agent-style"

# Diretivas do +FORMAT, uma por caso, sem -d: o instante vem do relógio congelado, então o caso mede só
# a formatação (sem depender do parser de datas da biblioteca).
#
# Relógio: `FAKETIME` absoluto + `LD_PRELOAD` da libfaketime congela o relógio no instante dado,
# interpretado no TZ do caso. O campo `faketime` do harness usa o wrapper `faketime`, que só fixa os
# segundos e herda a fração de segundo real (medido no oráculo: 12:00:00.79, 12:00:00.92...), então %S
# pode virar 12:00:01 de vez em quando; com o relógio congelado o golden é determinístico.
#
# Instante base: segunda-feira 2026-01-05 09:07:03 UTC.

[[case]]
id = "date-fmt-weekday-abbr"
argv = ["date", "+%a"]
tags = ["format"]
env = { FAKETIME = "2026-01-05 09:07:03", LD_PRELOAD = "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1" }

