tool = "date"
source = "agent-style"

# Gramática do `date -d`. Saída sempre em "+%F %T %z" (diretivas que os dois lados suportam), pra que o
# caso meça só o parsing. Relógio congelado (ver format.toml) em quinta-feira 2026-01-15 12:00:00 UTC,
# salvo onde indicado.

# Relativas ao "agora".

[[case]]
id = "date-parse-days-ago"
argv = ["date", "-d", "2 days ago", "+%F %T %z"]
tags = ["parse", "relative"]
env = { FAKETIME = "2026-01-15 12:00:00", LD_PRELOAD = "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1" }

