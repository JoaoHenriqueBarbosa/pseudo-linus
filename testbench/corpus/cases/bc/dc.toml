tool = "dc"
source = "manual"

[[case]]
id = "dc-arith-basic"
argv = ["dc", "-e", "2 3+p 10 4-p 6 7*p 20 3/p 20 3%p"]
tags = ["arith"]

[[case]]
id = "dc-scale-div"
argv = ["dc", "-e", "5k 1 3/p 2 3/p _7 2/p K p"]
tags = ["arith", "scale"]

[[case]]
id = "dc-divrem-pow-sqrt"
argv = ["dc", "-e", "17 5~f c 2 10^p 2 _2^p 3k 2 _2^p 10k 2vp 16vp"]
tags = ["arith"]

[[case]]
id = "dc-modexp"
argv = ["dc", "-e", "4 13 497|p 2 100 7|p"]
tags = ["arith"]

[[case]]
id = "dc-negative-input"
argv = ["dc", "-e", "_5 3+p _1.5 2*p 0 _0+p .5p _.25p"]
tags = ["numbers"]

[[case]]
id = "dc-stack-ops"
argv = ["dc", "-e", "1 2 3 f r f d f zp c zp"]
tags = ["stack"]

[[case]]
id = "dc-rotate"
argv = ["dc", "-e", "1 2 3 4 3R f c 1 2 3 4 _3R f"]
tags = ["stack"]

[[case]]
id = "dc-registers"
argv = ["dc", "-e", "5sa 7sb la lb *p 1Sx 2Sx 3Sx Lxp Lxp lxp"]
tags = ["registers"]

[[case]]
id = "dc-arrays"
argv = ["dc", "-e", "10 0:a 20 1:a 1;ap 0;ap 5;ap"]
tags = ["registers"]

[[case]]
id = "dc-bases"
argv = ["dc", "-e", "255 16o p 2o p 10o 16i FF p A.8 p Ip 10i 1000 o 123456789p"]
tags = ["bases"]

[[case]]
id = "dc-strings"
argv = ["dc", "-e", "[hello]p [world]n 10an [abc]Zp [x[y]z]p 3.25Xp 123.45Zp 0Zp"]
tags = ["strings"]

[[case]]
id = "dc-P-bytes"
argv = ["dc", "-e", "[ola]P 10P 6841940 P 10P"]
tags = ["strings"]

[[case]]
id = "dc-macro-loop"
argv = ["dc", "-e", "1 [p 1+ d 5!<l]sl llx"]
tags = ["macros"]

[[case]]
id = "dc-compare"
argv = ["dc", "-e", "[[less]p]sa [[greater]p]sb [[equal]p]sc 1 2<a 2 1<a 2 1>b 3 3=c 3 4!=c 3 3!=c 1 2!>b 2 1!<a"]
tags = ["macros"]

[[case]]
id = "dc-quit-levels"
argv = ["dc", "-e", "[[inner]p q [never]p]sa [lax [after]p]sb lbx [top]p q [notreached]p"]
tags = ["macros"]

[[case]]
id = "dc-Q-levels"
argv = ["dc", "-e", "[[one]p 2Q [x]p]sa [lax [y]p]sb lbx [back]p"]
tags = ["macros"]

[[case]]
id = "dc-factorial"
argv = ["dc", "-e", "[d1-d1<f*]sf 30lfxp"]
tags = ["macros", "wrap"]

[[case]]
id = "dc-line-wrap"
argv = ["dc", "-e", "2 400^p 3 200^ d p f"]
tags = ["wrap"]

[[case]]
id = "dc-errors"
argv = ["dc", "-e", "p + 1 0/ 1 0% c 1 0~ c _4v f c lz Lz 1k _1k 1i 1o g [x]1+ zp"]
tags = ["errors"]

[[case]]
id = "dc-stdin"
argv = ["dc"]
stdin = "3 4*p\n# comentário\n[sum]P 10P 1 2+p\n"
tags = ["io"]

[[case]]
id = "dc-question"
argv = ["dc", "-e", "? 2*p ?p"]
stdin = "21\n5 5+\n"
tags = ["io"]

[[case]]
id = "dc-file"
argv = ["dc", "-f", "prog.dc", "-e", "lap", "more.dc"]
tags = ["io"]
[case.files]
"prog.dc" = "42 sa\n[from file]p\n"
"more.dc" = "la 2*p\n"

[[case]]
id = "dc-missing-file"
argv = ["dc", "nope.dc"]
tags = ["io", "errors"]

[[case]]
id = "dc-shell"
argv = ["dc", "-e", "1p !echo oi\n2p"]
tags = ["shell"]

[[case]]
id = "dc-version-help"
script = "dc -V; dc --help; dc -x; echo $?"
tags = ["options"]

[[case]]
id = "dc-long-options"
argv = ["dc", "--expression=3 4^p", "--expression", "[a]p"]
tags = ["options"]
