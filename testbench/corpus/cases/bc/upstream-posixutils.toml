tool = "bc"
source = "upstream:posixutils-rs calc/tests/bc (rev 4073af047104a44442f44047c76c1167f43a8c67)"

# Os 50 programas .bc da suíte do posixutils-rs, copiados sem mudança. Os quatro do math library
# (ln, atan, sin, cos) rodam com -l, como no driver deles (calc/tests/bc/mod.rs). O esperado aqui é o
# do GNU bc do oráculo, não o .out deles.

[[case]]
id = "up-add"
argv = ["bc"]
tags = ["upstream", "arith"]
stdin = '''
1 + 2
1 + 2.00
1.00 + 2
45.89 + 2.3
quit
'''

[[case]]
id = "up-arrays-are-passed-to-function-by-value"
argv = ["bc"]
tags = ["upstream", "define"]
stdin = '''
define r(a[]) {
	a[0]
	a[1]
	a[0] = 89.3
	a[1] = 23.7
}

a[0] = 1
a[1] = 2
r(a[])
a[0]
a[1]
quit
'''

