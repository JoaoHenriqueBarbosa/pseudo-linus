tool = "bc"
source = "agent-style"

# Usos típicos de agente: `echo ... | bc`, `bc -l <<< ...`, `bc -q arquivo.bc`. O programa vai no stdin
# (caso argv, sem shell). Tags: arith, scale, format, base, mathlib, define, control, string, last,
# compare, error, quit, file, wrap, env, gnu-ext.

[[case]]
id = "bc-scale-div"
argv = ["bc"]
stdin = "scale=2; 10/3\n"
tags = ["scale", "arith"]

[[case]]
id = "bc-int-div"
argv = ["bc"]
stdin = "10/3\n"
tags = ["arith"]

[[case]]
id = "bc-l-div"
argv = ["bc", "-l"]
stdin = "10/3\n"
tags = ["mathlib", "scale"]

[[case]]
id = "bc-leading-zero"
argv = ["bc"]
stdin = "scale=2; 1/3\n0.5 + 0.25\n"
tags = ["format", "scale"]

[[case]]
id = "bc-negative-frac"
argv = ["bc"]
stdin = "scale=2; -1/3\n-0.5\n"
tags = ["format", "scale"]

[[case]]
id = "bc-pow"
argv = ["bc"]
stdin = "2^10\n2^-1\nscale=5; 2^-3\n"
tags = ["arith"]

[[case]]
id = "bc-pow-frac-exponent"
argv = ["bc"]
stdin = "2^0.5\n3\n"
tags = ["error", "arith"]

[[case]]
id = "bc-sqrt"
argv = ["bc"]
stdin = "scale=10; sqrt(2)\nsqrt(16)\nsqrt(15)\n"
tags = ["arith", "scale"]

[[case]]
id = "bc-sqrt-negative"
argv = ["bc"]
stdin = "sqrt(-4)\n1\n"
tags = ["error"]

[[case]]
id = "bc-mod"
argv = ["bc"]
stdin = "10%3\n-7%3\nscale=2; 7.5%2\n"
tags = ["arith", "scale"]

[[case]]
id = "bc-precedence"
argv = ["bc"]
stdin = "2+3*4\n(2+3)*4\n2^3^2\n-2^2\n"
tags = ["arith"]

[[case]]
id = "bc-obase16"
argv = ["bc"]
stdin = "obase=16; 255\n4096\n-31\n"
tags = ["base"]

[[case]]
id = "bc-obase2"
argv = ["bc"]
stdin = "obase=2; 10\n255\n"
tags = ["base"]

[[case]]
id = "bc-ibase16"
argv = ["bc"]
stdin = "ibase=16; FF\n1A\n"
tags = ["base"]

[[case]]
id = "bc-ibase-then-obase"
argv = ["bc"]
stdin = "ibase=16; obase=2; F\n"
tags = ["base"]

[[case]]
id = "bc-obase-then-ibase"
argv = ["bc"]
stdin = "obase=16; ibase=2; 11111111\n"
tags = ["base"]

[[case]]
id = "bc-ibase2-obase10-trap"
argv = ["bc"]
stdin = "ibase=2; obase=10; 101\n"
tags = ["base"]

[[case]]
id = "bc-obase-fraction"
argv = ["bc"]
stdin = "obase=16; scale=10; 1/3\n-10.5\n"
tags = ["base", "scale"]

[[case]]
id = "bc-obase-100"
argv = ["bc"]
stdin = "obase=100; 123456789\n"
tags = ["base"]

[[case]]
id = "bc-obase-1000"
argv = ["bc"]
stdin = "obase=1000; 2^40\n"
tags = ["base"]

[[case]]
id = "bc-ibase-fraction"
argv = ["bc"]
stdin = "ibase=16; A.8\n"
tags = ["base"]

[[case]]
id = "bc-l-pi"
argv = ["bc", "-l"]
stdin = "scale=50; 4*a(1)\n"
tags = ["mathlib"]

[[case]]
id = "bc-l-trig"
argv = ["bc", "-l"]
stdin = "s(1)\nc(0)\na(1)\n"
tags = ["mathlib"]

[[case]]
id = "bc-l-log-exp"
argv = ["bc", "-l"]
stdin = "l(10)\ne(1)\ne(l(2))\n"
tags = ["mathlib"]

[[case]]
id = "bc-l-bessel"
argv = ["bc", "-l"]
stdin = "j(0,1)\nj(1,2.5)\n"
tags = ["mathlib"]

[[case]]
id = "bc-l-scale-reset"
argv = ["bc", "-l"]
stdin = "scale\nscale=2; 1/3\nscale=0; 7/2\n"
tags = ["mathlib", "scale"]

[[case]]
id = "bc-l-sin-pi"
argv = ["bc", "-l"]
stdin = "s(3.14159265358979323846)\n"
tags = ["mathlib"]

[[case]]
id = "bc-define-recursive-factorial"
argv = ["bc"]
stdin = '''
define f(n) {
  if (n <= 1) return (1);
  return (n * f(n-1));
}
f(10)
f(100)
'''
tags = ["define", "wrap"]

[[case]]
id = "bc-define-auto"
argv = ["bc"]
stdin = '''
define g(n) {
  auto i, s
  s = 0
  for (i = 1; i <= n; i++) s += i
  return (s)
}
g(100)
i
'''
tags = ["define", "control"]

[[case]]
id = "bc-pow-big"
argv = ["bc"]
stdin = "2^1000\n"
tags = ["wrap", "arith"]

[[case]]
id = "bc-line-length-zero"
argv = ["bc"]
stdin = "2^300\n"
env = { BC_LINE_LENGTH = "0" }
tags = ["wrap", "env"]

[[case]]
id = "bc-line-length-20"
argv = ["bc"]
stdin = "2^100\n"
env = { BC_LINE_LENGTH = "20" }
tags = ["wrap", "env"]

[[case]]
id = "bc-while"
argv = ["bc"]
stdin = "i = 0\nwhile (i < 5) { i; i += 1 }\n"
tags = ["control"]

[[case]]
id = "bc-for-break"
argv = ["bc"]
stdin = "for (i = 0; ; i++) { if (i == 3) break; i }\n"
tags = ["control", "gnu-ext"]

[[case]]
id = "bc-continue"
argv = ["bc"]
stdin = "for (i = 0; i < 5; i++) { if (i % 2) continue; i }\n"
tags = ["control", "gnu-ext"]

[[case]]
id = "bc-if-else"
argv = ["bc"]
stdin = '''
x = 5
if (x > 3) print "big\n" else print "small\n"
if (x > 9) { print "huge\n" } else { print "not huge\n" }
'''
tags = ["control", "string", "gnu-ext"]

[[case]]
id = "bc-print"
argv = ["bc"]
stdin = '''
x = 3
print "x=", x, "\n"
print "a\tb\n"
print 1/2, "\n"
'''
tags = ["string", "gnu-ext"]

[[case]]
id = "bc-string-statement"
argv = ["bc"]
stdin = '''
"hello"
"world\n"
1
'''
tags = ["string"]

[[case]]
id = "bc-last-dot"
argv = ["bc"]
stdin = "5+5\nlast*2\n.+1\n"
tags = ["last", "gnu-ext"]

[[case]]
id = "bc-compare"
argv = ["bc"]
stdin = "1 < 2\n2 == 2.0\n3 != 3\n!0\n1 && 0\n0 || 2\n"
tags = ["compare", "gnu-ext"]

[[case]]
id = "bc-relational-assign"
argv = ["bc"]
stdin = "a = (3 > 2)\na\n"
tags = ["compare"]

[[case]]
id = "bc-div-zero"
argv = ["bc"]
stdin = "1/0\n2+2\n"
tags = ["error"]

[[case]]
id = "bc-mod-zero"
argv = ["bc"]
stdin = "5%0\n7\n"
tags = ["error"]

[[case]]
id = "bc-syntax-error"
argv = ["bc"]
stdin = "1 +* 2\n3\n"
tags = ["error"]

[[case]]
id = "bc-uppercase-variable"
argv = ["bc"]
stdin = "A = 5\nA\n"
tags = ["error"]

[[case]]
id = "bc-uppercase-digit"
argv = ["bc"]
stdin = "A\nF+1\nZ\n"
tags = ["base"]

[[case]]
id = "bc-quit"
argv = ["bc"]
stdin = "1\nquit\n2\n"
tags = ["quit"]

[[case]]
id = "bc-halt"
argv = ["bc"]
stdin = "1\nhalt\n2\n"
tags = ["quit", "gnu-ext"]

[[case]]
id = "bc-quit-in-if"
argv = ["bc"]
stdin = "if (0) quit\n5\n"
tags = ["quit"]

[[case]]
id = "bc-file-q"
argv = ["bc", "-q", "prog.bc"]
tags = ["file"]
[case.files]
"prog.bc" = "define sq(x) { return (x*x) }\nsq(12)\nquit\n"

[[case]]
id = "bc-file-then-stdin"
argv = ["bc", "lib.bc"]
stdin = "d(21)\n"
tags = ["file"]
[case.files]
"lib.bc" = "define d(x) { return (2*x) }\n"

[[case]]
id = "bc-missing-file"
argv = ["bc", "nope.bc"]
stdin = "1\n"
tags = ["file", "error"]

[[case]]
id = "bc-comments"
argv = ["bc"]
stdin = "# hash comment\n1 /* inline */ + 1\n"
tags = ["gnu-ext"]

[[case]]
id = "bc-semicolons"
argv = ["bc"]
stdin = "a=1; b=2; a+b; a*b\n"
tags = ["arith"]

[[case]]
id = "bc-arrays"
argv = ["bc"]
stdin = "a[0]=1; a[1]=2; a[2]=a[0]+a[1]; a[2]\n"
tags = ["arith"]

[[case]]
id = "bc-incdec"
argv = ["bc"]
stdin = "i=5\ni++\ni\n++i\ni--\n--i\n"
tags = ["arith"]

[[case]]
id = "bc-length-scale"
argv = ["bc"]
stdin = "length(123.45)\nscale(1.2345)\nlength(0.001)\n"
tags = ["scale"]

[[case]]
id = "bc-big-mul"
argv = ["bc"]
stdin = "123456789012345678901234567890 * 987654321098765432109876543210\n"
tags = ["arith"]

[[case]]
id = "bc-scale-60"
argv = ["bc"]
stdin = "scale=60; 1/7\n"
tags = ["scale"]

[[case]]
id = "bc-scale-100-wrap"
argv = ["bc"]
stdin = "scale=100; 1/7\n"
tags = ["scale", "wrap"]

[[case]]
id = "bc-negative-trunc"
argv = ["bc"]
stdin = "scale=0; -7/2\nscale=1; -7/2\n"
tags = ["scale", "arith"]

[[case]]
id = "bc-negative-base-pow"
argv = ["bc"]
stdin = "scale=10; (-2)^3\n(-2)^-1\n"
tags = ["arith"]

[[case]]
id = "bc-standard-mode"
argv = ["bc", "-s"]
stdin = "x = 1\nif (x) print \"y\\n\"\n"
tags = ["error", "gnu-ext"]

[[case]]
id = "bc-warn-mode"
argv = ["bc", "-w"]
stdin = "print \"y\\n\"\n"
tags = ["gnu-ext"]

[[case]]
id = "bc-void-function"
argv = ["bc"]
stdin = "define void f() { print \"v\\n\" }\nf()\n"
tags = ["define", "gnu-ext"]

[[case]]
id = "bc-crlf-input"
argv = ["bc"]
stdin = "1+1\r\n2+2\r\n"
tags = ["format", "error"]

[[case]]
id = "bc-empty-input"
argv = ["bc"]
stdin = ""
tags = ["quit"]

[[case]]
id = "bc-multiline-expression"
argv = ["bc"]
stdin = "1 + \\\n2\n"
tags = ["format"]
