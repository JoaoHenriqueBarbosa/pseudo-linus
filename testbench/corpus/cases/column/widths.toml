tool = "column"
source = "manual"

# Redução de largura do modo tabela (-T, -W, -E com -c), medida contra a libsmartcols do util-linux 2.41.

[[case]]
id = "column-t-trunc-three-148"
argv = ["column", "-t", "-c", "148", "-T", "1,2,3"]
stdin = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb cccccccccccccccccccccccccccccccccccccccc z\n"

