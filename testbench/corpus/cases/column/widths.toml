[[case]]
id = "column-t-trunc-header-min"
argv = ["column", "-t", "-s,", "-T", "2", "-c", "10", "-N", "A,BBBBBB,C"]
stdin = "a,abcdefghij,z\nb,c,d\n"

[[case]]
id = "column-t-wrap-words"
argv = ["column", "-t", "-s,", "-W", "2", "-c", "14"]
stdin = "a,hello world foo bar,z\nb,c,d\n"

[[case]]
id = "column-t-wrap-cjk"
