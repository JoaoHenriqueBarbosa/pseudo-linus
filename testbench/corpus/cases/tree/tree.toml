tool = "tree"
source = "manual"

# tree 2.2.1 do Debian 13. Fixture com mtime fixo nos diretórios declarados (pro -D), sem
# depender de tamanho de diretório nem de inode (que mudam de um sistema de arquivos pro outro).

[[case]]
id = "tree-plain"
argv = ["tree", "proj"]
[case.files]
"proj" = { dir = true }
"proj/src" = { dir = true }
"proj/src/sub" = { dir = true }
"proj/docs" = { dir = true }
"proj/empty" = { dir = true }
"proj/.hidden" = { dir = true }
"proj/a.txt" = "hi\n"
"proj/B.md" = "# t\n"
"proj/run.sh" = { content = "#!/bin/sh\n", mode = 0o755 }
"proj/file10" = ""
"proj/file9" = ""
"proj/build.log" = "log\n"
"proj/.dotfile" = ""
"proj/.hidden/h" = ""
"proj/src/main.rs" = "fn main() {}\n"
"proj/src/lib.rs" = ""
"proj/src/sub/z.c" = ""
"proj/docs/readme.md" = ""
"proj/link" = { symlink = "a.txt" }
"proj/broken" = { symlink = "nowhere" }
"proj/srcl" = { symlink = "src" }

