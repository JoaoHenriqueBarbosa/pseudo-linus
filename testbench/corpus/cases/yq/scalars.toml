tool = "yq"
source = "manual"

# Resolução de escalares: é aqui que YAML 1.1 (PyYAML, com os ajustes do yq 3.4.3) e YAML 1.2 (core
# schema, o que as crates Rust implementam) divergem. Um grupo por caso, pra que o placar por tag
# mostre exatamente quais formas mudam.

[[case]]
id = "yq-scalar-bool-words"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "yaml11"]
[case.files]
"s.yaml" = '''
a: yes
b: no
c: on
d: off
e: Y
f: n
'''

[[case]]
id = "yq-scalar-bool-canonical"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar"]
[case.files]
"s.yaml" = '''
a: true
b: false
c: True
d: FALSE
'''

[[case]]
id = "yq-scalar-null-forms"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar"]
[case.files]
"s.yaml" = '''
a: ~
b: null
c: Null
d:
e: NULL
'''

[[case]]
id = "yq-scalar-int-decimal"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
a: 0
b: -5
c: +7
d: 42
e: 9007199254740993
'''

[[case]]
id = "yq-scalar-int-big"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
a: 100000000000000000000
b: -99999999999999999999999
'''

[[case]]
id = "yq-scalar-int-legacy-octal"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "yaml11", "number"]
[case.files]
"s.yaml" = '''
a: 012
b: 0755
'''

[[case]]
id = "yq-scalar-int-08"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "python-quirk"]
[case.files]
"s.yaml" = '''
a: 08
'''

[[case]]
id = "yq-scalar-int-octal-12"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
a: 0o12
b: 0o755
'''

[[case]]
id = "yq-scalar-int-hex"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
a: 0x1F
b: 0xff
c: -0x10
'''

[[case]]
id = "yq-scalar-int-binary"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "yaml11", "number"]
[case.files]
"s.yaml" = '''
a: 0b101
'''

[[case]]
id = "yq-scalar-int-underscore"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "yaml11"]
[case.files]
"s.yaml" = '''
