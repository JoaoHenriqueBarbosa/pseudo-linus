b: '012'
c: "1.0"
d: "null"
e: ''
f: "true"
'''

[[case]]
id = "yq-scalar-explicit-tags"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "tag"]
[case.files]
"s.yaml" = '''
a: !!str 123
b: !!float 1
c: !!int "5"
d: !!bool "true"
e: !!null ""
'''

[[case]]
id = "yq-scalar-plain-strings"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "string"]
[case.files]
"s.yaml" = '''
a: hello world
b: 1.2.3
c: 0x
d: 12abc
e: a-b
f: a:b
g: http://example.com/x?y=1#z
h: v1.27
'''

[[case]]
id = "yq-scalar-number-arith"
argv = ["yq", "-c", "[.a + 1, .b * 2, .c / 4, .d - 0.5]", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
a: 1.0
b: 1e3
c: 10
d: 0.1
'''
