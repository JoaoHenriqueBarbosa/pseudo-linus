b: 1_000.5
'''

[[case]]
id = "yq-scalar-sexagesimal"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "yaml11"]
[case.files]
"s.yaml" = '''
a: 1:20
b: 190:20:30
c: 22:00
'''

[[case]]
id = "yq-scalar-float-forms"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
a: 1.0
b: 1.5
c: -0.5
d: 0.1
e: 3.14159265358979
f: 2.50
'''

[[case]]
id = "yq-scalar-float-dotless"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
