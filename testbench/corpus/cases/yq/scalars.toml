b: 1E-2
c: .5
d: 1.
e: 6.02e23
'''

[[case]]
id = "yq-scalar-float-extreme"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
a: 1e16
b: 1.0e+20
c: 0.00001
d: 1.5e-7
e: 123456789.123456789
'''

[[case]]
id = "yq-scalar-inf-nan"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "number"]
[case.files]
"s.yaml" = '''
