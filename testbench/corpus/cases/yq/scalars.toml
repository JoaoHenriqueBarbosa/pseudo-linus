'''

[[case]]
id = "yq-scalar-dates"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "yaml11"]
[case.files]
"s.yaml" = '''
a: 2026-01-15
b: 2026-01-15T10:00:00Z
c: 2026-01-15 10:00:00
d: 2026-01-15t10:00:00.5+03:00
'''

[[case]]
id = "yq-scalar-quoted"
argv = ["yq", "-c", ".", "s.yaml"]
tags = ["scalar", "string"]
[case.files]
"s.yaml" = '''
