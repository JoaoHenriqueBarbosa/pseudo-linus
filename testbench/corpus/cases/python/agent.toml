[[case]]
id = "rest-api-client"
script = '''
cat > /tmp/api.py <<'PY'
import http.server, json, urllib.parse
DB = {1: {'id': 1, 'nome': 'ana', 'tags': ['a']}, 2: {'id': 2, 'nome': 'bia', 'tags': []}}
class H(http.server.BaseHTTPRequestHandler):
    protocol_version = 'HTTP/1.1'
    def log_message(self, *a): pass
    def _json(self, code, obj, extra=()):
        b = json.dumps(obj, ensure_ascii=False).encode()
        self.send_response(code); self.send_header('Content-Type', 'application/json; charset=utf-8')
        for k, v in extra: self.send_header(k, v)
        self.send_header('Content-Length', str(len(b))); self.end_headers(); self.wfile.write(b)
    def _auth(self):
        if self.headers.get('Authorization') != 'Bearer s3cr3t':
            self._json(401, {'erro': 'sem token'}, [('WWW-Authenticate', 'Bearer')]); return False
        return True
    def do_GET(self):
        u = urllib.parse.urlsplit(self.path); q = urllib.parse.parse_qs(u.query)
        if u.path == '/users':
            if not self._auth(): return
            items = sorted(DB.values(), key=lambda d: d['id'])
            if 'nome' in q: items = [i for i in items if i['nome'].startswith(q['nome'][0])]
            page = int(q.get('page', ['1'])[0])
            return self._json(200, {'items': items[(page-1)*1:page*1], 'total': len(items), 'next': page + 1 if page < len(items) else None})
        if u.path.startswith('/users/'):
            uid = int(u.path.rsplit('/', 1)[1])
            if uid in DB: return self._json(200, DB[uid])
            return self._json(404, {'erro': 'nao existe', 'id': uid})
        if u.path == '/slow':
            import time; time.sleep(3); return self._json(200, {})
        return self._json(404, {'erro': 'rota'})
    def do_POST(self):
        n = int(self.headers.get('Content-Length', 0)); raw = self.rfile.read(n)
        try: body = json.loads(raw)
        except ValueError as e: return self._json(400, {'erro': str(e)})
        nid = max(DB) + 1; DB[nid] = {'id': nid, **body}
        return self._json(201, DB[nid], [('Location', f'/users/{nid}')])
    def do_DELETE(self):
        uid = int(self.path.rsplit('/', 1)[1]); DB.pop(uid, None)
        self.send_response(204); self.end_headers()
http.server.ThreadingHTTPServer(('127.0.0.1', 8088), H).serve_forever()
PY
