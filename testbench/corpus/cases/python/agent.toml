[[case]]
id = "tcp-two-processes"
script = '''
cd /tmp
cat > srv.py <<'EOF'
import socket, os, sys
s = socket.socket(); s.bind(('127.0.0.1', 0)); s.listen()
open('/tmp/port', 'w').write(str(s.getsockname()[1]))
for _ in range(2):
    c, a = s.accept()
    data = b''
    while chunk := c.recv(7):
        data += chunk
    c.sendall(data.upper() * 3)
    c.close()
print('srv ok', a[0], file=sys.stderr)
EOF
cat > cli.py <<'EOF'
import socket, time, os
while not os.path.exists('/tmp/port') or not open('/tmp/port').read(): time.sleep(0.05)
port = int(open('/tmp/port').read())
for msg in (b'hello world', b'x' * 100000):
    c = socket.create_connection(('127.0.0.1', port))
    same = c.getpeername()[1] == port
    c.sendall(msg); c.shutdown(socket.SHUT_WR)
    got = b''
    while chunk := c.recv(65536):
        got += chunk
    print(len(got), got[:11], same)
    c.close()
try:
    socket.create_connection(('127.0.0.1', 1))
except ConnectionRefusedError as e:
    print('recusada', e.errno)
EOF
rm -f /tmp/port
python3 srv.py &
python3 cli.py
wait
echo fim
'''
tags = ["agent", "net"]

[[case]]
id = "asyncio-two-processes"
script = '''
cd /tmp
cat > asrv.py <<'EOF'
import asyncio
async def handle(r, w):
    while line := await r.readline():
        w.write(b'eco: ' + line.upper())
        await w.drain()
    w.close()
async def main():
    srv = await asyncio.start_server(handle, '127.0.0.1', 8765)
    async with srv:
        await asyncio.sleep(3)
asyncio.run(main())
EOF
cat > acli.py <<'EOF'
import asyncio
async def one(i):
    r, w = await asyncio.open_connection('127.0.0.1', 8765)
    for word in ('um', 'dois'):
        w.write(f'{word} {i}\n'.encode()); await w.drain()
        print((await r.readline()).decode().strip())
    w.close(); await w.wait_closed()
async def main():
    for _ in range(50):
        try:
            await one(0); break
        except ConnectionRefusedError:
            await asyncio.sleep(0.05)
    await asyncio.gather(one(1), one(2))
asyncio.run(main())
EOF
python3 asrv.py &
python3 acli.py | sort
wait
echo fim
'''
tags = ["agent", "net"]

[[case]]
id = "crawler-local-site"
script = '''
set -e
mkdir -p /tmp/www/blog && cd /tmp/www
cat > index.html <<'EOF'
<!doctype html><html><head><title>Início &amp; mais</title><meta charset="utf-8"></head>
<body><h1>Olá</h1><a href="/blog/a.html">A</a> <a href="blog/b.html">B</a> <a href="https://x.org">ext</a>
<img src="logo.png" alt="logo"></body></html>
EOF
echo '<html><head><title>Post A</title></head><body><p>texto <b>forte</b></p><a href="/">home</a></body></html>' > blog/a.html
echo '<html><head><title>Post B</title></head><body><a href="/nada.html">quebrado</a></body></html>' > blog/b.html
python3 -m http.server 8181 --bind 127.0.0.1 -d /tmp/www >/tmp/www.log 2>&1 &
cat > /tmp/crawl.py <<'EOF'
import json, urllib.request, urllib.error, urllib.parse, time
from html.parser import HTMLParser
class P(HTMLParser):
    def __init__(s):
        super().__init__(); s.links = []; s.title = ''; s._t = False
    def handle_starttag(s, tag, attrs):
        a = dict(attrs)
        if tag == 'a': s.links.append(a['href'])
        if tag == 'title': s._t = True
    def handle_endtag(s, tag):
        if tag == 'title': s._t = False
    def handle_data(s, d):
        if s._t: s.title += d
base = 'http://127.0.0.1:8181/'
for _ in range(100):
    try: urllib.request.urlopen(base).close(); break
    except urllib.error.URLError: time.sleep(0.05)
seen, queue, report = set(), [base], {}
while queue:
    url = queue.pop(0)
    if url in seen: continue
    seen.add(url)
    try:
        with urllib.request.urlopen(url) as r:
            p = P(); p.feed(r.read().decode());
            report[urllib.parse.urlparse(url).path] = {'status': r.status, 'title': p.title, 'type': r.headers.get_content_type()}
            for h in p.links:
                full = urllib.parse.urljoin(url, h)
                if full.startswith(base): queue.append(full)
    except urllib.error.HTTPError as e:
        report[urllib.parse.urlparse(url).path] = {'status': e.code}
print(json.dumps(report, indent=1, sort_keys=True, ensure_ascii=False))
EOF
python3 /tmp/crawl.py
kill %1; wait || true
grep -c 'GET' /tmp/www.log
'''
tags = ["agent", "net"]
