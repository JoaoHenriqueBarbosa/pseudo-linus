tool = "python3"
source = "manual"

# Cenários de uso de agente que dependem do sistema de arquivos, de fusos (/usr/share/zoneinfo) ou de
# vários processos (servidor em segundo plano mais cliente): ficam aqui, no kernel real, e não nos testes de
# unidade do interpretador.

[[case]]
id = "fs-shutil-zip-tar"
script = '''
python3 - <<'PYEOF'
import os, shutil, zipfile, gzip, tarfile, pathlib, tempfile, hashlib, fnmatch, glob, io, stat, time

base = pathlib.Path(tempfile.mkdtemp(prefix='proj_'))
src = base / 'src'
(src / 'pkg' / 'sub').mkdir(parents=True)
for i, name in enumerate(['a.py', 'b.txt', 'pkg/c.py', 'pkg/sub/d.md']):
    (src / name).write_text(f'arquivo {i}\n' * (i + 1), encoding='utf-8')
print(sorted(p.relative_to(src).as_posix() for p in src.rglob('*.py')))
print(sorted(os.path.relpath(p, src) for p in glob.glob(str(src / '**' / '*'), recursive=True)))
for root, dirs, files in sorted(os.walk(src)):
    dirs.sort()
    print(os.path.relpath(root, src), sorted(files))
dst = base / 'copia'
shutil.copytree(src, dst, ignore=shutil.ignore_patterns('*.md'))
print(sorted(str(p.relative_to(dst)) for p in dst.rglob('*') if p.is_file()))
arq = shutil.make_archive(str(base / 'pacote'), 'zip', root_dir=src)
with zipfile.ZipFile(arq) as z:
    print(sorted(z.namelist()), z.read('pkg/c.py').decode().count('\n'))
    info = z.getinfo('a.py'); print(info.file_size, info.compress_type in (0, 8))
with zipfile.ZipFile(base / 'm.zip', 'w', zipfile.ZIP_DEFLATED) as z:
    z.writestr('x/y.txt', 'olá ' * 100)
    z.write(src / 'b.txt', 'b.txt')
with zipfile.ZipFile(base / 'm.zip') as z:
    print(z.testzip(), [(i.filename, i.file_size) for i in z.infolist()])
    z.extractall(base / 'ext')
print((base / 'ext' / 'x' / 'y.txt').read_text()[:8])
gz = base / 'log.gz'
with gzip.open(gz, 'wt', encoding='utf-8') as f:
    f.write('linha\n' * 50)
with gzip.open(gz, 'rt') as f:
    print(sum(1 for _ in f), gzip.decompress(gz.read_bytes())[:6])
with tarfile.open(base / 't.tar.gz', 'w:gz') as t:
    t.add(src, arcname='src')
with tarfile.open(base / 't.tar.gz') as t:
    print(sorted(m.name for m in t.getmembers() if m.isfile()))
    print(t.extractfile('src/a.py').read())
h = hashlib.sha256()
with open(src / 'b.txt', 'rb') as f:
    for chunk in iter(lambda: f.read(4), b''):
        h.update(chunk)
print(h.hexdigest()[:16], hashlib.md5(b'x').hexdigest())
print(fnmatch.filter(['a.py', 'b.PY', 'c.txt'], '*.py'), fnmatch.fnmatch('B.PY', '*.py'))
st = os.stat(src / 'a.py'); print(stat.S_ISREG(st.st_mode), st.st_size, oct(st.st_mode & 0o777) != '')
os.chmod(src / 'a.py', 0o600); print(oct(os.stat(src / 'a.py').st_mode & 0o777))
os.rename(src / 'b.txt', src / 'b2.txt'); os.replace(src / 'b2.txt', src / 'b3.txt')
print(sorted(os.listdir(src)), os.path.splitext('x/y.tar.gz'), os.path.getsize(src / 'b3.txt'))
p = src / 'pkg' / 'c.py'
print(p.stem, p.suffix, p.parent.name, p.with_suffix('.bak').name, p.match('pkg/*.py'), p.exists())
print(shutil.disk_usage(base).total > 0, shutil.which('sh') is not None)
shutil.move(str(src / 'b3.txt'), str(dst / 'movido.txt'))
print((dst / 'movido.txt').exists(), not (src / 'b3.txt').exists())
shutil.rmtree(base)
print(base.exists())
PYEOF
'''
tags = ["agent"]

[[case]]
id = "dates-zones-decimal"
script = '''
python3 - <<'PYEOF'
from datetime import datetime, date, time, timedelta, timezone
from zoneinfo import ZoneInfo
from decimal import Decimal, ROUND_HALF_UP, getcontext, localcontext
import calendar, time as _t, email.utils, json

sp = ZoneInfo('America/Sao_Paulo'); ny = ZoneInfo('America/New_York'); utc = timezone.utc
t = datetime(2026, 3, 8, 6, 30, tzinfo=utc)
print(t.astimezone(sp), t.astimezone(ny), t.astimezone(ny).tzname(), t.astimezone(ny).dst())
print((datetime(2026, 11, 1, 12, tzinfo=ny) - datetime(2026, 10, 31, 12, tzinfo=ny)), datetime(2026, 11, 1, 1, 30, fold=1, tzinfo=ny).utcoffset())
d = date(2026, 10, 6)
print(d.isocalendar(), d.strftime('%A %d/%m/%Y %j %U'), d + timedelta(weeks=3), d.replace(day=31) if False else d.toordinal())
print(calendar.monthrange(2026, 2), calendar.isleap(2028), calendar.month(2026, 10).splitlines()[0].strip())
print(datetime.fromisoformat('2026-10-06T14:05:09.123+03:00').astimezone(utc).isoformat(timespec='milliseconds'))
print(datetime.strptime('06/10/2026 23:59', '%d/%m/%Y %H:%M') + timedelta(minutes=2))
print(timedelta(days=1, seconds=3725, microseconds=5), timedelta(hours=-1).total_seconds(), abs(timedelta(days=-2)) // timedelta(hours=5))
print(email.utils.format_datetime(t), email.utils.parsedate_to_datetime('Tue, 06 Oct 2026 10:00:00 -0300').isoformat())
print(datetime(2026, 1, 1, tzinfo=utc).timestamp(), datetime.fromtimestamp(0, utc), _t.strftime('%Y', _t.gmtime(86400 * 365)))
precos = [Decimal('19.90'), Decimal('5.05'), Decimal('0.333')]
tot = sum(precos); print(tot, tot.quantize(Decimal('0.01'), ROUND_HALF_UP), (tot * Decimal('1.075')).quantize(Decimal('.01')))
with localcontext() as ctx:
    ctx.prec = 5; print(Decimal(1) / Decimal(7), Decimal('2').sqrt())
print(getcontext().prec, Decimal('1e3').normalize(), Decimal('-0.00').is_signed(), f"{Decimal('1234567.891'):,.2f}", Decimal(0.1))
print(round(Decimal('2.675'), 2), Decimal('10') % Decimal('3'), divmod(Decimal(-7), Decimal(2)), Decimal('NaN').is_nan())
print(json.dumps({'quando': t.isoformat(), 'valor': str(tot)}), sorted([date(2026, 1, 2), date(2025, 12, 31)])[0])
print(time(23, 59, 59, 999999).isoformat(), (datetime.combine(d, time(8)) - datetime.combine(d, time(17, 30))).days)
PYEOF
'''
