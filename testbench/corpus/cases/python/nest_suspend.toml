import threading

def run(action):
    ready = threading.Event()
    gate = threading.Event()
    log = []

    def inner():
        try:
            yield 1
        except ValueError as e:
            log.append(("inner caught", str(e)))
            ready.set()
            gate.wait()
            yield 2
        finally:
            log.append("inner finally")

    def outer():
        try:
            yield from inner()
        finally:
            log.append("outer finally")

    def worker():
        g = outer()
        next(g)
        log.append(action(g))

    t = threading.Thread(target=worker)
    t.start()
    ready.wait()
    log.append("main")
    gate.set()
    t.join()
    return log

print(run(lambda g: g.throw(ValueError("boom"))))
PYEOF
'''
