python3 - <<'PYEOF'
import os

def reap(code):
    pid = os.fork()
    if pid == 0:
        os._exit(code)
    return os.WEXITSTATUS(os.waitpid(pid, 0)[1])

class Counter:
    def __init__(self, n):
        self.n = n
        self.i = 0

    def __iter__(self):
        return self

    def __next__(self):
        if self.i >= self.n:
            raise StopIteration
        self.i += 1
        return reap(self.i)

print(sum(Counter(3)))
print(list(Counter(2)))
print(max(Counter(3)), min(Counter(3)))
print(sorted(Counter(3), key=lambda x: reap(10 - x)))
print(list(map(str, Counter(2))))
print(dict(zip("ab", Counter(2))))
print(list(enumerate(Counter(2))))
print(any(v == 2 for v in Counter(3)), all(Counter(2)))

class Legacy:
    def __getitem__(self, i):
        if i >= 3:
            raise IndexError(i)
        return reap(i + 1)

print(list(Legacy()))
print(sum(Legacy()), max(Legacy()))
print(list(enumerate(Legacy())))
print(tuple(zip(Legacy(), "xyz")))

class Fresh:
    def __iter__(self):
        reap(9)
        return Counter(2)

print(list(Fresh()))
print(tuple(Fresh()), sorted(Fresh()))
print(set(Fresh()) == {1, 2})
PYEOF
