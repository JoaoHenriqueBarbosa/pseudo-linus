# `os.fork` e a troca de thread dentro de construções que a VM já resolve sem recursão Rust
# (wip/notes/python-fork.md, fatias G; wip/notes/python-threads.md): gerador retomado pelo `for`, por
# `next()`, por `send()` e por `yield from`, e `contextlib.contextmanager` (`__enter__` e `__exit__` sem
# exceção chamam `next(self.gen)`). Nada não determinístico aparece na saída: pids e tempos nunca são
# impressos, a ordem é fixada por `waitpid` (fork) e por `Event` (threads).

[[case]]
id = "nest-fork-generator-for-next"
script = '''
python3 - <<'PYEOF'
import os

def reap(code):
    pid = os.fork()
    if pid == 0:
        os._exit(code)
    return os.WEXITSTATUS(os.waitpid(pid, 0)[1])

def codes(n):
    for i in range(n):
        yield reap(i + 1)

for value in codes(3):
    print("for", value)
print([v for v in codes(2)])
g = codes(2)
print(next(g), next(g), next(g, "end"))
try:
    next(g)
except StopIteration as e:
    print("stop", e.value)
PYEOF
'''
