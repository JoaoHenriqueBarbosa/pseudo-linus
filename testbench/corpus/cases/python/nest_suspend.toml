import contextlib, os

def reap(code):
    pid = os.fork()
    if pid == 0:
        os._exit(code)
    return os.WEXITSTATUS(os.waitpid(pid, 0)[1])

@contextlib.contextmanager
def swallow():
    try:
        yield "res"
    except ValueError as e:
        print("swallowed", e, reap(4))

@contextlib.contextmanager
def cleanup():
    try:
        yield
    finally:
        print("cleanup", reap(6))

with swallow() as r:
    print("body", r)
    raise ValueError("x")
print("after swallow")
try:
    with cleanup():
        raise KeyError("y")
except KeyError as e:
    print("propagated", e)
