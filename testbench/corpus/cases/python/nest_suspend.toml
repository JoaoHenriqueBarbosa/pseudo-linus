import contextlib, threading

enter_gate = threading.Event()
exit_gate = threading.Event()
entered = threading.Event()
inside = threading.Event()
log = []

@contextlib.contextmanager
def managed():
    log.append("enter")
    entered.set()
    enter_gate.wait()
    try:
        yield "res"
    finally:
        log.append("exit-start")
        inside.set()
        exit_gate.wait()
        log.append("exit-end")

def worker():
    with managed() as r:
        log.append(("body", r))

t = threading.Thread(target=worker)
t.start()
entered.wait()
log.append("m0")
enter_gate.set()
inside.wait()
log.append("m1")
exit_gate.set()
t.join()
print(log)
