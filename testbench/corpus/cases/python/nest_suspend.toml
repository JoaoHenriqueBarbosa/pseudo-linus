    return out[0]

class Slow:
    def __init__(self, f, n):
        self.f = f
        self.n = n
        self.i = 0

    def __iter__(self):
        return self

    def __next__(self):
        if self.i >= self.n:
            raise StopIteration
        self.i += 1
        return self.f(self.i)

class Seq:
    def __init__(self, f):
        self.f = f

    def __getitem__(self, i):
        if i >= 3:
            raise IndexError(i)
        return self.f(i)

class Fresh:
    def __init__(self, f):
        self.f = f

    def __iter__(self):
        self.f(0)
        return iter([1, 2])

print(run(lambda f: sum(Slow(f, 3))))
print(run(lambda f: list(Slow(f, 2))))
print(run(lambda f: sorted(Slow(f, 3), key=lambda x: -x)))
print(run(lambda f: list(enumerate(Slow(f, 2)))))
print(run(lambda f: list(Seq(f))))
print(run(lambda f: max(Seq(f))))
print(run(lambda f: list(Fresh(f))))
PYEOF
'''
tags = ["threading", "dunder", "iterator", "nest"]

# Tratador de `signal.signal` e `atexit` (fatia G1): o tratador roda entre duas instruções, como quadro do laço,
# e `os.kill` para si mesmo o dispara logo depois da chamada. Nada não determinístico aparece na saída: pids
# nunca são impressos e a ordem é fixada por `waitpid` e por `Event`.

[[case]]
id = "nest-fork-in-signal-handler"
script = '''
python3 - <<'PYEOF'
import os, signal

log = []

def handler(signum, frame):
    log.append(signal.Signals(signum).name)
    pid = os.fork()
    if pid == 0:
        log.append("child in handler")
        return
    log.append("parent in handler")
    log.append(os.WEXITSTATUS(os.waitpid(pid, 0)[1]))

signal.signal(signal.SIGUSR1, handler)
os.kill(os.getpid(), signal.SIGUSR1)
if "child in handler" in log:
    print("child resumed the interrupted code", log, flush=True)
    os._exit(7)
print("parent resumed the interrupted code", log, flush=True)
PYEOF
'''
tags = ["fork", "signals", "nest"]

