script = '''
python3 - <<'PYEOF'
import os

def reap(code):
    pid = os.fork()
    if pid == 0:
        os._exit(code)
    return os.WEXITSTATUS(os.waitpid(pid, 0)[1])

def catcher():
    try:
        yield "ready"
    except ValueError as e:
        yield ("caught", str(e), reap(7))
    finally:
        print("catcher finally", reap(9))

g = catcher()
print(next(g))
print(g.throw(ValueError("boom")))
g.close()
print("closed")

def closer():
    try:
        yield 1
    finally:
        print("closer finally", reap(3))

c = closer()
next(c)
print(c.close())
try:
    next(c)
except StopIteration:
    print("done")

def stubborn():
    try:
        yield 1
    finally:
        yield reap(5)

s = stubborn()
next(s)
try:
    s.close()
except RuntimeError as e:
    print(e)

def passthrough():
    yield 1
    yield 2

p = passthrough()
next(p)
try:
    p.throw(KeyError("k"))
except KeyError as e:
    print("raised", e)
try:
    next(p)
except StopIteration:
    print("finished")
PYEOF
'''
