import os

def reap(code):
    pid = os.fork()
    if pid == 0:
        os._exit(code)
    return os.WEXITSTATUS(os.waitpid(pid, 0)[1])

def echo():
    got = yield "ready"
    while True:
        got = yield reap(got)

g = echo()
print(next(g))
print(g.send(4), g.send(5))
g.close()

def inner():
    yield reap(1)
    return reap(2)

def outer():
    result = yield from inner()
    yield result
    yield reap(3)

for v in outer():
    print("outer", v)

def returns():
    yield reap(6)
    return reap(7)

g = returns()
print(next(g))
try:
    next(g)
except StopIteration as e:
    print("returned", e.value)
