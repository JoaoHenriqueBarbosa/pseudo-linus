python3 - <<'PYEOF'
import os, contextlib

@contextlib.contextmanager
def child_runs(code):
    pid = os.fork()
    if pid == 0:
        os._exit(code)
    try:
        yield pid > 0
    finally:
        _, status = os.waitpid(pid, 0)
        print("reaped", os.WEXITSTATUS(status), flush=True)

with child_runs(9) as parent:
    print("inside", parent, flush=True)
print("after")
