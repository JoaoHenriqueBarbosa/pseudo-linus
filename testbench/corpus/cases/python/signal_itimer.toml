[[case]]
id = "signal-alarm-handler-exception-interrupts-sleep"
script = '''
python3 - <<'PYEOF'
import signal, time

class Timeout(Exception):
    pass

def handler(signum, frame):
    raise Timeout("tempo esgotado")

signal.signal(signal.SIGALRM, handler)
signal.setitimer(signal.ITIMER_REAL, 0.05)
start = time.monotonic()
try:
    time.sleep(30)
except Timeout as e:
    print("interrompido", e, time.monotonic() - start < 10)
print(signal.getitimer(signal.ITIMER_REAL))
PYEOF
'''
