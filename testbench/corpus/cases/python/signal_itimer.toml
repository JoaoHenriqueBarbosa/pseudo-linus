[[case]]
id = "signal-itimer-fork-clears-the-child-timers"
script = '''
python3 - <<'PYEOF'
import os, signal
signal.signal(signal.SIGALRM, lambda s, f: None)
signal.setitimer(signal.ITIMER_REAL, 100, 3)
signal.setitimer(signal.ITIMER_VIRTUAL, 100, 4)
signal.setitimer(signal.ITIMER_PROF, 100, 5)
pid = os.fork()
if pid == 0:
    print("child", [signal.getitimer(w) for w in (0, 1, 2)], signal.alarm(7))
    os._exit(0)
os.waitpid(pid, 0)
print("parent", [signal.getitimer(w)[0] > 98 for w in (0, 1, 2)], [signal.getitimer(w)[1] for w in (0, 1, 2)])
print(signal.alarm(0) >= 99)
PYEOF
'''
tags = ["signals", "itimer", "fork"]

