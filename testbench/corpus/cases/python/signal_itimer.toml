tool = "python3"
source = "manual"

# `signal.alarm`, `signal.setitimer` e `signal.getitimer` (CPython 3.13 sobre o `alarm(2)` e o `setitimer(2)` do
# kernel): constantes, o erro `ItimerError`, os valores devolvidos, a entrega do sinal, o intervalo, o fork, o
# efeito sobre `time.sleep` e os timers de CPU. Nada não determinístico aparece na saída: tempos nunca são
# impressos, só comparações largas entre eles.

[[case]]
id = "signal-itimer-constants-and-error"
script = '''
python3 - <<'PYEOF'
import signal
print(signal.ITIMER_REAL, signal.ITIMER_VIRTUAL, signal.ITIMER_PROF)
print(issubclass(signal.ItimerError, OSError), signal.ItimerError.__name__, signal.ItimerError.__module__)
print(signal.ItimerError is signal.ItimerError, signal.ItimerError.__mro__[1].__name__)
print(callable(signal.alarm), callable(signal.setitimer), callable(signal.getitimer))
PYEOF
'''
tags = ["signals", "itimer"]

