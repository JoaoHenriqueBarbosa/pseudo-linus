[[case]]
id = "signal-alarm-default-action-kills-the-process"
script = '''
python3 - <<'PYEOF'
import os, signal, time
pid = os.fork()
if pid == 0:
    signal.setitimer(signal.ITIMER_REAL, 0.05)
    time.sleep(30)
    os._exit(0)
_, status = os.waitpid(pid, 0)
print(os.WIFSIGNALED(status), os.WTERMSIG(status) == signal.SIGALRM, signal.strsignal(os.WTERMSIG(status)))
PYEOF
