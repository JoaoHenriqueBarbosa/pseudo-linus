[[case]]
id = "signal-setitimer-interval-repeats-until-cancelled"
script = '''
python3 - <<'PYEOF'
import signal, time
got = []
signal.signal(signal.SIGALRM, lambda s, f: got.append(s))
signal.setitimer(signal.ITIMER_REAL, 0.02, 0.02)
deadline = time.monotonic() + 10
while len(got) < 4 and time.monotonic() < deadline:
    time.sleep(0.01)
print(len(got) >= 4)
print(signal.getitimer(signal.ITIMER_REAL)[1])
old = signal.alarm(0)
print(old in (0, 1), signal.getitimer(signal.ITIMER_REAL))
time.sleep(0.1)
count = len(got)
time.sleep(0.2)
print(len(got) == count)
PYEOF
'''
tags = ["signals", "itimer"]

