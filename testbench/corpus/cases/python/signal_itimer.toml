[[case]]
id = "signal-alarm-delivers-to-the-handler"
script = '''
python3 - <<'PYEOF'
import signal, time
got = []
signal.signal(signal.SIGALRM, lambda s, f: got.append(s))
signal.setitimer(signal.ITIMER_REAL, 0.05)
