[[case]]
id = "signal-itimer-cpu-timers-fire-on-cpu-time"
script = '''
python3 - <<'PYEOF'
import signal, time
got = []
signal.signal(signal.SIGVTALRM, lambda s, f: got.append("virtual"))
signal.signal(signal.SIGPROF, lambda s, f: got.append("prof"))
for which, name in ((signal.ITIMER_VIRTUAL, "virtual"), (signal.ITIMER_PROF, "prof")):
    signal.setitimer(which, 0.05)
    deadline = time.monotonic() + 30
    n = 0
    while name not in got and time.monotonic() < deadline:
        n += 1
    print(name, name in got, signal.getitimer(which))
# O processo parado em `sleep` não gasta CPU: o timer de CPU não vence.
signal.setitimer(signal.ITIMER_VIRTUAL, 0.05)
got.clear()
time.sleep(0.4)
print(got)
signal.setitimer(signal.ITIMER_VIRTUAL, 0)
PYEOF
'''
tags = ["signals", "itimer", "cpu"]

