# `dir_fd`, `src_dir_fd`/`dst_dir_fd` e caminho como descritor (as chamadas `*at`) e os conjuntos `supports_*`.
[[case]]
id = "os-dir-fd-supports"
script = '''
cd /tmp; mkdir -p dd/sub; echo hi > dd/f; ln -sf f dd/l
python3 - <<'P'
import os
fd = os.open('dd', os.O_RDONLY | os.O_DIRECTORY)
print(sorted(os.listdir(fd)), sorted(e.name for e in os.scandir(fd)), [e.path for e in os.scandir(fd) if e.name == 'f'])
print(os.stat('f', dir_fd=fd).st_size, os.stat(fd).st_mode & 0o170000 == 0o040000, os.lstat('l', dir_fd=fd).st_mode & 0o170000 == 0o120000)
print(os.readlink('l', dir_fd=fd), os.access('f', os.R_OK, dir_fd=fd))
os.mkdir('n', dir_fd=fd); os.symlink('n', 'ln', dir_fd=fd); os.rename('f', 'g', src_dir_fd=fd, dst_dir_fd=fd)
os.chmod('g', 0o600, dir_fd=fd); os.utime('g', (1, 2), dir_fd=fd); print(oct(os.stat('dd/g').st_mode), os.stat('dd/g').st_mtime)
x = os.open('new', os.O_CREAT | os.O_WRONLY, 0o644, dir_fd=fd); os.write(x, b'z'); os.close(x)
os.unlink('ln', dir_fd=fd); os.rmdir('n', dir_fd=fd); print(sorted(os.listdir('dd')))
try: os.stat('nope', dir_fd=fd)
except OSError as e: print(e)
try: os.mkdir('q', dir_fd=-5)
except OSError as e: print(e)
for n in ('supports_dir_fd', 'supports_fd', 'supports_effective_ids', 'supports_follow_symlinks'):
    print(n, sorted(f.__name__ for f in getattr(os, n)))
P
'''

# `link` (com `filename2` no erro), `mkfifo`, `mknod` e `major`/`minor`/`makedev`.
