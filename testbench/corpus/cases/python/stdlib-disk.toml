tool = "python3"
source = "manual"

# Módulos da stdlib que dependem de outros lidos do disco (o `sysconfig` real do CPython): o
# `help()` do pydoc e a contagem de linhas do `trace`.

[[case]]
id = "pydoc-help-user-functions-classes"
script = '''
python3 - <<'PYEOF'
import collections
def f(a, b=2, *c, d=1, **e):
    """Soma a e b."""
    return a + b

class Animal:
    """Um bicho."""
    kind = 'x'
    def __init__(self, name):
        """Cria."""
        self.name = name
    def speak(self, loud=False):
        """Fala."""
        return self.name
    @property
    def upper(self):
        """Nome em caixa alta."""
        return self.name.upper()
    @classmethod
    def make(cls):
        """Fábrica."""
        return cls('a')

class Dog(Animal):
    """Cachorro."""
    def speak(self, loud=True):
        return 'au'

help(f)
help(Animal)
help(Dog)
help(Dog.speak)
help(Dog('r').speak)
PYEOF
'''

[[case]]
id = "trace-counts-lines"
script = '''
python3 - <<'PYEOF'
import trace
import sys
BASE = sys._getframe().f_lineno
def f(n):
    s = 0
    for i in range(n):
        s += i
    return s
def g():
    return f(3) + f(2)
t = trace.Trace(count=1, trace=0)
t.runfunc(g)
counts = {(k[1] - BASE): v for k, v in t.results().counts.items()}
print(sorted(counts.items()))
PYEOF
'''

