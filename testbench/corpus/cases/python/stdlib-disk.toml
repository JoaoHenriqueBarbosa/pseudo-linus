# `unittest.mock` importa o `pkgutil` real do disco (que usa o `FileFinder` e o `sys.path_hooks`).
[[case]]
id = "unittest-mock-live-dict"
script = '''
python3 - <<'PYEOF'
from unittest import mock


class A:
    def __init__(self):
        self.x = 1


a = A()
d = a.__dict__
d['y'] = 2
print(a.y, sorted(a.__dict__))
a.z = 3
print(sorted(d))
del d['x']
print(hasattr(a, 'x'), sorted(vars(a)))
del a.y
print(sorted(d))

m = mock.Mock(return_value=3)
print(m(1, k=2), m.call_count, m.call_args)
m.foo.bar.return_value = 'ok'
print(m.foo.bar())
with mock.patch('os.getcwd', return_value='/x'):
    import os
    print(os.getcwd())
mm = mock.MagicMock()
mm.__len__.return_value = 5
print(len(mm))
class Svc:
    def greet(self): return 'x'
m = mock.Mock(side_effect=lambda k: k * 2); print(m(4))
mm = mock.MagicMock(); mm.__getitem__.side_effect = lambda k: k + 1; print(mm[1])
a = mock.create_autospec(Svc, instance=True); a.greet.return_value = 'ok'; print(a.greet())
try: a.nope
except AttributeError: print('sem nope')
f = lambda: 3; print(f.__call__(), issubclass(type(Svc), object), issubclass(type, (int, type)), issubclass(type(Svc), Svc))
PYEOF
'''

# O `pkgutil` real: `FileFinder` por `sys.path_hooks`, módulos de um pacote, dados e nomes.
[[case]]
id = "pkgutil-file-finder"
script = '''
python3 - <<'PYEOF'
import sys, pkgutil, json, email, importlib.machinery, inspect, _imp
print(sys.path_hooks[0], sys.path_hooks[1].__qualname__)
print(pkgutil.get_importer('/usr/lib/python3.13'), pkgutil.get_importer('/etc/hostname'))
print(sorted(m.name for m in pkgutil.iter_modules(json.__path__)))
print(pkgutil.get_data('email', 'architecture.rst')[:40])
print(pkgutil.resolve_name('os.path:join').__name__)
print([m.name for m in pkgutil.walk_packages(email.__path__, 'email.')][:6])
f = importlib.machinery.FileFinder('/usr/lib/python3.13', (importlib.machinery.SourceFileLoader, ['.py']))
print(f.find_spec('json').submodule_search_locations, f.find_spec('glob').origin, f.find_spec('nope'))
print(inspect.getmodulename('/a/b/x.cpython-313-x86_64-linux-gnu.so'), inspect.getmodulename('y.py'), inspect.getmodulename('z.txt'))
print(_imp.is_builtin('sys'), _imp.is_builtin('_imp'), _imp.is_frozen('os'), _imp.lock_held(), _imp.extension_suffixes())
e = ImportError('m', name='n', path='p'); print(e.name, e.path, repr(e))
try: ImportError(foo=1)
except TypeError as e: print(e)
PYEOF
'''

# `site` real no startup (`.pth` de um venv), `stat` do disco, `\N{}` e finder em `sys.meta_path`.
[[case]]
id = "site-pth-meta-path-named-escape"
script = '''
cd /tmp && python3 -m venv --without-pip v && echo 'import sys; sys.pth_ran = 1' > v/lib/python3.13/site-packages/x.pth
v/bin/python -c 'import sys, site, stat; print(sys.pth_ran, site.__spec__.origin, stat.UF_HIDDEN, stat.filemode(0o100644))'
python3 -c 'print("\N{LATIN SMALL LETTER A WITH ACUTE}", ascii("\N{EM DASH}"))'
python3 -c 'print("é\N{NOPE}")'; python3 -c 'print("\N{abc")'
python3 - <<'PYEOF'
import sys, importlib, importlib.abc, importlib.util
class L(importlib.abc.Loader):
    def create_module(self, spec): return None
    def exec_module(self, mod): mod.x = 42
class F:
    def find_spec(self, name, path, target=None):
        if name.startswith("magic"):
            return importlib.util.spec_from_loader(name, L())
sys.meta_path.insert(0, F())
print(importlib.import_module("magic1").x, __import__("magic2").x)
import magic3; print(magic3.x)
PYEOF
'''

# `importlib.machinery` só reexporta o `_frozen_importlib` e o `_frozen_importlib_external`, e um
# pacote achado pelo `PathFinder` dentro de um finder do programa ganha `__path__`, `__file__` e
# `__cached__` (o caminho do `__pip-runner__.py` do pip).
[[case]]
id = "importlib-machinery-reexports-meta-path-package"
script = '''
mkdir -p /tmp/r/pk && echo 'X = 1' > /tmp/r/pk/__init__.py && echo 'print("main", __name__, __package__)' > /tmp/r/pk/__main__.py
python3 - <<'PYEOF'
import sys, runpy, importlib.machinery as m
print([n for n in dir(m) if not n.startswith('__')])
for n in ('ModuleSpec', 'FrozenImporter', 'PathFinder', 'SourceFileLoader', 'NamespaceLoader', 'WindowsRegistryFinder'):
    print(n, getattr(m, n).__module__)
print(m.all_suffixes(), m.all_suffixes.__doc__)
class F:
    @classmethod
    def find_spec(cls, fullname, path=None, target=None):
        if fullname == 'pk':
            return m.PathFinder.find_spec(fullname, ['/tmp/r'], target)
sys.meta_path.insert(0, F)
import pk
print(pk.__path__, pk.__file__, pk.__cached__, pk.__package__, pk.__spec__.parent, pk.__spec__.has_location)
runpy.run_module('pk', run_name='__main__')
PYEOF
'''

# `sys.path`: entradas do `PYTHONPATH` (absolutizadas, a vazia vira o cwd) antes do stdlib, fora com
# -E e -I; o `path[0]` entra depois do `site` (o '' do -c não vira o cwd) e some com -P.
[[case]]
id = "sys-path-pythonpath-path0"
script = '''
cd /tmp; mkdir -p d bt; echo 'Z=3' > bt/sy.py; echo 'import sys; print(sys.path[:3])' > d/s.py
python3 -c 'import sys; print(sys.path)'
PYTHONPATH=/tmp/bt:rel::/x python3 -c 'import sys, sy; print(sys.path[:6], sy.Z)'
PYTHONPATH=/tmp/bt python3 -E -c 'import sys; print(sys.path[:2])'
PYTHONPATH=/tmp/bt python3 -I -c 'import sys; print(sys.path[:2])'
PYTHONPATH=/tmp/bt python3 -P -c 'import sys; print(sys.path[:2])'
PYTHONPATH=bt python3 d/s.py
python3 -P d/s.py
cd d; python3 -c 'import sys; print(sys.path[0]=="")'; echo 'import sys; print(sys.path[0])' > m.py; python3 -m m; python3 -P -m m
'''
