tool = "python3"
source = "manual"

# Linha de comando do CPython 3.13.5 (fatia 1 de docs/python3-port.md): versão, ajuda e erro de uso.

[[case]]
id = "python-version"
argv = ["python3", "-V"]
tags = ["cli"]

[[case]]
id = "python-version-long"
argv = ["python3", "--version"]
tags = ["cli"]

[[case]]
id = "python-help"
argv = ["python3", "-h"]
tags = ["cli"]

[[case]]
id = "python-unknown-option"
argv = ["python3", "-z"]
tags = ["cli", "error"]

[[case]]
id = "python-unknown-long-option"
argv = ["python3", "--nope"]
tags = ["cli", "error"]

[[case]]
id = "python-c-missing-argument"
argv = ["python3", "-c"]
tags = ["cli", "error"]

# Leitor do pipe já fechado: `flush` levanta `BrokenPipeError`, o fim avisa e sai com 120.
[[case]]
id = "stdout-broken-pipe"
script = '''
python3 -c 'import time, sys
print(1); sys.stdout.flush(); time.sleep(0.5)
try:
    print(2); sys.stdout.flush()
except BrokenPipeError as e:
    sys.stderr.write("BPE %r\n" % (e,))
' | head -1
echo "rc=${PIPESTATUS[0]}"
python3 -c 'import time; print(1, flush=True); time.sleep(0.5); print(2)' | head -1; echo "rc=${PIPESTATUS[0]}"
python3 -m pip show pip 2>&1 | head -2
'''
tags = ["io", "error"]
