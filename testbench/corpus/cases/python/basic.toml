tool = "python3"
source = "manual"

# Linha de comando do CPython 3.13.5 (fatia 1 de docs/python3-port.md): versão, ajuda e erro de uso.

[[case]]
id = "python-version"
argv = ["python3", "-V"]
tags = ["cli"]

[[case]]
id = "python-version-long"
argv = ["python3", "--version"]
tags = ["cli"]

[[case]]
id = "python-help"
argv = ["python3", "-h"]
tags = ["cli"]

[[case]]
id = "python-unknown-option"
argv = ["python3", "-z"]
tags = ["cli", "error"]

[[case]]
id = "python-unknown-long-option"
argv = ["python3", "--nope"]
tags = ["cli", "error"]

[[case]]
id = "python-c-missing-argument"
argv = ["python3", "-c"]
tags = ["cli", "error"]

# Leitor do pipe já fechado: `flush` levanta `BrokenPipeError`, o fim avisa e sai com 120.
[[case]]
id = "stdout-broken-pipe"
script = '''
python3 -c 'import time, sys
print(1); sys.stdout.flush(); time.sleep(0.5)
try:
    print(2); sys.stdout.flush()
except BrokenPipeError as e:
    sys.stderr.write("BPE %r\n" % (e,))
' | head -1
echo "rc=${PIPESTATUS[0]}"
python3 -c 'import time; print(1, flush=True); time.sleep(0.5); print(2)' | head -1; echo "rc=${PIPESTATUS[0]}"
python3 -m pip show pip 2>&1 | head -2
'''
tags = ["io", "error"]

# Erro dentro de módulo que no CPython é C: sem quadro do shim no traceback, mensagens do C,
# e `islice` como classe que valida na criação.
[[case]]
id = "c-module-errors-and-islice"
script = '''
python3 -c 'import marshal; marshal.loads(b"\x00")'
python3 -c 'import sys; sys.setrecursionlimit("a")'
python3 -c 'import select; select.select(1, [], [])'
python3 -c 'import itertools; itertools.islice([], -1)'
python3 -c 'import time; time.sleep(-1)'
python3 -c 'import operator; operator.itemgetter()'
python3 - <<'PYEOF'
from itertools import islice, count
s = islice(range(10), 2, 8, 3)
print(type(s), list(s), list(s))
it = iter(range(10)); print(list(islice(it, 3)), next(it))
it = iter(range(10)); print(list(islice(it, 5, 3)), next(it))
print(list(islice(count(), 1, 30, 4)), list(islice(count(), 0, 20, 7)))
for a in [(1,), ([], 'x'), ([], 1, 2, 0), ([], None, None, None), ([], 1, 2, 3, 4)]:
    try: print(list(islice(*a)))
    except Exception as e: print(type(e).__name__, e)
try: islice([], 1, stop=2)
except TypeError as e: print(e)
print(islice.__name__, islice.__module__, isinstance(islice([], 1), islice))
PYEOF
'''
tags = ["error"]

# Traceback dentro de módulos da stdlib que rodam o fonte do disco, e `break`/`continue`/`return`
# saindo de um `except` sem deixar a exceção presa no `sys.exc_info()` nem no `__context__`.
[[case]]
id = "stdlib-disk-tracebacks-handler-exit"
script = '''
python3 -c 'import base64; base64.b64decode("a")'
python3 -c 'import ipaddress; ipaddress.ip_address("x")'
python3 -c 'import shlex; shlex.split("\"")'
python3 -c 'import string; string.Template("$").substitute()'
python3 -c 'import getopt; getopt.getopt(["-x"], "a")'
python3 -c 'import uuid; uuid.UUID("z")'
python3 -c 'import configparser; c = configparser.ConfigParser(); c.read_string("x")'
python3 -c 'import tarfile; tarfile.open("/etc/hostname")'
python3 -c 'import urllib.parse; urllib.parse.urlsplit("http://[::1")'
python3 -c 'import tempfile, os; f = tempfile.NamedTemporaryFile(delete=False, dir="/tmp", prefix="R", suffix=".t"); print(os.path.dirname(f.name), len(os.path.basename(f.name)), os.O_CLOEXEC, os.O_DIRECTORY)'
python3 - <<'PYEOF'
import sys
for i in range(2):
    try:
        raise KeyError(i)
    except KeyError:
        continue
print(sys.exc_info())
def f():
    for i in range(2):
        try:
            raise KeyError(i)
        except KeyError as e:
            break
    return sys.exc_info(), 'e' in dir()
print(f())
def g():
    try:
        raise KeyError(1)
    except KeyError:
        return sys.exc_info()[0]
print(g(), sys.exc_info())
try:
    1/0
except ZeroDivisionError as e:
    print(repr(e.__context__))
PYEOF
'''
tags = ["error"]
