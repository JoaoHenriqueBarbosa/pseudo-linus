# Leitor do pipe já fechado: `flush` levanta `BrokenPipeError`, o fim avisa e sai com 120.
[[case]]
id = "stdout-broken-pipe"
script = '''
python3 -c 'import time, sys
print(1); sys.stdout.flush(); time.sleep(0.5)
try:
    print(2); sys.stdout.flush()
except BrokenPipeError as e:
    sys.stderr.write("BPE %r\n" % (e,))
' | head -1
echo "rc=${PIPESTATUS[0]}"
python3 -c 'import time; print(1, flush=True); time.sleep(0.5); print(2)' | head -1; echo "rc=${PIPESTATUS[0]}"
python3 -m pip show pip 2>&1 | head -2
'''
tags = ["io", "error"]

# Erro dentro de módulo que no CPython é C: sem quadro do shim no traceback, mensagens do C,
# e `islice` como classe que valida na criação.
[[case]]
id = "c-module-errors-and-islice"
script = '''
python3 -c 'import marshal; marshal.loads(b"\x00")'
python3 -c 'import sys; sys.setrecursionlimit("a")'
python3 -c 'import select; select.select(1, [], [])'
python3 -c 'import itertools; itertools.islice([], -1)'
python3 -c 'import time; time.sleep(-1)'
python3 -c 'import operator; operator.itemgetter()'
python3 - <<'PYEOF'
from itertools import islice, count
s = islice(range(10), 2, 8, 3)
print(type(s), list(s), list(s))
it = iter(range(10)); print(list(islice(it, 3)), next(it))
it = iter(range(10)); print(list(islice(it, 5, 3)), next(it))
print(list(islice(count(), 1, 30, 4)), list(islice(count(), 0, 20, 7)))
for a in [(1,), ([], 'x'), ([], 1, 2, 0), ([], None, None, None), ([], 1, 2, 3, 4)]:
    try: print(list(islice(*a)))
    except Exception as e: print(type(e).__name__, e)
try: islice([], 1, stop=2)
except TypeError as e: print(e)
print(islice.__name__, islice.__module__, isinstance(islice([], 1), islice))
PYEOF
'''
tags = ["error"]

# Traceback dentro de módulos da stdlib que rodam o fonte do disco, e `break`/`continue`/`return`
# saindo de um `except` sem deixar a exceção presa no `sys.exc_info()` nem no `__context__`.
[[case]]
id = "stdlib-disk-tracebacks-handler-exit"
script = '''
python3 -c 'import base64; base64.b64decode("a")'
python3 -c 'import ipaddress; ipaddress.ip_address("x")'
python3 -c 'import shlex; shlex.split("\"")'
python3 -c 'import string; string.Template("$").substitute()'
python3 -c 'import getopt; getopt.getopt(["-x"], "a")'
python3 -c 'import uuid; uuid.UUID("z")'
python3 -c 'import configparser; c = configparser.ConfigParser(); c.read_string("x")'
python3 -c 'import tarfile; tarfile.open("/etc/hostname")'
python3 -c 'import urllib.parse; urllib.parse.urlsplit("http://[::1")'
python3 -c 'import tempfile, os; f = tempfile.NamedTemporaryFile(delete=False, dir="/tmp", prefix="R", suffix=".t"); print(os.path.dirname(f.name), len(os.path.basename(f.name)), os.O_CLOEXEC, os.O_DIRECTORY)'
python3 - <<'PYEOF'
import sys
for i in range(2):
    try:
        raise KeyError(i)
    except KeyError:
        continue
print(sys.exc_info())
def f():
    for i in range(2):
        try:
            raise KeyError(i)
        except KeyError as e:
            break
    return sys.exc_info(), 'e' in dir()
print(f())
def g():
    try:
        raise KeyError(1)
    except KeyError:
        return sys.exc_info()[0]
print(g(), sys.exc_info())
try:
    1/0
except ZeroDivisionError as e:
    print(repr(e.__context__))
PYEOF
'''
tags = ["error"]

[[case]]
id = "json-c-speedups"
script = '''
python3 - <<'PYEOF'
import json, _json, sys
from collections import OrderedDict
print(_json, repr(_json.__doc__), sorted(dir(_json)))
print(_json.make_encoder, _json.make_scanner, _json.scanstring, _json.encode_basestring)
print(_json.make_scanner.__doc__, '|', _json.make_encoder.__doc__)
print(sorted(set(dir(_json.make_scanner)) - set(dir(object))), sorted(set(dir(_json.make_encoder)) - set(dir(object))))
e = _json.make_encoder(None, str, json.encoder.encode_basestring, "  ", ":", ",", False, False, True)
print(e({"a": [1, {"b": 2}], "c": []}, 0), e({"x": {}}, 2), e.indent, e.markers, e.sort_keys)
s = _json.make_scanner(json.decoder.JSONDecoder())
print(type(s), s("[1, 2.5, \"x\", null, true, false, -3e2, 0.5E-1]", 0), s.strict, s.parse_int)
for bad in [lambda: s("x", 0), lambda: s(1, 0), lambda: s("x", -1), lambda: s("x"),
            lambda: _json.make_encoder([], None, None, None, ":", ",", 0, 0, 0),
            lambda: _json.make_encoder(None, None, None, None, 1, ",", 0, 0, 0),
            lambda: _json.scanstring("abc", 5), lambda: _json.scanstring("abc"), lambda: _json.encode_basestring(1)]:
    try: print(bad())
    except StopIteration as x: print('SI', x.value)
    except Exception as x: print(type(x).__name__, x)
for n in ('strict', 'foo'):
    try: setattr(s, n, 1)
    except AttributeError as x: print(x)
print(_json.scanstring("ab\\u00e9\\ud83d\\ude00\\ud800x\"zz", 0), _json.encode_basestring_ascii("é\n\"x\U0001f600"), _json.encode_basestring("é\n\x01"))
for bad in ["[1,]", "{\"a\" 1}", "[", "{", "\"abc", "\"\\x\"", "\"\\u12\"", "[1 2]", "{\"a\":1,}", "-", "1e", "\"\x01\"", "[1,", "{\"a\":", "nul", "[-]", "\"\\u12345\"", "\"\\u", "  "]:
    try: print(repr(bad), json.loads(bad))
    except json.JSONDecodeError as x: print(repr(bad), x)
print(json.loads("[1e5, 1E+2, -0, 10e-1, 123456789012345678901234567890, 1.5e1]"))
print(json.loads('{"a": NaN, "b": Infinity, "c": -Infinity}'))
print(json.loads('{"b": 1, "a": 2, "b": 3}'), json.loads('{"b": 1, "a": 2}', object_pairs_hook=OrderedDict))
print(json.loads('[1.5, 2]', parse_float=str, parse_int=lambda t: int(t) * 10), json.loads('{"k": 1}', object_hook=lambda d: sorted(d)))
print(json.loads('"\\ud800"').encode('utf-8', 'surrogatepass'), json.loads('"a\tb"', strict=False))
print(json.dumps({"a": [1, 2.5, None, True], "é": "x\ny"}), json.dumps({"é": 1}, ensure_ascii=False))
print(json.dumps({3: 1, 1.5: 2, True: 3, None: 4, "s": 5}), json.dumps({"b": 1, "a": {"d": 1, "c": 2}}, sort_keys=True, indent=2))
print(json.dumps([1, [2, [3]]], indent="\t"), json.dumps({"a": 1}, separators=(",", ":")))
print(json.dumps(OrderedDict([("z", 1), ("a", 2)])), json.dumps((1, 2)), json.dumps({(1,): 2}, skipkeys=True))
try: json.dumps({(1,): 2})
except TypeError as x: print(x)
try: json.dumps(float('nan'), allow_nan=False)
except ValueError as x: print(x)
try: json.dumps({1, 2})
except TypeError as x: print(x)
print(json.dumps({1, 2}, default=sorted))
a = []; a.append(a)
try: json.dumps(a)
except ValueError as x: print(x)
for n in (9998, 9999):
    try: json.loads("[" * n + "]" * n); print(n, "ok")
    except RecursionError as x: print(n, x)
for n in (9997, 9998):
    d = []
    for _ in range(n): d = [d]
    try: json.dumps(d); print(n, "ok")
    except RecursionError as x: print(n, x)
PYEOF
python3 -c 'import json; json.loads("[1, 2")'
python3 -c 'import json; json.loads("{\"a\": x}")'
python3 -c 'import json; json.dumps(object())'
python3 -c 'import _json_native'
echo '{"b": [1, 2], "a": "é"}' | python3 -m json.tool
'''
tags = ["error"]

[[case]]
id = "builtin-c-module-metadata"
script = '''
python3 - <<'PYEOF'
import marshal, time, select, zlib, gc, atexit, errno, _struct, math, binascii, unicodedata, _json
for m in (marshal, select, gc, errno, _json):
    print(m.__name__, [n for n in dir(m) if n.startswith('_') and not n.startswith('__')])
for m in (marshal, time, select, zlib, gc, atexit, _struct, math, binascii, unicodedata, _json):
    print(m, repr(m.__doc__)[:50], repr(m.__package__), m.__spec__, m.__loader__, hasattr(m, '__file__'))
leaks = [(marshal, '_Reader'), (marshal, 'struct'), (time, '_os'), (time, '_sys'), (zlib, '_zlib'),
         (select, '_socket'), (gc, '_enabled'), (atexit, '_exithandlers')]
