print(marshal.dumps.__doc__.splitlines()[0], marshal.loads.__qualname__, marshal.loads(marshal.dumps([1, "é", (2.5, None), {3: b"x"}])))
for stmt in ("from time import _os", "from select import _socket"):
    try: exec(stmt)
    except ImportError as e: print(e)
PYEOF
'''
