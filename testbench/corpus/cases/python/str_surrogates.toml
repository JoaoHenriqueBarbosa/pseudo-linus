tool = "python3"
source = "manual"

# Complemento de `surrogates.toml`: o que ainda não tinha caso. `print` de `str` com surrogate no
# stdout real (`UnicodeEncodeError`, `sys.stdout.errors`), as funções de baixo nível do módulo
# `codecs` (`utf_8_decode`, `utf_16_decode`, `utf_32_decode`, `*_ex_decode`, `*_encode`) com `final`,
# BOM e o tamanho consumido, e o plano 16 pelas mesmas portas (`chr`, `len`, `ord`, `encode`,
# `repr`, `sorted`). O golden vem do oráculo; nenhum script imprime um surrogate cru.

[[case]]
id = "strsur-print-stdout"
script = '''
python3 - <<'PYEOF'
import sys
print(sys.stdout.encoding, sys.stdout.errors, sys.stderr.errors, sys.getfilesystemencodeerrors())
for s in ['\ud800', 'a\udfffb', '\U0010d800', '\U0010ffff'.encode('utf-8', 'surrogatepass').hex()]:
    try:
        print(s)
    except UnicodeEncodeError as e:
        print(type(e).__name__, e)
try:
    print('ok', '\ud800', 'depois')
except UnicodeEncodeError as e:
    print(e.reason, e.start, e.end)
try:
    sys.stdout.write('x\ud83dy')
except UnicodeEncodeError as e:
    print(ascii(e.object), e.start, e.end)
print(ascii('😀'), len('😀'))
PYEOF
'''

[[case]]
id = "strsur-codecs-utf8-decode"
script = '''
python3 - <<'PYEOF'
import codecs
def t(f):
    try:
        print(ascii(f()))
    except Exception as e:
        print(type(e).__name__, e)
for b in [b'', b'a', b'\xe2', b'\xe2\x82', b'\xe2\x82\xac', b'a\xe2\x82', b'\xf0\x9f\x98', b'\xf0\x9f\x98\x80',
          b'\xed\xa0\x80', b'\xed\xa0', b'\xf4\x90', b'\xc3', b'\xff', b'a\xffb\xe2']:
    for final in (False, True):
        for err in ('strict', 'replace', 'ignore', 'surrogateescape', 'surrogatepass', 'backslashreplace'):
            t(lambda: codecs.utf_8_decode(b, err, final))
t(lambda: codecs.utf_8_decode(b'abc'))
t(lambda: codecs.utf_8_decode(b'abc', None, True))
t(lambda: codecs.utf_8_decode('abc'))
t(lambda: codecs.utf_8_decode(bytearray(b'\xc3\xa9'), 'strict', True))
t(lambda: codecs.utf_8_decode(memoryview(b'\xc3\xa9x'), 'strict', True))
t(lambda: codecs.utf_8_encode('a\ud800\U0010ffff', 'surrogatepass'))
t(lambda: codecs.utf_8_encode('a\ud800'))
t(lambda: codecs.utf_8_encode('a\udc80', 'surrogateescape'))
t(lambda: codecs.utf_8_encode(b'a'))
t(lambda: codecs.latin_1_decode(b'\xff\x80', 'strict'))
t(lambda: codecs.latin_1_encode('\xffĀ', 'replace'))
t(lambda: codecs.ascii_decode(b'a\x80', 'surrogateescape'))
t(lambda: codecs.ascii_encode('a\udc80é', 'surrogateescape'))
PYEOF
'''

[[case]]
id = "strsur-codecs-utf16-decode"
script = '''
python3 - <<'PYEOF'
import codecs
def t(f):
    try:
        print(ascii(f()))
    except Exception as e:
        print(type(e).__name__, e)
samples = ['', 'ff', 'fffe', 'feff', 'fffe6100', 'feff0061', 'fffe0000', 'fffe3dd8', 'fffe3dd800de', 'fffe3dd800',
           'fffe00d8', 'fffe00dc', 'fffe00dc00d8', '6100', '61', '610062', '3dd8', '3dd800de', '00d800d8',
           'fffefffe', 'feff0061ff', 'fffe3dd8', 'fffe00d86100']
for h in samples:
    b = bytes.fromhex(h)
    for final in (False, True):
        for err in ('strict', 'surrogatepass', 'replace', 'ignore', 'backslashreplace'):
            t(lambda: codecs.utf_16_decode(b, err, final))
            t(lambda: codecs.utf_16_le_decode(b, err, final))
            t(lambda: codecs.utf_16_be_decode(b, err, final))
        t(lambda: codecs.utf_16_ex_decode(b, 'surrogatepass', 0, final))
        t(lambda: codecs.utf_16_ex_decode(b, 'surrogatepass', -1, final))
        t(lambda: codecs.utf_16_ex_decode(b, 'surrogatepass', 1, final))
for s in ['a', '\ud800', '𐀀', '\U0010ffff', '\U0010d800', '😀', '\U0001f600']:
    for err in ('strict', 'surrogatepass', 'replace', 'ignore', 'backslashreplace'):
        t(lambda: codecs.utf_16_encode(s, err))
        t(lambda: codecs.utf_16_encode(s, err, -1))
        t(lambda: codecs.utf_16_encode(s, err, 1))
        t(lambda: codecs.utf_16_le_encode(s, err))
        t(lambda: codecs.utf_16_be_encode(s, err))
t(lambda: codecs.utf_16_ex_decode(b'\xff\xfea\x00', 'strict', 5))
t(lambda: codecs.utf_16_decode('a'))
PYEOF
'''

