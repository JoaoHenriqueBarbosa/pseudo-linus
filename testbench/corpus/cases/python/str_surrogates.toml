[[case]]
id = "strsur-bytes-decode-utf16-utf32"
script = '''
python3 - <<'PYEOF'
def t(f):
    try:
        print(ascii(f()))
    except Exception as e:
        print(type(e).__name__, e)
for enc in ('utf-16', 'utf-16-le', 'utf-16-be', 'utf-32', 'utf-32-le', 'utf-32-be'):
    for s in ['\ud800', '\udc00', '𐀀', '\udc00\ud800', '😀', '\U0010ffff', '\U0010d800', 'a\udfffb']:
        t(lambda: s.encode(enc, 'surrogatepass'))
        t(lambda: s.encode(enc, 'surrogatepass').decode(enc, 'surrogatepass'))
        t(lambda: s.encode(enc, 'surrogatepass').decode(enc, 'surrogatepass') == s)
        t(lambda: len(s.encode(enc, 'surrogatepass').decode(enc, 'surrogatepass')))
        t(lambda: s.encode(enc, 'surrogatepass').decode(enc))
        t(lambda: s.encode(enc, 'surrogatepass').decode(enc, 'replace'))
        t(lambda: s.encode(enc, 'surrogatepass').decode(enc, 'ignore'))
        t(lambda: s.encode(enc, 'surrogatepass').decode(enc, 'backslashreplace'))
t(lambda: '\U0001f600'.encode('utf-16-le').decode('utf-16-le'))
t(lambda: len('\U0001f600'.encode('utf-16-le')))
t(lambda: len('\U0001f600'.encode('utf-32-le')))
t(lambda: [hex(ord(c)) for c in '\U0001f600\U0010ffff'.encode('utf-16').decode('utf-16')])
t(lambda: '😀'.encode('utf-16', 'surrogatepass') == '\U0001f600'.encode('utf-16'))
t(lambda: '😀'.encode('utf-16-le', 'surrogatepass').decode('utf-16-le') == '\U0001f600')
t(lambda: '😀'.encode('utf-8', 'surrogatepass') == '\U0001f600'.encode('utf-8'))
PYEOF
'''

[[case]]
id = "strsur-plane16-basics"
script = '''
python3 - <<'PYEOF'
top = chr(0x10ffff)
low = '\U0010d800'
print(len(top), ord(top), hex(ord(low)), repr(top), ascii(top), repr(low), ascii(low))
print(top.encode('utf-8'), low.encode('utf-8'), top.encode('utf-16-le'), top.encode('utf-32-be'))
print(top.isprintable(), top.isalpha(), top.isidentifier(), top.isspace(), top.isdecimal(), top.isnumeric())
print(len(top * 3), (top * 3)[1] == top, ord((top + low)[1]) == 0x10d800, (top + low).index(low), (top + low).count(top))
xs = [top, low, '\ud800', '\udfff', '\U0010d7ff', '\U0010e000', 'a', '￿', '\U00010000', '']
print([hex(ord(c)) for c in sorted(xs)])
print([hex(ord(c)) for c in sorted(xs, reverse=True)], hex(ord(max(xs))), hex(ord(min(xs))))
print(top > low > '\udfff' > '\ud800', top == '\U0010ffff', top != low, low < '\U0010e000', low > '\U0010d7ff')
print(ascii(top + '\ud800' + low), len(top + '\ud800' + low), ascii((top + '\ud800' + low)[::-1]))
print(ascii(f'{top}{low}'), ascii(format(low, '>3')), ascii('%s|%r|%a' % (top, top, top)), ascii('{:^5}'.format(top)))
print(top.encode('utf-8').decode('utf-8') == top)
try:
    low.encode('utf-8')
    print('ok')
except UnicodeEncodeError as e:
    print('erro', e.reason)
print(ascii(top.encode('utf-8').decode('utf-8', 'surrogateescape')), ascii('\ud800'.encode('utf-8', 'surrogatepass').decode('utf-8', 'surrogatepass')))
print(ascii(''.join(map(chr, [0x10ffff, 0xd800, 0x10d800, 0x1f600, 0xdfff]))), ascii(str(bytes([0xf4, 0x8f, 0xbf, 0xbf]), 'utf-8')))
print(len({top, low, '\ud800', '\udfff', chr(0x10ffff)}), hash(top) == hash(chr(0x10ffff)), hash(low) != hash('\ud800'))
d = {top: 1, low: 2, '\ud800': 3}
print(sorted(d.values()), d[chr(0x10ffff)], d['\U0010d800'], d['\ud800'], ascii(sorted(d)))
PYEOF
'''
