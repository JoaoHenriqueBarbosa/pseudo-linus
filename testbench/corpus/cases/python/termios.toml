[[case]]
id = "termios-pty-flow-send"
script = '''
python3 - <<'PYEOF'
import os, select, termios, time

m, s = os.openpty()
os.set_blocking(m, False)
os.set_blocking(s, False)

def readable(fd, wait=0.3):
    return bool(select.select([fd], [], [], wait)[0])

def writable(fd):
    return bool(select.select([], [fd], [], 0.2)[1])

def try_write(fd, data):
    try:
        return os.write(fd, data)
    except BlockingIOError as e:
        return type(e).__name__

# O escravo manda STOP e START ao que o mestre lê, sem OPOST nem eco.
print(termios.tcflow(s, termios.TCIOFF), readable(m, 2), os.read(m, 64))
print(termios.tcflow(s, termios.TCION), readable(m, 2), os.read(m, 64))
# Com o caractere desligado (_POSIX_VDISABLE) não se escreve nada.
attrs = termios.tcgetattr(s)
saved = attrs[6][termios.VSTOP]
attrs[6][termios.VSTOP] = b'\0'
termios.tcsetattr(s, termios.TCSANOW, attrs)
print(termios.tcflow(s, termios.TCIOFF), readable(m))
attrs[6][termios.VSTOP] = saved
termios.tcsetattr(s, termios.TCSANOW, attrs)
# O mestre manda o STOP ao escravo: com IXON ele é consumido (nem entrada nem eco) e suspende a saída.
print(termios.tcflow(m, termios.TCIOFF))
time.sleep(0.3)
print(readable(s), readable(m), writable(s), try_write(s, b'x'))
print(termios.tcflow(m, termios.TCION))
time.sleep(0.3)
print(writable(s), try_write(s, b'y'), readable(s), readable(m, 2), os.read(m, 64))
# STOP e START digitados no mestre fazem o mesmo.
os.write(m, b'\x13')
time.sleep(0.3)
print(writable(s), try_write(s, b'z'))
os.write(m, b'\x11')
time.sleep(0.3)
print(writable(s), try_write(s, b'z'), readable(s))
os.read(m, 64)
# O START digitado não desfaz o TCOOFF.
termios.tcflow(s, termios.TCOOFF)
os.write(m, b'\x11')
time.sleep(0.3)
print(writable(s), try_write(s, b'w'))
termios.tcflow(s, termios.TCOON)
print(writable(s), try_write(s, b'w'))
os.read(m, 64)
# Desligar o IXON religa a saída parada pelo STOP.
os.write(m, b'\x13')
time.sleep(0.3)
print(writable(s))
attrs = termios.tcgetattr(s)
attrs[0] &= ~termios.IXON
termios.tcsetattr(s, termios.TCSANOW, attrs)
print(writable(s), try_write(s, b'v'))
os.close(m)
os.close(s)
PYEOF
'''
tags = ["termios", "pty"]

