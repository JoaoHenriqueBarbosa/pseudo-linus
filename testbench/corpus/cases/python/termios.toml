print(termios.tcsendbreak(s, 0), termios.tcsendbreak(m, 3), termios.tcdrain(s), termios.tcdrain(m))
# As ioctls de modo no mestre agem no escravo.
attrs[3] &= ~termios.ECHO
termios.tcsetattr(m, termios.TCSADRAIN, attrs)
print(termios.tcgetattr(s)[3] & termios.ECHO, termios.tcgetattr(m)[3] & termios.ECHO)
