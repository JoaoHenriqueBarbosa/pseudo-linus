[[case]]
id = "termios-pty-flush"
script = '''
python3 - <<'PYEOF'
import os, select, termios, time

m, s = os.openpty()

def readable(fd, wait=0.3):
    return bool(select.select([fd], [], [], wait)[0])

def slurp(fd, want):
    got = b''
    while len(got) < want and readable(fd, 2):
        got += os.read(fd, 256)
    return got

# O eco prova que a disciplina de linha já viu a entrada antes do descarte.
os.write(m, b'ab\n')
print(slurp(m, 4))
print(termios.tcflush(s, termios.TCIFLUSH), readable(s))
os.write(m, b'xy')
print(slurp(m, 2))
termios.tcflush(s, termios.TCIOFLUSH)
os.write(m, b'z\n')
print(slurp(m, 3), os.read(s, 64))
# TCOFLUSH não toca a entrada do escravo.
os.write(m, b'keep\n')
print(slurp(m, 6))
termios.tcflush(s, termios.TCOFLUSH)
print(os.read(s, 64))
# No mestre, a entrada é o que o escravo escreveu e ninguém leu.
os.write(s, b'hello')
termios.tcflush(m, termios.TCIFLUSH)
print(readable(m))
os.write(s, b'again')
print(slurp(m, 5))
termios.tcflush(m, termios.TCOFLUSH)
termios.tcflush(m, termios.TCIOFLUSH)
print(readable(m))
# No modo não canônico a entrada pendente também sai.
attrs = termios.tcgetattr(s)
attrs[3] &= ~(termios.ICANON | termios.ECHO)
termios.tcsetattr(s, termios.TCSANOW, attrs)
os.write(m, b'raw')
time.sleep(0.2)
print(termios.tcflush(s, termios.TCIFLUSH), readable(s))
os.write(m, b'new')
print(os.read(s, 64))
os.close(m)
os.close(s)
PYEOF
'''
tags = ["termios", "pty"]

[[case]]
id = "termios-pty-flow-output"
script = '''
python3 - <<'PYEOF'
import os, select, termios, time

m, s = os.openpty()
os.set_blocking(m, False)
os.set_blocking(s, False)

def writable(fd):
    return bool(select.select([], [fd], [], 0.2)[1])

def try_write(fd, data):
    try:
        return os.write(fd, data)
    except BlockingIOError as e:
        return type(e).__name__

print(writable(s), try_write(s, b'a'))
print(termios.tcflow(s, termios.TCOOFF), writable(s), try_write(s, b'a'))
print(termios.tcflow(s, termios.TCOOFF), writable(s))
print(termios.tcflow(s, termios.TCOON), writable(s), try_write(s, b'b'))
time.sleep(0.2)
print(os.read(m, 64))
print(termios.tcflow(s, termios.TCOON), writable(s))
# O mestre também suspende a própria saída.
print(termios.tcflow(m, termios.TCOOFF), writable(m), try_write(m, b'c'))
print(termios.tcflow(m, termios.TCOON), writable(m), try_write(m, b'd'))
# A saída do escravo suspensa não impede o mestre de ler o que já existia.
os.write(s, b'old')
termios.tcflow(s, termios.TCOOFF)
time.sleep(0.2)
print(os.read(m, 64), try_write(s, b'x'))
termios.tcflow(s, termios.TCOON)
print(try_write(s, b'x'))
os.close(m)
os.close(s)
PYEOF
'''
