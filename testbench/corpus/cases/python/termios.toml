# `termios` (CPython 3.13 sobre a glibc): o `dir()` do módulo, `tcflush` e `tcflow` (`TCFLSH` e `TCXONC`) em
# pseudoterminais e os erros em fd que não é terminal, junto com o resto da interface (`tcgetattr`,
# `tcsetattr`, `tcgetwinsize`, `tcsetwinsize`, `tcsendbreak`, `tcdrain`). O que o kernel entrega de forma
# assíncrona (a escrita no mestre vira entrada do escravo depois) é sincronizado com `select`, e nada
# não determinístico aparece na saída.

[[case]]
id = "termios-dir-and-constants"
script = '''
python3 - <<'PYEOF'
import termios
print(len(dir(termios)))
print(' '.join(dir(termios)))
print(termios.TCIFLUSH, termios.TCOFLUSH, termios.TCIOFLUSH)
print(termios.TCOOFF, termios.TCOON, termios.TCIOFF, termios.TCION)
print(termios.TCFLSH, termios.TCXONC, termios.TCSBRK, termios.TCSBRKP)
print(termios.error.__module__, termios.error.__name__, termios.error.__mro__[1].__name__)
for name in ('tcflush', 'tcflow', 'tcdrain', 'tcsendbreak', 'tcgetattr', 'tcsetattr', 'tcgetwinsize', 'tcsetwinsize'):
    f = getattr(termios, name)
    print(name, type(f).__name__, f.__module__, f.__doc__.splitlines()[0])
PYEOF
'''
