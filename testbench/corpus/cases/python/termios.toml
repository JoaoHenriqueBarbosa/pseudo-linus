    ('tcflush-bad-queue', lambda fd: termios.tcflush(fd, 99)),
    ('tcflow', lambda fd: termios.tcflow(fd, termios.TCOON)),
    ('tcflow-bad-action', lambda fd: termios.tcflow(fd, 99)),
    ('tcdrain', lambda fd: termios.tcdrain(fd)),
    ('tcsendbreak', lambda fd: termios.tcsendbreak(fd, 0)),
    ('tcgetattr', lambda fd: termios.tcgetattr(fd)),
    ('tcsetattr', lambda fd: termios.tcsetattr(fd, termios.TCSANOW, [0] * 6 + [[b'\0'] * termios.NCCS])),
    ('tcgetwinsize', lambda fd: termios.tcgetwinsize(fd)),
    ('tcsetwinsize', lambda fd: termios.tcsetwinsize(fd, (24, 80))),
]
for target in (r, w, f, 9999):
    for name, call in calls:
        try:
            call(target)
            print(name, 'ok')
