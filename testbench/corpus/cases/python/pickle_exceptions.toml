tool = "python3"
source = "manual"

# As exceções embutidas e as de usuário seguem o protocolo de pickle do CPython 3.13: `__reduce__` e
# `__reduce_ex__` devolvem `(tipo, args)` ou `(tipo, args, __dict__)`, o `OSError` refaz os argumentos com
# `filename` e `filename2`, o `ImportError` e o `AttributeError` levam `name`/`path` no estado, e
# `pickle.dumps`/`pickle.loads` (protocolos 0 a 5) devolvem a mesma exceção. É o que o `multiprocessing.Pool`
# usa para levar de volta a exceção que a tarefa levantou. Os endereços saem normalizados para `0xADDR`.

[[case]]
id = "pickle-exceptions-reduce"
script = '''
python3 - <<'PYEOF' 2>&1 | sed -E 's/0x[0-9a-f]+/0xADDR/g'
e = ValueError("x", 2)
print(e.__reduce__())
print(e.__reduce_ex__(2))
print(e.__reduce_ex__(0), e.__reduce_ex__(5))
print(ValueError().__reduce__())

k = KeyError("k")
print(k.__reduce__())
k.x = 5
print(k.__reduce__(), k.x, k.__dict__)
k.y = [1, 2]
print(k.__reduce_ex__(4))
del k.x
print(k.__reduce__(), hasattr(k, "x"))

print(StopIteration(7).__reduce__(), StopIteration(7).value)
print(SystemExit(3).__reduce__(), SystemExit(3).code)
print(SystemExit().__reduce__(), SystemExit("a", "b").__reduce__())
print(Exception("a", (1, 2), {"k": None}).__reduce_ex__(2))
print(UnicodeDecodeError("utf-8", b"\xff", 0, 1, "invalid start byte").__reduce__())
print(SyntaxError("bad", ("f.py", 1, 2, "x = (", 1, 3)).__reduce__())
print(ValueError.__reduce__(ValueError("viaclass")))
print(BaseException.__reduce__(KeyError("k")))
PYEOF
'''

