[[case]]
id = "fork-recursive-function"
script = '''
python3 - <<'PYEOF'
import os

def depth(n):
    if n == 0:
        pid = os.fork()
        if pid == 0:
            os._exit(42)
        return os.WEXITSTATUS(os.waitpid(pid, 0)[1])
    return depth(n - 1) + 1

print(depth(50))

def tree(d):
    if d == 0:
        return 0
    pids = []
    for _ in range(2):
        pid = os.fork()
        if pid == 0:
            os._exit(tree(d - 1) + 1)
        pids.append(pid)
    return max(os.WEXITSTATUS(os.waitpid(p, 0)[1]) for p in pids)

print(tree(3))

def fact_in_child(n):
    if n <= 1:
        return 1
    pid = os.fork()
    if pid == 0:
        os._exit(n % 256 if n < 6 else fact_in_child(n - 1) % 256)
    return os.WEXITSTATUS(os.waitpid(pid, 0)[1])

print(fact_in_child(10))
PYEOF
'''
tags = ["fork", "process"]

[[case]]
id = "fork-in-generator"
script = '''
python3 - <<'PYEOF'
import os

def spawn(n):
    for i in range(n):
        pid = os.fork()
        if pid == 0:
            os._exit(10 + i)
        yield pid

pids = list(spawn(3))
print(sorted(os.WEXITSTATUS(os.waitpid(p, 0)[1]) for p in pids))

def lazy():
    total = 0
    for i in range(3):
        pid = os.fork()
        if pid == 0:
            os._exit(i * 2)
        total += os.WEXITSTATUS(os.waitpid(pid, 0)[1])
        yield total

g = lazy()
print(next(g), next(g), next(g))

def inner():
    pid = os.fork()
    if pid == 0:
        os._exit(7)
    return os.WEXITSTATUS(os.waitpid(pid, 0)[1])

def outer():
    yield inner()
    yield from [inner(), inner()]

print(list(outer()))
print([inner() for _ in range(2)])
print(sorted({inner() for _ in range(3)}))
PYEOF
'''
tags = ["fork", "process"]

[[case]]
id = "fork-in-with-and-try-finally"
script = '''
python3 - <<'PYEOF'
import os, sys, contextlib

MAIN = os.getpid()

def say(*a):
    print(*a, flush=True)

@contextlib.contextmanager
def cm(tag):
    say("enter", tag)
    try:
        yield
    finally:
        say("exit", tag, os.getpid() == MAIN)

class Res:
    def __enter__(self):
        say("Res enter")
        return self
    def __exit__(self, *exc):
        say("Res exit", os.getpid() == MAIN, exc[0].__name__ if exc[0] else None)
        return False

with cm("a"):
    pid = os.fork()
    if pid != 0:
        os.waitpid(pid, 0)
    else:
        say("child in with")
if pid == 0:
    os._exit(0)

with Res():
    pid = os.fork()
    if pid == 0:
        say("child in Res")
        sys.exit(2)
    status = os.waitpid(pid, 0)[1]
    say("parent status", os.waitstatus_to_exitcode(status))

try:
    pid = os.fork()
    if pid == 0:
        say("child try")
        raise SystemExit(6)
    status = os.waitpid(pid, 0)[1]
    say("parent got", os.waitstatus_to_exitcode(status))
finally:
    say("finally", os.getpid() == MAIN)
PYEOF
'''
tags = ["fork", "process"]

