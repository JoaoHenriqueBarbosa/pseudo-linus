tool = "python3"
source = "manual"

# `os.fork` e o que depende dele (wip/notes/python-fork.md): estado do filho, buffers, ganchos de
# `register_at_fork`, espera (`waitpid`, `wait3`, `wait4`, `waitid`), sinais, `multiprocessing`, `pty` e
# `socketserver`. Nada não determinístico aparece na saída: pids e tempos nunca são impressos, só
# comparações entre eles. A ordem da saída é fixada porque o pai espera o filho antes de imprimir.

