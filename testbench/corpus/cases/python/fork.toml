[[case]]
id = "fork-multiprocessing-process"
script = '''
python3 - <<'PYEOF'
import multiprocessing as mp, os, sys

ctx = mp.get_context("fork")
PARENT = os.getpid()

def work(q, n):
    q.put((n * n, os.getpid() != PARENT))

def die(code):
    sys.exit(code)

def boom():
    raise ValueError("boom in process")

if __name__ == "__main__":
    q = ctx.Queue()
    procs = [ctx.Process(target=work, args=(q, n)) for n in range(4)]
    for p in procs:
        p.start()
    results = sorted(q.get() for _ in procs)
    for p in procs:
        p.join()
    print(results, [p.exitcode for p in procs], [p.is_alive() for p in procs])
    p = ctx.Process(target=die, args=(7,))
    p.start()
    p.join()
    print("exitcode", p.exitcode)
    p = ctx.Process(target=boom)
    p.start()
    p.join()
    print("exitcode", p.exitcode)
    p = ctx.Process(target=work, args=(q, 1), daemon=True, name="named")
    print(p.name, p.daemon, p.exitcode, p.pid)
    p.start()
    p.join()
    print(q.get(), p.exitcode)
    print(mp.get_start_method(allow_none=True), "fork" in mp.get_all_start_methods())
PYEOF
'''
