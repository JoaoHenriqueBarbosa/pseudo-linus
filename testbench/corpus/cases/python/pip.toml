tool = "python3"
source = "manual"

# O pip do Debian (python3-pip 25.1.1) rodando no interpretador: versão, ajuda, lista de pacotes
# instalados e o `importlib.metadata` real lendo os `.dist-info` de dist-packages.

[[case]]
id = "pip-version-help-list"
script = '''
cd /root
python3 -m pip --version; echo rc=$?
pip --version; echo rc=$?
pip3 --version; echo rc=$?
python3 -m pip --help; echo rc=$?
pip list; echo rc=$?
'''

[[case]]
id = "importlib-metadata-dist-info"
script = '''
python3 - <<'PYEOF'
import sys
import importlib.metadata as m
print(sys.meta_path)
print(m.__file__)
dists = list(m.distributions())
print(len(dists), sorted(d.metadata['Name'] for d in dists))
print(m.version('pip'), m.version('PyYAML'), m.version('pillow'))
print(m.distribution('pillow').requires)
print(sorted(e.name for e in m.entry_points(group='console_scripts')))
print(sorted(m.packages_distributions().items())[:5])
try:
    m.version('nope')
except m.PackageNotFoundError as e:
    print('PNF', e)
PYEOF
'''

[[case]]
id = "python-c-frames-hidden"
script = '''
python3 - <<'PYEOF'
import itertools, functools, collections, traceback
def bad():
    raise ValueError('x')
def gen():
    yield bad()
for f in [lambda: list(itertools.chain(gen())),
          lambda: functools.reduce(lambda a, b: bad(), [1, 2, 3]),
          lambda: collections.defaultdict(bad)['k'],
          lambda: list(itertools.starmap(lambda a: bad(), [(1,)]))]:
    try:
        f()
    except ValueError:
        traceback.print_exc()
class A:
    pass
a = A(); a.x = 1
b = A.__new__(A)
b.__dict__ = a.__dict__.copy()
b.__dict__['y'] = 2
print(b.x, b.y, b.__dict__)
import types
class M(types.ModuleType):
    def __getattr__(self, name):
        return name.upper()
mod = M('mm', 'doc')
print(mod.__name__, mod.__doc__, mod.zz, isinstance(mod, types.ModuleType))
print(types.MethodType(lambda self: self.x, a)())
PYEOF
'''

# Projeto do agente com `pyproject.toml` (setuptools) instalado num venv sem rede: build isolation
# com o setuptools do /usr/share/python-wheels, entry point em bin/, `-e`, `-r`, freeze e uninstall.
# O sha256 e o diretório temporário do wheel mudam a cada execução (carimbo de hora no zip).
[[case]]
id = "pip-install-local-project"
script = '''
cd /tmp
python3 -m venv v >/dev/null; echo venv=$?
mkdir -p proj/src/hello
cat > proj/pyproject.toml <<'EOT'
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-agent"
version = "0.1.0"
description = "Projeto de teste"
requires-python = ">=3.9"

[project.scripts]
hello = "hello.cli:main"
EOT
echo 'VALUE = 42' > proj/src/hello/__init__.py
printf 'import hello\ndef main():\n    print("ola", hello.VALUE)\n' > proj/src/hello/cli.py
W="--no-index --find-links /usr/share/python-wheels"
v/bin/pip install $W ./proj 2>&1 | sed -E 's/ in [0-9.]+s$//; s/sha256=[0-9a-f]+/sha256=X/; s/pip-ephem-wheel-cache-[^/]+/pip-ephem-wheel-cache-X/'; echo rc=$?
v/bin/hello; echo rc=$?
v/bin/pip freeze
v/bin/pip show -f hello-agent | sed -n '1,3p;/^Files/,$p'
head -1 v/bin/hello
v/bin/pip uninstall -y hello-agent; echo rc=$?
v/bin/pip install $W -e ./proj 2>&1 | sed -E 's/ in [0-9.]+s$//; s/sha256=[0-9a-f]+/sha256=X/; s/pip-ephem-wheel-cache-[^/]+/pip-ephem-wheel-cache-X/'; echo rc=$?
echo 'VALUE = 7' > proj/src/hello/__init__.py
v/bin/hello
ls v/lib/python3.13/site-packages | grep -i hello | sort
v/bin/pip list 2>&1
printf 'wheel\n' > req.txt
v/bin/pip install $W -r req.txt 2>&1; echo rc=$?
v/bin/pip freeze --all
'''

# PEP 668 no Python do sistema: recusa sem flag e com --user, --break-system-packages e
# PIP_BREAK_SYSTEM_PACKAGES, e o dist-packages local que o postinst do python3.13-minimal cria.
[[case]]
id = "pip-pep668-break-system-packages"
script = '''
cd /tmp
W="--no-index --find-links /usr/share/python-wheels"
pip install $W wheel 2>&1 | head -3; echo rc=$?
pip install --user $W wheel 2>&1 | head -3; echo rc=$?
pip install --break-system-packages $W wheel 2>&1 | tail -4; echo rc=$?
python3 -c 'import wheel; print(wheel.__file__)'
ls -A /usr/local/lib/python3.13/dist-packages; ls -A /usr/local/bin
pip uninstall -y --break-system-packages wheel 2>&1 | tail -3
PIP_BREAK_SYSTEM_PACKAGES=1 pip install --user $W wheel 2>&1 | tail -3; echo rc=$?
python3 -m site --user-site
python3 -c 'import site; print(site.getsitepackages(), site.ENABLE_USER_SITE)'
'''
