id = "python-settrace-events"
script = '''
python3 - <<'PYEOF'
import sys, io

def short(a, n=40):
    try:
        r = repr(a)
    except Exception as e:
        r = '<repr %s>' % type(e).__name__
    return r if len(r) <= n else r[:n] + '...'

def fmt_arg(event, arg):
    if event == 'exception':
        return '%s(%s)' % (arg[0].__name__, short(arg[1], 30))
    return short(arg)

def make_tracer(log, names, with_local=True, lines=True):
    def local(frame, event, arg):
        if event == 'line' and not lines:
            return local
        log.append((event, frame.f_code.co_name, frame.f_lineno, fmt_arg(event, arg)))
        return local
    def glob(frame, event, arg):
        if frame.f_code.co_name not in names:
            return None
        log.append((event, frame.f_code.co_name, frame.f_lineno, fmt_arg(event, arg)))
        return local if with_local else None
    return glob

def dump(title, log):
    print('==', title, len(log))
    for item in log:
        print('  ', item)

def simple(a, b):
    c = a + b
    d = c * 2
    return d

def caught(x):
    try:
        y = 1 // x
    except ZeroDivisionError as e:
        y = -1
    finally:
        z = 5
    return y + z

def inner_raise():
    raise ValueError('boom')

def propagated():
    v = 1
    inner_raise()
    return v

def outer_catch():
    try:
        propagated()
    except ValueError:
        return 'caught'

def gen(n):
    for i in range(n):
        yield i * 2
    return 'done'

def consume():
    total = 0
    for v in gen(3):
        total += v
    return total

def gen_send():
    x = yield 1
    y = yield x + 1
    return y

def drive_send():
    g = gen_send()
    a = next(g)
    b = g.send(10)
    try:
        g.send(20)
    except StopIteration as e:
        return a, b, e.value

def gen_close():
    try:
        yield 1
    finally:
        pass

def drive_close():
    g = gen_close()
    next(g)
    g.close()

def drive_throw():
    g = gen_close()
    next(g)
    try:
        g.throw(KeyError('k'))
    except KeyError:
        return 'thrown'

def loops():
    n = 0
    while n < 2:
        n += 1
    for i in (1, 2):
        pass
    return n

def with_lambda():
    f = lambda q: q + 1
    return f(1), [k for k in range(2)], {k: k for k in range(1)}

def recursive(n):
    if n == 0:
        return 0
    return n + recursive(n - 1)

class C:
    def __init__(self, v):
        self.v = v
    def get(self):
        return self.v
    @property
    def prop(self):
        return self.v + 1

def use_class():
    c = C(3)
    return c.get(), c.prop

def run(title, fn, names, **kw):
    log = []
    sys.settrace(make_tracer(log, names, **kw))
    try:
        r = fn()
    except BaseException as e:
        r = 'raised %s' % type(e).__name__
    sys.settrace(None)
    dump(title + ' -> ' + ascii(r), [x for x in log])

run('return', lambda: simple(1, 2), {'simple'})
run('caught', lambda: caught(0), {'caught'})
run('caught-ok', lambda: caught(2), {'caught'})
run('propagated', outer_catch, {'outer_catch', 'propagated', 'inner_raise'})
run('uncaught', propagated, {'propagated', 'inner_raise'})
run('generator', consume, {'consume', 'gen'})
run('send', drive_send, {'drive_send', 'gen_send'})
run('close', drive_close, {'drive_close', 'gen_close'})
run('throw', drive_throw, {'drive_throw', 'gen_close'})
run('loops', loops, {'loops'})
run('lambda', with_lambda, {'with_lambda', '<lambda>', '<listcomp>', '<dictcomp>', 'q'})
run('recursive', lambda: recursive(2), {'recursive'})
run('class', use_class, {'use_class', '__init__', 'get', 'prop'})
run('no-local', lambda: simple(1, 2), {'simple'}, with_local=False)
run('no-lines', lambda: simple(1, 2), {'simple'}, lines=False)

# f_trace_lines = False dentro do rastreador global
log = []
def glob_nolines(frame, event, arg):
    if frame.f_code.co_name != 'simple':
        return None
    frame.f_trace_lines = False
    log.append((event, frame.f_lineno, frame.f_trace_lines, frame.f_trace_opcodes))
    def local(frame, event, arg):
        log.append((event, frame.f_lineno, short(arg)))
        return local
    return local
sys.settrace(glob_nolines)
simple(1, 2)
sys.settrace(None)
dump('f_trace_lines=False', log)

# f_trace_lines = True mas f_trace_opcodes = True (contagem apenas, sem listar)
log = []
def glob_ops(frame, event, arg):
    if frame.f_code.co_name != 'simple':
        return None
    frame.f_trace_opcodes = True
    def local(frame, event, arg):
        log.append(event)
        return local
    return local
sys.settrace(glob_ops)
simple(1, 2)
sys.settrace(None)
print('opcodes events:', sorted(set(log)), log.count('opcode') > 0, log.count('line'))

# f_trace atribuído tardiamente via sys._getframe().f_back
log = []
def late_local(frame, event, arg):
    log.append((event, frame.f_code.co_name, frame.f_lineno, fmt_arg(event, arg)))
    return late_local

def attach():
    sys._getframe().f_back.f_trace = late_local
    sys.settrace(lambda *a: None)

def late_target():
    attach()
    a = 1
    b = 2
    return a + b

late_target()
sys.settrace(None)
dump('late f_trace', log)

log = []
def late2():
    f = sys._getframe()
    f.f_trace = late_local
    x = 1
    y = 2
    return x + y
late2()
dump('f_trace without settrace', log)

log = []
def late3():
    sys.settrace(lambda *a: None)
    f = sys._getframe()
    f.f_trace = late_local
    x = 1
    y = 2
    return x + y
late3()
sys.settrace(None)
dump('f_trace after settrace', log)

log = []
def late4():
    sys.settrace(lambda *a: None)
    sys._getframe().f_trace = late_local
    sys._getframe().f_trace = None
    x = 1
    return x
late4()
sys.settrace(None)
dump('f_trace cleared', log)

# gettrace / settrace(None)
print(sys.gettrace())
def tr(frame, event, arg):
    return tr
sys.settrace(tr)
print(sys.gettrace() is tr)
sys.settrace(None)
print(sys.gettrace())
for bad in [1, 'x', object()]:
    try:
        sys.settrace(bad)
        print('accepted', type(bad).__name__, sys.gettrace() is bad)
        sys.settrace(None)
    except Exception as e:
