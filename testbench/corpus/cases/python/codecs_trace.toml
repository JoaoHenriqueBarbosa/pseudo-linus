tool = "python3"
source = "manual"

# Quatro frentes do CPython 3.13 que costumam divergir: o codec utf-7 (encode, decode, erros,
# incremental, aliases), a mensagem do ValueError de '%' + caractere (formato não suportado),
# os eventos de sys.settrace e sys.setprofile, o depurador pdb dirigido por stdin e as
# transformações de caixa (upper, lower, casefold, title...) com os casos especiais do Unicode.
# Os scripts capturam exceções e imprimem (type(e).__name__, e) para não abortar no primeiro erro.

