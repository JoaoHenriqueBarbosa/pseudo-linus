print(sys.gettrace())

# retornar None no local desliga as linhas seguintes
log = []
def once_global(frame, event, arg):
    if frame.f_code.co_name != 'simple':
        return None
    def local(frame, event, arg):
        log.append((event, frame.f_lineno))
        return None
    return local
sys.settrace(once_global)
simple(1, 2)
