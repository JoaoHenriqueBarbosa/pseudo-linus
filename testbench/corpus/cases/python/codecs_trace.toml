# frames e atributos vistos pelo rastreador
log = []
def inspector(frame, event, arg):
    if frame.f_code.co_name != 'simple':
        return None
    log.append((event, sorted(k for k in frame.f_locals), frame.f_back.f_code.co_name, frame.f_code.co_argcount,
                frame.f_globals is globals(), frame.f_code.co_filename == __file__ if '__file__' in globals() else frame.f_code.co_filename))
