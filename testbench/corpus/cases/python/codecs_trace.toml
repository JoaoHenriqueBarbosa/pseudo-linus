# setprofile
def pshort(a):
    if a is None:
        return None
    n = getattr(a, '__name__', None)
    return n if n is not None else short(a, 30)

def prof_run(title, fn):
    plog = []
    def prof(frame, event, arg):
        if event.startswith('c_'):
            plog.append((event, frame.f_code.co_name, pshort(arg), getattr(arg, '__qualname__', None)))
        else:
            plog.append((event, frame.f_code.co_name, short(arg, 20)))
    sys.setprofile(prof)
    try:
        r = fn()
    except BaseException as e:
        r = 'raised %s' % type(e).__name__
    sys.setprofile(None)
    dump('profile ' + title + ' -> ' + ascii(r), plog)

def native_calls():
    a = len([1, 2, 3])
    b = sorted([3, 1, 2])
    buf = io.StringIO()
    print('hello', file=buf)
    c = buf.getvalue()
    d = max(1, 2)
    e = 'abc'.upper()
    return a, b, c, d, e

def native_error():
    try:
        len(5)
    except TypeError:
        pass
    try:
        int('x')
    except ValueError:
        pass
    return {}.get('a')

def py_calls():
    return simple(1, 2) + recursive(1)

def native_callback():
    return sorted([3, 1, 2], key=lambda v: -v)

def native_calls_gen():
    return list(gen(2))

prof_run('native', native_calls)
