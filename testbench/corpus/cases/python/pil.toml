# Tabela `kern` OpenType com subtables de formato 2 (classes por deslocamento) e 3 (índices de
# classe), que o HarfBuzz aplica quando a fonte não tem GPOS: a DejaVuSans da imagem é remontada
# sem GPOS e com o `kern` abaixo.
[[case]]
id = "pil-kern-formats-2-3"
script = '''
python3 - <<'PYEOF'
import struct
from PIL import ImageFont

KERN = {
    2: "",
    3: "",
}

def rebuild(src, kern):
    version, n = struct.unpack(">IH", src[:6])
    tables = {}
    for i in range(n):
        tag, _, off, length = struct.unpack(">4sIII", src[12 + 16 * i:28 + 16 * i])
        tables[tag] = src[off:off + length]
    del tables[b"GPOS"]
    tables[b"kern"] = kern
    tags = sorted(tables)
    out = struct.pack(">IHHHH", version, len(tags), 0, 0, 0)
    offset = 12 + 16 * len(tags)
    body = b""
    for tag in tags:
        data = tables[tag]
        padded = data + b"\0" * (-len(data) % 4)
        checksum = sum(struct.unpack(f">{len(padded) // 4}I", padded)) & 0xFFFFFFFF
        out += struct.pack(">4sIII", tag, checksum, offset + len(body), len(data))
        body += padded
    return out + body

dejavu = open("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", "rb").read()
for fmt, hexdata in KERN.items():
    path = f"/tmp/kern{fmt}.ttf"
    open(path, "wb").write(rebuild(dejavu, bytes.fromhex(hexdata)))
    for size in [13, 40]:
        font = ImageFont.truetype(path, size)
        for t in ["AVATo Ta We Yo, Ty. VAWAY", "TTTT oTo"]:
            print(fmt, size, t, font.getlength(t), font.getlength(t, features=["-kern"]), font.getbbox(t))
            print(" ", font.getbbox(t, direction="rtl"), font.getlength(t, direction="ttb"))
PYEOF
'''
tags = ["agent", "pil"]

# Os métodos de fonte variável do `_imagingft` existem e, numa fonte estática, respondem como o
# FreeType 2.13.3 (`FT_Err_Invalid_Argument`), não como um Pillow compilado sem suporte.
[[case]]
id = "pil-variation-methods-static-font"
script = '''
python3 - <<'PYEOF'
from PIL import ImageFont
font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 20)
f = font.font
print(sorted(n for n in dir(f) if "var" in n))
for m, a in [("get_variation_names", ()), ("get_variation_axes", ()), ("set_variation_by_axes", ([100],))]:
    try:
        print(m, getattr(font, m)(*a))
    except Exception as e:
        print(m, type(e).__name__, e)
calls = [
    ("getvarnames", ()), ("getvarnames", (1,)), ("getvaraxes", (1, 2)),
    ("setvarname", ()), ("setvarname", (1,)), ("setvarname", ("a",)), ("setvarname", (1.5,)),
    ("setvaraxes", ([1, 2.5],)), ("setvaraxes", ((1,),)), ("setvaraxes", (["x"],)), ("setvaraxes", ([1], 2)),
]
for name, a in calls:
    try:
        print(name, a, getattr(f, name)(*a))
    except Exception as e:
        print(name, a, type(e).__name__, e)
print(f.getvarnames.__doc__, f.render.__doc__, type(f.setvaraxes).__name__)
PYEOF
'''
tags = ["agent", "pil"]
