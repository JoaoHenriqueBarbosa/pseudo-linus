id = "yaml-libyaml-compose-nodes"
script = '''
python3 - <<'PYEOF'
import yaml


def show(n, depth=0):
    pad = '  ' * depth
    mk = '[%d:%d-%d:%d]' % (n.start_mark.line, n.start_mark.column, n.end_mark.line, n.end_mark.column)
    if isinstance(n, yaml.ScalarNode):
        print(pad + 'Scalar', repr(n.tag), repr(n.value), repr(n.style), mk)
    elif isinstance(n, yaml.SequenceNode):
        print(pad + 'Sequence', repr(n.tag), repr(n.flow_style), mk)
        for c in n.value:
            show(c, depth + 1)
    else:
        print(pad + 'Mapping', repr(n.tag), repr(n.flow_style), mk)
        for k, v in n.value:
            show(k, depth + 1)
            show(v, depth + 2)


def comp(text, loader=yaml.CSafeLoader, many=False):
    print('--', ascii(text), loader.__name__)
    try:
        if many:
            for n in yaml.compose_all(text, Loader=loader):
                show(n)
                print('.')
        else:
            n = yaml.compose(text, Loader=loader)
            if n is None:
                print(None)
            else:
                show(n)
    except Exception as e:
        print(type(e).__name__, str(e))


texts = [
    'a: 1\nb: [x, "y", 2.5, ~, true]\n', '- &a [1, 2]\n- *a\n', '!!set {a, b}', '!t {a: 1}', '%TAG !e! tag:x:\n---\n!e!foo bar\n', '', '# c', '|\n  lit\n', 'a: *x\n',
    'a\n---\nb\n', '&a x\n', '[1, 2\n', '- !!binary aGk=\n', '? [a]\n: {b: c}\n', '&a {k: *a}', '<<: {a: 1}\n', '"x": \'y\'\n',
]
for loader in (yaml.CSafeLoader, yaml.CLoader):
    for text in texts:
        comp(text, loader)
comp('a\n---\nb\n', yaml.CSafeLoader, True)
comp('a\n---\nb: [\n', yaml.CSafeLoader, True)
comp('', yaml.CSafeLoader, True)
