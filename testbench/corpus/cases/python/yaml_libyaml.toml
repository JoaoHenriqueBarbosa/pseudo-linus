id = "yaml-libyaml-roundtrip-values"
script = '''
python3 - <<'PYEOF'
import yaml, datetime, math

values = [
    0, 1, -1, 2**70, 1.5, -0.0, 1e100, 1e-100, 123456789012345.6, float('inf'), float('-inf'), True, False, None,
    '', ' ', 'x', 'yes', 'no', 'on', 'off', 'true', 'null', '~', '1', '1.5', '0x1', '1e3', '.inf', '2001-12-14', '12:30:45', '1:2', 'a: b', '# c', '- d', '? e', '@f', '`g', '!h', '&i', '*j', '|k', '>l', "'m'", '"n"', '%o', 'p, q', '[r]', '{s}',
    'a\nb', 'a\nb\n', '\n', ' \n', 'a  b', 'a\tb', 'x ', ' y', 'caf\u00e9', '\u65e5\u672c', '\U0001f600', 'tab\there', 'cr\rhere', 'nul\x00here', 'bell\x07', 'del\x7f', 'nel\x85', 'ls\u2028', 'bom\ufeff', '\ud800', 'z' * 200, 'w ' * 100,
    b'', b'\x00\xff', bytes(range(256)),
    datetime.date(2024, 2, 29), datetime.datetime(2024, 2, 29, 12, 30, 45), datetime.datetime(2024, 2, 29, 12, 30, 45, 123456), datetime.datetime(2024, 2, 29, 12, 30, 45, tzinfo=datetime.timezone.utc), datetime.datetime(2024, 2, 29, 12, 30, 45, tzinfo=datetime.timezone(datetime.timedelta(hours=5, minutes=30))),
    [], {}, [[]], [{}], {'a': []}, {'a': {}}, [1, [2, [3, [4]]]], {'a': {'b': {'c': {'d': 1}}}}, {1: 'a', 2: 'b'}, {None: 1}, {True: 1}, {1.5: 1}, {'': ''}, {'a b': 'c d'},
    {'users': [{'name': 'a', 'tags': ['x', 'y'], 'meta': {'k': None}}, {'name': 'b', 'tags': [], 'meta': {}}]},
]
for dumper, loader in ((yaml.CSafeDumper, yaml.CSafeLoader), (yaml.CDumper, yaml.CLoader), (yaml.CSafeDumper, yaml.CLoader), (yaml.CDumper, yaml.CSafeLoader)):
    print('==', dumper.__name__, loader.__name__)
    for dfs in (None, False, True):
        for au in (False, True):
            ok = bad = 0
            for v in values:
                try:
                    text = yaml.dump(v, Dumper=dumper, default_flow_style=dfs, allow_unicode=au)
                    back = yaml.load(text, Loader=loader)
                    same = back == v or (isinstance(v, float) and math.isnan(v))
                    if same and type(back) is type(v):
                        ok += 1
                    else:
                        bad += 1
                        print('  MISMATCH', ascii(v), ascii(text), ascii(back))
                except Exception as e:
                    bad += 1
                    print('  ERROR', ascii(v), type(e).__name__, str(e))
            print(dfs, au, ok, bad)
nan = yaml.load(yaml.dump(float('nan'), Dumper=yaml.CSafeDumper), Loader=yaml.CSafeLoader)
print(math.isnan(nan), yaml.dump(float('nan'), Dumper=yaml.CSafeDumper), yaml.dump(-0.0, Dumper=yaml.CSafeDumper))
print(math.copysign(1, yaml.load('-0.0', Loader=yaml.CSafeLoader)))
for w in (10, 20, 40, 80, 200):
    for ind in (2, 3, 4, 8):
        v = {'k': 'word ' * 30, 'l': ['item ' * 15, {'n': 'deep ' * 20}], 'm': {'p': [1, 2, 3], 'q': 'x'}}
        text = yaml.dump(v, Dumper=yaml.CSafeDumper, width=w, indent=ind)
        print(w, ind, yaml.load(text, Loader=yaml.CSafeLoader) == v, len(text.splitlines()), max(len(x) for x in text.splitlines()))
PYEOF
'''

