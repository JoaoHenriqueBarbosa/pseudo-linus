print([c.__name__ for c in (yaml.CLoader, yaml.CSafeLoader, yaml.CFullLoader, yaml.CBaseLoader, yaml.CDumper, yaml.CSafeDumper, yaml.CBaseDumper)])
print([c.__mro__[1].__name__ for c in (yaml.CLoader, yaml.CSafeLoader, yaml.CDumper, yaml.CSafeDumper)])
