tool = "python3"
source = "manual"

# PyYAML 6.0.2 sobre a libyaml 0.2.5 (`yaml._yaml`: `CParser` e `CEmitter`): `CSafeLoader`, `CLoader`,
# `CSafeDumper` e `CDumper` em escalares, coleções, fluxo e bloco, âncoras, tags, documentos múltiplos,
# unicode, largura, indentação, `canonical`, a API de baixo nível (`scan`, `parse`, `compose`, `emit`,
# `serialize`), os erros com a marca de linha e coluna, e um arquivo de configuração lido e regravado.
# Todo script captura as exceções e imprime `type(e).__name__` e `str(e)`, para nenhum caso abortar.

