import yaml


def ev(e):
    parts = [type(e).__name__]
    for a in ('anchor', 'tag', 'implicit', 'value', 'style', 'flow_style', 'explicit', 'version', 'tags'):
        if hasattr(e, a):
            parts.append('%s=%r' % (a, getattr(e, a)))
    parts.append('[%d:%d-%d:%d]' % (e.start_mark.line, e.start_mark.column, e.end_mark.line, e.end_mark.column))
    return ' '.join(parts)


