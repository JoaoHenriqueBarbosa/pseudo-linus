id = "yaml-libyaml-config-file-io"
script = '''
python3 - <<'PYEOF'
import yaml, os, tempfile

cfg = {
    'server': {'host': '0.0.0.0', 'port': 8080, 'tls': {'enabled': False, 'cert': None}},
    'features': ['a', 'b', {'c': True}],
    'limits': {'rate': 1.5, 'burst': 10, 'name': 'caf\u00e9'},
    'motd': 'line one\nline two\n',
    'regex': '^\\\\d+$',
    'empty': [],
    'when': None,
}
d = '/tmp/yaml-config-io'
os.makedirs(d, exist_ok=True)
p = os.path.join(d, 'config.yml')
for dumper, loader in ((yaml.CSafeDumper, yaml.CSafeLoader), (yaml.CDumper, yaml.CLoader)):
    with open(p, 'w', encoding='utf-8') as f:
        r = yaml.dump(cfg, f, Dumper=dumper, sort_keys=False, allow_unicode=True)
        print('dump returned', r)
    with open(p, encoding='utf-8') as f:
        raw = f.read()
    print(raw)
    with open(p, encoding='utf-8') as f:
        back = yaml.load(f, Loader=loader)
    print(back == cfg, back)
    with open(p, 'rb') as f:
        back = yaml.load(f, Loader=loader)
    print(back == cfg)
    with open(p, 'wb') as f:
        yaml.dump(cfg, f, Dumper=dumper, sort_keys=False, encoding='utf-8')
    with open(p, 'rb') as f:
        data = f.read()
    print(data[:60], len(data))
    with open(p, 'wb') as f:
        yaml.dump(cfg, f, Dumper=dumper, sort_keys=False, encoding='utf-16', allow_unicode=True)
    with open(p, 'rb') as f:
        data = f.read()
    print(data[:20], len(data))
    with open(p, 'rb') as f:
        print(yaml.load(f, Loader=loader) == cfg)
    with open(p, 'w', encoding='utf-8') as f:
        yaml.dump_all([cfg, [1, 2], 'x'], f, Dumper=dumper, sort_keys=False, explicit_start=True)
    with open(p, encoding='utf-8') as f:
        docs = list(yaml.load_all(f, Loader=loader))
    print(len(docs), docs[0] == cfg, docs[1:])
    with open(p, 'w', encoding='latin-1') as f:
        yaml.dump({'k': 'caf\u00e9'}, f, Dumper=dumper, allow_unicode=True)
    with open(p, 'rb') as f:
        data = f.read()
    print(data)
    try:
        with open(p, 'rb') as f:
            print(yaml.load(f, Loader=loader))
    except Exception as e:
        print(type(e).__name__, str(e))
    try:
        with open(p, 'w') as f:
            f.write('a: [1, 2\nb: 3\n')
        with open(p) as f:
            yaml.load(f, Loader=loader)
    except yaml.YAMLError as e:
        print(type(e).__name__)
        print(e)
        print(e.problem_mark.name == p, os.path.basename(e.problem_mark.name))
os.remove(p)
os.rmdir(d)
PYEOF
'''
