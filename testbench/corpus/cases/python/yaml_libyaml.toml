import yaml


def tok(t):
    extra = ''
    for a in ('value', 'plain', 'style', 'name', 'handle', 'suffix', 'tag'):
        if hasattr(t, a):
            extra += ' %s=%r' % (a, getattr(t, a))
    return '%s [%d:%d-%d:%d]%s' % (type(t).__name__, t.start_mark.line, t.start_mark.column, t.end_mark.line, t.end_mark.column, extra)


def scan(text, loader=yaml.CSafeLoader):
