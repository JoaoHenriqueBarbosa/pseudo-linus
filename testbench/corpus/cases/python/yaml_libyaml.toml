[[case]]
id = "yaml-libyaml-dump-multiline-and-styles"
script = '''
python3 - <<'PYEOF'
import yaml


def t(value, dumper=yaml.CSafeDumper, **kw):
    try:
        print(ascii(value), kw, '->', ascii(yaml.dump(value, Dumper=dumper, **kw)))
    except Exception as e:
        print(ascii(value), kw, '->', type(e).__name__, str(e))


class Lit(str):
    pass


class Fold(str):
    pass


def lit(d, v):
    return d.represent_scalar('tag:yaml.org,2002:str', v, style='|')


def fold(d, v):
    return d.represent_scalar('tag:yaml.org,2002:str', v, style='>')


class D(yaml.CSafeDumper):
    pass


D.add_representer(Lit, lit)
D.add_representer(Fold, fold)

for text in ['a\nb\n', 'a\nb', 'a\nb\n\n', 'a\nb\n\n\n', '\na\n', ' a\nb\n', 'a\n b\n', 'a\n\nb\n', 'x\n', 'x', '\n', '\n\n', 'a  \nb\n', 'a\t\nb\n', 'a\nb \n', ' \n', '# c\n', 'a: b\nc: d\n', '- x\n', 'line one\nline two\nline three is rather long and keeps going until it needs to be wrapped at the width limit of eighty chars\n']:
    t({'k': text})
    t({'k': Lit(text)}, D)
    t({'k': Fold(text)}, D)
    t([Lit(text), Fold(text)], D, default_flow_style=True)
t({'k': 'a\nb'}, default_style='|')
t({'k': 'a\nb'}, default_style='>')
t({'k': 'a b', 'l': ['x', 1, None, True]}, default_style='"')
t({'k': 'a b', 'l': ['x', 1, None, True]}, default_style="'")
t({'k': 'a b', 'l': ['x', 1, None, True]}, default_style='|')
t({'k': 'a b', 'l': ['x', 1, None, True]}, default_style='>')
t({'k': 'a b', 'l': ['x', 1, None, True]}, default_style='x')
