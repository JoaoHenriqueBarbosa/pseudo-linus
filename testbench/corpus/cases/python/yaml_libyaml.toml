[[case]]
id = "yaml-libyaml-config-compose-roundtrip"
script = '''
python3 - <<'PYEOF'
import yaml

compose = """\
# stack de exemplo
version: "3.8"
x-common: &common
  restart: unless-stopped
  environment:
    TZ: America/Sao_Paulo
    LOG_LEVEL: info
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  web:
    <<: *common
    image: registry.example.com/web:1.4.2
    ports:
      - "8080:80"
      - 8443:443
    environment:
      TZ: UTC
      DEBUG: yes
      EMPTY:
      PORT: 8080
      RATIO: 0.75
      FLAGS: [a, b, c]
    command: ["gunicorn", "-b", "0.0.0.0:8000", "app:app"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db
      - cache
    volumes:
      - ./data:/var/lib/data:ro
      - type: bind
        source: ./conf
        target: /etc/app
  db:
    <<: *common
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "s3cr3t: with colon"
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
  cache:
    image: redis:7
    entrypoint: |
      #!/bin/sh
      exec redis-server "$@"

volumes:
  dbdata: {}
  other:
networks:
  default:
    name: stack_net
"""

workflow = """\
name: CI
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug'
        required: false
        default: false
        type: boolean
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta, nightly]
        include:
          - os: ubuntu-latest
            rust: '1.75'
        exclude:
          - {os: windows-latest, rust: nightly}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Build
        run: |
          cargo build --all-targets --locked
          cargo test --all -- --nocapture
      - name: Long one-liner
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic -A clippy::module_name_repetitions
      - if: ${{ failure() }}
        run: echo "failed on ${{ matrix.os }}"
        continue-on-error: true
        timeout-minutes: 15
  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: >-
          echo deploying
          and more
"""

for label, text in (('compose', compose), ('workflow', workflow)):
    print('=====', label)
    for loader in (yaml.CSafeLoader, yaml.CLoader):
        data = yaml.load(text, Loader=loader)
        print(loader.__name__, type(data).__name__, list(data))
    data = yaml.load(text, Loader=yaml.CSafeLoader)
    print(repr(data))
    for dumper in (yaml.CSafeDumper, yaml.CDumper):
        for kw in ({}, {'sort_keys': False}, {'sort_keys': False, 'default_flow_style': False, 'indent': 2}, {'sort_keys': False, 'default_flow_style': None}, {'default_flow_style': True}, {'sort_keys': False, 'width': 60}, {'sort_keys': False, 'indent': 4, 'width': 1000}, {'sort_keys': False, 'allow_unicode': True, 'explicit_start': True}, {'canonical': True}):
            out = yaml.dump(data, Dumper=dumper, **kw)
            print('--', dumper.__name__, kw)
            print(out)
            back = yaml.load(out, Loader=yaml.CSafeLoader)
            print('roundtrip equal:', back == data)
    node = yaml.compose(text, Loader=yaml.CSafeLoader)
    print(ascii(yaml.serialize(node, Dumper=yaml.CSafeDumper)))
    evs = [type(e).__name__ for e in yaml.parse(text, Loader=yaml.CSafeLoader)]
    print(len(evs), evs[:12])
    toks = [type(t).__name__ for t in yaml.scan(text, Loader=yaml.CSafeLoader)]
    print(len(toks), toks[:12])
    print(ascii(yaml.emit(yaml.parse(text, Loader=yaml.CSafeLoader), Dumper=yaml.CSafeDumper)))
    print(ascii(yaml.emit(yaml.parse(text, Loader=yaml.CSafeLoader), Dumper=yaml.CSafeDumper, canonical=True)))
    print(ascii(yaml.emit(yaml.parse(text, Loader=yaml.CSafeLoader), Dumper=yaml.CSafeDumper, width=40, indent=4)))
    print(yaml.emit(yaml.parse(text, Loader=yaml.CSafeLoader), Dumper=yaml.CSafeDumper) == text)
broken = compose.replace('      - db\n', '    - db\n', 1)
try:
    yaml.load(broken, Loader=yaml.CSafeLoader)
except yaml.YAMLError as e:
    print(type(e).__name__)
    print(e)
broken = workflow.replace("branches: [main, 'release/**']", "branches: [main, 'release/**'")
try:
    yaml.load(broken, Loader=yaml.CSafeLoader)
except yaml.YAMLError as e:
    print(type(e).__name__)
    print(e)
PYEOF
'''

