             lambda: os.utime('/tmp/os-extra-time', ns=(1,)), lambda: os.utime(fd, (1, 2), follow_symlinks=False),
             lambda: os.utime(fd, (1, 2), dir_fd=fd), lambda: os.utime('/tmp/os-extra-time', (float('nan'), 1))):
    try:
