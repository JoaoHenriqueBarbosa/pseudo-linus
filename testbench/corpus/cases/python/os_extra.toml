             lambda: os.getpriority(7, 0), lambda: os.setpriority(os.PRIO_PROCESS, 999999, 0), lambda: os.nice(0) is None,
             lambda: os.sched_setscheduler(0, os.SCHED_FIFO, os.sched_param(1)), lambda: os.sched_setparam(0, (1,)),
             lambda: os.unshare(os.CLONE_NEWNS), lambda: os.setns(999), lambda: os.setns(0), lambda: os.tcgetpgrp(0)):
    try:
        print(call())
    except Exception as e:
        print(type(e).__name__, getattr(e, 'errno', None))
