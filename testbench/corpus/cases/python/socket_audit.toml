[[case]]
id = "socket-audit-repr-and-timeouts"
script = '''
python3 - <<'PY'
import re
import socket
import _socket

def show(text):
    print(re.sub(r"\('127\.0\.0\.1', \d+\)", "(ADDR)", text))

s = socket.socket()
print(repr(s))
print(repr(socket.socket(socket.AF_INET6, socket.SOCK_DGRAM)))
print(repr(_socket.socket()))
print(repr(socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)))
s.bind(("127.0.0.1", 0))
show(repr(s))
s.listen()
c = socket.create_connection(s.getsockname())
show(repr(c))
c.close()
print(repr(c))
s.close()
print(repr(s))
print(type(socket.socket().family), type(socket.socket().type))

t = socket.socket()
print(t.gettimeout(), t.getblocking())
t.settimeout(0)
print(t.gettimeout(), t.getblocking())
t.settimeout(1.5)
print(t.gettimeout(), t.getblocking())
t.setblocking(True)
print(t.gettimeout(), t.getblocking())
t.setblocking(False)
print(t.gettimeout(), t.getblocking())
for value in (1e-12, 0.1, 0.3, 5, True, 2 ** 31, 1e9, -0.0, -1, "a", float("nan"), 10 ** 30,
              float("inf"), -float("inf"), b"x", [1], None):
    try:
        t.settimeout(value)
        print(repr(value), "->", t.gettimeout())
    except Exception as e:
        print(repr(value), type(e).__name__, e)
print(socket.timeout is TimeoutError, socket.error is OSError)
for cls in (socket.gaierror, socket.herror, socket.timeout, socket.error):
    print(cls, cls.__module__, cls.__qualname__, [k.__name__ for k in cls.__mro__])
socket.setdefaulttimeout(2.5)
print(socket.getdefaulttimeout(), socket.socket().gettimeout(), socket.socket().getblocking())
socket.setdefaulttimeout(0)
print(socket.getdefaulttimeout(), socket.socket().gettimeout(), socket.socket().getblocking())
for value in (-1, "a", float("nan"), 3):
    try:
        socket.setdefaulttimeout(value)
        print(repr(value), "->", socket.getdefaulttimeout())
    except Exception as e:
        print(repr(value), type(e).__name__, e)
socket.setdefaulttimeout(None)
print(socket.getdefaulttimeout(), socket.socket().gettimeout())
u = socket.socket()
u.close()
for call in (lambda: u.settimeout(7), lambda: u.setblocking(True), lambda: u.gettimeout(), lambda: u.getblocking()):
    try:
        print(call())
    except Exception as e:
        print(type(e).__name__, e.args)
print(u.gettimeout())
print(type(_socket.CAPI).__name__, re.sub(r"0x[0-9a-f]+", "0xADDR", repr(_socket.CAPI)))
PY
'''
