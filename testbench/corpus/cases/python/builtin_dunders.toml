tool = "python3"
source = "manual"

# Os métodos mágicos dos valores embutidos (`(0).__index__`, `int.__neg__(5)`, `[].__iadd__`...): todo nome do
# `dir()` do tipo existe, é chamável e responde como no CPython 3.13, com o repr de `method-wrapper`,
# `wrapper_descriptor` e `method_descriptor` e os erros de receptor e de aridade dos descritores. O
# `select.epoll.poll` (e portanto o `asyncio.run`) chama `obj.__index__` de um `int`. Os endereços saem
# normalizados para `0xADDR`.

