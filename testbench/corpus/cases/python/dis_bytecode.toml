tool = "python3"
source = "manual"

# Bytecode do CPython 3.13 (wip/notes/python-dis.md): `dis.dis`, `dis.get_instructions`, `co_code`,
# `co_consts`, `co_names`, `co_varnames`, `co_stacksize`, `co_flags`, `co_exceptiontable`, `co_linetable` e
# `co_lines` de uma função (ou de um módulo compilado) por construção da linguagem. O golden é o que o
# compilador do Debian 13 produz; o emissor (`cpybc.rs`, `cpyops.rs`, `opcodenative.rs`) tem de igualar byte a byte.
# Determinístico: todo `0x...` (endereço de objeto código) é trocado por `0xADDR` antes de imprimir, e os
# números de linha são os do próprio script (o heredoc é fixo). O auxiliar `show` é repetido em cada caso
# porque cada caso é um script independente. Códigos aninhados (lambdas, classes, compreensões, funções
# internas) são impressos recursivamente.

