[[case]]
id = "dis-assign-arith"
script = '''
python3 - <<'PYEOF'
import dis, io, re
def fx(s): return re.sub(r"0x[0-9a-f]+", "0xADDR", s)
def show(c, depth=0):
    if hasattr(c, "__code__"): c = c.__code__
    b = io.StringIO(); b.write(dis.Bytecode(c).dis()); print(fx(b.getvalue()))
    print(fx(repr([(i.opname, i.argrepr) for i in dis.get_instructions(c)])))
    print(c.co_code.hex())
    print(fx(repr(c.co_consts)), c.co_names, c.co_varnames, c.co_freevars, c.co_cellvars)
    print(c.co_name, c.co_qualname, c.co_stacksize, c.co_flags, c.co_argcount, c.co_nlocals)
    print(c.co_exceptiontable.hex())
    print(c.co_linetable.hex())
    print(list(c.co_lines()))
    for k in c.co_consts:
        if hasattr(k, "co_code"):
            print("--", k.co_name); show(k, depth + 1)
def f(a, b):
    x = a + b * 2
    y = x - a
    z = x // 3
    return x % y, a ** b, -a, ~b, a << 1, a >> 1, a & b, a | b, a ^ b, a @ b, z, +a, not b
show(f)
PYEOF
'''
tags = ["python", "dis", "bytecode", "arith"]

