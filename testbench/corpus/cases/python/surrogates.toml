tool = "python3"
source = "manual"

# Surrogates soltos (U+D800..U+DFFF) e o plano 16 (U+10D800.., U+10FFFF) no `str` do CPython 3.13:
# len, indexação, fatia, repr, ascii, hash, chr/ord, os codecs com todos os tratadores de erro e as
# mensagens de exceção, fsencode/fsdecode, json, formatação, `re`, `unicodedata`, `isX`, comparação
# e ordenação. Nenhum script imprime um surrogate cru: a saída passa por `ascii()`, `repr()` ou hex.

[[case]]
id = "surrogate-str-basics"
script = '''
python3 - <<'PYEOF'
s = '\ud800\udfff\U0010d800\U0010ffff'
print(len(s), [hex(ord(c)) for c in s])
for i in range(-4, 4):
    print(i, ascii(s[i]))
print(ascii(s[1:3]), ascii(s[::-1]), ascii(s[::2]), ascii(s[3:1:-1]))
print(repr(s), ascii(s))
print(repr('\ud800'), repr('\udfff'), repr('\U0010d800'), repr('\U0010ffff'), repr('\U0010fffd'))
print(ascii('\ud83d\ude00'), len('\ud83d\ude00'), len('\U0001f600'), '\ud83d\ude00' == '\U0001f600')
print(s.count('\ud800'), s.find('\udfff'), s.index('\U0010d800'), s.rfind('\U0010ffff'), '\udfff' in s)
print(ascii(s.replace('\udfff', 'x')), ascii(s.split('\U0010d800')), ascii(s.partition('\udfff')))
print(ascii(s + 'a'), ascii(s * 2), ascii(s.center(8, '\ud800')), ascii(s.ljust(6, '\U0010ffff')))
print(ascii(s.upper()), ascii(s.lower()), ascii(s.swapcase()), ascii(s.title()), ascii(s.casefold()))
print(hash(s) == hash('\ud800\udfff\U0010d800\U0010ffff'), hash('\ud800') == hash('\udfff'))
print(hash('\ud800') == hash('\ud800'), len({'\ud800', '\ud800', '\udfff', '\U0010d800'}))
print(s.isascii(), s.isprintable(), s.isidentifier(), '%r' % s, '%a' % s, '%s' % ascii(s))
print(ascii(str(s)), ascii(str(s.encode('utf-16-le', 'surrogatepass'), 'utf-16-le', 'surrogatepass')))
print(ascii(''.join(reversed(s))), ascii(list(s)), ascii(tuple(s)), ascii({s: 1}))
PYEOF
'''

