        print(type(e).__name__, e)
s = 'a\ud800b\udfffc\U0010d800d\U0010ffffe\ud83d\ude00f\udc00\ud800'
for pat in ['[\ud800-\udfff]', '[\ud800-\udbff]', '[\udc00-\udfff]', '[^\ud800-\udfff]', '[\U0010d800-\U0010ffff]', '[\U00010000-\U0010ffff]',
            '[\ud800\udfff]', '[\ud800-\U0010ffff]', '\ud800', '\udfff', '\U0010ffff', '.', '\\w', '\\W', '\\S', '\\D', '\\s', '[^a-z]', '(?s).', '[\\u0000-\\uffff]',
            '[\\ud800-\\udfff]', '\\ud800', '\\U0010ffff', '[\\U0010d800-\\U0010ffff]', '(?i)\ud800', '(?i)[\ud800-\udfff]']:
    t(lambda: re.findall(pat, s))
    t(lambda: [(m.start(), m.end()) for m in re.finditer(pat, s)])
for pat in ['[\udfff-\ud800]', '[\U0010ffff-\U0010d800]', '[z-a]', '\\ud', '\\U0010', '\\U00110000', '\\Uffffffff', '[\\ud800-]', '[\\udfff-\\ud800]', '(?P<\ud800>x)', '(?P<a\udfff>x)', '\\N{LATIN SMALL LETTER A}', '\\N{NOPE}', '\\N{}', '\\N']:
    t(lambda: re.compile(pat))
t(lambda: re.sub('[\ud800-\udfff]', lambda m: '<%x>' % ord(m.group()), s))
t(lambda: re.sub('[\ud800-\udfff]+', lambda m: '<%d>' % len(m.group()), s))
t(lambda: re.sub('(?P<x>[\U0010d800-\U0010ffff])', lambda m: m.group('x') * 2, s))
t(lambda: re.sub('[\ud800-\udfff]', '\\\\', s))
t(lambda: re.sub('[\ud800-\udfff]', '\ud800', s))
