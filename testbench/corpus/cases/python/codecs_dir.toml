tool = "python3"
source = "manual"

# `codecs` e `_codecs` no CPython 3.13: o `dir()` do módulo `codecs` (puro Python, com os nomes do `_codecs`
# trazidos por `from _codecs import *`), o `__all__`, o tipo, o módulo e a docstring das funções do `_codecs`,
# a identidade `codecs.utf_8_decode is _codecs.utf_8_decode`, os erros de argumento, o contrato de `final`
# (bytes consumidos, `exc.object`/`start`/`end` relativos ao buffer inteiro), `charmap_*`, `escape_*`,
# `unicode_escape_*`, `readbuffer_encode` e o registro de tratadores de erro. O golden vem do oráculo.

[[case]]
id = "codecs-dir-all-and-builtin-identity"
script = '''
python3 - <<'PYEOF'
import codecs, _codecs

def t(f):
    try:
        print(ascii(f()))
    except Exception as e:
        print(type(e).__name__, ascii(str(e)))

print(len(dir(codecs)))
print(' '.join(dir(codecs)))
print(sorted(codecs.__all__))
print(' '.join(dir(_codecs)))
t(lambda: codecs.utf_8_decode.__doc__)
t(lambda: codecs.utf_8_decode.__module__)
t(lambda: type(codecs.utf_8_decode))
t(lambda: codecs.utf_8_decode)
t(lambda: codecs.utf_8_decode is _codecs.utf_8_decode)
t(lambda: all(getattr(codecs, n) is getattr(_codecs, n) for n in dir(_codecs) if not n.startswith('_')))
t(lambda: [hasattr(codecs, n) for n in ('_buffer', '_text', '_wide_decode', '_make', '_cache', '_search', '_CANON')])
t(lambda: (codecs.strict_errors, codecs.strict_errors.__module__, codecs.lookup_error('strict') is codecs.strict_errors))
t(lambda: codecs.surrogateescape if hasattr(codecs, 'surrogateescape') else _codecs.lookup_error('surrogateescape'))
t(lambda: _codecs.lookup_error('surrogatepass'))
t(lambda: codecs.lookup('utf-8').encode is codecs.lookup('UTF8').encode)
PYEOF
'''

