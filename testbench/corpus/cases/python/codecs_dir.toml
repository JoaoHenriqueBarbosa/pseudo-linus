[[case]]
id = "codecs-registry-and-error-handlers"
script = '''
python3 - <<'PYEOF'
import codecs

def t(f):
    try:
        print(ascii(f()))
    except Exception as e:
        print(type(e).__name__, ascii(str(e)))

t(lambda: codecs.lookup('no-such-codec-xyz'))
t(lambda: codecs.lookup(5))
t(lambda: codecs.lookup())
t(lambda: codecs.lookup('utf-8').name)
t(lambda: codecs.lookup('  UTF 8 ').name)
t(lambda: codecs.lookup('latin_1').name)
t(lambda: codecs.register(5))
t(lambda: codecs.register())
seen = []
def search(name):
    seen.append(name)
    if name == 'my_codec':
        return codecs.CodecInfo(lambda s, e='strict': (s.encode('ascii', e), len(s)), lambda b, e='strict': (b.decode('ascii', e), len(b)), name='my-codec')
    return None
t(lambda: codecs.register(search))
t(lambda: codecs.lookup('My Codec').name)
t(lambda: codecs.encode('abc', 'my-codec'))
t(lambda: codecs.decode(b'abc', 'my-codec'))
t(lambda: seen)
t(lambda: codecs.unregister(search))
t(lambda: codecs.unregister(search))
t(lambda: codecs.lookup('my_codec'))
t(lambda: codecs.encode('abc'))
t(lambda: codecs.encode(b'abc'))
t(lambda: codecs.decode('abc'))
t(lambda: codecs.decode(b'a\xffb', 'utf-8', 'replace'))
t(lambda: codecs.encode('abc', encoding='utf-16-le'))
t(lambda: codecs.encode('abc', encoding=5))
t(lambda: codecs.encode('abc', 'hex'))
t(lambda: codecs.decode('616263', 'hex'))
t(lambda: codecs.lookup_error('strict'))
t(lambda: codecs.lookup_error('nope'))
t(lambda: codecs.lookup_error(5))
t(lambda: codecs.register_error('x'))
t(lambda: codecs.register_error('x', 5))
t(lambda: codecs.register_error(5, print))
def h(exc):
    return ('<%s:%d:%d>' % (type(exc).__name__, exc.start, exc.end), exc.end)
t(lambda: codecs.register_error('my.handler', h))
t(lambda: codecs.lookup_error('my.handler') is h)
for name in ('strict', 'ignore', 'replace', 'xmlcharrefreplace', 'backslashreplace', 'namereplace', 'surrogateescape', 'surrogatepass'):
    t(lambda: codecs.lookup_error(name)(UnicodeEncodeError('utf-8', 'a\udc80b€', 1, 4, 'why')))
    t(lambda: codecs.lookup_error(name)(UnicodeDecodeError('utf-8', b'a\x80\xedb', 1, 3, 'why')))
    t(lambda: codecs.lookup_error(name)(UnicodeTranslateError('a€b', 1, 2, 'why')))
    t(lambda: codecs.lookup_error(name)(ValueError('x')))
    t(lambda: codecs.lookup_error(name)(5))
t(lambda: codecs.lookup_error('surrogatepass')(UnicodeDecodeError('utf-8', b'a\xed\xa0\x80b', 1, 3, 'why')))
t(lambda: codecs.lookup_error('surrogatepass')(UnicodeDecodeError('utf-16-le', b'a\x00\x00\xd8', 2, 4, 'why')))
t(lambda: codecs.lookup_error('surrogatepass')(UnicodeEncodeError('utf-16-be', '\ud800', 0, 1, 'why')))
t(lambda: codecs.lookup_error('surrogatepass')(UnicodeEncodeError('ascii', '\ud800', 0, 1, 'why')))
t(lambda: codecs.lookup_error('surrogateescape')(UnicodeDecodeError('utf-8', b'a\x80\x81\x82\x83\x84', 1, 6, 'why')))
t(lambda: codecs.lookup_error('surrogateescape')(UnicodeDecodeError('utf-8', b'ab', 1, 2, 'why')))
PYEOF
'''
