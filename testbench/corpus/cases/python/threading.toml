script = '''
python3 - <<'PYEOF'
import fcntl, os, threading, time
path = '/tmp/thr-flock.lock'
a = open(path, 'w')
b = open(path, 'w')
fcntl.flock(a, fcntl.LOCK_EX)
log = []
def holder():
    time.sleep(0.1)
    log.append('release')
    fcntl.flock(a, fcntl.LOCK_UN)
t = threading.Thread(target=holder)
t.start()
try:
    fcntl.flock(b, fcntl.LOCK_EX | fcntl.LOCK_NB)
except OSError as e:
    log.append(('nb', e.errno))
fcntl.flock(b, fcntl.LOCK_EX)
log.append('acquired')
t.join()
print(log)
fcntl.flock(b, fcntl.LOCK_UN)
os.unlink(path)
PYEOF
'''
