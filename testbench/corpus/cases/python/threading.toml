print(sorted(n for n in ("acquire_lock", "release_lock", "locked_lock", "_at_fork_reinit", "acquire", "release", "locked", "__enter__", "__exit__") if hasattr(l, n)))
try:
    class Sub(_thread.lock): pass
except TypeError as e:
    print("TypeError", e)
try:
    _thread.lock(1)
except TypeError as e:
    print("TypeError", e)
print(_thread.TIMEOUT_MAX == threading.TIMEOUT_MAX, _thread.error is RuntimeError, threading.ThreadError is RuntimeError)
