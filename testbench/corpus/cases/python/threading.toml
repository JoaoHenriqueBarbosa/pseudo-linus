tool = "python3"
source = "manual"

# `threading` e `_thread` (wip/notes/python-fork.md): nomes de thread, ident e native_id, travões, Condition,
# excepthook, `_thread.start_new_thread`, ordem do desligamento e bloqueio cooperativo. Nada não determinístico
# aparece na saída: ids, tempos e endereços nunca são impressos, só comparações e formatos normalizados.

