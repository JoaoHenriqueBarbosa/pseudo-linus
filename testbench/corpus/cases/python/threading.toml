script = '''
python3 - <<'PYEOF'
import sys, threading
events = []
def prof(frame, event, arg):
    if frame.f_code.co_name == "target": events.append(("profile", event))
def target(): pass
threading.setprofile(prof)
print(threading.getprofile() is prof, threading.gettrace())
t = threading.Thread(target=target); t.start(); t.join()
threading.setprofile(None)
print(events[:2], sys.getprofile())
def tr(frame, event, arg):
    if frame.f_code.co_name == "target": events.append(("trace", event))
    return tr
threading.settrace(tr)
t = threading.Thread(target=target); t.start(); t.join()
threading.settrace(None)
print([e for e in events if e[0] == "trace"][:2], sys.gettrace())
PYEOF
'''
