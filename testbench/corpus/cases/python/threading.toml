[[case]]
id = "thread-lock-cross-thread-release"
script = '''
python3 - <<'PYEOF'
import threading
l = threading.Lock()
l.acquire()
done = []
def releaser():
    l.release()
    done.append("released")
t = threading.Thread(target=releaser); t.start(); t.join()
print(done, l.locked())
l.acquire()
order = []
def holder():
    with l:
        order.append("worker got it")
    order.append("worker done")
l.release()
t = threading.Thread(target=holder)
l.acquire()
t.start()
order.append("main holds")
l.release()
order.append("main released")
t.join()
print(order)
PYEOF
'''
