import re, threading
def norm(s): return re.sub(r"\d{3,}", "N", s)
def worker(): pass
t = threading.Thread(target=worker, daemon=True)
print(norm(repr(t)), t.ident, t.native_id, t.is_alive(), t.daemon)
try:
    t.join()
except RuntimeError as e:
    print("join", e)
t.start()
print(norm(repr(t)), t.ident is not None, t.native_id is not None, t.is_alive())
try:
    t.start()
except RuntimeError as e:
    print("start", e)
try:
    t.daemon = False
except RuntimeError as e:
    print("daemon", e)
t.join()
print(norm(repr(t)), t.is_alive(), t.ident is not None)
n = threading.Thread(target=worker)
print(n.daemon, threading.Thread(target=worker, daemon=False).daemon)
try:
    threading.current_thread().join()
except RuntimeError as e:
    print("current", e)
m = threading.main_thread()
print(norm(repr(m)), m.is_alive(), m.daemon, m.ident == threading.get_ident(), m.native_id == threading.get_native_id())
try:
    threading.Thread(group=1)
except AssertionError as e:
    print("group", e)
