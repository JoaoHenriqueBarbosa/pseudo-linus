# O processo que espera um filho (leitura do pipe até o EOF, `wait`, `waitid`) não pode parar a thread do servidor
# que o próprio filho precisa para terminar: o `read` bloqueante do `stdout` do `check_output` e do `run` soltam a GIL.
[[case]]
id = "threading-server-thread-subprocess-run-stdout-only"
script = '''
cd /tmp
mkdir -p thr-site && echo "olá" > thr-site/a.txt
python3 - <<'PYEOF'
import http.server, threading, subprocess, functools
H = functools.partial(http.server.SimpleHTTPRequestHandler, directory='/tmp/thr-site')
http.server.SimpleHTTPRequestHandler.log_message = lambda *a: None
s = http.server.ThreadingHTTPServer(('127.0.0.1', 0), H)
url = 'http://127.0.0.1:%d/a.txt' % s.server_address[1]
threading.Thread(target=s.serve_forever, daemon=True).start()
r = subprocess.run(['curl', '-s', url], stdout=subprocess.PIPE)
print(r.returncode, r.stdout)
r = subprocess.run(['curl', '-s', '-w', ' %{http_code}', url], capture_output=True, text=True)
print(r.returncode, repr(r.stdout), repr(r.stderr))
print(repr(subprocess.check_output(['curl', '-s', url], text=True)))
s.shutdown()
PYEOF
'''
tags = ["threading", "subprocess", "net"]

