import re, _thread, threading
def norm(s): return re.sub(r"0x[0-9a-f]+", "0xADDR", s)
l = threading.Lock()
print(norm(repr(l)), type(l) is _thread.lock, _thread.LockType is _thread.lock, threading.Lock is _thread.lock)
print(l.acquire(), norm(repr(l)), l.locked(), l.acquire(False), l.acquire(blocking=False))
l.release()
print(l.locked())
try:
    l.release()
except RuntimeError as e:
    print("RuntimeError", e)
with l:
    print("in", l.locked())
print(l.acquire(True, 0), l.acquire(timeout=0.01), l.acquire(True, 0.01))
l.release()
for args in [(False, 1), (True, -2), (True, 1e30), (False, 0)]:
    try:
        print(args, l.acquire(*args))
    except (ValueError, OverflowError) as e:
        print(type(e).__name__, e)
    else:
