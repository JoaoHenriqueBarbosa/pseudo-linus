tool = "archive"
source = "manual"

# tar -c sobre a fixture (datas fixas, dono root): o arquivo gerado entra na árvore final e é
# comparado byte a byte com o do GNU tar 1.35. Sem links simbólicos sem --mtime, porque o oráculo não
# fixa a data deles.

[[case]]
id = "tar-create-gnu"
argv = ["tar", "--sort=name", "--format=gnu", "-cf", "out.tar", "dir"]
tags = ["tar", "create", "gnu"]
[case.files]
"dir" = { dir = true, mode = 0o755 }
"dir/a.txt" = { content = "hello world\n", mode = 0o644 }
"dir/b.txt" = { content = "bee\n", mode = 0o640 }
"dir/run.sh" = { content = "#!/bin/sh\necho hi\n", mode = 0o755 }
"dir/sub" = { dir = true, mode = 0o750 }
"dir/sub/c.txt" = { content = "sea\n", mode = 0o600 }
"dir/sub/deep" = { dir = true, mode = 0o755 }
"dir/sub/deep/d.txt" = { content = "deep\n", mode = 0o644 }
"dir/empty" = { dir = true, mode = 0o700 }
"dir/sp ace.txt" = { content = "space\n", mode = 0o644 }

