tool = "archive"
source = "manual"

# Saída do gzip 1.13 byte a byte (deflate.c e trees.c do próprio gzip): todos os níveis em texto,
# binário e dado repetido, tamanhos em volta da janela de 32 KiB e do deslize em 64 KiB, vários
# arquivos na mesma execução (a janela do C é global e os bytes velhos influenciam o fim do arquivo
# seguinte), entrada em pedaços pelo pipe, --rsyncable e tar -z. Compara pelo md5 da saída.

[[case]]
id = "gzip-deflate-levels-text"
script = '''
for i in $(seq 1 3000); do echo "$i $((i*i % 977)) linha $((i % 13)) $((i*7919 % 10007))"; done > t.txt
for l in 1 2 3 4 5 6 7 8 9; do printf '%s ' $l; gzip -$l -n -c t.txt | md5sum; done
'''
tags = ["gzip", "compress", "deflate"]

[[case]]
id = "gzip-deflate-levels-binary"
script = '''
seq 1 50000 | awk '{printf "%02x", ($1*7919 + $1*$1*31) % 256}' | xxd -r -p > b.bin
head -c 100000 /dev/zero > z.bin
for f in b.bin z.bin; do for l in 1 3 4 6 9; do printf '%s %s ' $f $l; gzip -$l -n -c $f | md5sum; done; done
'''
tags = ["gzip", "compress", "deflate"]

[[case]]
id = "gzip-deflate-window-sizes"
script = '''
seq 1 30000 > n.txt
for s in 1 2 3 258 262 32768 65274 65535 65536 65537 98304; do
  printf '%s ' $s
  for l in 1 4 9; do head -c $s n.txt | gzip -$l -n | md5sum | cut -c1-12 | tr '\n' ' '; done
  echo
done
'''
tags = ["gzip", "compress", "deflate"]

[[case]]
id = "gzip-deflate-stale-window"
script = '''
seq 1 30000 > n.txt
seq 1 2000 | awk '{printf "%02x", ($1*31 + 7) % 256}' | xxd -r -p > b.bin
for i in 1 2 3; do head -c 70000 n.txt > p$i; head -c $((300 * i)) b.bin >> p$i; done
head -c 140 n.txt > q
gzip -n -c p1 q p2 q p3 q | md5sum
gzip -9 -n -c q p3 q | md5sum
'''
tags = ["gzip", "compress", "deflate"]

[[case]]
id = "gzip-deflate-pipe-chunks"
script = '''
seq 1 30000 > n.txt
(head -c 1000 n.txt; sleep 0.1; head -c 70000 n.txt; sleep 0.1; head -c 5 n.txt) | gzip -n | md5sum
'''
tags = ["gzip", "compress", "deflate", "stdin"]

[[case]]
id = "gzip-deflate-rsyncable"
script = '''
seq 1 40000 > n.txt
for i in $(seq 1 3000); do echo "$i $((i*i % 977)) linha $((i*7919 % 10007))"; done > t.txt
for l in 1 6 9; do gzip --rsyncable -$l -n -c n.txt t.txt | md5sum; done
'''
tags = ["gzip", "compress", "deflate", "rsyncable"]

[[case]]
id = "gzip-deflate-tar-z"
script = '''
mkdir d
seq 1 20000 > d/n.txt
for i in $(seq 1 2000); do echo "linha $i $((i*7919 % 10007))"; done > d/t.txt
touch -d '2026-01-15 12:00:00' d d/*
tar --owner=0 --group=0 --numeric-owner -czf - d | md5sum
'''
tags = ["gzip", "tar", "deflate"]
