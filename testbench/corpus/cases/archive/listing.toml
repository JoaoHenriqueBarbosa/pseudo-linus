tool = "archive"
source = "manual"

# Casos de CLI de compressão e arquivo com fixtures binárias geradas pelo próprio oráculo (GNU tar 1.35,
# gzip 1.13, bzip2 1.0.8, xz 5.8.1, lzip 1.25, zstd 1.5.7, Info-ZIP zip 3.0) e embutidas em base64.
# A árvore de origem tem modos variados (0755, 0444, 04755, 01777, 0750, 0600), symlink, hardlink,
# nome com espaço e Unicode, caminho de 140 bytes (cabe no prefixo do ustar) e, só nos formatos que
# suportam, caminho de mais de 255 bytes e alvo de symlink de 120 bytes. Todos os casos têm a tag
# "formatter": o experimento f08 roda sobre eles o shim de CLI nosso (crates + formatadores finos).

[[case]]
id = "tar-tv-ustar"
argv = ["tar", "tvf", "ustar.tar.gz"]
tags = ["formatter", "tar-tv", "ustar"]
[case.files]
"ustar.tar.gz" = { content_b64 = "" }

[[case]]
id = "tar-tzv-ustar"
argv = ["tar", "-tzvf", "ustar.tar.gz"]
tags = ["formatter", "tar-tv", "ustar"]
[case.files]
