tool = "archive"
source = "manual"

# tar -x sobre arquivos que o GNU tar 1.35 gerou (com link simbólico e link físico, datas fixas).

[[case]]
id = "tar-x-verbose"
argv = ["tar", "-xvzf", "a.tgz"]
tags = ["tar", "extract"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-vv"
argv = ["tar", "-xvvzf", "a.tgz"]
tags = ["tar", "extract", "verbose"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-strip-chdir"
argv = ["tar", "-xvzf", "a.tgz", "-C", "out", "--strip-components=1"]
tags = ["tar", "extract", "strip"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"out" = { dir = true, mode = 0o755 }

[[case]]
id = "tar-x-chdir-missing"
argv = ["tar", "-xzf", "a.tgz", "-C", "nope"]
tags = ["tar", "extract", "error"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-members"
argv = ["tar", "-xvzf", "a.tgz", "dir/sub", "dir/nope"]
tags = ["tar", "extract", "members"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-wildcards"
argv = ["tar", "-xvzf", "a.tgz", "--wildcards", "dir/*.txt"]
tags = ["tar", "extract", "members"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-exclude"
argv = ["tar", "-xvzf", "a.tgz", "--exclude=*.txt", "--exclude=deep"]
tags = ["tar", "extract", "exclude"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-keep-old"
argv = ["tar", "-xkzf", "a.tgz"]
tags = ["tar", "extract", "existing"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"dir/a.txt" = { content = "local\n", mode = 0o600 }
"dir/b.txt" = { content = "lb\n", mode = 0o644 }

[[case]]
id = "tar-x-skip-old"
argv = ["tar", "-xvzf", "a.tgz", "--skip-old-files", "dir/a.txt", "dir/run.sh"]
tags = ["tar", "extract", "existing"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"dir/a.txt" = { content = "local\n", mode = 0o600 }
"dir/b.txt" = { content = "lb\n", mode = 0o644 }

[[case]]
id = "tar-x-replace"
argv = ["tar", "-xzf", "a.tgz"]
tags = ["tar", "extract", "existing"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"dir/a.txt" = { content = "local\n", mode = 0o600 }
"dir/b.txt" = { content = "lb\n", mode = 0o644 }

[[case]]
id = "tar-x-overwrite"
argv = ["tar", "-xzf", "a.tgz", "--overwrite", "dir/b.txt"]
tags = ["tar", "extract", "existing"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"dir/a.txt" = { content = "local\n", mode = 0o600 }
"dir/b.txt" = { content = "lb\n", mode = 0o644 }

[[case]]
id = "tar-x-conflicts"
argv = ["tar", "-xzf", "a.tgz"]
tags = ["tar", "extract", "existing"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"dir/a.txt/inner" = { dir = true, mode = 0o755 }
"dir/sub" = { content = "x", mode = 0o644 }

[[case]]
id = "tar-x-to-stdout"
argv = ["tar", "-xOvzf", "a.tgz", "dir/a.txt", "dir/sub"]
tags = ["tar", "extract", "stdout"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-one-top-level"
argv = ["tar", "-xzf", "a.tgz", "--one-top-level=top"]
tags = ["tar", "extract"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-transform"
argv = ["tar", "-xvzf", "a.tgz", "--transform=s,^dir,renamed,", "--show-transformed-names"]
tags = ["tar", "extract", "transform"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-hardlink-missing"
argv = ["tar", "-xzf", "a.tgz", "dir/hard"]
tags = ["tar", "extract", "error"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-occurrence"
argv = ["tar", "-xvzf", "a.tgz", "--occurrence=1", "dir/a.txt"]
tags = ["tar", "extract", "members"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-no-same-perms"
argv = ["tar", "-xzf", "a.tgz", "--no-same-permissions", "--no-same-owner"]
tags = ["tar", "extract"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-x-pax"
argv = ["tar", "-xvf", "p.tar"]
tags = ["tar", "extract", "pax"]
[case.files]
"p.tar" = { content_b64 = "", mode = 0o644 }
