tool = "archive"
source = "manual"

# xz 5.8.1 (e unxz, xzcat, lzma, unlzma, lzcat): compressão e descompressão em arquivo, -v com as
# unidades do xz, -l/-lv/--robot, fluxos concatenados, enchimento, lixo no fim (fim inesperado ou
# dado corrompido), .lzma e .lz lidos pelo modo automático, conferências de entrada, sufixos e erros.
# Fixtures geradas pelo xz e pelo lzip do oráculo.

[[case]]
id = "xz-compress-file"
argv = ["xz", "a.txt"]
tags = ["xz", "compress"]
[case.files]
"a.txt" = "hello world\n"

[[case]]
id = "xz-compress-verbose-keep"
argv = ["xz", "-kv", "a.txt"]
tags = ["xz", "compress", "verbose"]
[case.files]
"a.txt" = "hello world\n"

