tool = "archive"
source = "manual"

# -r, -u, -A, --delete e -d sobre arquivos do GNU tar 1.35; o arquivo resultante entra na árvore
# final e é comparado byte a byte.

[[case]]
id = "tar-r-append"
argv = ["tar", "-rvf", "small.tar", "dir/new.txt"]
tags = ["tar", "append"]
[case.files]
"small.tar" = { content_b64 = "", mode = 0o644 }
"dir/new.txt" = { content = "new\n", mode = 0o644 }

[[case]]
id = "tar-r-append-records"
argv = ["tar", "-rvf", "two.tar", "dir/new.txt"]
tags = ["tar", "append"]
[case.files]
"two.tar" = { content_b64 = "", mode = 0o644 }
"dir/new.txt" = { content = "new\n", mode = 0o644 }

[[case]]
id = "tar-u-update"
argv = ["tar", "-uvf", "two.tar", "dir"]
tags = ["tar", "update"]
[case.files]
"two.tar" = { content_b64 = "", mode = 0o644 }
"dir/a.txt" = { content = "hello world\n", mode = 0o644 }
"dir/b.txt" = { content = "bee\n", mode = 0o640 }
"dir/new.txt" = { content = "new\n", mode = 0o644 }

[[case]]
id = "tar-delete"
argv = ["tar", "--delete", "-vf", "two.tar", "dir/a.txt", "nope"]
tags = ["tar", "delete"]
[case.files]
"two.tar" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-delete-stdin"
argv = ["tar", "--delete", "dir/b.txt"]
tags = ["tar", "delete"]
stdin_b64 = ""

[[case]]
id = "tar-A-catenate"
argv = ["tar", "-Af", "two.tar", "other.tar"]
tags = ["tar", "catenate"]
[case.files]
"two.tar" = { content_b64 = "", mode = 0o644 }
"other.tar" = { content_b64 = "", mode = 0o644 }

[[case]]
id = "tar-d-compare"
argv = ["tar", "-dvzf", "a.tgz"]
tags = ["tar", "compare"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"dir/a.txt" = { content = "hello WORLD\n", mode = 0o644 }
"dir/b.txt" = { content = "bee\n", mode = 0o600 }
"dir/run.sh" = { content = "#!/bin/sh\nx\n", mode = 0o755 }
"dir/sub" = { dir = true, mode = 0o755 }
"dir/link" = { symlink = "b.txt" }

[[case]]
id = "tar-d-compare-quiet"
argv = ["tar", "-dzf", "a.tgz", "dir/sub", "dir/b.txt"]
tags = ["tar", "compare"]
[case.files]
"a.tgz" = { content_b64 = "", mode = 0o644 }
"dir/a.txt" = { content = "hello WORLD\n", mode = 0o644 }
"dir/b.txt" = { content = "bee\n", mode = 0o600 }
"dir/run.sh" = { content = "#!/bin/sh\nx\n", mode = 0o755 }
"dir/sub" = { dir = true, mode = 0o755 }
"dir/link" = { symlink = "b.txt" }
