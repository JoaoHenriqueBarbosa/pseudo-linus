tool = "archive"
source = "agent-style"

# Duas funções do unzip 6.0 que dependem do campo extra do membro, com os zips montados byte a byte
# (método "stored", data DOS 1980-01-01 00:00).
#
# VMS (t.txt): "version made by" com host 2 (VMS), atributo interno 1 (texto) e, no extra local e no
# central, o bloco 0x000c da PKWARE: CRC-32 dos itens (0xdc6e5ac6) e o item VMSATR_C_RECATTR (tag 4,
# tamanho 1) com o formato de registro 2 (variável). O conteúdo são dois registros de 1 byte, cada um
# com o byte de preenchimento: 01 00 'A' 00 01 00 'B' 00 (CRC-32 0x177f4cdc). Com -a vira "A\nB\n";
# sem -a sai cru.
#
# RISC OS (prog, vazio): host 3, extra 0x4341 de 20 bytes com "ARC0", endereço de carga 0xfffffe00
# (tipo de arquivo ffe), execução 0, atributos 3. Com -F o nome ganha ",ffe".

[[case]]
id = "unzip-vms-varlen-a"
script = "printf '\\x50\\x4b\\x03\\x04\\x0a\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x21\\x00\\xdc\\x4c\\x7f\\x17\\x08\\x00\\x00\\x00\\x08\\x00\\x00\\x00\\x05\\x00\\x0d\\x00t.txt\\x0c\\x00\\x09\\x00\\xc6\\x5a\\x6e\\xdc\\x04\\x00\\x01\\x00\\x02\\x01\\x00\\x41\\x00\\x01\\x00\\x42\\x00\\x50\\x4b\\x01\\x02\\x14\\x02\\x0a\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x21\\x00\\xdc\\x4c\\x7f\\x17\\x08\\x00\\x00\\x00\\x08\\x00\\x00\\x00\\x05\\x00\\x0d\\x00\\x00\\x00\\x00\\x00\\x01\\x00\\x00\\x00\\xa4\\x81\\x00\\x00\\x00\\x00t.txt\\x0c\\x00\\x09\\x00\\xc6\\x5a\\x6e\\xdc\\x04\\x00\\x01\\x00\\x02\\x50\\x4b\\x05\\x06\\x00\\x00\\x00\\x00\\x01\\x00\\x01\\x00\\x40\\x00\\x00\\x00\\x38\\x00\\x00\\x00\\x00\\x00' > v.zip; unzip -a v.zip; echo \"exit=$?\"; rm -f v.zip; ls; od -c t.txt"
tags = ["cli", "unzip", "vms"]

[[case]]
id = "unzip-vms-varlen-binary"
script = "printf '\\x50\\x4b\\x03\\x04\\x0a\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x21\\x00\\xdc\\x4c\\x7f\\x17\\x08\\x00\\x00\\x00\\x08\\x00\\x00\\x00\\x05\\x00\\x0d\\x00t.txt\\x0c\\x00\\x09\\x00\\xc6\\x5a\\x6e\\xdc\\x04\\x00\\x01\\x00\\x02\\x01\\x00\\x41\\x00\\x01\\x00\\x42\\x00\\x50\\x4b\\x01\\x02\\x14\\x02\\x0a\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x21\\x00\\xdc\\x4c\\x7f\\x17\\x08\\x00\\x00\\x00\\x08\\x00\\x00\\x00\\x05\\x00\\x0d\\x00\\x00\\x00\\x00\\x00\\x01\\x00\\x00\\x00\\xa4\\x81\\x00\\x00\\x00\\x00t.txt\\x0c\\x00\\x09\\x00\\xc6\\x5a\\x6e\\xdc\\x04\\x00\\x01\\x00\\x02\\x50\\x4b\\x05\\x06\\x00\\x00\\x00\\x00\\x01\\x00\\x01\\x00\\x40\\x00\\x00\\x00\\x38\\x00\\x00\\x00\\x00\\x00' > v.zip; unzip v.zip; echo \"exit=$?\"; rm -f v.zip; ls; od -c t.txt"
tags = ["cli", "unzip", "vms"]

