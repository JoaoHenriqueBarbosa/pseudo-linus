tool = "archive"
source = "manual"

# gzip 1.13 (e os scripts gunzip e zcat do Debian): compressão e descompressão em arquivo, nomes de
# saída e sufixos, -k/-f/-c/-v/-q/-n/-N/-S, -l com as contas de razão, -t, membros concatenados,
# sobras no fim, cabeçalhos com flags e todos os tipos de erro de dados. As fixtures .gz foram
# geradas pelo gzip do oráculo (e as corrompidas, a partir delas); as entradas de texto são pequenas,
# pra que a saída comprimida seja reprodutível byte a byte.

[[case]]
id = "gzip-compress-file"
argv = ["gzip", "a.txt"]
tags = ["gzip", "compress"]
[case.files]
"a.txt" = "hello world\n"

[[case]]
id = "gzip-compress-verbose"
argv = ["gzip", "-v", "a.txt", "p.txt"]
tags = ["gzip", "compress", "verbose"]
[case.files]
"a.txt" = "hello world\n"
"p.txt" = "plain text\nplain text\nplain text\n"

[[case]]
id = "gzip-keep-verbose"
argv = ["gzip", "-kv", "p.txt"]
tags = ["gzip", "compress", "verbose"]
[case.files]
"p.txt" = "plain text\nplain text\nplain text\n"

