tool = "lzmainfo"
source = "manual"

# lzmainfo do xz-utils 5.8.1: tabela do cabeçalho de 13 bytes do .lzma (lc/lp/pb, dicionário com
# potência de dois e MB arredondado, tamanho conhecido, desconhecido ou enorme), cabeçalho recusado,
# linhas em branco entre arquivos, entrada padrão e opções. Fixtures montadas à mão no oráculo.

[[case]]
id = "lzmainfo-real-file"
argv = ["lzmainfo", "t.lzma"]
tags = ["lzmainfo"]
[case.files]
"t.lzma" = { content_b64 = "XQAAgAD//////////wA0GUnujekXiTozX/2BRBNUJ///+umAAA==" }

[[case]]
id = "lzmainfo-known-size-nonpow2-dict"
argv = ["lzmainfo", "a.lzma"]
tags = ["lzmainfo"]
[case.files]
"a.lzma" = { content_b64 = "XQAAAAMFAAAAAAAAAA==" }

[[case]]
id = "lzmainfo-unknown-size"
argv = ["lzmainfo", "b.lzma"]
tags = ["lzmainfo"]
[case.files]
