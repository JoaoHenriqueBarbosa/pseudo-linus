tool = "archive"
source = "manual"

# tar -t sobre arquivos do GNU tar 1.35 e variações corrompidas (cabeçalho ruim, bloco de zeros
# sozinho, truncado, gzip quebrado), estilos de citação e seleção de membros.

[[case]]
id = "tar-t-corrupt-first"
argv = ["tar", "-tf", "t.tar"]
tags = ["tar", "read", "corrupt"]
[case.files]
"t.tar" = { content_b64 = "", mode = 0o644 }

