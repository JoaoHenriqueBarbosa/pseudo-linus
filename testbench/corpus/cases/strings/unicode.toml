tool = "strings"
source = "manual"

# -U/--unicode: sequências UTF-8 (líder c0..ff, continuação 80..bf) contam como um caractere;
# escape com as contas do original (a de quatro bytes não dá o código Unicode), hex, locale (só o
# primeiro byte), invalid (não gráfico), highlight fora de terminal (igual ao escape) e o defeito de
# deslocamento +2^32 da cadeia que começa no byte devolvido depois de uma sequência inválida.

[[case]]
id = "strings-unicode-escape"
argv = ["strings", "-U", "e", "utf"]
tags = ["unicode"]
[case.files]
"utf" = { content_b64 = "Y2Fmw6kgYXUgbGFpdABldXJvIOKCrCBzaWduAHNtaWxlIPCfmIAgZmFjZQBiYWQgwyBieXRlIGhlcmUAb3ZlciDAryBsb25nAHN1cnIg7aCAIGdhdGUAZml2ZSD4iICAgCBieXRlAMOpw6kAw6nDqcOpw6kAeOKCrHkAdHJ1bmMg4oI=" }

