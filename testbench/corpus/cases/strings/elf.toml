tool = "strings"
source = "manual"

# -d/--data: só as seções ELF alocadas com conteúdo, cada uma varrida separadamente (cadeias não
# atravessam a fronteira entre seções). t64.o e t32.o saem do `as` do binutils 2.44 (fonte com
# .text, .data, .rodata, .bss, .comment, .mynote alocada, .myw/.myw2 contíguas e .nonalloc); as
# outras fixtures foram montadas com struct do Python: ELF32/64 big endian, seção que passa do fim do
# arquivo, índice de tabela de nomes corrompido, seções sobrepostas, só seção não alocada (volta a
# varrer tudo), core (não reconhecido) e arquivo menor que o cabeçalho.

[[case]]
id = "strings-data-elf64"
argv = ["strings", "-d", "-t", "x", "t64.o"]
tags = ["data", "elf"]
[case.files]
"t64.o" = { content_b64 = "" }

[[case]]
id = "strings-all-elf64"
argv = ["strings", "-t", "x", "t64.o"]
tags = ["elf"]
[case.files]
"t64.o" = { content_b64 = "" }

[[case]]
id = "strings-data-long-names"
argv = ["strings", "--data", "-f", "t64.o", "t32.o"]
tags = ["data", "elf", "names"]
[case.files]
"t64.o" = { content_b64 = "" }
"t32.o" = { content_b64 = "" }

[[case]]
id = "strings-data-then-dash"
argv = ["strings", "-d", "-t", "x", "t32.o", "-", "t32.o"]
