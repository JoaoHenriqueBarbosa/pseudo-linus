tool = "strings"
source = "manual"

# Varredura padrão do strings do binutils 2.44: mínimo de caracteres (-n, --bytes, -NUM com bases
# do strtoul), deslocamentos (-t o/d/x, -o), nome do arquivo (-f), separador (-s), espaço em branco
# (-w), 8 bits (-e S), stdin e vários arquivos. A fixture `a` mistura cadeias curtas, controle, tab,
# DEL e um byte 0xff; `ws` tem \n, \r, \f e \v no meio das cadeias.

[[case]]
id = "strings-default"
argv = ["strings", "a"]
tags = ["scan"]
[case.files]
"a" = { content_b64 = "aGVsbG8gd29ybGQAYWJjAGFiY2QAAQJsb25nZXIgc3RyaW5nIGhlcmUKc2Vjb25kIGxpbmUJdGFif/94eXp3AA==" }

