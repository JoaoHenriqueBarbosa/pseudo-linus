tool = "strings"
source = "manual"

# Caracteres de 16 e 32 bits (-e l/b/L/B): leitura em pares ou quádruplas, retomada um byte depois
# do início do caractere não gráfico (o que acha cadeias em deslocamento ímpar e em dado de outra
# ordem de bytes), caractere incompleto no fim e -w.

[[case]]
id = "strings-e-l"
argv = ["strings", "-e", "l", "w16"]
tags = ["encoding"]
[case.files]
"w16" = { content_b64 = "aABlAGwAbABvAAAA6QB0AG8AbwBvAAAAeAA=" }

