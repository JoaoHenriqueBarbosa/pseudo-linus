tool = "strings"
source = "manual"

# Erros e mensagens: arquivo inexistente, diretório, caminho com componente que não é diretório,
# validação do mínimo (-n e -NUM, inclusive o elemento do argv permutado que o original lê),
# argumentos inválidos de -t/-e/-U (os dois primeiros imprimem o uso no stderr), opções
# desconhecidas, --help (uso no stdout com a linha de bugs), versão e o operando `-` sozinho.

[[case]]
id = "strings-nonexist"
argv = ["strings", "nonexist"]
tags = ["error"]

[[case]]
id = "strings-nonexist-then-file"
argv = ["strings", "nonexist", "a", "missing"]
tags = ["error"]
[case.files]
"a" = "hello\u0000"

[[case]]
id = "strings-directory"
argv = ["strings", "d", "a"]
tags = ["error"]
[case.files]
"a" = "hello\u0000"
"d" = { dir = true }

[[case]]
id = "strings-not-a-directory"
argv = ["strings", "a/b"]
tags = ["error"]
[case.files]
"a" = "hello\u0000"

[[case]]
id = "strings-empty-name"
argv = ["strings", ""]
tags = ["error"]

[[case]]
id = "strings-broken-symlink"
argv = ["strings", "broken"]
tags = ["error"]
[case.files]
"broken" = { symlink = "nowhere" }

[[case]]
id = "strings-symlink-to-dir"
argv = ["strings", "dl"]
tags = ["error"]
[case.files]
"d" = { dir = true }
"dl" = { symlink = "d" }

