tool = "awk"
source = "agent-style"

# Funções de string e semântica de regex (inclui casos onde leftmost-longest difere de leftmost-first).

[[case]]
id = "awk-length-forms"
argv = ["awk", "{print length($0), length, length($1)}"]
tags = ["strings"]
stdin = "hello world\n\n"

[[case]]
id = "awk-substr"
argv = ["awk", 'BEGIN{s="hello world"; print substr(s,1,5) "|" substr(s,7) "|" substr(s,0,3) "|" substr(s,-1,3) "|" substr(s,20) "|" substr(s,1.5,2.3)}']
tags = ["strings"]

[[case]]
id = "awk-index"
argv = ["awk", 'BEGIN{print index("foobar","bar"), index("foobar","z"), index("", "a"), index("abc", "")}']
tags = ["strings"]

[[case]]
id = "awk-split-default"
argv = ["awk", 'BEGIN{n=split("  a b  c ", arr); print n, "[" arr[1] "]", "[" arr[3] "]"}']
tags = ["strings", "arrays"]

[[case]]
id = "awk-split-char-sep"
argv = ["awk", 'BEGIN{n=split("2026-01-15", d, "-"); print n, d[1], d[2]+0, d[3]}']
tags = ["strings", "arrays"]

[[case]]
id = "awk-split-regex-sep"
argv = ["awk", 'BEGIN{n=split("a1b22c333", arr, /[0-9]+/); print n; for (i=1; i<=n; i++) print i, "[" arr[i] "]"}']
tags = ["strings", "regex"]

[[case]]
id = "awk-split-seps-array"
argv = ["awk", 'BEGIN{n=split("a1b22c", arr, /[0-9]+/, seps); print n, arr[2], seps[1], seps[2]}']
tags = ["strings", "gawk-ext"]

[[case]]
id = "awk-split-empty-sep-chars"
argv = ["awk", 'BEGIN{n=split("abc", a, ""); print n, a[1], a[3]}']
tags = ["strings"]

[[case]]
id = "awk-split-dot-literal"
argv = ["awk", 'BEGIN{n=split("10.0.0.1", ip, "."); print n, ip[4]}']
tags = ["strings", "regex"]

[[case]]
id = "awk-match-rstart-rlength"
argv = ["awk", '{if (match($0, /ms=[0-9]+/)) print RSTART, RLENGTH, substr($0, RSTART+3, RLENGTH-3); else print "no", RSTART, RLENGTH}']
tags = ["strings", "regex"]
stdin = "slow request path=/api/users ms=1200\nnothing here\n"

[[case]]
id = "awk-match-array-capture"
argv = ["awk", 'match($0, /path=([^ ]+) ms=([0-9]+)/, m) {print m[1], m[2], m[0, "start"]}']
tags = ["regex", "gawk-ext"]
stdin = "x path=/api/users ms=1200\ny path=/b ms=3\n"

[[case]]
id = "awk-sub-first"
argv = ["awk", '{sub(/INFO/, "info"); print}']
tags = ["strings", "regex"]
stdin = "INFO a INFO\n"

[[case]]
id = "awk-gsub-count"
argv = ["awk", '{n = gsub(/a/, "A"); print n, $0}']
tags = ["strings", "regex"]
stdin = "banana\nxyz\n"

[[case]]
id = "awk-gsub-ampersand"
argv = ["awk", '{gsub(/[0-9]+/, "<&>"); print}']
tags = ["strings", "regex"]
stdin = "a1b22c333\n"

[[case]]
id = "awk-gsub-escaped-ampersand"
argv = ["awk", '{gsub(/and/, "\\&"); print}']
tags = ["strings", "regex"]
stdin = "salt and pepper\n"

[[case]]
id = "awk-gsub-double-backslash"
argv = ["awk", '{gsub(/x/, "\\\\&"); print}']
tags = ["strings", "regex"]
stdin = "axb\n"

[[case]]
id = "awk-gsub-field-rebuild"
argv = ["awk", '{gsub(/o/, "0", $1); print; print $2}']
tags = ["strings", "fields"]
stdin = "foo   boo zoo\n"

[[case]]
id = "awk-gsub-empty-regex-matches"
argv = ["awk", 'BEGIN{s="abc"; gsub(/x*/, "-", s); print s}']
tags = ["regex"]

[[case]]
id = "awk-gsub-anchor"
argv = ["awk", 'BEGIN{s="aaa"; gsub(/^a/, "X", s); print s}']
tags = ["regex"]

[[case]]
id = "awk-sub-var-target"
argv = ["awk", '{x = $0; sub(/[ \t]+$/, "", x); print "[" x "]"}']
tags = ["strings", "regex"]
stdin = "trailing   \t\n"

[[case]]
id = "awk-trim-both"
argv = ["awk", '{gsub(/^[ \t]+|[ \t]+$/, ""); print "[" $0 "]"}']
tags = ["strings", "regex"]
stdin = "   both sides  \n"

[[case]]
id = "awk-tolower-toupper"
argv = ["awk", '{print tolower($0); print toupper($1)}']
tags = ["strings"]
stdin = "Hello World 42\n"

[[case]]
id = "awk-utf8-length-substr"
argv = ["awk", 'BEGIN{s="olá mundo"; print length(s), substr(s,1,3), toupper(s), index(s, "m")}']
tags = ["strings", "utf8"]

[[case]]
id = "awk-string-concat-trim-comma"
argv = ["awk", '{s = s $1 ","} END{print substr(s, 1, length(s)-1)}']
tags = ["strings"]
stdin = "a\nb\nc\n"

[[case]]
id = "awk-concat-vs-comma"
argv = ["awk", "{print $1 $2; print $1, $2; print $1 \" \" $2}"]
tags = ["strings"]
stdin = "a b\n"

[[case]]
id = "awk-concat-precedence"
argv = ["awk", 'BEGIN{print 1 " " 2+3, 1 -1, "a" (1 < 2)}']
tags = ["strings", "numeric"]

[[case]]
id = "awk-gensub"
argv = ["awk", 'BEGIN{print gensub(/([a-z]+)-([0-9]+)/, "\\2:\\1", "g", "abc-12 def-34"); print gensub(/o/, "0", 2, "foo boo")}']
tags = ["regex", "gawk-ext"]

[[case]]
id = "awk-regex-char-classes"
argv = ["awk", "/^[[:upper:]][[:alpha:]]+$/"]
tags = ["regex"]
stdin = "Alice\nbob\nCarol9\nDAVE\n"

[[case]]
id = "awk-regex-interval"
argv = ["awk", "/^[0-9]{3}-[0-9]{4}$/"]
tags = ["regex"]
stdin = "555-1234\n55-1234\n5555-1234\n"

[[case]]
id = "awk-regex-leftmost-longest-match"
argv = ["awk", 'BEGIN{s="xabcabcy"; match(s, /(abc|abcabc)/); print RSTART, RLENGTH}']
tags = ["regex", "posix-semantics"]

[[case]]
id = "awk-regex-leftmost-longest-sub"
argv = ["awk", 'BEGIN{s="aaa"; sub(/a|aa/, "X", s); print s; t="foobar"; sub(/fo|foob/, "Y", t); print t}']
tags = ["regex", "posix-semantics"]

[[case]]
id = "awk-regex-leftmost-longest-split"
argv = ["awk", 'BEGIN{n=split("a--b-c", p, /-|--/); print n, p[2]}']
tags = ["regex", "posix-semantics"]

[[case]]
id = "awk-regex-escaped-dot"
argv = ["awk", '/\.txt$/']
tags = ["regex"]
stdin = "a.txt\natxt\nb.txt.bak\n"

[[case]]
id = "awk-regex-dynamic-string-escape"
argv = ["awk", '$0 ~ "\\.log$"']
tags = ["regex"]
stdin = "app.log\napplog\n"

[[case]]
id = "awk-regex-bracket-specials"
argv = ["awk", '/[]a]/ {print "1:" $0} /[^]a]x/ {print "2:" $0}']
tags = ["regex"]
stdin = "]\nbx\nax\n"

[[case]]
id = "awk-regex-slash-in-class"
argv = ["awk", '{gsub(/[/]/, "_"); print}']
tags = ["regex"]
stdin = "/usr/local/bin\n"

[[case]]
id = "awk-regex-word-boundary-gnu"
argv = ["awk", '{gsub(/\<the\>/, "THE"); print}']
tags = ["regex", "gawk-ext"]
stdin = "the other then the\n"

[[case]]
id = "awk-regex-dot-matches-newline-in-string"
argv = ["awk", 'BEGIN{s="a\nb"; print (s ~ /a.b/)}']
tags = ["regex"]

[[case]]
id = "awk-regex-backref-not-supported"
argv = ["awk", 'BEGIN{print ("aa" ~ /(a)\1/)}']
tags = ["regex"]

[[case]]
id = "awk-regex-plus-literal-start"
argv = ["awk", '{print ($0 ~ /^+/)}']
tags = ["regex"]
stdin = "+x\nx\n"

[[case]]
id = "awk-sub-special-chars-replacement"
argv = ["awk", '{sub(/=/, " => "); print}']
tags = ["strings"]
stdin = "key=value=x\n"

[[case]]
id = "awk-index-substr-extract"
argv = ["awk", '{i = index($0, "="); print substr($0, 1, i-1) "|" substr($0, i+1)}']
tags = ["strings"]
stdin = "PATH=/usr/bin:/bin\nEMPTY=\n"

[[case]]
id = "awk-strtonum"
argv = ["awk", 'BEGIN{print strtonum("0x1A"), strtonum("017"), strtonum("12abc")}']
tags = ["numeric", "gawk-ext"]

[[case]]
id = "awk-sprintf-repeat-char"
argv = ["awk", 'BEGIN{s = sprintf("%10s", ""); gsub(/ /, "-", s); print s}']
tags = ["strings", "printf"]
