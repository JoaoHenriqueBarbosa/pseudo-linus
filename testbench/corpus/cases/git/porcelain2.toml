tool = "git"
source = "agent-style"

# remote, merge, revert, stash e column. Cada caso monta um repositório pequeno com autor, committer
# e datas fixos e termina com `rm -rf .git` (o índice guarda ctime/ino/dev).

[[case]]
id = "git-log-graph-linear"
script = '''git init -q -b main; echo a > f; git add f; git commit -qm one; echo b >> f; git commit -qam two; echo c >> f; git commit -qam three; git log --oneline --graph; git log --graph --format=%s; git log --graph -n 2 --format='%h%n%s'; rm -rf .git f'''
tags = ["log", "graph"]
[case.env]
GIT_AUTHOR_NAME = "Agent"
GIT_AUTHOR_EMAIL = "agent@example.com"
GIT_COMMITTER_NAME = "Agent"
GIT_COMMITTER_EMAIL = "agent@example.com"
GIT_AUTHOR_DATE = "1768478400 +0000"
GIT_COMMITTER_DATE = "1768478400 +0000"

