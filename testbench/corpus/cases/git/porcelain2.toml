id = "git-stash-nothing"
script = '''git init -q -b main; echo a > f; git add f; git commit -qm one; git stash; echo "exit=$?"; git stash pop; echo "exit=$?"; rm -rf .git f'''
tags = ["stash", "error"]
[case.env]
GIT_AUTHOR_NAME = "Agent"
GIT_AUTHOR_EMAIL = "agent@example.com"
GIT_COMMITTER_NAME = "Agent"
