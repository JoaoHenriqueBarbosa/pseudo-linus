[[case]]
id = "git-column"
script = '''seq 1 30 | git column --mode=column --width=40; seq 1 12 | git column --mode=row --width=20; printf 'a\nbb\nccc\n' | git column --mode=column,dense --width=10 --padding=3'''
tags = ["column"]
