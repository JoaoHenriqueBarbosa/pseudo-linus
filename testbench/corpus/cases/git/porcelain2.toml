id = "git-stash-push-list-pop"
script = '''git init -q -b main; echo a > f; git add f; git commit -qm one; echo b >> f; echo new > n; git add n; git stash; echo "exit=$?"; git status --short; cat f; git stash list; git stash show; git stash pop; echo "exit=$?"; git status --short; git stash list; rm -rf .git f n'''
tags = ["stash"]
[case.env]
GIT_AUTHOR_NAME = "Agent"
GIT_AUTHOR_EMAIL = "agent@example.com"
GIT_COMMITTER_NAME = "Agent"
GIT_COMMITTER_EMAIL = "agent@example.com"
GIT_AUTHOR_DATE = "1768478400 +0000"
GIT_COMMITTER_DATE = "1768478400 +0000"

[[case]]
id = "git-stash-message-apply-drop"
script = '''git init -q -b main; echo a > f; git add f; git commit -qm one; echo b >> f; git stash push -m wip; echo c >> f; git stash; git stash list; git stash apply stash@{1}; echo "exit=$?"; git stash drop; echo "exit=$?"; git stash list; git stash drop stash@{5}; echo "exit=$?"; rm -rf .git f'''
tags = ["stash"]
[case.env]
GIT_AUTHOR_NAME = "Agent"
GIT_AUTHOR_EMAIL = "agent@example.com"
GIT_COMMITTER_NAME = "Agent"
