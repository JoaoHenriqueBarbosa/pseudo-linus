tool = "xxd"
source = "manual"

# Dump normal do xxd 9.1: colunas (-c), grupos (-g), little-endian (-e), bits (-b), maiúsculas (-u),
# endereço decimal (-d) e deslocado (-o), limite (-l), posição inicial (-s, em arquivo e em pipe),
# EBCDIC (-E) e linhas nulas (-a). Fixtures: `txt` é texto de 55 bytes; `all` tem os 256 bytes em
# ordem; `zz`, `z3` e `z5` exercitam o `-a` (sequências de linhas nulas no meio e no fim).

[[case]]
id = "xxd-default"
argv = ["xxd", "txt"]
tags = ["dump", "default"]
[case.files]
"txt" = "The quick brown fox jumps over the lazy dog.\n0123456789"

[[case]]
id = "xxd-stdin"
argv = ["xxd"]
stdin = "hello world\n"
tags = ["dump", "stdin"]

[[case]]
id = "xxd-stdin-dash"
argv = ["xxd", "-"]
stdin = "hello world\n"
tags = ["dump", "stdin"]

[[case]]
id = "xxd-all-bytes"
argv = ["xxd", "all"]
tags = ["dump", "default"]
[case.files]
"all" = { content_b64 = "" }

