tool = "procps"
source = "manual"

# /proc/net de um container sem rede (o oráculo roda com --network none): só o lo. E a escrita em
# arquivos do /proc, que recusa no open (EACCES) ou na escrita (EINVAL) depois do O_TRUNC.

[[case]]
id = "procfs-net-tree"
script = """
readlink /proc/net
stat -c '%n %F %a %h %U' /proc/self/net /proc/net/stat /proc/net/vlan /proc/net/vlan/config /proc/net/dev /proc/net/nf_conntrack
ls -f /proc/net /proc/net/stat /proc/net/netfilter /proc/net/dev_snmp6
ls /proc/self/task/$$/net | head -3
"""
tags = ["proc", "net"]

[[case]]
id = "procfs-net-lo-only"
script = """
cat /proc/net/dev /proc/net/if_inet6 /proc/net/route /proc/net/tcp /proc/net/tcp6 /proc/net/udp /proc/net/unix
cat /proc/net/fib_trie /proc/net/ipv6_route /proc/net/arp /proc/net/sockstat6
"""
tags = ["proc", "net"]

[[case]]
id = "procfs-write-errors"
script = """
echo x > /proc/net/dev; echo "exit=$?"
echo x > /proc/version; echo "exit=$?"
echo x > /proc/self/stat; echo "exit=$?"
touch /proc/version; echo "exit=$?"
chmod 600 /proc/version; echo "exit=$?"
"""
tags = ["proc", "error"]

# /proc/net/tcp e tcp6 a partir dos sockets vivos: escuta em 0.0.0.0, 127.0.0.1 e ::, conexão com
# dados não lidos, conexão ainda na fila do accept, CLOSE_WAIT com o FIN, FIN_WAIT2 órfão e TIME_WAIT
# do servidor HTTP (o cliente lê até o EOF, então o FIN do servidor sempre vem primeiro; um cliente
# que fecha ao fim do Content-Length disputa a corrida com o servidor, também no Debian). Portas efêmeras, inodes, ponteiros e o tempo restante dos timers variam no próprio Debian:
# o awk troca cada um pela forma (EPH, inode zero ou não, timer ligado ou não) e ordena as linhas.
[[case]]
id = "procfs-net-tcp-live"
script = '''
cd /tmp
python3 -m http.server 8080 >/dev/null 2>&1 &
python3 -c '
import socket,time
s=socket.socket(); s.bind(("127.0.0.1",9000)); s.listen(5)
s6=socket.socket(socket.AF_INET6); s6.bind(("::",9001)); s6.listen(1)
c=socket.create_connection(("127.0.0.1",9000))
a,_=s.accept()
c2=socket.create_connection(("127.0.0.1",9000))
c.sendall(b"x"*10)
d=socket.socket(); d.connect(("127.0.0.1",9000)); b,_=s.accept(); b.close()
time.sleep(30)' &
sleep 1
python3 -c '
import socket
c = socket.create_connection(("127.0.0.1", 8080)); c.sendall(b"GET / HTTP/1.0\r\n\r\n")
while c.recv(4096): pass'
sleep 0.5
norm() {
  awk 'NR == 1 { print; next } {
    split($2, l, ":"); split($3, r, ":")
    lp = strtonum("0x" l[2]); rp = strtonum("0x" r[2])
    if (lp >= 32768) l[2] = "EPH"; if (rp >= 32768) r[2] = "EPH"
    print l[1] ":" l[2], r[1] ":" r[2], $4, $5, substr($6, 1, 2), $8, ($10 == 0 ? "ino0" : "ino"), $11, NF
  }' "$1" | sort
}
norm /proc/net/tcp
norm /proc/net/tcp6
head -1 /proc/net/tcp | wc -c
awk 'NR > 1 { print length($0) }' /proc/net/tcp | sort -u
grep -E "^TCP" /proc/net/sockstat | cut -d" " -f1-7
grep -E "^TCP6" /proc/net/sockstat6
'''
tags = ["proc", "net", "tcp"]

[[case]]
id = "procfs-net-tcp-ports"
script = '''
python3 -c '
import socket
s = socket.socket(); s.bind(("127.0.0.1", 0)); s.listen(1)
p = s.getsockname()[1]
cs = [socket.create_connection(("127.0.0.1", p)) for _ in range(20)]
eph = [c.getsockname()[1] for c in cs]
print("bind0 odd", p % 2 == 1, 32768 <= p <= 60999)
print("connect even", all(x % 2 == 0 for x in eph), all(32768 <= x <= 60999 for x in eph))
print("sequential", eph == list(range(eph[0], eph[0] + 20)))
'
'''
tags = ["proc", "net", "tcp", "ports"]

# /proc/net/unix a partir dos sockets vivos: escuta, embrião ainda na fila do accept (estado 02, sem
# inode), conexão aceita (herda o caminho), cliente sem nome, socketpair, datagrama com nome, conectado
# (as duas pontas em 03 e a referência a mais no destino), espaço abstrato (@) e caminho relativo como
# o bind recebeu. Ponteiros e inodes variam: o awk tira o ponteiro, troca o inode pela forma e ordena.
[[case]]
id = "procfs-net-unix-live"
script = '''
cd /tmp
umask 077
python3 -c '
import socket, os
u = socket.socket(socket.AF_UNIX); u.bind("/tmp/a.sock"); u.listen(4)
c = socket.socket(socket.AF_UNIX); c.connect("/tmp/a.sock")
s, addr = u.accept()
c2 = socket.socket(socket.AF_UNIX); c2.connect("/tmp/a.sock")
p, q = socket.socketpair()
nb = socket.socket(socket.AF_UNIX)
r = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM); r.bind("r.sock")
d = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM); d.connect("r.sock")
a = socket.socket(socket.AF_UNIX); a.bind("\0abs"); a.listen(1)
b = socket.socket(socket.AF_UNIX); b.connect("\0abs"); x, _ = a.accept(); b.close()
print(repr(addr), repr(c.getsockname()), repr(c.getpeername()), repr(s.getsockname()), repr(x.getsockname()))
print(oct(os.stat("/tmp/a.sock").st_mode))
os.system("awk '\''NR == 1 { print; next } { print $2, $3, $4, $5, $6, ($7 == 0 ? \"ino0\" : \"ino\"), $8 }'\'' /proc/net/unix | sort")
'
ls -l /tmp/a.sock /tmp/r.sock | cut -c1-10
'''
tags = ["proc", "net", "unix"]

# AF_UNIX entre processos e os erros do bind e do connect.
[[case]]
id = "unix-socket-errors-and-processes"
script = '''
cd /tmp
python3 -c '
import socket, subprocess
s = socket.socket(socket.AF_UNIX); s.bind("/tmp/srv2.sock"); s.listen(1)
child = subprocess.Popen(["python3", "-c", "import socket\nc = socket.socket(socket.AF_UNIX); c.connect(\"/tmp/srv2.sock\"); c.sendall(b\"from child\"); print(\"child got\", c.recv(20), flush=True)"])
x, _ = s.accept(); print("parent got", x.recv(20), flush=True); x.sendall(b"ok"); child.wait()
r = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM); r.bind("r2.sock")
socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM).sendto(b"anon", "r2.sock"); print(r.recvfrom(100))
n = socket.socket(socket.AF_UNIX, socket.SOCK_DGRAM); n.bind("\0abs-n"); n.sendto(b"named", "/tmp/r2.sock"); print(r.recvfrom(100))
def err(what, f):
    try: f()
    except OSError as e: print(what, e)
err("rebind", lambda: socket.socket(socket.AF_UNIX).bind("/tmp/srv2.sock"))
s2 = socket.socket(socket.AF_UNIX); s2.bind("/tmp/b2.sock")
err("nolisten", lambda: socket.socket(socket.AF_UNIX).connect("/tmp/b2.sock"))
err("missing", lambda: socket.socket(socket.AF_UNIX).connect("/tmp/nope.sock"))
open("/tmp/f", "w").close()
err("notsock", lambda: socket.socket(socket.AF_UNIX).connect("/tmp/f"))
err("abs missing", lambda: socket.socket(socket.AF_UNIX).connect("\0nope"))
err("listen unbound", lambda: socket.socket(socket.AF_UNIX).listen(1))
err("listen dgram", lambda: r.listen(1))
err("send unconn", lambda: socket.socket(socket.AF_UNIX).send(b"x"))
s.close()
err("closed", lambda: socket.socket(socket.AF_UNIX).connect("/tmp/srv2.sock"))
'
stat -c '%F %s %h %a' /tmp/srv2.sock
rm /tmp/srv2.sock
python3 -c '
import socket
try: socket.socket(socket.AF_UNIX).connect("/tmp/srv2.sock")
except OSError as e: print(e)'
'''
tags = ["net", "unix"]

# /proc/net/udp e udp6 a partir dos sockets vivos: o rx_queue soma o truesize de cada datagrama na
# fila (cabeça pequena de 704, balde do kmalloc ou páginas acima de 16 KB), descarte contado em drops
# quando a fila passa do rmem_default, conectado em 01 com o endereço de origem da rota, autobind no
# curinga, ECONNREFUSED do ICMP só no conectado. O balde (sl) e a porta efêmera variam: o awk tira o
# balde, troca a porta efêmera por EPH e o inode pela forma, e ordena.
[[case]]
id = "procfs-net-udp-live"
script = '''
python3 -c '
import socket, time
def rxq(port):
    for l in open("/proc/net/udp").read().splitlines()[1:]:
        f = l.split()
        if int(f[1].split(":")[1], 16) == port:
            return int(f[4].split(":")[1], 16), (int(f[0][:-1]) - port) % 16384
sl = set()
for n in [0, 200, 500, 1000, 2000, 4000, 8000, 16004, 16005, 30000, 65000, 65507]:
    r = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); r.bind(("127.0.0.1", 0))
    p = r.getsockname()[1]
    socket.socket(socket.AF_INET, socket.SOCK_DGRAM).sendto(b"x" * n, ("127.0.0.1", p))
    q, off = rxq(p); sl.add(off)
    print(n, q, 32768 <= p <= 60999)
    r.close()
print("same slot offset", len(sl) == 1)
try: socket.socket(socket.AF_INET, socket.SOCK_DGRAM).sendto(b"x" * 65508, ("127.0.0.1", 9))
except OSError as e: print("big", e)
r = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); r.bind(("0.0.0.0", 7000))
s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.1", 7001)); s.connect(("127.0.0.1", 7000))
for i in range(3): s.send(b"a" * 10)
c = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); c.connect(("127.0.0.1", 7999))
c.send(b"q")
try: c.send(b"q")
except OSError as e: print("refused", e)
c.send(b"q"); print("again ok")
n = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); n.sendto(b"q", ("127.0.0.1", 7999)); n.sendto(b"q", ("127.0.0.1", 7999)); print("unconnected no error")
u6 = socket.socket(socket.AF_INET6, socket.SOCK_DGRAM); u6.bind(("::", 7002))
socket.socket(socket.AF_INET, socket.SOCK_DGRAM).sendto(b"v4", ("127.0.0.1", 7002)); print(u6.recvfrom(10)[0], u6.recvfrom.__name__)
u = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
print("unbound", u.getsockname())
u.sendto(b"z", ("127.0.0.1", 7000)); print("autobound", u.getsockname()[0], u.getsockname()[1] > 32767)
big = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); big.bind(("127.0.0.1", 7003))
for i in range(300): s.sendto(b"b" * 1000, ("127.0.0.1", 7003))
print(r.recvfrom(100), r.recvfrom(100, socket.MSG_PEEK), r.recv(3))
try: socket.socket(socket.AF_INET, socket.SOCK_DGRAM).bind(("0.0.0.0", 7000))
except OSError as e: print("inuse", e)
try: socket.socket(socket.AF_INET6, socket.SOCK_DGRAM).bind(("::", 7000))
except OSError as e: print("inuse6", e)
a = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); a.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); a.bind(("0.0.0.0", 7010))
b = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); b.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); b.bind(("0.0.0.0", 7010)); print("reuse ok", flush=True)
time.sleep(5)
'  > /tmp/out.txt 2>&1 &
sleep 2
cat /tmp/out.txt
norm() {
  awk 'NR == 1 { print; next } {
    split($2, l, ":"); split($3, r, ":")
    lp = strtonum("0x" l[2]); rp = strtonum("0x" r[2])
    if (lp >= 32768) l[2] = "EPH"; if (rp >= 32768) r[2] = "EPH"
    print l[1] ":" l[2], r[1] ":" r[2], $4, $5, $6, $7, $8, $9, ($10 == 0 ? "ino0" : "ino"), $11, $13, NF
  }' "$1" | sort
}
norm /proc/net/udp
norm /proc/net/udp6
head -1 /proc/net/udp | wc -c
awk 'NR > 1 { print length($0) }' /proc/net/udp | sort -u
grep -E "^UDP" /proc/net/sockstat | cut -d" " -f1-3
grep -E "^UDP6" /proc/net/sockstat6
'''
tags = ["proc", "net", "udp"]

# sockets: used do sockstat conta todo socket vivo (inclusive o embrião do Unix e o UDP sem porta), e
# os de time-wait não. Os casos dividem o container do oráculo: a contagem sai relativa ao início.
[[case]]
id = "procfs-sockstat-used"
script = '''
python3 -c '
import socket, time
def count():
    return int(open("/proc/net/sockstat").readline().split()[2])
base = count()
def used():
    return count() - base
u = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); print("udp unbound", used())
l = socket.socket(); l.bind(("127.0.0.1", 9100)); l.listen(5); print("listen", used())
c = socket.socket(); c.connect(("127.0.0.1", 9100)); time.sleep(0.1); print("tcp conn unaccepted", used())
a, _ = l.accept(); print("accepted", used())
c.close(); a.close(); time.sleep(0.1); print("tcp closed", used())
x = socket.socket(socket.AF_UNIX); x.bind("/tmp/used.sock"); x.listen(1); print("unix listen", used())
y = socket.socket(socket.AF_UNIX); y.connect("/tmp/used.sock"); print("unix embryo", used())
z, _ = x.accept(); print("unix accepted", used())
p, q = socket.socketpair(); print("pair", used())
'
'''
tags = ["proc", "net"]
