tool = "procps"
source = "manual"

# /usr/bin/kill do procps-ng 4.0.4: ajuda, versão, listas de sinais, conversões de -l, erros de
# argumento e kill em pid que não existe. Nada aqui manda sinal pra processo vivo (os pids do
# oráculo e do candidato não batem).

[[case]]
id = "kill-help"
argv = ["kill", "--help"]
tags = ["kill", "usage"]

[[case]]
id = "kill-h"
argv = ["kill", "-h"]
tags = ["kill", "usage"]

[[case]]
id = "kill-no-args"
argv = ["kill"]
tags = ["kill", "usage", "error"]

[[case]]
id = "kill-version"
argv = ["kill", "-V"]
tags = ["kill", "version"]

[[case]]
id = "kill-version-long"
argv = ["kill", "--version"]
tags = ["kill", "version"]

[[case]]
id = "kill-l"
argv = ["kill", "-l"]
tags = ["kill", "list"]

[[case]]
id = "kill-list-long"
argv = ["kill", "--list"]
tags = ["kill", "list"]

[[case]]
id = "kill-L"
argv = ["kill", "-L"]
tags = ["kill", "list"]

[[case]]
id = "kill-table"
argv = ["kill", "--table"]
tags = ["kill", "list"]

[[case]]
id = "kill-l-9"
argv = ["kill", "-l", "9"]
tags = ["kill", "list"]

[[case]]
id = "kill-l-attached"
argv = ["kill", "-l9"]
tags = ["kill", "list"]

[[case]]
