tags = ["kill", "list", "error"]

[[case]]
id = "kill-l-bogus"
argv = ["kill", "-l", "bogus"]
tags = ["kill", "list", "error"]

[[case]]
id = "kill-l-io-alias"
argv = ["kill", "-l", "IO"]
tags = ["kill", "list", "error"]

[[case]]
id = "kill-l-poll"
argv = ["kill", "-l", "POLL"]
tags = ["kill", "list"]

[[case]]
id = "kill-list-eq"
argv = ["kill", "--list=15"]
tags = ["kill", "list"]

[[case]]
id = "kill-list-sep"
argv = ["kill", "--list", "TERM"]
tags = ["kill", "list"]

[[case]]
id = "kill-l-then-sig"
argv = ["kill", "-l", "-9"]
tags = ["kill", "list"]

[[case]]
id = "kill-L-arg"
argv = ["kill", "-L", "9"]
tags = ["kill", "list"]

[[case]]
id = "kill-esrch"
argv = ["kill", "99999"]
tags = ["kill", "error"]

[[case]]
id = "kill-9-esrch"
argv = ["kill", "-9", "99999"]
tags = ["kill", "error"]

[[case]]
id = "kill-s-esrch"
argv = ["kill", "-s", "KILL", "99999"]
tags = ["kill", "error"]

[[case]]
id = "kill-signal-long-esrch"
