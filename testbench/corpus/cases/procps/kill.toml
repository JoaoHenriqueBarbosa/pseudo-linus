[[case]]
id = "kill-bad-option"
argv = ["kill", "-xyz", "99999"]
tags = ["kill", "usage", "error"]

[[case]]
id = "kill-unknown-long"
argv = ["kill", "--bogus", "99999"]
tags = ["kill", "usage", "error"]

[[case]]
id = "kill-two-pids"
argv = ["kill", "99999", "99998"]
tags = ["kill", "error"]
