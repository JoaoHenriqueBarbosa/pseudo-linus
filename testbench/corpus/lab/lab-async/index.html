<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>lab: assíncrono</title>
</head>
<body>
<h1>Ordem assíncrona</h1>
<p>Ticks: <span id="ticks">0</span></p>
<pre id="log"></pre>
<script>
  var lines = [];
  function log(line) { lines.push(String(line)); document.getElementById('log').textContent = lines.join('\n'); }

  log('1 síncrono');
  setTimeout(function () { log('6 setTimeout 0'); Promise.resolve().then(function () { log('7 microtarefa dentro do timeout'); }); }, 0);
  setTimeout(function () { log('8 setTimeout 0 segundo'); }, 0);
  setTimeout(function () { log('11 setTimeout 10'); }, 10);
  setTimeout(function () { log('10 setTimeout 5'); }, 5);
  Promise.resolve().then(function () { log('3 then 1'); return null; }).then(function () { log('5 then 2 encadeado'); });
  queueMicrotask(function () { log('4 queueMicrotask'); });
  (async function () { log('2 async antes do await'); await null; log('4b async depois do await'); })();
  requestAnimationFrame(function (t) { log('raf 1 (tipo do tempo: ' + typeof t + ')'); requestAnimationFrame(function () { log('raf 2 no quadro seguinte'); }); });
  requestIdleCallback(function (deadline) { log('idle: timeRemaining é número=' + (typeof deadline.timeRemaining() === 'number') + ' didTimeout=' + deadline.didTimeout); });

  Promise.all([1, Promise.resolve(2), new Promise(function (r) { setTimeout(function () { r(3); }, 1); })]).then(function (v) { log('all ' + v.join(',')); });
  Promise.race([new Promise(function (r) { setTimeout(function () { r('lento'); }, 20); }), new Promise(function (r) { setTimeout(function () { r('rápido'); }, 2); })]).then(function (v) { log('race ' + v); });
  Promise.any([Promise.reject(new Error('a')), Promise.resolve('b')]).then(function (v) { log('any ' + v); });
  Promise.allSettled([Promise.reject(new TypeError('x')), 1]).then(function (r) { log('allSettled ' + r.map(function (s) { return s.status; }).join(',')); });
  Promise.any([Promise.reject(1)]).catch(function (e) { log('AggregateError: ' + e.constructor.name + ' ' + e.errors.length); });

  async function* gerador() { for (var i = 0; i < 3; i++) { await new Promise(function (r) { setTimeout(r, 3); }); yield i; } }
  (async function () { var out = []; for await (var v of gerador()) out.push(v); log('for await ' + out.join(',')); })();

  window.addEventListener('unhandledrejection', function (e) { log('unhandledrejection: ' + e.reason); e.preventDefault(); });
  Promise.reject('sem catch');

  var ticks = 0;
  var id = setInterval(function () {
    ticks += 1;
    document.getElementById('ticks').textContent = String(ticks);
    if (ticks === 5) { clearInterval(id); log('interval parado em 5'); }
  }, 100);

  var chained = 0;
  (function proximo() { if (++chained < 50) setTimeout(proximo, 0); else log('50 timeouts encadeados'); })();
  setTimeout(function () { log('timeout de 2s dentro do orçamento'); }, 2000);
  setTimeout(function () { log('timeout de 60s fora do orçamento'); }, 60000);
  var cancelado = setTimeout(function () { log('cancelado não roda'); }, 1);
  clearTimeout(cancelado);
  setTimeout(function (a, b) { log('argumentos extras: ' + a + b); }, 3, 'x', 'y');
  log('9? síncrono final (deve ser o segundo)');
</script>
</body>
</html>
