window.addEventListener('load', () => {

  setTimeout(() => {
    const r = {};
    const t = (name, f) => { try { r[name] = f(); } catch (e) { r[name] = 'ERR ' + e; } };
    t('frames', () => frames.length);
    t('w0', () => window[0] === fa.contentWindow);
    t('w1', () => window[1] === fb.contentWindow);
    t('byName', () => window.a === fa.contentWindow || window.a === a);
    t('parentOfFrame', () => frames[0].parent === window);
    t('topOfFrame', () => frames[0].top === window);
    t('selfTop', () => [window.top === window, window.parent === window, window.self === window, window.frames === window]);
    t('href', () => fa.contentWindow.location.href);
    t('title', () => fa.contentDocument.title);
    t('srcdoc', () => [fb.contentDocument.title, fb.contentWindow.location.href, fb.contentDocument.body.textContent]);
    t('p', () => fa.contentDocument.getElementById('p').textContent);
    t('frameElement', () => frames[0].frameElement === fa);
    t('arrayRealms', () => frames[0].Array === Array);
    t('crossInstance', () => frames[0].eval('[]') instanceof Array);
    t('docOwner', () => fa.contentDocument.defaultView === fa.contentWindow);
    t('rs', () => [fa.contentDocument.readyState, fb.contentDocument.readyState]);
    t('childOrigin', () => fa.contentWindow.origin);
    r.entries = window.entries;
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = JSON.stringify(r);
    document.body.append(pre);
    done = true;
  }, 50);
});
