<!doctype html>
<meta charset="utf-8">
<title>mixed probe</title>
<script>
// Valores de formas diferentes (JSON, palavras, base64, números, trechos repetidos), com um gerador determinístico,
// para exercitar o compressor snappy em dados que não são uma única repetição. Cerca de 150 KiB no total.
let state = 0x9e3779b9;
function random() {
  state = (state + 0x6d2b79f5) | 0;
  let t = Math.imul(state ^ (state >>> 15), 1 | state);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const words = ['alpha', 'bravo', 'charlie', 'delta', 'echo', 'foxtrot', 'golf', 'hotel', 'india', 'juliet', 'kilo', 'lima', 'mike', 'november', 'oscar', 'papa', 'quebec', 'romeo', 'sierra', 'tango'];
const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function pick(list) { return list[Math.floor(random() * list.length)]; }
function sentence(n) { const out = []; for (let i = 0; i < n; i++) out.push(pick(words)); return out.join(' '); }
function base64(n) { let out = ''; for (let i = 0; i < n; i++) out += alphabet[Math.floor(random() * 64)]; return out; }
function json(depth) {
  if (depth === 0) return random() < 0.5 ? Math.floor(random() * 100000) : sentence(3);
  const object = {};
  for (let i = 0; i < 4; i++) object['field' + i] = json(depth - 1);
  object.list = [1, 2, 3, sentence(2)];
  return object;
}
for (let i = 0; i < 60; i++) {
  const kind = i % 4;
  let value;
  if (kind === 0) value = JSON.stringify(json(3));
  else if (kind === 1) value = sentence(150 + Math.floor(random() * 200));
  else if (kind === 2) value = base64(1500 + Math.floor(random() * 1500));
  else value = (sentence(5) + ' ').repeat(20 + Math.floor(random() * 40)) + base64(64);
  localStorage.setItem('mixed' + String(i).padStart(3, '0'), value);
}
document.title = 'mixed:' + localStorage.length;
</script>
<body>mixed probe</body>
