<!doctype html>
<meta charset="utf-8">
<title>large values probe</title>
<script>
// Valores grandes (20, 40, 70 e 130 mil caracteres) de dados variados: cada um ocupa um bloco de dados inteiro da
// tabela e passa de um ou de dois fragmentos de 64 KiB do compressor snappy, que escolhe o tamanho da tabela de hash
// pelo tamanho do fragmento.
let state = 0x1234abcd;
function random() {
  state = (state + 0x6d2b79f5) | 0;
  let t = Math.imul(state ^ (state >>> 15), 1 | state);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const words = ['rust', 'leveldb', 'snappy', 'block', 'table', 'chromium', 'storage', 'origin', 'value', 'key', 'sequence', 'number'];
function text(length) {
  let out = '';
  while (out.length < length) {
    const roll = random();
    if (roll < 0.6) out += words[Math.floor(random() * words.length)] + ' ';
    else if (roll < 0.8) out += Math.floor(random() * 1e9) + ',';
    else out += Math.floor(random() * 4294967296).toString(36);
  }
  return out.slice(0, length);
}
[20000, 40000, 70000, 130000].forEach((length, index) => localStorage.setItem('large' + index, text(length)));
document.title = 'large:' + localStorage.length;
</script>
<body>large values probe</body>
