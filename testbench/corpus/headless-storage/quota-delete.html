<!doctype html>

<title>quota-delete</title>
<script>
// Mantém o orçamento de tempo virtual ocupado com E/S real até o IndexedDB terminar.
let done = false;
const keepAlive = async () => { for (let i = 0; i < 200 && !done; i++) await fetch('/quota-delete.html', { cache: 'no-store' }).then((r) => r.text()); };
keepAlive();
const a = indexedDB.deleteDatabase('gone'); a.onsuccess = () => setTimeout(() => { done = true; }, 200);
</script>
<body>quota-delete</body>
