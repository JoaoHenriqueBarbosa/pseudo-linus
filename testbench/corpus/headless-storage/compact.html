<!doctype html>
<meta charset="utf-8">
<title>compaction probe</title>
<script>
// Duas chaves de 40 mil caracteres variados, com valores que dependem da query da URL (a mesma página em execuções
// seguidas não reescreve valor igual). Cada reabertura recupera o log da anterior (acima do write_buffer_size) e o
// transforma numa tabela de nível 0 cuja faixa [k0, k1] sobrepõe as outras; na quarta a abertura dispara a
// compactação do nível 0 para o nível 1.
let state = 0x9e3779b9 ^ Number(location.search.slice(1));
function random() {
  state = (state + 0x6d2b79f5) | 0;
  let t = Math.imul(state ^ (state >>> 15), 1 | state);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function text(length) {
  let out = '';
  while (out.length < length) out += Math.floor(random() * 4294967296).toString(36);
  return out.slice(0, length);
}
localStorage.setItem('k0', text(40000));
localStorage.setItem('k1', text(40000));
document.title = 'compact:' + localStorage.length;
</script>
<body>compaction probe</body>
