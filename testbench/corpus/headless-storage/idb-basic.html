<!doctype html>
<meta charset="utf-8">
<title>idb basic</title>
<script>
// Mantém o orçamento de tempo virtual ocupado com E/S real (fetch ao servidor) até o IndexedDB terminar de gravar.
let done = false;
const keepAlive = async () => { for (let i = 0; i < 200 && !done; i++) await fetch('/idb-basic.html', { cache: 'no-store' }).then((r) => r.text()); };
keepAlive();
const request = indexedDB.open('db1', 1);
request.onupgradeneeded = (event) => {
  const db = event.target.result;
  const store = db.createObjectStore('items', { keyPath: 'id' });
  store.createIndex('by_name', 'name');
  store.add({ id: 1, name: 'a', tags: ['x', 'y'], when: new Date(0) });
  store.add({ id: 2, name: 'b', n: 1.5, t: true, z: null, bytes: new Uint8Array([1, 2, 3]) });
};
request.onsuccess = () => { request.result.close(); setTimeout(() => { done = true; document.title = 'done'; }, 200); };
</script>
<body>idb basic</body>
