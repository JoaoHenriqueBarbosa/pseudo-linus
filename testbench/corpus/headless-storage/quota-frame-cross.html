<!doctype html>
<meta charset="utf-8">
<title>quota-frame-cross</title>
<script>
// Mantém o orçamento de tempo virtual ocupado com E/S real até o iframe terminar.
let done = false;
const keepAlive = async () => { for (let i = 0; i < 200 && !done; i++) await fetch('/quota-frame-cross.html', { cache: 'no-store' }).then((r) => r.text()); };
keepAlive();
setTimeout(() => { done = true; }, 1500);

</script>
<body>quota-frame-cross<iframe src="http://localhost:8000/quota-inner.html"></iframe></body>
