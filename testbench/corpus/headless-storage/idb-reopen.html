<!doctype html>
<meta charset="utf-8">
<title>idb reopen</title>
<script>
// Só reabre o db1 (sem escrever): mede o que a abertura de um banco existente grava.
let done = false;
const keepAlive = async () => { for (let i = 0; i < 200 && !done; i++) await fetch('/idb-reopen.html', { cache: 'no-store' }).then((r) => r.text()); };
keepAlive();
const request = indexedDB.open('db1', 3);
request.onsuccess = () => { request.result.close(); setTimeout(() => { done = true; document.title = 'done'; }, 200); };
</script>
<body>idb reopen</body>
