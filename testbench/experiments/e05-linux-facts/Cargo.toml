[package]
name = "e05-linux-facts"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "E05: verdade de campo do Linux real (errno, strerror, sinais, limites, formatos de /proc)"

# Workspace próprio: cada experimento compila isolado (ver testbench/Cargo.toml).
[workspace]

[dependencies]
anyhow = "1"
harness = { path = "../../crates/harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "process", "thread", "pipe", "param", "system"] }

[lints.rust]
unsafe_code = "forbid"
