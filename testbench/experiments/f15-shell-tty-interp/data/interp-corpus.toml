# Corpus do H39: one-liners típicos de agente em Python, JS e Lua, mais sondas de negação de I/O de
# host. Cada trecho roda num contexto novo, com `files` como FS em memória (o mesmo diretório de
# trabalho, caminhos relativos).
#
# kind = "corpus": saída esperada em `expected` (e, quando há escrita, arquivos em `expected_files`).
#   Python e JS: o orquestrador confirma o esperado rodando o mesmo trecho no python3/node do host,
#   com os arquivos materializados num diretório de rascunho. Lua: esperado escrito à mão e conferido
#   contra o Lua 5.4 de referência (o C do mlua vendored), já que o host não tem lua.
# kind = "deny": sonda que tenta tocar o host. Imprime DENIED quando o acesso falha do jeito certo e
#   LEAK quando vaza. Não roda no host (lá vazaria por definição).
#
# Convenção de saída: em JS só imprimimos strings e números (console.log de objeto/array usa o
# util.inspect do node, que o prelúdio não imita); em Lua o print separa com TAB, como o original.

# ------------------------------------------------------------------------------------------------
# Python
# ------------------------------------------------------------------------------------------------

