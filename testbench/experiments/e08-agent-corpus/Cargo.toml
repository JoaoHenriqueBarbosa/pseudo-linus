[package]
name = "e08-agent-corpus"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "E08: estatística dos comandos Bash que agentes rodaram de verdade (transcripts locais do Claude Code)"

# Workspace próprio: cada experimento compila isolado (ver testbench/Cargo.toml).
[workspace]

[dependencies]
anyhow = "1"
harness = { path = "../../crates/harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
memchr = "2"
brush-parser = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
