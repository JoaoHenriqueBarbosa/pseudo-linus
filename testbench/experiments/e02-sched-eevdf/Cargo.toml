[package]
name = "e02-sched-eevdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "E02: árvore rubro-negra aumentada e EEVDF (correção, desempenho, diferencial contra o kernel do host, escala da trava)"

# Workspace próprio: cada experimento compila isolado (ver testbench/Cargo.toml).
[workspace]

[dependencies]
anyhow = "1"
harness = { path = "../../crates/harness" }
rbtree = { path = "../../../crates/rbtree" }
sched = { path = "../../../crates/sched" }
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
rustix = { version = "1", features = ["thread", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
