[package]
name = "e04-hostfs-escape"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "E04: confinamento e semântica de caminho do hostfs (cap-std, openat2, namei manual)"

# Workspace próprio: cada experimento compila isolado (ver testbench/Cargo.toml).
[workspace]

[dependencies]
anyhow = "1"
harness = { path = "../../crates/harness" }
depscan = { path = "../../crates/depscan" }
serde_json = "1"
cap-std = "4"
rustix = { version = "1", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "forbid"
