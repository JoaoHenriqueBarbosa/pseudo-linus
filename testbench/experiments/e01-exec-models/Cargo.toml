[package]
name = "e01-exec-models"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "E01: modelos de execução de pseudo-processos (thread por processo, corrotina presa ao worker, async)"

# Workspace próprio: cada experimento compila isolado (ver testbench/Cargo.toml).
[workspace]

[dependencies]
anyhow = "1"
corosensei = "0.3.4"
harness = { path = "../../crates/harness" }
memchr = "2"
parking_lot = "0.12"
rustix = { version = "1", features = ["process", "thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1.25"

[dev-dependencies]
# Só pros doctests compile_fail e pro teste de migração do H01.
generator = "0.8"
may = "0.3.51"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = "line-tables-only"
panic = "unwind"
