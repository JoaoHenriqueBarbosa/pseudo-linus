# Sondas de compilação do H01. Cada binário em src/bin é uma tentativa de migrar corrotina stackful
# entre threads; o binário do E01 roda `cargo check --bin <sonda>` em cada uma e registra se compilou e
# com quais códigos de erro. Workspace próprio pra não entrar no build do experimento.
[package]
name = "e01-h01-probes"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]

[dependencies]
corosensei = "0.3.4"
generator = "0.8"
may = "0.3.51"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = false
