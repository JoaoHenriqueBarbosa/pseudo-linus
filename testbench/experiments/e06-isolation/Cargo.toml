[package]
name = "e06-isolation"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "E06: as três camadas de isolamento (clippy, forbid(unsafe_code), Landlock e seccomp por thread)"

# Workspace próprio: cada experimento compila isolado (ver testbench/Cargo.toml).
# As crates-sonda de `probes/` formam outro workspace, compilado pelo próprio binário do experimento
# (algumas delas existem justamente pra falhar a compilação, então não podem ser membros daqui).
[workspace]
exclude = ["probes"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "e06-isolation"
path = "src/main.rs"

[dependencies]
anyhow = "1"
harness = { path = "../../crates/harness" }
depscan = { path = "../../crates/depscan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "process", "thread"] }
nix = { version = "0.31", features = ["process", "fs"] }
# Só `IoUring::new` (io_uring_setup), que é seguro: prova que o filtro seccomp fecha o io_uring.
io-uring = "0.7"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = "line-tables-only"
