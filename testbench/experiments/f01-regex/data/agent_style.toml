# Regexes no estilo que agentes escrevem (grep -E de log, IPs, e-mails, classes POSIX, \b, \w, \s,
# âncoras, alternação, quantificadores, backrefs em BRE, extensões GNU \+ \? \| \{n,m\}), mais casos de
# borda da semântica POSIX. O gerador (src/bin/gen_cases.rs) transforma cada entrada em sondas
# (grep -n, grep -ob, sed, gawk) em corpus/cases/regex/agent-style.toml.
#
# Campos: id (inglês, único), re (padrão), d (dialeto: grep-bre, grep-ere, sed-bre, sed-ere),
# on (grupos de linhas de [subjects]), s (linhas extras), i (ignora caixa).

