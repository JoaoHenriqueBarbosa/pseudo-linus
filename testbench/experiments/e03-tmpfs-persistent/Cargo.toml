[package]
name = "e03-tmpfs-persistent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "E03: tmpfs persistente (snapshot, restore e sandbox em O(1)) sobre imbl, rpds e Arc à mão"
# O binário principal roda o `e03-mem` (medição de memória com allocator contador) como subprocesso.
default-run = "e03-tmpfs-persistent"

# Workspace próprio: cada experimento compila isolado (ver testbench/Cargo.toml).
[workspace]

[dependencies]
anyhow = "1"
harness = { path = "../../crates/harness" }
depscan = { path = "../../crates/depscan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imbl = { version = "7", features = ["triomphe"] }
im = "15"
archery = "1"
rpds = "1"
immutable-chunkmap = "2"
arc-swap = "1"
stats_alloc = "0.1"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = "line-tables-only"

[profile.test]
opt-level = 3
