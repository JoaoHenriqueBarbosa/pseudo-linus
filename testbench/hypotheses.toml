criterion = "Grupo com quota de 20% e 50% (período de 100 ms), sozinho e competindo com outro grupo, no simulador e no kernel do host (-p CPUQuota). Confirmada se a fração de CPU bate em até 2 pontos percentuais e o padrão roda/estrangula por período é o mesmo."

