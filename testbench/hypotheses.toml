[[hypothesis]]
id = "H41"
source = "v2"
experiment = "e02-sched-eevdf"
statement = "EEVDF hierárquico (group scheduling) divide CPU entre usuários e sandboxes pelo peso do grupo, independente de quantos processos cada um roda"
criterion = "Mesmos cenários no simulador e no kernel do host com cgroups v2 reais (systemd-run --user --scope -p CPUWeight): grupo com 1 laço contra grupo com 8 laços, pesos 100/100 e 100/300, hierarquia usuário > sandbox > processo, em 1 e 2 CPUs. Confirmada se as divisões batem em até 5 pontos percentuais."

[[hypothesis]]
