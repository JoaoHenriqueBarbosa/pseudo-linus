# Registro de hipóteses da bancada. Fonte da verdade da tabela no fim de docs/design.md.
#
# Cada hipótese tem: a frase (do v1 ou nova no v2), o experimento que responde, e o critério que decide
# o veredito. O runner falha se alguma hipótese ficar sem veredito em results/.
#
# Vereditos possíveis: confirmed, refuted, partial, inconclusive.

[[hypothesis]]
id = "H01"
source = "v1"
experiment = "e01-exec-models"
statement = "Corrotinas stackful permitem M:N com migração entre workers em Rust seguro"
criterion = "Confirmada se alguma crate de corrotina stackful permite mover corrotina suspensa entre threads sem unsafe nosso; refutada se todas exigem unsafe impl Send ou API unsafe (provado por teste compile_fail)."

[[hypothesis]]
id = "H02"
source = "v1"
experiment = "e01-exec-models"
statement = "Troca de contexto de corrotina é muito mais barata que handoff de thread, e isso pesa no throughput de pipelines"
criterion = "Mede ns por troca (ping-pong) em A, B e C, e throughput de yes|head e de um pipeline de 4 estágios com buffer de 64 KiB. Confirmada se A perde mais de 20% de throughput de pipeline para B ou C; parcial se a troca é muito mais cara mas o pipeline não sente."

[[hypothesis]]
id = "H03"
source = "v1"
experiment = "e01-exec-models"
statement = "Pilha virtual de 256 KiB por processo só ocupa memória física quando tocada; milhares de processos custam pouco"
criterion = "RSS por processo ocioso em 1k, 10k e 30k processos em cada modelo. Confirmada se ficar abaixo de 64 KiB por processo."

[[hypothesis]]
id = "H04"
source = "v1"
experiment = "e01-exec-models"
statement = "Criar pseudo-processo custa microssegundos e cabem dezenas de milhares num processo host"
criterion = "Mediana de spawn+exit e máximo sustentado (até 30k, dentro de um scope com TasksMax). Confirmada se spawn < 50 µs e 30k processos simultâneos funcionam."

[[hypothesis]]
id = "H05"
source = "v1"
experiment = "e01-exec-models"
statement = "Checkpoint com AtomicBool custa quase nada e dá preempção com granularidade fina"
criterion = "Overhead do checkpoint num laço de interpretador (ns por chamada, % de slowdown) e distribuição da latência entre o timer marcar e o processo ceder. Confirmada se overhead < 2% e p99 de latência < 100 µs."

[[hypothesis]]
id = "H06"
source = "v1"
experiment = "e01-exec-models"
statement = "SIGKILL via unwind libera fds e roda Drops, com o processo bloqueado ou em laço com checkpoint"
criterion = "Processo bloqueado em read de pipe e processo em laço com checkpoint morrem, Drops rodam (contador), e o tempo até morrer é medido."

[[hypothesis]]
id = "H07"
source = "v2"
experiment = "e01-exec-models"
statement = "Laço de CPU sem checkpoint não pode ser preemptado nem morto em Rust seguro; rebaixar a thread host mitiga"
criterion = "Demonstra que o laço sem checkpoint não cede nem morre; mede, no modelo A, quanto CPU ele rouba de um vizinho com e sem a thread rebaixada pra nice 19."

[[hypothesis]]
id = "H08"
source = "v2"
experiment = "e01-exec-models"
statement = "Stack overflow num pseudo-processo derruba o host; stacker mitiga nos interpretadores"
criterion = "Em subprocesso: recursão infinita num pseudo-processo mata o processo host (sinal); com stacker::maybe_grow e limite de profundidade, o pseudo-processo termina com erro e o host sobrevive. Testado em cada modelo."

[[hypothesis]]
id = "H09"
source = "v1"
experiment = "e01-exec-models"
statement = "Panic num builtin fica isolado no processo e não envenena o kernel"
criterion = "Panic segurando lock do kernel e panic fora de lock: o pai vê término anormal e o kernel continua atendendo outros processos."

[[hypothesis]]
id = "H10"
source = "v1"
experiment = "e01-exec-models"
statement = "Thread-local de processo corrente viabiliza o shim sysio e a contabilidade"
criterion = "Em A, thread-local é por processo sem nada especial; em B, mostrar o que quebra (troca manual a cada resume) e se é seguro; em C, task-local."

[[hypothesis]]
id = "H11"
source = "v1"
experiment = "e02-sched-eevdf"
statement = "Runqueue com trava global escala até uns 8 workers"
criterion = "Operações de escalonamento por segundo (pick + put) com 1, 2, 4, 8 e 16 workers, trava global contra runqueue por worker. Confirmada se a trava global mantém >= 70% da vazão ideal até 8 workers."

[[hypothesis]]
id = "H12"
source = "v1"
experiment = "e02-sched-eevdf"
statement = "Árvore rubro-negra em arena com índices u32 é correta e competitiva com BTreeMap"
criterion = "proptest com 100k sequências sem falha (ordem, invariantes, augmentação); insert/remove/leftmost no máximo 2x mais lento que BTreeMap; pick_eevdf aumentado melhor que linear a partir de n=64."

[[hypothesis]]
id = "H13"
source = "v2"
experiment = "e02-sched-eevdf"
statement = "O nosso EEVDF reproduz a divisão de CPU e a latência de wakeup do kernel 6.12 do host"
criterion = "Mesmos cenários no host (threads fixadas numa CPU, nices diferentes, sleeper periódico) e no simulador. Confirmada se shares batem em até 5 pontos percentuais e p50/p99 de latência de wakeup na mesma ordem de grandeza."

