  return b64(px);
};
window.onload = () => {
  const out = {};
  for (const [name, fn] of Object.entries(scenes)) out[name] = run(name, fn, 1);
  for (const [name, fn] of Object.entries(scenes2)) out[name] = run(name, fn, 2);
  document.body.setAttribute('data-out', JSON.stringify(out));
};
