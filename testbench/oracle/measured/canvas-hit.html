<!doctype html><body><script>
// isPointInPath e isPointInStroke no oráculo: cada caso devolve um booleano.
const c = document.createElement('canvas').getContext('2d');
const out = {};
const pts = [[10, 10], [5, 5], [20, 5], [5, 20], [20, 20], [12.5, 12.5], [4.999, 10], [20.001, 10], [10, 4.999], [10, 20.001], [0, 0], [30, 30], [NaN, 3], [Infinity, 2]];
c.beginPath(); c.rect(5, 5, 15, 15);
out.rect = pts.map(([x, y]) => c.isPointInPath(x, y));
c.beginPath(); c.rect(0, 0, 30, 30); c.rect(8, 8, 10, 10);
out.evenodd = pts.map(([x, y]) => c.isPointInPath(x, y, 'evenodd'));
out.nonzero = pts.map(([x, y]) => c.isPointInPath(x, y));
c.beginPath(); c.arc(15, 15, 8, 0, Math.PI * 2);
out.circle = pts.map(([x, y]) => c.isPointInPath(x, y));
c.setTransform(2, 0, 0, 2, 0, 0); c.beginPath(); c.rect(2, 2, 5, 5);
out.scaledBuilt = pts.map(([x, y]) => c.isPointInPath(x, y));
c.setTransform(1, 0, 0, 1, 0, 0);
out.scaledLater = pts.map(([x, y]) => c.isPointInPath(x, y));
const p = new Path2D('M5 5 L20 5 L20 20 Z');
c.setTransform(1, 0, 0, 1, 2, 0);
out.path2d = pts.map(([x, y]) => c.isPointInPath(p, x, y));
c.setTransform(1, 0, 0, 1, 0, 0);
c.beginPath(); c.moveTo(5, 10); c.lineTo(20, 10);
c.lineWidth = 4;
out.strokeLine = [[5, 10], [12, 12], [12, 12.001], [12, 8], [3, 10], [4.5, 10], [21, 10], [12, 13]].map(([x, y]) => c.isPointInStroke(x, y));
c.lineCap = 'square';
out.strokeSquare = [[3, 10], [3.001, 10], [21.9, 10], [22.1, 10]].map(([x, y]) => c.isPointInStroke(x, y));
c.lineCap = 'butt'; c.setLineDash([3, 3]);
out.strokeDash = [[6, 10], [9, 10], [10, 10], [13, 10], [16, 10], [19, 10]].map(([x, y]) => c.isPointInStroke(x, y));
c.setLineDash([]); c.lineWidth = 2; c.lineJoin = 'miter';
c.beginPath(); c.moveTo(5, 25); c.lineTo(15, 5); c.lineTo(25, 25);
out.strokeMiter = [[15, 3], [15, 2.8], [15, 1], [15, 6], [15, 7.5]].map(([x, y]) => c.isPointInStroke(x, y));
c.scale(2, 2); c.lineWidth = 1; c.beginPath(); c.moveTo(2, 5); c.lineTo(10, 5);
out.strokeScaled = [[5, 5], [5, 5.4], [5, 5.6], [10, 9], [10, 11.1]].map(([x, y]) => c.isPointInStroke(x, y));
document.body.setAttribute('data-out', JSON.stringify(out));
</script></body>
