<!doctype html><body><script>
// Pontos e linhas do WebGL no oráculo (ANGLE sobre SwiftShader): cada cena desenha num canvas de 24x24 sem
// antisserrilhado (e algumas com) e guarda o readPixels (RGBA, de baixo para cima) em base64. Rodar com
// `chromium --headless --disable-gpu --dump-dom`; o resultado sai no atributo data-out do body.
const W = 24, H = 24;
const b64 = (u8) => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s); };
const VS = 'attribute vec2 p; attribute vec4 c; varying vec4 v; uniform float size; void main() { v = c; gl_PointSize = size; gl_Position = vec4(p, 0.0, 1.0); }';
const FS = 'precision mediump float; varying vec4 v; void main() { gl_FragColor = v; }';
const FS_COORD = 'precision mediump float; varying vec4 v; void main() { gl_FragColor = vec4(gl_PointCoord, v.b, 1.0); }';
// Pixel (x, y) com fração para coordenadas de recorte.
const at = (x, y) => [(x / W) * 2 - 1, (y / H) * 2 - 1];
const red = [1, 0, 0, 1], green = [0, 1, 0, 1], blue = [0, 0, 1, 1];
const scenes = {
  'points-1': (gl, d) => d.draw([at(2.5, 2.5), at(5.0, 3.0), at(8.3, 2.7), at(11.5, 4.0), at(14.75, 2.25), at(18.0, 2.5)].flat(), [red], gl.POINTS, 1),
  'points-2': (gl, d) => d.draw([at(2.5, 2.5), at(6.0, 3.0), at(10.3, 2.7), at(14.5, 4.0), at(18.75, 2.25), at(21.0, 6.5)].flat(), [green], gl.POINTS, 2),
  'points-3': (gl, d) => d.draw([at(3.5, 3.5), at(8.0, 4.0), at(13.3, 3.7), at(18.5, 5.0), at(4.75, 12.25), at(12.0, 12.5)].flat(), [blue], gl.POINTS, 3),
  'points-4.5': (gl, d) => d.draw([at(4.5, 4.5), at(12.0, 5.0), at(19.3, 4.7), at(5.5, 14.0), at(13.75, 14.25)].flat(), [red], gl.POINTS, 4.5),
  'points-big-colors': (gl, d) => d.draw([at(6.2, 6.4), at(16.5, 16.5)].flat(), [red, blue], gl.POINTS, 9),
  'points-clipped': (gl, d) => d.draw([at(0.5, 12), at(23.6, 12), at(12, -0.4), at(12, 24.2)].flat(), [green], gl.POINTS, 5),
  'points-coord': (gl, d) => d.draw([at(6.5, 6.5), at(17.25, 16.75)].flat(), [[0, 0, 0.5, 1]], gl.POINTS, 8, FS_COORD),
  'lines-axis': (gl, d) => d.draw([at(2, 2.5), at(20, 2.5), at(2.5, 5), at(2.5, 20), at(4.3, 8.7), at(19.6, 8.7), at(6.6, 6.2), at(6.6, 21.4)].flat(), [red], gl.LINES),
  'lines-diag': (gl, d) => d.draw([at(1, 1), at(23, 23), at(1, 22.5), at(22, 1.5), at(3.2, 5.1), at(20.7, 9.4), at(4.4, 2.2), at(9.6, 21.9)].flat(), [green], gl.LINES),
  'lines-shallow': (gl, d) => d.draw([at(0.5, 3.3), at(23.5, 7.1), at(23.1, 12.6), at(0.9, 10.4), at(2.7, 20.5), at(21.2, 15.5)].flat(), [blue], gl.LINES),
  'lines-colors': (gl, d) => d.draw([at(1.5, 4.5), at(22.5, 18.5), at(2.5, 20.5), at(20.5, 2.5)].flat(), [red, blue, green, red], gl.LINES),
  // Gradientes nas quatro direções, com eixo maior em x e em y, uma linha por cena para a cor dizer o t.
  'lines-grad-xpos': (gl, d) => d.draw([at(0.7, 3.2), at(23.1, 19.9)].flat(), [red, blue], gl.LINES),
  'lines-grad-xneg': (gl, d) => d.draw([at(22.8, 6.1), at(1.3, 17.4)].flat(), [green, red], gl.LINES),
  'lines-grad-ypos': (gl, d) => d.draw([at(4.2, 0.9), at(17.7, 23.3)].flat(), [blue, green], gl.LINES),
  'lines-grad-yneg': (gl, d) => d.draw([at(19.6, 22.6), at(6.1, 1.2)].flat(), [red, green], gl.LINES),
  'lines-diamond': (gl, d) => d.draw([at(3.5, 3.5), at(3.5, 3.5), at(6, 6), at(7, 6), at(9.5, 9.5), at(10.5, 9.5), at(12.4, 12.4), at(13.6, 12.6), at(15.5, 3.2), at(15.5, 3.9)].flat(), [red], gl.LINES),
  'line-strip': (gl, d) => d.draw([at(2, 2), at(12, 20), at(20, 4), at(22, 22), at(3.5, 12.5)].flat(), [red, green, blue, red, green], gl.LINE_STRIP),
  'line-loop': (gl, d) => d.draw([at(3.5, 3.5), at(20.5, 4.5), at(18.5, 19.5), at(5.5, 17.5)].flat(), [red, green, blue, red], gl.LINE_LOOP),
  'lines-clipped': (gl, d) => d.draw([at(-5, 3.5), at(30, 9.5), at(12.5, -6), at(14.5, 30), at(-3, -3), at(27, 25)].flat(), [blue], gl.LINES),
  'lines-depth': (gl, d) => {
    gl.enable(gl.DEPTH_TEST); gl.clear(gl.DEPTH_BUFFER_BIT);
    d.draw([at(2, 12.5), at(22, 12.5)].flat(), [red], gl.LINES);
    d.draw([at(12.5, 2), at(12.5, 22)].flat(), [blue], gl.LINES);
  },
  'aa-points': (gl, d) => d.draw([at(4.5, 4.5), at(12.3, 5.7), at(18, 18)].flat(), [red], gl.POINTS, 3),
  'aa-lines': (gl, d) => d.draw([at(1.5, 2.5), at(22.5, 9.5), at(3.3, 21.2), at(19.7, 12.1), at(6.5, 4), at(6.5, 20)].flat(), [green], gl.LINES),
};
const out = {};
for (const [name, fn] of Object.entries(scenes)) {
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const gl = canvas.getContext('webgl', { antialias: name.startsWith('aa-'), depth: true, preserveDrawingBuffer: true });
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  const programs = new Map();
  const program = (fs) => {
    if (!programs.has(fs)) {
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
      gl.bindAttribLocation(prog, 0, 'p'); gl.bindAttribLocation(prog, 1, 'c'); gl.linkProgram(prog);
      programs.set(fs, prog);
    }
    return programs.get(fs);
  };
  const vb = gl.createBuffer(), cb = gl.createBuffer();
  const d = {
    // `colors` repete o último até cobrir os vértices.
    draw(pos, colors, mode, size = 1, fs = FS) {
      const n = pos.length / 2, prog = program(fs);
      gl.useProgram(prog); gl.uniform1f(gl.getUniformLocation(prog, 'size'), size);
      gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, cb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(Array.from({ length: n }, (_, i) => colors[Math.min(i, colors.length - 1)]).flat()), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 0, 0);
      gl.drawArrays(mode, 0, n);
    },
  };
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  fn(gl, d);
  const px = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  out[name] = b64(px);
}
document.body.setAttribute('data-out', JSON.stringify(out));
</script></body>
