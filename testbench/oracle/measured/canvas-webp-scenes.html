<!doctype html><body><script>
// toDataURL('image/webp') no oráculo, segunda leva: pixels postos com putImageData (sem antisserrilhado) para cobrir
// o codificador com perdas (ruído, tamanhos ímpares, segmentos, alfa com filtros e níveis variados) e o sem perdas
// (paleta pequena e grande, transparência, preditor, imagem de histogramas), mais o canvas WebGL e o 2D sem desenho.
let seed = 12345;
const rand = (n) => { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; return (seed >>> 16) % n; };
const scene = (w, h, f) => {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) img.data.set(f(x, y), (y * w + x) * 4);
  }
  ctx.putImageData(img, 0, 0);
  return c;
};
const scenes = {
  noise: scene(37, 23, () => [rand(256), rand(256), rand(256), 255]),
  photo: scene(160, 90, (x, y) => [128 + Math.round(100 * Math.sin(x / 9 + y / 15)) + rand(8), 128 + Math.round(90 * Math.cos(y / 11)) + rand(8), 120 + Math.round(60 * Math.sin((x + y) / 20)), 255]),
  alphaNoise: scene(29, 31, () => [rand(256), rand(256), rand(256), rand(256)]),
  alphaSoft: scene(40, 40, (x, y) => [200, 100, 50, Math.max(0, Math.min(255, 255 - 6 * Math.round(Math.hypot(x - 20, y - 20))))]),
  alphaFew: scene(64, 64, (x, y) => [250, 0, 0, [0, 64, 128, 255][(Math.floor(x / 16) + Math.floor(y / 16)) % 4]]),
  alphaHoles: scene(48, 33, (x, y) => [x * 5, y * 7, 128, (Math.floor(x / 8) + Math.floor(y / 8)) % 3 === 0 ? 0 : 255]),
  pal100: scene(130, 90, (x, y) => [(Math.floor(x / 13) * 25) & 255, (Math.floor(y / 9) * 25) & 255, 7, 255]),
  pal40a: scene(70, 70, (x, y) => [(Math.floor(x / 10) * 30) & 255, (Math.floor(y / 10) * 30) & 255, 200, (x + y) % 17 === 0 ? 0 : 255]),
  smooth: scene(400, 400, (x, y) => [(x + y) & 255, (x * 2) & 255, Math.floor(y / 2) & 255, 255]),
  odd: scene(3, 5, (x, y) => [x * 70, y * 50, 90, 255]),
};
const out = {};
for (const [name, c] of Object.entries(scenes)) {
  out[name] = c.toDataURL('image/webp');
  out[name + 'Q50'] = c.toDataURL('image/webp', 0.5);
  out[name + 'Lossless'] = c.toDataURL('image/webp', 1);
}
const empty2d = document.createElement('canvas');
empty2d.width = 20;
empty2d.height = 10;
empty2d.getContext('2d');
out.empty2d = empty2d.toDataURL('image/webp');
out.empty2dLossless = empty2d.toDataURL('image/webp', 1);
const glCanvas = document.createElement('canvas');
glCanvas.width = 24;
glCanvas.height = 16;
const gl = glCanvas.getContext('webgl', { preserveDrawingBuffer: true });
gl.clearColor(0.2, 0.4, 0.6, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
out.webgl = glCanvas.toDataURL('image/webp');
out.webglLossless = glCanvas.toDataURL('image/webp', 1);
document.body.setAttribute('data-out', JSON.stringify(out));
</script></body>
